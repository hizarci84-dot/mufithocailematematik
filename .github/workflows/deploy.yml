name: GitHub Pages Yayını

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - name: Kaynak kodları indir
        uses: actions/checkout@v4

      - name: Node.js kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Bağımlılıkları yükle
        run: yarn install --frozen-lockfile

      - name: Üretim derlemesi (dist)
        run: yarn build

      - name: GitHub Pages paketini yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages üzerinde yayınla
        id: deployment
        uses: actions/deploy-pages@v4
