<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kesir Karşılaştırma Animasyonu</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0F172A;
            --text-color: #F8FAFC;
            --bar-bg: rgba(255, 255, 255, 0.1);
            --c-basket: #F97316; /* Orange */
            --c-futbol: #22C55E; /* Green */
            --c-voleybol: #3B82F6; /* Blue */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1E293B 0%, #0F172A 100%);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Branding */
        .brand-header {
            position: absolute;
            top: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 25px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            z-index: 100;
        }
        .brand-header img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: contain;
            background: white;
            padding: 2px;
        }
        .brand-header span {
            color: #E2E8F0;
            font-weight: 600;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Kazanım Box */
        .kazanim-box {
            position: absolute;
            bottom: 30px;
            padding: 15px 30px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            text-align: center;
            z-index: 100;
        }
        .kazanim-box p {
            font-size: 1rem;
            color: #94A3B8;
        }

        /* Scene */
        .scene {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title {
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 3rem;
            line-height: 1.4;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 1s ease;
        }
        .show-title .title { opacity: 1; transform: translateY(0); }

        /* Bars Container */
        .chart-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .bar-row {
            display: flex;
            align-items: center;
            gap: 20px;
            opacity: 0;
            transform: translateX(-30px);
            transition: all 0.8s ease;
        }
        .show-bars .bar-row { opacity: 1; transform: translateX(0); }
        .show-bars .bar-row:nth-child(2) { transition-delay: 0.3s; }
        .show-bars .bar-row:nth-child(3) { transition-delay: 0.6s; }

        .bar-label {
            width: 180px;
            font-size: 1.5rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
        }
        .bar-label .icon { font-size: 2rem; }

        .bar-track {
            flex: 1;
            height: 40px;
            background: var(--bar-bg);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
        }

        .bar-fill {
            height: 100%;
            width: 0%;
            border-radius: 20px;
            transition: width 2s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 15px;
            font-weight: 800;
            font-size: 1.2rem;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .fill-bask .bar-fill { background: var(--c-basket); }
        .fill-futb .bar-fill { background: var(--c-futbol); }
        .fill-voley .bar-fill { background: var(--c-voleybol); }

        .rep-value {
            font-size: 1.5rem;
            font-weight: 800;
            width: 80px;
            text-align: left;
        }

        /* Conclusion */
        .conclusion {
            margin-top: 3rem;
            font-size: 2rem;
            color: #FDE047;
            font-weight: 800;
            opacity: 0;
            transform: scale(0.8);
            transition: all 1s ease;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 30px;
            border-radius: 12px;
        }
        .show-conclusion .conclusion {
            opacity: 1;
            transform: scale(1);
        }

        /* Replay */
        #replayBtn {
            position: absolute;
            right: 30px;
            bottom: 30px;
            background: #F8FAFC;
            color: #0F172A;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            z-index: 100;
        }
        #replayBtn.visible { opacity: 1; pointer-events: auto; }
    </style>
</head>
<body>

    <div class="brand-header">
        <img src="../../logom.png" alt="Müfit Hoca Logo">
        <span>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
            @mufithocailematematik
        </span>
    </div>

    <div class="scene" id="mainScene">
        <div class="title" id="mainTitle">Bir sınıfta öğrencilerin en sevdiği sporlar araştırıldı. Hangisi daha çok seviliyor?</div>
        
        <div class="chart-container">
            <div class="bar-row fill-bask">
                <div class="bar-label">Basketbol <span class="icon">🏀</span></div>
                <div class="bar-track"><div class="bar-fill" id="barBask"></div></div>
                <div class="rep-value" id="valBask">2/5</div>
            </div>

            <div class="bar-row fill-futb">
                <div class="bar-label">Futbol <span class="icon">⚽</span></div>
                <div class="bar-track"><div class="bar-fill" id="barFutb"></div></div>
                <div class="rep-value" id="valFutb">%35</div>
            </div>

            <div class="bar-row fill-voley">
                <div class="bar-label">Voleybol <span class="icon">🏐</span></div>
                <div class="bar-track"><div class="bar-fill" id="barVoley"></div></div>
                <div class="rep-value" id="valVoley">0,25</div>
            </div>
        </div>

        <div class="conclusion" id="conclusion">
            2/5 > %35 > 0,25
        </div>
    </div>

    <div class="kazanim-box">
        <p><strong>MAT.5.1.4.</strong> Farklı gösterimlerle ifade edilen kesirlerin karşılaştırılmasına yönelik çıkarım yapabilme.</p>
    </div>

    <button id="replayBtn" onclick="startSequence()">Tekrar Oynat</button>

    <script>
        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        async function startSequence() {
            const scene = document.getElementById('mainScene');
            
            // Reset
            scene.classList.remove('show-title', 'show-bars', 'show-conclusion');
            document.getElementById('barBask').style.width = '0%';
            document.getElementById('barBask').innerText = '';
            document.getElementById('barFutb').style.width = '0%';
            document.getElementById('barFutb').innerText = '';
            document.getElementById('barVoley').style.width = '0%';
            document.getElementById('barVoley').innerText = '';
            
            document.getElementById('valBask').innerText = '2/5';
            document.getElementById('valFutb').innerText = '%35';
            document.getElementById('valVoley').innerText = '0,25';
            
            document.getElementById('mainTitle').innerText = "Bir sınıfta öğrencilerin en sevdiği sporlar araştırıldı. Hangisi daha popüler?";
            document.getElementById('replayBtn').classList.remove('visible');

            await sleep(500);

            // 1. Show Title
            scene.classList.add('show-title');
            await sleep(2000);

            // 2. Show empty bars
            scene.classList.add('show-bars');
            await sleep(2000);

            // 3. Fill bars (convert to percentage visually)
            document.getElementById('mainTitle').innerText = "Karşılaştırmak için hepsini YÜZDE olarak düşünelim...";
            await sleep(1500);

            document.getElementById('barBask').style.width = '40%';
            document.getElementById('barBask').innerText = '%40';
            document.getElementById('valBask').innerText = '%40';
            await sleep(1000);

            document.getElementById('barFutb').style.width = '35%';
            document.getElementById('barFutb').innerText = '%35';
            await sleep(1000);

            document.getElementById('barVoley').style.width = '25%';
            document.getElementById('barVoley').innerText = '%25';
            document.getElementById('valVoley').innerText = '%25';
            await sleep(2000);

            // 4. Show Conclusion
            document.getElementById('mainTitle').innerText = "En çok Basketbol seviliyor!";
            scene.classList.add('show-conclusion');
            await sleep(2000);

            document.getElementById('replayBtn').classList.add('visible');
        }

        window.onload = startSequence;
    </script>
</body>
</html>
