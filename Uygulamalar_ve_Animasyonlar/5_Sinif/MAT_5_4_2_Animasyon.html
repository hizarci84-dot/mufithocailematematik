<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alan Formülü Nereden Geliyor? - Animasyon</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F172A;
            --text: #F8FAFC;
            --primary: #3B82F6; /* Blue */
            --secondary: #10B981; /* Green */
            --tertiary: #F59E0B; /* Amber */
            --danger: #F43F5E; /* Rose */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px; overflow-x: hidden;
        }

        .header {
            width: 100%; max-width: 900px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area { text-align: center; width: 100%; max-width: 800px; margin-bottom: 20px; height: 120px;}
        h1 { font-size: 2.2rem; color: var(--primary); text-shadow: 0 5px 15px rgba(0,0,0,0.5); line-height: 1.3;}
        .subtitle { font-size: 1.2rem; color: #94A3B8; margin-top: 10px; line-height: 1.5;}
        .subtitle span { color: white; font-weight: 800; background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 5px;}

        .canvas-area {
            position: relative; width: 100%; max-width: 800px; height: 450px; 
            background: #0B1120; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.3); 
            overflow: hidden; display: flex; align-items: center; justify-content: center;
        }

        svg { width: 100%; height: 100%; overflow: visible; }
        
        .rect-frame { fill: rgba(59, 130, 246, 0.05); stroke: var(--primary); stroke-width: 6; stroke-dasharray: 10 10; opacity: 0; transition: opacity 1s; }
        
        .unit-sq {
            fill: rgba(16, 185, 129, 0.8); stroke: var(--bg); stroke-width: 2;
            opacity: 0; transform: scale(0); transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .text-lbl { font-size: 26px; font-weight: 900; fill: white; opacity: 0; transition: opacity 0.5s; text-anchor: middle;}
        
        .row-highlight { fill: none; stroke: var(--tertiary); stroke-width: 4; rx: 10; opacity: 0; transition: opacity 0.5s; }

        .btn-start {
            margin-top: 30px; background: var(--secondary); color: white; border: none; padding: 15px 40px; border-radius: 50px;
            font-size: 1.2rem; font-weight: 800; cursor: pointer; transition: all 0.3s; box-shadow: 0 10px 20px rgba(16, 185, 129, 0.4);
        }
        .btn-start:hover { transform: scale(1.05); }

        .formula-box {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(50px);
            background: var(--danger); color: white; padding: 15px 30px; border-radius: 15px;
            font-size: 1.5rem; font-weight: 900; opacity: 0; transition: all 1s; box-shadow: 0 10px 30px rgba(244, 63, 94, 0.4);
            white-space: nowrap;
        }
        .formula-box.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        @media (max-width: 768px) {
            .header { flex-direction: column; gap: 10px; }
            h1 { font-size: 1.5rem; }
            .canvas-area { height: 300px; }
            .title-area { height: 140px; }
            .formula-box { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.5.4.2. Alan Formülünün Keşfi</div>
    </div>

    <div class="title-area">
        <h1 id="mTitle">Alan Formülü Nereden Geliyor?</h1>
        <p class="subtitle" id="mSub">Bu dikdörtgenin alanını (içini) <span>birim karelerle</span> kaplayalım.</p>
    </div>

    <div class="canvas-area">
        <svg viewBox="0 0 800 450" id="svgView">
            
            <rect id="frame" class="rect-frame" x="250" y="100" width="300" height="200"></rect>
            
            <!-- We will inject 6x4 = 24 squares dynamically (50px each) -->
            <!-- Frame is 300x200 (6 cols, 4 rows) -->
            
            <rect id="hl1" class="row-highlight" x="245" y="95" width="310" height="60"></rect>
            
            <text id="lblW" class="text-lbl" x="400" y="70">6 birim (Sütun)</text>
            <text id="lblH" class="text-lbl" x="120" y="200">4 birim</text>
            <text id="lblH2" class="text-lbl" x="120" y="230">(Satır)</text>
            
            <g id="squaresG"></g>
            <g id="sqTextG"></g>
        </svg>

        <div id="formulaBox" class="formula-box">ALAN = Kısa Kenar × Uzun Kenar</div>
    </div>

    <button class="btn-start" id="startBtn" onclick="runTimeline()">Animasyonu Başlat</button>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        
        const mTitle = document.getElementById('mTitle');
        const mSub = document.getElementById('mSub');
        const startBtn = document.getElementById('startBtn');
        const formulaBox = document.getElementById('formulaBox');
        
        const frame = document.getElementById('frame');
        const hl1 = document.getElementById('hl1');
        const lblW = document.getElementById('lblW');
        const lblH = document.getElementById('lblH');
        const lblH2 = document.getElementById('lblH2');
        const squaresG = document.getElementById('squaresG');
        const sqTextG = document.getElementById('sqTextG');

        let UNIT = 50;
        let ROWS = 4;
        let COLS = 6;
        let START_X = 250;
        let START_Y = 100;

        function createSquares() {
            squaresG.innerHTML = '';
            sqTextG.innerHTML = '';
            let count = 1;
            for(let r=0; r<ROWS; r++) {
                for(let c=0; c<COLS; c++) {
                    let sq = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                    sq.setAttribute('x', START_X + c*UNIT);
                    sq.setAttribute('y', START_Y + r*UNIT);
                    sq.setAttribute('width', UNIT);
                    sq.setAttribute('height', UNIT);
                    sq.setAttribute('class', `unit-sq row-${r}`);
                    sq.style.transformOrigin = `${START_X + c*UNIT + UNIT/2}px ${START_Y + r*UNIT + UNIT/2}px`;
                    squaresG.appendChild(sq);

                    let txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    txt.setAttribute('x', START_X + c*UNIT + UNIT/2);
                    txt.setAttribute('y', START_Y + r*UNIT + UNIT/2);
                    txt.setAttribute('class', `text-lbl row-${r}`);
                    txt.style.fontSize = "20px";
                    txt.style.dominantBaseline = "central";
                    txt.textContent = count++;
                    sqTextG.appendChild(txt);
                }
            }
        }

        async function clearScene() {
            frame.style.opacity = 0;
            hl1.style.opacity = 0;
            lblW.style.opacity = 0; lblH.style.opacity = 0; lblH2.style.opacity = 0;
            formulaBox.classList.remove('show');
            createSquares(); // re-create to reset
            await sleep(500);
        }

        async function runTimeline() {
            startBtn.style.display = 'none';

            await clearScene();

            // Scene 1
            mTitle.innerText = "Alan Demek, İçindeki Kareler Demektir";
            mSub.innerHTML = "6x4 birimlik bu dikdörtgenin içine toplam kaç kare sığar?";
            frame.style.opacity = 1;
            lblW.style.opacity = 1; lblH.style.opacity = 1; lblH2.style.opacity = 1;
            await sleep(3500);

            // Scene 2: First row
            mTitle.innerText = "İlk Satırı Dizelim";
            mSub.innerHTML = "Genişliğimiz 6 olduğu için <span>ilk satıra tam 6 adet</span> kare sığar.";
            
            let row0Sqs = document.querySelectorAll('.unit-sq.row-0');
            let row0Txts = document.querySelectorAll('.text-lbl.row-0');
            
            for(let i=0; i<COLS; i++) {
                row0Sqs[i].style.opacity = 1; row0Sqs[i].style.transform = 'scale(1)';
                row0Txts[i].style.opacity = 1;
                await sleep(300);
            }
            await sleep(1000);

            hl1.style.opacity = 1;
            await sleep(2500);
            hl1.style.opacity = 0;

            // Scene 3: Copy rows
            mTitle.innerText = "Satırları Çoğaltıyoruz";
            mSub.innerHTML = "Yüksekliğimiz 4 olduğu için, bu 6'lı satırlardan <span>tam 4 tane</span> dizebiliriz!";
            
            for(let r=1; r<ROWS; r++) {
                let rSqs = document.querySelectorAll(`.unit-sq.row-${r}`);
                let rTxts = document.querySelectorAll(`.text-lbl.row-${r}`);
                for(let i=0; i<COLS; i++) {
                    rSqs[i].style.opacity = 1; rSqs[i].style.transform = 'scale(1)';
                    rTxts[i].style.opacity = 1;
                    await sleep(100);
                }
                await sleep(500);
            }
            await sleep(2000);

            // Scene 4: Conclusion
            mTitle.innerText = "Matematiksel Kısa Yol";
            mSub.innerHTML = "Toplam Kare Sayısı = <span>4 Satır × 6 Sütun = 24 Kare</span> eder.";
            
            await sleep(3000);

            // Scene 5: Formula Reveal
            mTitle.innerText = "İşte Formül Buradan Gelir!";
            mSub.innerHTML = "Uzun uzun saymak yerine, sadece kenarları birbiriyle çarparız! 🎓";
            
            formulaBox.classList.add('show');

            setTimeout(() => {
                startBtn.style.display = 'block';
                startBtn.innerText = "Tekrar İzle";
            }, 4000);
        }

        // Init
        createSquares();
    </script>
</body>
</html>
