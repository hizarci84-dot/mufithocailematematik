<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alan-Çevre Dengesi Laboratuvarı</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F172A;
            --surface: #1E293B;
            --text: #F8FAFC;
            --primary: #3B82F6; /* Blue */
            --secondary: #10B981; /* Green */
            --tertiary: #F59E0B; /* Amber */
            --danger: #F43F5E; /* Rose */
            --purple: #8B5CF6; /* Purple */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, var(--bg) 0%, var(--surface) 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px;
        }

        .header {
            width: 100%; max-width: 1000px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--primary); color: #0F172A; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .container {
            width: 100%; max-width: 1000px; display: grid; grid-template-columns: 1fr 340px; gap: 20px;
        }

        .canvas-area {
            background: #0B1120; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            position: relative; height: 550px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5); overflow: hidden;
        }

        svg { width: 100%; height: 100%; }

        .grid-line { stroke: rgba(255, 255, 255, 0.05); stroke-width: 1; }
        .rect-shape { fill: rgba(16, 185, 129, 0.2); stroke: var(--secondary); stroke-width: 4; stroke-linejoin: round; transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .edge-lbl { fill: white; font-weight: 800; font-size: 16px; text-anchor: middle; transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);}
        .edge-lbl.v { dominant-baseline: central; }

        .tools-area { display: flex; flex-direction: column; gap: 15px; }

        .panel {
            background: rgba(255,255,255,0.03); border-radius: 20px; padding: 20px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .panel-title { font-size: 1.2rem; font-weight: 800; color: var(--primary); margin-bottom: 15px; border-bottom: 2px solid rgba(255,255,255,0.1); padding-bottom: 10px;}
        
        .tab-btns { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn {
            flex: 1; background: rgba(255,255,255,0.05); color: white; border: none; padding: 12px; border-radius: 12px;
            font-size: 0.95rem; font-weight: 800; cursor: pointer; transition: all 0.2s;
        }
        .tab-btn.active { background: var(--primary); box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4);}

        .control-group { margin-bottom: 20px; }
        .control-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #94A3B8; }
        
        .slider-container { display: flex; align-items: center; gap: 15px; }
        input[type=range] { flex: 1; accent-color: var(--secondary); cursor: pointer; }
        .val-display { background: rgba(0,0,0,0.3); padding: 5px 12px; border-radius: 8px; font-weight: 800; font-size: 1.1rem; min-width: 45px; text-align: center; border: 1px solid rgba(255,255,255,0.1);}

        .stats-box {
            background: rgba(0,0,0,0.2); border: 2px solid var(--primary); padding: 15px; border-radius: 15px;
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
        }
        .stat-item { text-align: center; }
        .stat-lbl { font-size: 0.85rem; color: #94A3B8; font-weight: 600; text-transform: uppercase; margin-bottom: 5px;}
        .stat-val { font-size: 1.5rem; font-weight: 900; }
        .stat-val.c-area { color: var(--secondary); }
        .stat-val.c-perim { color: var(--tertiary); }

        .conclusion { background: rgba(245, 158, 11, 0.1); color: #FCD34D; padding: 12px; border-radius: 10px; font-size: 0.9rem; font-weight: 600; line-height: 1.4;}
        .conclusion span { color: white; font-weight: 800; }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
            .canvas-area { height: 400px; }
            .header { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.5.4.3. Alan-Çevre İlişkisi</div>
    </div>

    <div class="container">
        
        <div class="canvas-area">
            <svg id="svgCanvas">
                <g id="gridGroup"></g>
                <rect id="mRect" class="rect-shape"></rect>
                
                <text id="lblT" class="edge-lbl"></text>
                <text id="lblL" class="edge-lbl v"></text>
            </svg>
        </div>

        <div class="tools-area">
            <div class="panel">
                <div class="panel-title">Deney Modu Seçimi</div>
                <div class="tab-btns">
                    <button class="tab-btn active" id="tabPerim" onclick="setMode('perim')">Sabit Çevre (24 br)</button>
                    <button class="tab-btn" id="tabArea" onclick="setMode('area')">Sabit Alan (36 br²)</button>
                </div>
                
                <div class="control-group">
                    <label id="sliderLabel">Kısa Kenarı Değiştir</label>
                    <div class="slider-container">
                        <input type="range" id="mainSlider" min="1" max="6" step="1" value="1" oninput="updateShape()">
                        <div class="val-display" id="sVal">1</div>
                    </div>
                </div>

                <div class="stats-box">
                    <div class="stat-item">
                        <div class="stat-lbl">ÇEVRE</div>
                        <div class="stat-val c-perim" id="dispPerim">24</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-lbl">ALAN</div>
                        <div class="stat-val c-area" id="dispArea">11</div>
                    </div>
                </div>

                <div class="conclusion" id="concText">
                    Kenar uzunlukları birbirine yaklaştıkça alan <span>BÜYÜR</span>. Maksimum alan için şekil <span>KARE</span> olmalıdır.
                </div>
            </div>
        </div>

    </div>

    <script>
        const svg = document.getElementById('svgCanvas');
        const gridGroup = document.getElementById('gridGroup');
        const mRect = document.getElementById('mRect');
        const lblT = document.getElementById('lblT');
        const lblL = document.getElementById('lblL');
        
        const mainSlider = document.getElementById('mainSlider');
        const sliderLabel = document.getElementById('sliderLabel');
        const sVal = document.getElementById('sVal');
        const dispPerim = document.getElementById('dispPerim');
        const dispArea = document.getElementById('dispArea');
        const concText = document.getElementById('concText');
        
        const tabPerim = document.getElementById('tabPerim');
        const tabArea = document.getElementById('tabArea');

        let UNIT = 15; // 1br = 15px
        let mode = 'perim'; // 'perim' (Fixed Perimeter=24) or 'area' (Fixed Area=36)
        
        // For Area=36, factors are: 1x36, 2x18, 3x12, 4x9, 6x6
        const areaFactors = [
            {w: 36, h: 1}, {w: 18, h: 2}, {w: 12, h: 3}, {w: 9, h: 4}, {w: 6, h: 6}
        ];

        let W = 0, H = 0, CX = 0, CY = 0;

        function resize() {
            let rect = svg.getBoundingClientRect();
            W = rect.width;
            H = rect.height;
            CX = W / 2;
            CY = H / 2;
            drawGrid();
            updateShape();
        }

        function drawGrid() {
            gridGroup.innerHTML = '';
            for(let i = 0; i <= W; i+=UNIT) {
                let l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                l.setAttribute('x1', i); l.setAttribute('y1', 0); l.setAttribute('x2', i); l.setAttribute('y2', H);
                l.setAttribute('class', 'grid-line');
                gridGroup.appendChild(l);
            }
            for(let i = 0; i <= H; i+=UNIT) {
                let l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                l.setAttribute('x1', 0); l.setAttribute('y1', i); l.setAttribute('x2', W); l.setAttribute('y2', i);
                l.setAttribute('class', 'grid-line');
                gridGroup.appendChild(l);
            }
        }

        function setMode(m) {
            mode = m;
            tabPerim.classList.remove('active');
            tabArea.classList.remove('active');
            
            if(mode === 'perim') {
                tabPerim.classList.add('active');
                mainSlider.min = 1;
                mainSlider.max = 6;
                mainSlider.value = 1;
                sliderLabel.innerText = "Kısa Kenarı Değiştir (br)";
                concText.innerHTML = "Çevre sabitken; kenar uzunlukları birbirine yaklaştıkça alan <span>BÜYÜR</span>. Maksimum alan <span>KARE</span> (6x6) şeklindeyken elde edilir.";
            } else {
                tabArea.classList.add('active');
                mainSlider.min = 0;
                mainSlider.max = 4;
                mainSlider.value = 0;
                sliderLabel.innerText = "Farklı Kenar Çiftlerini Seç";
                concText.innerHTML = "Alan sabitken; kenar uzunlukları birbirine yaklaştıkça çevre <span>KÜÇÜLÜR</span>. Minimum çevre <span>KARE</span> (6x6) şeklindeyken elde edilir.";
            }
            updateShape();
        }

        function updateShape() {
            let val = parseInt(mainSlider.value);
            let rectW, rectH, perim, area;

            if(mode === 'perim') {
                // Fixed Perimeter = 24.  a + b = 12
                rectH = val;
                rectW = 12 - val;
                sVal.innerText = val;
                perim = 24;
                area = rectW * rectH;
                
                dispPerim.style.color = "var(--text)";
                dispArea.style.color = area === 36 ? "var(--danger)" : "var(--secondary)";
            } else {
                // Fixed Area = 36
                let f = areaFactors[val];
                rectW = f.w;
                rectH = f.h;
                sVal.innerText = `${f.h} x ${f.w}`;
                area = 36;
                perim = 2 * (rectW + rectH);
                
                dispArea.style.color = "var(--text)";
                dispPerim.style.color = perim === 24 ? "var(--danger)" : "var(--tertiary)";
            }

            dispPerim.innerText = perim + " br";
            dispArea.innerText = area + " br²";

            // If it's a square, highlight it
            if(rectW === rectH) {
                mRect.style.fill = "rgba(244, 63, 94, 0.3)";
                mRect.style.stroke = "var(--danger)";
            } else {
                mRect.style.fill = "rgba(16, 185, 129, 0.2)";
                mRect.style.stroke = "var(--secondary)";
            }

            renderRect(rectW, rectH);
        }

        function renderRect(w, h) {
            let pxW = w * UNIT;
            let pxH = h * UNIT;
            
            let startX = CX - pxW / 2;
            let startY = CY - pxH / 2;

            mRect.setAttribute('x', startX);
            mRect.setAttribute('y', startY);
            mRect.setAttribute('width', pxW);
            mRect.setAttribute('height', pxH);

            lblT.setAttribute('x', startX + pxW/2); 
            lblT.setAttribute('y', startY - 15);
            lblT.textContent = w + ' br';
            
            lblL.setAttribute('x', startX - 25); 
            lblL.setAttribute('y', startY + pxH/2);
            lblL.textContent = h + ' br';
        }

        window.addEventListener('resize', resize);
        
        // Init
        resize();
        setMode('perim');

    </script>
</body>
</html>
