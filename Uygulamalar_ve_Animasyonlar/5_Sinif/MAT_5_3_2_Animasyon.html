<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometrik Çıkarımlar Animasyonu</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F172A;
            --text: #F8FAFC;
            --primary: #FDE047; /* Yellow */
            --accent: #38BDF8; /* Blue */
            --success: #10B981; /* Green */
            --error: #EF4444; /* Red */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, #1E293B 0%, var(--bg) 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 20px; overflow: hidden;
        }

        .header {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 100%; max-width: 900px;
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1); z-index: 100;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--primary); color: #0F172A; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area { position: absolute; top: 120px; text-align: center; width: 100%; z-index: 50; }
        h1 { font-size: 2.2rem; color: #F8FAFC; text-shadow: 0 5px 15px rgba(0,0,0,0.5); line-height: 1.4;}
        .highlight { color: var(--primary); }

        .canvas { position: relative; width: 100%; max-width: 800px; height: 400px; display: flex; align-items: center; justify-content: center; }

        svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 0 10px rgba(255,255,255,0.1)); }
        
        /* Scenes container */
        .scene { opacity: 0; transition: opacity 0.5s; display: none; }
        .scene.active { opacity: 1; display: block; }

        /* Generic SVG styles */
        .point { fill: white; stroke: var(--accent); stroke-width: 4; r: 10;}
        .line-main { stroke: var(--accent); stroke-width: 6; stroke-linecap: round; }
        .line-success { stroke: var(--success); stroke-width: 6; stroke-linecap: round; }
        .line-error { stroke: var(--error); stroke-width: 4; stroke-dasharray: 8 8; opacity: 0.5; }
        
        /* Scene 1 Animations */
        .draw-path { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.5s ease forwards; }
        .draw-path-delay-1 { animation-delay: 1.5s; }
        .draw-path-delay-2 { animation-delay: 3s; }
        
        @keyframes draw { to { stroke-dashoffset: 0; } }

        /* Scene 3 Animations */
        .distance-line { stroke: var(--primary); stroke-width: 4; stroke-dasharray: 5 10; opacity: 0;}
        .fade-in { animation: fadeIn 0.5s ease forwards; }
        @keyframes fadeIn { to { opacity: 1; } }

        #replayBtn { 
            position: absolute; bottom: 40px; background: var(--primary); color: #0F172A; border: none; 
            padding: 15px 40px; border-radius: 50px; font-size: 1.2rem; font-weight: 800; 
            cursor: pointer; opacity: 0; pointer-events: none; transition: all 0.5s ease; box-shadow: 0 10px 20px rgba(253, 224, 71, 0.4);
        }
        #replayBtn.visible { opacity: 1; pointer-events: auto; }
        #replayBtn:hover { transform: scale(1.05); background: white;}

        @media (max-width: 768px) {
            .header { top: 10px; flex-direction: column; gap: 10px; width: 90%;}
            .title-area { top: 150px; }
            h1 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.5.3.2. Geometrik Çıkarımlar</div>
    </div>

    <div class="title-area">
        <h1 id="mainTitle">Geometrik Çıkarımlar Animasyonu</h1>
    </div>

    <div class="canvas">
        <svg id="svgCanvas">
            
            <!-- SCENE 1 -->
            <g id="scene1" class="scene">
                <circle class="point" cx="200" cy="200" />
                <circle class="point" cx="600" cy="200" />
                
                <!-- Failed lines -->
                <path class="line-error draw-path" d="M 100 300 Q 400 50 600 300" />
                <path class="line-error draw-path draw-path-delay-1" d="M 150 100 Q 400 350 650 100" />
                
                <!-- Success line -->
                <line class="line-success draw-path draw-path-delay-2" x1="100" y1="200" x2="700" y2="200" />
            </g>

            <!-- SCENE 2 -->
            <g id="scene2" class="scene">
                <line class="line-main draw-path" x1="100" y1="300" x2="700" y2="300" />
                <circle class="point" cx="400" cy="100" />
                
                <!-- Failed drops -->
                <line class="line-error draw-path draw-path-delay-1" x1="400" y1="100" x2="250" y2="300" />
                <line class="line-error draw-path draw-path-delay-1" x1="400" y1="100" x2="550" y2="300" />
                
                <!-- Success drop (Perpendicular) -->
                <line class="line-success draw-path draw-path-delay-2" x1="400" y1="100" x2="400" y2="300" />
                
                <!-- 90 Degree symbol -->
                <rect x="400" y="270" width="30" height="30" fill="none" stroke="var(--success)" stroke-width="3" opacity="0" style="animation: fadeIn 0.5s forwards; animation-delay: 4.5s;" />
            </g>

            <!-- SCENE 3 -->
            <g id="scene3" class="scene">
                <line class="line-main draw-path" x1="100" y1="150" x2="700" y2="150" />
                <line class="line-main draw-path" x1="100" y1="250" x2="700" y2="250" />
                
                <!-- Distance markers showing parallel concept -->
                <line class="distance-line fade-in" x1="200" y1="150" x2="200" y2="250" style="animation-delay: 2s;" />
                <line class="distance-line fade-in" x1="300" y1="150" x2="300" y2="250" style="animation-delay: 2.5s;" />
                <line class="distance-line fade-in" x1="400" y1="150" x2="400" y2="250" style="animation-delay: 3s;" />
                <line class="distance-line fade-in" x1="500" y1="150" x2="500" y2="250" style="animation-delay: 3.5s;" />
                <line class="distance-line fade-in" x1="600" y1="150" x2="600" y2="250" style="animation-delay: 4s;" />
            </g>

        </svg>
    </div>

    <button id="replayBtn" onclick="startSequence()">Tekrar Oynat</button>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        
        async function startSequence() {
            const title = document.getElementById('mainTitle');
            const btn = document.getElementById('replayBtn');
            const s1 = document.getElementById('scene1');
            const s2 = document.getElementById('scene2');
            const s3 = document.getElementById('scene3');

            // Reset Everything
            btn.classList.remove('visible');
            s1.classList.remove('active'); s2.classList.remove('active'); s3.classList.remove('active');
            
            // Re-trigger CSS animations by cloning elements (cleanest way to restart CSS animations)
            const clone1 = s1.cloneNode(true); s1.parentNode.replaceChild(clone1, s1);
            const clone2 = s2.cloneNode(true); s2.parentNode.replaceChild(clone2, s2);
            const clone3 = s3.cloneNode(true); s3.parentNode.replaceChild(clone3, s3);
            
            await sleep(500);

            // --- SCENE 1 ---
            title.innerHTML = "1. Çıkarım: İki noktadan sadece <span class='highlight'>BİR DOĞRU</span> geçer.";
            document.getElementById('scene1').classList.add('active');
            await sleep(5500);
            document.getElementById('scene1').classList.remove('active');

            // --- SCENE 2 ---
            title.innerHTML = "2. Çıkarım: Dışındaki bir noktadan doğruya sadece <span class='highlight'>BİR DİKME</span> çizilebilir.";
            document.getElementById('scene2').classList.add('active');
            await sleep(5500);
            document.getElementById('scene2').classList.remove('active');

            // --- SCENE 3 ---
            title.innerHTML = "3. Çıkarım: Uzaklıkları her yerde eşit ve kesişmeyen doğrular <span class='highlight'>PARALELDİR</span>.";
            document.getElementById('scene3').classList.add('active');
            await sleep(5000);
            
            btn.classList.add('visible');
        }
        
        window.onload = startSequence;
    </script>
</body>
</html>
