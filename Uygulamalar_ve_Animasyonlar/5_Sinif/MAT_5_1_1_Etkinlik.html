<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çok Basamaklı Sayılar Keşfi</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --secondary: #10B981;
            --background: #0F172A;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0F172A 0%, #1E1B4B 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow-x: hidden;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #60A5FA, #A78BFA);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }

        .number-display {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: 4px;
            margin: 2rem 0;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            border: 2px dashed rgba(255,255,255,0.2);
        }

        .periods-container {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .period-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1.5rem;
            flex: 1;
            min-width: 200px;
            transition: transform 0.3s ease;
        }

        .period-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.08);
        }

        .period-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #60A5FA;
        }

        .period-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 0.8rem;
            font-size: 1.5rem;
            color: white;
            text-align: center;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .period-input:focus {
            border-color: #60A5FA;
        }

        .period-input.correct {
            border-color: var(--secondary);
            background: rgba(16, 185, 129, 0.2);
        }
        
        .period-input.wrong {
            border-color: #EF4444;
            background: rgba(239, 68, 68, 0.2);
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
            margin: 0.5rem;
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: scale(1.05);
        }

        .btn.secondary {
            background: transparent;
            border: 2px solid var(--primary);
        }

        .btn.secondary:hover {
            background: rgba(79, 70, 229, 0.1);
        }

        #result-text {
            margin-top: 2rem;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--secondary);
            min-height: 2.5rem;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
        }

        #result-text.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .spelling-box {
            margin-top: 1rem;
            font-size: 1.2rem;
            color: #A78BFA;
            font-style: italic;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Confetti Canvas */
        #confetti {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        .brand-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: max-content;
            margin-left: auto;
            margin-right: auto;
        }
        
        .brand-header img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: contain;
            background: white; /* In case logo has transparent bg and dark text */
            padding: 2px;
        }

        .brand-header a {
            color: #A78BFA;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.2rem;
            transition: color 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .brand-header a:hover {
            color: #60A5FA;
        }

        .kazanim-box {
            margin-top: 3rem;
            padding: 1.2rem;
            background: rgba(96, 165, 250, 0.1);
            border: 1px dashed rgba(96, 165, 250, 0.3);
            border-radius: 12px;
            text-align: left;
            position: relative;
        }

        .kazanim-badge {
            position: absolute;
            top: -12px;
            left: 20px;
            background: #60A5FA;
            color: #0F172A;
            font-size: 0.8rem;
            font-weight: 800;
            padding: 3px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .kazanim-box p {
            color: #E2E8F0;
            font-size: 0.95rem;
            line-height: 1.4;
            margin: 0;
            padding-top: 5px;
        }
    </style>
</head>
<body>
    <canvas id="confetti"></canvas>
    
    <div class="container">
        <div class="brand-header">
            <img src="../../logom.png" alt="Müfit Hoca Logo">
            <a href="https://www.instagram.com/mufithocailematematik" target="_blank">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
                @mufithocailematematik
            </a>
        </div>

        <h1>Çok Basamaklı Sayıları Keşfedelim</h1>
        <p class="subtitle">Ekranda görünen sayıyı bölüklerine ayır ve doğruluğunu kontrol et!</p>

        <div class="number-display" id="mainNumber">0</div>

        <div class="periods-container">
            <div class="period-card">
                <div class="period-title">Milyonlar Bölüğü</div>
                <input type="text" class="period-input" id="milyonlar" maxlength="3" autocomplete="off" placeholder="___">
            </div>
            <div class="period-card">
                <div class="period-title">Binler Bölüğü</div>
                <input type="text" class="period-input" id="binler" maxlength="3" autocomplete="off" placeholder="___">
            </div>
            <div class="period-card">
                <div class="period-title">Birler Bölüğü</div>
                <input type="text" class="period-input" id="birler" maxlength="3" autocomplete="off" placeholder="___">
            </div>
        </div>

        <div>
            <button class="btn" onclick="checkAnswers()">Kontrol Et</button>
            <button class="btn secondary" onclick="generateNumber()">Yeni Sayı</button>
        </div>

        <div id="result-text"></div>
        <div class="spelling-box" id="spelling-text"></div>

        <div class="kazanim-box">
            <span class="kazanim-badge">Kazanım</span>
            <p><strong>MAT.5.1.1.</strong> Altı basamaklı sayıları okuma ve yazmayı çok basamaklı sayılara genelleyebilme</p>
        </div>
    </div>

    <script>
        let currentNumber = "";
        let currentParts = [];

        function formatNumberWithSpaces(numStr) {
            return numStr.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
        }

        function generateNumber() {
            // Generate a random number between 1,000,000 and 999,999,999
            const min = 1000000;
            const max = 999999999;
            const randomNum = Math.floor(Math.random() * (max - min + 1)) + min;
            
            currentNumber = randomNum.toString();
            
            // Pad to 9 digits if necessary
            currentNumber = currentNumber.padStart(9, '0');
            
            currentParts = [
                currentNumber.substring(0, 3), // Milyonlar
                currentNumber.substring(3, 6), // Binler
                currentNumber.substring(6, 9)  // Birler
            ];

            // Update UI without spaces for the challenge
            document.getElementById('mainNumber').innerText = currentNumber;
            
            // Reset inputs
            const inputs = document.querySelectorAll('.period-input');
            inputs.forEach(input => {
                input.value = "";
                input.classList.remove('correct', 'wrong');
            });

            // Reset text
            const resultText = document.getElementById('result-text');
            resultText.classList.remove('visible');
            document.getElementById('spelling-text').innerText = "";
        }

        function getSpelling(numStr) {
            const birler = ["", "Bir", "İki", "Üç", "Dört", "Beş", "Altı", "Yedi", "Sekiz", "Dokuz"];
            const onlar = ["", "On", "Yirmi", "Otuz", "Kırk", "Elli", "Altmış", "Yetmiş", "Seksen", "Doksan"];
            
            function readThreeDigits(n) {
                let res = "";
                const yuzlerDigit = Math.floor(n / 100);
                const onlarDigit = Math.floor((n % 100) / 10);
                const birlerDigit = n % 10;

                if (yuzlerDigit === 1) res += "Yüz ";
                else if (yuzlerDigit > 1) res += birler[yuzlerDigit] + " Yüz ";
                
                if (onlarDigit > 0) res += onlar[onlarDigit] + " ";
                if (birlerDigit > 0) res += birler[birlerDigit] + " ";
                
                return res.trim();
            }

            const milyonlarPart = parseInt(numStr.substring(0, 3));
            const binlerPart = parseInt(numStr.substring(3, 6));
            const birlerPart = parseInt(numStr.substring(6, 9));

            let spelling = "";
            if (milyonlarPart > 0) {
                spelling += readThreeDigits(milyonlarPart) + " Milyon ";
            }
            
            if (binlerPart === 1) {
                spelling += "Bin ";
            } else if (binlerPart > 1) {
                spelling += readThreeDigits(binlerPart) + " Bin ";
            }

            if (birlerPart > 0) {
                spelling += readThreeDigits(birlerPart);
            }

            return spelling.trim();
        }

        function checkAnswers() {
            const m_input = document.getElementById('milyonlar');
            const b_input = document.getElementById('binler');
            const bi_input = document.getElementById('birler');

            // Format inputs (remove leading zeros for comparison if user didn't type them, but strictly we can expect exact match or parsed match)
            const m_val = parseInt(m_input.value || "0");
            const b_val = parseInt(b_input.value || "0");
            const bi_val = parseInt(bi_input.value || "0");

            const m_correct = parseInt(currentParts[0]);
            const b_correct = parseInt(currentParts[1]);
            const bi_correct = parseInt(currentParts[2]);

            let allCorrect = true;

            if (m_val === m_correct) {
                m_input.classList.add('correct');
                m_input.classList.remove('wrong');
            } else {
                m_input.classList.add('wrong');
                m_input.classList.remove('correct');
                allCorrect = false;
            }

            if (b_val === b_correct) {
                b_input.classList.add('correct');
                b_input.classList.remove('wrong');
            } else {
                b_input.classList.add('wrong');
                b_input.classList.remove('correct');
                allCorrect = false;
            }

            if (bi_val === bi_correct) {
                bi_input.classList.add('correct');
                bi_input.classList.remove('wrong');
            } else {
                bi_input.classList.add('wrong');
                bi_input.classList.remove('correct');
                allCorrect = false;
            }

            const resultText = document.getElementById('result-text');
            if (allCorrect) {
                resultText.innerText = "Tebrikler! Harika iş çıkardın 🎉";
                resultText.style.color = "var(--secondary)";
                document.getElementById('spelling-text').innerText = "Okunuşu: " + getSpelling(currentNumber);
                document.getElementById('mainNumber').innerText = formatNumberWithSpaces(currentNumber);
                fireConfetti();
            } else {
                resultText.innerText = "Bazı bölükler yanlış. Tekrar dene! 🧐";
                resultText.style.color = "#EF4444";
                document.getElementById('spelling-text').innerText = "";
            }
            resultText.classList.add('visible');
        }

        // Simple Confetti
        function fireConfetti() {
            const canvas = document.getElementById('confetti');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const pieces = [];
            const colors = ['#4F46E5', '#10B981', '#60A5FA', '#A78BFA', '#F59E0B'];

            for (let i = 0; i < 100; i++) {
                pieces.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 20,
                    vy: (Math.random() - 0.5) * 20 - 10,
                    size: Math.random() * 10 + 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rot: Math.random() * 360,
                    rotSpeed: (Math.random() - 0.5) * 10
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let active = false;
                
                pieces.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.5; // gravity
                    p.rot += p.rotSpeed;

                    if (p.y < canvas.height) active = true;

                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rot * Math.PI / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
                    ctx.restore();
                });

                if (active) requestAnimationFrame(animate);
                else ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
            animate();
        }

        // Init
        window.onload = generateNumber;
    </script>
</body>
</html>
