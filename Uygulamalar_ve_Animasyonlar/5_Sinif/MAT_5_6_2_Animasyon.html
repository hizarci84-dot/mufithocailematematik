<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şans Kime Güler? - Animasyon</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F172A;
            --text: #F8FAFC;
            --primary: #8B5CF6; /* Purple */
            --secondary: #F43F5E; /* Red */
            --tertiary: #3B82F6; /* Blue */
            --amber: #F59E0B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px; overflow-x: hidden;
        }

        .header {
            width: 100%; max-width: 900px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--amber); color: #0F172A; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area { text-align: center; width: 100%; max-width: 800px; margin-bottom: 20px; height: 120px;}
        h1 { font-size: 2.2rem; color: var(--amber); text-shadow: 0 5px 15px rgba(0,0,0,0.5); line-height: 1.3;}
        .subtitle { font-size: 1.2rem; color: #94A3B8; margin-top: 10px; line-height: 1.5; min-height: 55px;}
        .subtitle span { color: white; font-weight: 800; background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 5px;}

        .canvas-area {
            position: relative; width: 100%; max-width: 800px; height: 450px; 
            background: #0B1120; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.3); 
            overflow: hidden; display: flex; align-items: center; justify-content: center;
        }

        .scene { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.8s; pointer-events: none;}
        .scene.active { opacity: 1; z-index: 10; }

        /* Spinner Wheel */
        .wheel-container { position: relative; width: 250px; height: 250px; margin-bottom: 30px;}
        .wheel {
            width: 100%; height: 100%; border-radius: 50%; border: 5px solid white;
            transition: all 2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }
        .pointer {
            position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent;
            border-top: 30px solid white; z-index: 10;
        }

        /* Wheel states */
        /* Red: 75%, Blue: 25% */
        .w-state-1 { background: conic-gradient(var(--secondary) 0% 75%, var(--tertiary) 75% 100%); }
        
        /* Red: 50%, Blue: 50% */
        .w-state-2 { background: conic-gradient(var(--secondary) 0% 50%, var(--tertiary) 50% 100%); }

        .spin-anim { animation: spin 3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(1420deg); } } /* Ends near top (0-50deg area) */

        .big-text { font-size: 2rem; font-weight: 900; color: white; text-align: center; opacity: 0; transform: translateY(20px); transition: all 0.5s 0.3s; padding: 0 20px;}
        .scene.active .big-text { opacity: 1; transform: translateY(0); }

        .btn-start {
            margin-top: 30px; background: var(--amber); color: #0F172A; border: none; padding: 15px 40px; border-radius: 50px;
            font-size: 1.2rem; font-weight: 900; cursor: pointer; transition: all 0.3s; box-shadow: 0 10px 20px rgba(245, 158, 11, 0.4);
        }
        .btn-start:hover { transform: scale(1.05); }

        @media (max-width: 768px) {
            .header { flex-direction: column; gap: 10px; }
            h1 { font-size: 1.5rem; }
            .canvas-area { height: 350px; }
            .title-area { height: 140px; }
            .wheel-container { width: 180px; height: 180px; }
            .big-text { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.5.6.2. Şans Kime Güler?</div>
    </div>

    <div class="title-area">
        <h1 id="mTitle">Şans Kime Güler?</h1>
        <p class="subtitle" id="mSub">Olasılık bir sihir değildir, <span>sayıların gücüdür.</span></p>
    </div>

    <div class="canvas-area">
        
        <div class="scene active" id="sc1">
            <div class="wheel-container">
                <div class="pointer"></div>
                <div class="wheel w-state-1" id="wheelObj"></div>
            </div>
            <div class="big-text" id="bText">
                <!-- text injected -->
            </div>
        </div>

    </div>

    <button class="btn-start" id="startBtn" onclick="runTimeline()">Çarkı Çevir</button>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        
        const mTitle = document.getElementById('mTitle');
        const mSub = document.getElementById('mSub');
        const startBtn = document.getElementById('startBtn');
        const wheelObj = document.getElementById('wheelObj');
        const bText = document.getElementById('bText');

        async function runTimeline() {
            startBtn.style.display = 'none';

            // Reset
            wheelObj.className = "wheel w-state-1";
            wheelObj.style.animation = "none";
            bText.innerHTML = "";
            bText.style.opacity = 0;
            await sleep(500);

            // Step 1: Unequal
            mTitle.innerText = "Bölüm 1: Adaletsiz Çark";
            mSub.innerHTML = "Bu çarkta Kırmızı renk alanın %75'ini, Mavi ise sadece %25'ini kaplıyor.";
            await sleep(3500);

            bText.style.opacity = 1;
            bText.innerHTML = "Çarkı çevirirsek Kırmızı gelmesi <span style='color:var(--secondary)'>ÇOK OLASILIKLI</span>, Mavi gelmesi <span style='color:var(--tertiary)'>AZ OLASILIKLI'dır.</span>";
            await sleep(4000);

            // Spin
            mTitle.innerText = "Döndürüyoruz...";
            mSub.innerHTML = "Şansın kime güleceğini sayılar çoktan belirledi!";
            wheelObj.classList.add('spin-anim'); // Lands on roughly 340deg (Red area)
            
            await sleep(3500);
            bText.innerHTML = "Ve tahmin ettiğimiz gibi <span style='color:var(--secondary)'>KIRMIZI</span> kazandı!";
            await sleep(4000);

            // Step 2: Equal
            mTitle.innerText = "Bölüm 2: Adil Çark";
            mSub.innerHTML = "Şimdi renklerin alanlarını birbirine eşitledik. (Yarı yarıya)";
            
            wheelObj.style.animation = "none";
            // force reflow
            void wheelObj.offsetWidth;
            wheelObj.className = "wheel w-state-2";
            
            bText.innerHTML = "Artık Kırmızı ve Mavi'nin gelmesi <span style='color:var(--amber)'>EŞİT OLASILIKLI'dır!</span> İkisinin de şansı aynıdır.";
            await sleep(5000);

            mTitle.innerText = "Matematiğin Kuralı";
            mSub.innerHTML = "Olasılıkta bir şeyin sayısı veya alanı ne kadar büyükse, <span>şansı da o kadar çoktur! 🎓</span>";
            bText.style.opacity = 0;

            setTimeout(() => {
                startBtn.style.display = 'block';
                startBtn.innerText = "Tekrar İzle";
            }, 3000);
        }
    </script>
</body>
</html>
