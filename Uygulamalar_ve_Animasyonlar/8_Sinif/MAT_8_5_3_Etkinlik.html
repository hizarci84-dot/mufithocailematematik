<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Döndürme - Merkez ve Açı</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#0F0E17; --surface:#1A1A24; --primary:#8B5CF6; --secondary:#10B981; --tertiary:#06B6D4; --danger:#F43F5E; --accent:#F59E0B; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Outfit',sans-serif; }
        body { background:linear-gradient(135deg,var(--bg),#161625); color:#F8FAFC; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px; }
        .header { width:100%; max-width:1000px; display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,0.05); padding:15px 25px; border-radius:20px; border:1px solid rgba(139,92,246,0.2); margin-bottom:20px; }
        .header-left { display:flex; align-items:center; gap:15px; font-weight:600; font-size:1.2rem; }
        .header-left img { width:50px; height:50px; border-radius:50%; background:white; padding:2px; }
        .kazanim { background:var(--primary); color:white; padding:5px 15px; border-radius:20px; font-weight:800; font-size:0.9rem; }
        h1 { font-size:2.2rem; color:var(--tertiary); font-weight:900; text-align:center; }
        .subtitle { color:#94A3B8; font-size:1.1rem; margin-top:5px; text-align:center; margin-bottom:20px; }
        .panel { background:#11111A; border-radius:24px; border:1px solid rgba(255,255,255,0.05); box-shadow:inset 0 0 30px rgba(0,0,0,0.5); padding:25px; display:flex; width:100%; max-width:1000px; gap:25px; align-items:flex-start; justify-content:center; flex-wrap:wrap; }
        .controls { display:flex; flex-direction:column; gap:14px; width:260px; }
        .card { background:var(--surface); padding:15px; border-radius:15px; display:flex; flex-direction:column; gap:8px; }
        .c-lbl { font-weight:800; color:white; font-size:1.05rem; }
        .c-val { font-size:1.8rem; font-weight:900; }
        input[type=range] { width:100%; cursor:pointer; accent-color:var(--primary); }
        .dir-row { display:flex; gap:10px; }
        .dir-btn { flex:1; padding:10px; border-radius:10px; font-size:1rem; font-weight:800; cursor:pointer; border:2px solid #334155; background:transparent; color:white; transition:all 0.3s; }
        .dir-btn.active { border-color:var(--tertiary); background:rgba(6,182,212,0.2); color:var(--tertiary); }
        .btn-apply { background:var(--primary); color:white; border:none; padding:12px; border-radius:12px; font-size:1.1rem; font-weight:900; cursor:pointer; width:100%; }
        .btn-apply:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(139,92,246,0.4); }
        .btn-reset { background:rgba(244,63,94,0.2); color:var(--danger); border:2px solid var(--danger); padding:10px; border-radius:12px; font-size:1rem; font-weight:800; cursor:pointer; width:100%; }
        .info-box { background:rgba(245,158,11,0.1); border:1px solid var(--accent); padding:12px; border-radius:12px; color:white; font-size:0.95rem; font-weight:600; }
        .canvas-wrap { width:100%; max-width:620px; height:430px; background:#161625; border:2px dashed #334155; border-radius:15px; overflow:hidden; }
        canvas { display:block; width:100%; height:100%; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=8B5CF6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.8.5.3. Döndürme (Etkinlik)</div>
    </div>
    <h1>Döndürme (Rotasyon)</h1>
    <p class="subtitle">Merkez ve açıyı seçerek şekli döndürün. Döndürmede şeklin büyüklüğü değişmez.</p>
    <div class="panel">
        <div class="controls">
            <div class="card">
                <span class="c-lbl">Döndürme Açısı</span>
                <span class="c-val" style="color:var(--accent);" id="valAng">90°</span>
                <input type="range" id="sliderAng" min="0" max="360" step="45" value="90" oninput="update()">
            </div>
            <div class="card">
                <span class="c-lbl">Yön</span>
                <div class="dir-row">
                    <button class="dir-btn active" id="btnCCW" onclick="setDir(-1)">↺ Ters</button>
                    <button class="dir-btn" id="btnCW" onclick="setDir(1)">↻ Saat</button>
                </div>
            </div>
            <button class="btn-apply" onclick="applyRotation()">🔄 Döndür</button>
            <button class="btn-reset" onclick="reset()">↩ Sıfırla</button>
            <div class="info-box" id="ruleBox">
                Saat yönü tersi (+) döndürmede:<br>
                A(x,y) → A'(-y, x)<br>
                Saat yönü (-) döndürmede:<br>
                A(x,y) → A'(y, -x)
            </div>
        </div>
        <div class="canvas-wrap">
            <canvas id="cvs" width="620" height="430"></canvas>
        </div>
    </div>
    <script>
        const cvs=document.getElementById('cvs'); const ctx=cvs.getContext('2d');
        const CELL=35, OX=310, OY=215;
        function gx(x){return OX+x*CELL;} function gy(y){return OY-y*CELL;}
        const shape=[{x:1,y:1},{x:4,y:1},{x:4,y:3},{x:2,y:3},{x:2,y:2},{x:1,y:2}]; // L-shape
        let dir=-1; // -1=CCW(+), 1=CW(-)
        let ang=90;
        let rotated=null;

        function rotatePoint(p,angleDeg,direction){
            // Standard math rotation
            let radMath = angleDeg*Math.PI/180 * (-direction); // flip direction for screen coords (since CCW is standard)
            return {x:Math.round((p.x*Math.cos(radMath)-p.y*Math.sin(radMath))*10)/10,
                    y:Math.round((p.x*Math.sin(radMath)+p.y*Math.cos(radMath))*10)/10};
        }

        function setDir(d){
            dir=d;
            document.getElementById('btnCCW').classList.toggle('active',d===-1);
            document.getElementById('btnCW').classList.toggle('active',d===1);
            rotated=null; draw();
        }

        function update(){
            ang=parseInt(document.getElementById('sliderAng').value);
            document.getElementById('valAng').textContent=ang+'°';
            rotated=null; draw();
        }

        function applyRotation(){
            rotated=shape.map(p=>rotatePoint(p,ang,dir));
            draw();
        }
        function reset(){rotated=null;draw();}

        function drawGrid(){
            ctx.clearRect(0,0,620,430);
            ctx.strokeStyle='rgba(255,255,255,0.07)';ctx.lineWidth=1;
            for(let x=-9;x<=9;x++){ctx.beginPath();ctx.moveTo(gx(x),0);ctx.lineTo(gx(x),430);ctx.stroke();}
            for(let y=-7;y<=7;y++){ctx.beginPath();ctx.moveTo(0,gy(y));ctx.lineTo(620,gy(y));ctx.stroke();}
            ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=2;
            ctx.beginPath();ctx.moveTo(0,gy(0));ctx.lineTo(620,gy(0));ctx.stroke();
            ctx.beginPath();ctx.moveTo(gx(0),0);ctx.lineTo(gx(0),430);ctx.stroke();
            ctx.fillStyle='#94A3B8';ctx.font='600 11px Outfit';ctx.textAlign='center';
            for(let x=-8;x<=8;x+=2)if(x)ctx.fillText(x,gx(x),gy(0)+16);
            ctx.textAlign='right';
            for(let y=-5;y<=5;y+=2)if(y)ctx.fillText(y,gx(0)-6,gy(y)+4);
            // Center point
            ctx.beginPath();ctx.arc(gx(0),gy(0),6,0,Math.PI*2);
            ctx.fillStyle='#F59E0B';ctx.fill();
            ctx.fillStyle='#F59E0B';ctx.font='800 13px Outfit';ctx.textAlign='left';
            ctx.fillText('Merkez (0,0)',gx(0)+10,gy(0)-10);
        }

        function drawPoly(pts,fill,stroke,alpha,label){
            ctx.beginPath();ctx.moveTo(gx(pts[0].x),gy(pts[0].y));
            pts.forEach(p=>ctx.lineTo(gx(p.x),gy(p.y)));ctx.closePath();
            ctx.fillStyle=fill;ctx.globalAlpha=alpha;ctx.fill();
            ctx.globalAlpha=1;ctx.strokeStyle=stroke;ctx.lineWidth=3;ctx.stroke();
            if(label){let cx=pts.reduce((s,p)=>s+p.x,0)/pts.length,cy=pts.reduce((s,p)=>s+p.y,0)/pts.length;
                ctx.fillStyle=stroke;ctx.font='900 15px Outfit';ctx.textAlign='center';ctx.textBaseline='middle';
                ctx.fillText(label,gx(cx),gy(cy));
                ctx.textBaseline='alphabetic';}
        }

        function drawArc(){
            if(!rotated) return;
            // Draw arc from one vertex of original to rotated to show angle
            let p=shape[0]; let rp=rotated[0];
            let r=Math.sqrt(p.x*p.x+p.y*p.y)*CELL;
            let a1=Math.atan2(-p.y,p.x); // - because screen y
            let a2=Math.atan2(-rp.y,rp.x);
            ctx.beginPath();ctx.arc(gx(0),gy(0),r,a1,a2,dir===1);
            ctx.strokeStyle='rgba(245,158,11,0.5)';ctx.lineWidth=2;ctx.setLineDash([5,5]);ctx.stroke();ctx.setLineDash([]);
            // Angle label
            let midA=(a1+a2)/2;
            ctx.fillStyle='#F59E0B';ctx.font='900 14px Outfit';ctx.textAlign='center';
            ctx.fillText(ang+'°',gx(0)+r*0.6*Math.cos(midA),gy(0)+r*0.6*Math.sin(midA));
        }

        function draw(){
            drawGrid();
            drawPoly(shape,'#8B5CF6','#8B5CF6',0.35,'ABCDEF');
            if(rotated){drawArc();drawPoly(rotated,'#10B981','#10B981',0.35,"A'B'C'D'E'F'");}
        }

        document.addEventListener('click', function(e) {
            if (e.target.tagName === 'BUTTON' && !e.target.hasAttribute('data-spam-locked')) {
                e.target.setAttribute('data-spam-locked','true'); e.target.style.opacity='0.7'; e.target.style.pointerEvents='none';
                setTimeout(() => { e.target.removeAttribute('data-spam-locked'); e.target.style.opacity='1'; e.target.style.pointerEvents='auto'; }, 400);
            }
        });
        draw();
    </script>
</body>
</html>
