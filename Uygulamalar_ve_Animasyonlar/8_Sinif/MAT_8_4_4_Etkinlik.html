<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dik Prizma Simülatörü</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#0F0E17; --surface:#1A1A24; --primary:#8B5CF6; --secondary:#10B981; --tertiary:#06B6D4; --danger:#F43F5E; --accent:#F59E0B; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Outfit',sans-serif; }
        body { background:linear-gradient(135deg,var(--bg),#161625); color:#F8FAFC; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px; }
        .header { width:100%; max-width:1000px; display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,0.05); padding:15px 25px; border-radius:20px; border:1px solid rgba(139,92,246,0.2); margin-bottom:20px; }
        .header-left { display:flex; align-items:center; gap:15px; font-weight:600; font-size:1.2rem; }
        .header-left img { width:50px; height:50px; border-radius:50%; background:white; padding:2px; }
        .kazanim { background:var(--primary); color:white; padding:5px 15px; border-radius:20px; font-weight:800; font-size:0.9rem; }
        .title-area { text-align:center; margin-bottom:20px; }
        h1 { font-size:2.2rem; color:var(--tertiary); font-weight:900; }
        .subtitle { color:#94A3B8; font-size:1.1rem; margin-top:5px; }
        .panel { background:#11111A; border-radius:24px; border:1px solid rgba(255,255,255,0.05); box-shadow:inset 0 0 30px rgba(0,0,0,0.5); padding:30px; display:flex; width:100%; max-width:1000px; gap:30px; align-items:center; justify-content:center; flex-wrap:wrap; }
        .controls { display:flex; flex-direction:column; gap:15px; width:300px; }
        .card { background:var(--surface); padding:15px; border-radius:15px; display:flex; flex-direction:column; gap:8px; }
        .c-lbl { font-weight:800; color:white; font-size:1.1rem; }
        .c-val { font-size:1.8rem; font-weight:900; }
        input[type=range] { width:100%; cursor:pointer; accent-color:var(--primary); }
        .result-card { background:rgba(0,0,0,0.3); border:1px solid #334155; padding:15px; border-radius:12px; }
        .r-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
        .r-formula { color:#94A3B8; font-weight:600; font-size:0.95rem; }
        .r-val { font-weight:900; font-size:1.2rem; }
        .canvas-area { width:400px; height:380px; background:#161625; border:2px dashed #334155; border-radius:15px; display:flex; align-items:center; justify-content:center; }
        svg { overflow:visible; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=8B5CF6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.8.4.4. Dik Prizma (Etkinlik)</div>
    </div>
    <div class="title-area">
        <h1>Dikdörtgen Prizma - Hacim & Yüzey</h1>
        <p class="subtitle">Uzunluk, genişlik ve yüksekliği değiştirerek prizma formüllerini keşfedin.</p>
    </div>
    <div class="panel">
        <div class="controls">
            <div class="card">
                <span class="c-lbl">Uzunluk (a)</span>
                <span class="c-val" style="color:var(--secondary);" id="valA">6 cm</span>
                <input type="range" id="sliderA" min="1" max="12" value="6" oninput="update()">
            </div>
            <div class="card">
                <span class="c-lbl">Genişlik (b)</span>
                <span class="c-val" style="color:var(--danger);" id="valB">4 cm</span>
                <input type="range" id="sliderB" min="1" max="12" value="4" oninput="update()">
            </div>
            <div class="card">
                <span class="c-lbl">Yükseklik (c)</span>
                <span class="c-val" style="color:var(--accent);" id="valC">5 cm</span>
                <input type="range" id="sliderC" min="1" max="12" value="5" oninput="update()">
            </div>
            <div class="result-card">
                <div class="r-row">
                    <span class="r-formula">Hacim = a × b × c</span>
                    <span class="r-val" style="color:var(--primary);" id="rHacim">120 cm³</span>
                </div>
                <div class="r-row" style="margin-bottom:0;">
                    <span class="r-formula">Yüzey = 2(ab+bc+ac)</span>
                    <span class="r-val" style="color:var(--tertiary);" id="rYuzey">148 cm²</span>
                </div>
            </div>
        </div>
        <div class="canvas-area">
            <svg width="350" height="340" viewBox="0 0 350 340" id="svgBox">
                <!-- Isometric box drawing -->
                <!-- Front face -->
                <polygon id="front" points="80,280 220,280 220,130 80,130" fill="rgba(139,92,246,0.2)" stroke="var(--primary)" stroke-width="3"/>
                <!-- Top face -->
                <polygon id="top" points="80,130 220,130 280,70 140,70" fill="rgba(139,92,246,0.35)" stroke="var(--primary)" stroke-width="3"/>
                <!-- Right face -->
                <polygon id="right" points="220,280 280,220 280,70 220,130" fill="rgba(139,92,246,0.15)" stroke="var(--primary)" stroke-width="3"/>
                <!-- Labels -->
                <text id="lblA" x="150" y="300" text-anchor="middle" fill="var(--secondary)" font-weight="900" font-family="Outfit" font-size="16">a=6</text>
                <text id="lblB" x="265" y="165" fill="var(--danger)" font-weight="900" font-family="Outfit" font-size="16">b=4</text>
                <text id="lblC" x="50" y="210" fill="var(--accent)" font-weight="900" font-family="Outfit" font-size="16">c=5</text>
                <!-- Volume inside -->
                <text id="volLbl" x="148" y="215" text-anchor="middle" fill="white" font-weight="900" font-family="Outfit" font-size="20">120 cm³</text>
            </svg>
        </div>
    </div>
    <script>
        function update() {
            let a = parseInt(document.getElementById('sliderA').value);
            let b = parseInt(document.getElementById('sliderB').value);
            let c = parseInt(document.getElementById('sliderC').value);
            document.getElementById('valA').textContent = a + ' cm';
            document.getElementById('valB').textContent = b + ' cm';
            document.getElementById('valC').textContent = c + ' cm';
            let hacim = a*b*c;
            let yuzey = 2*(a*b + b*c + a*c);
            document.getElementById('rHacim').textContent = hacim + ' cm³';
            document.getElementById('rYuzey').textContent = yuzey + ' cm²';
            // SVG: isometric box - scale each dim
            let sa = 15 + (a/12)*120; // width of front face
            let sb = 15 + (b/12)*80;  // depth (right offset)
            let sc = 15 + (c/12)*150; // height
            // Fixed anchor: bottom-left front = (80, 280)
            let fx=80, fy=280;
            let fx2=fx+sa, fy2=fy;
            let fx3=fx+sa, fy3=fy-sc;
            let fx4=fx, fy4=fy-sc;
            document.getElementById('front').setAttribute('points', `${fx},${fy} ${fx2},${fy2} ${fx3},${fy3} ${fx4},${fy4}`);
            // Top face (isometric offset: dx=sb*0.5, dy=-sb*0.5)
            let dx=sb*0.5, dy=-sb*0.5;
            document.getElementById('top').setAttribute('points', `${fx4},${fy4} ${fx3},${fy3} ${fx3+dx},${fy3+dy} ${fx4+dx},${fy4+dy}`);
            // Right face
            document.getElementById('right').setAttribute('points', `${fx2},${fy2} ${fx2+dx},${fy2+dy} ${fx3+dx},${fy3+dy} ${fx3},${fy3}`);
            // Labels
            document.getElementById('lblA').setAttribute('x', fx+sa/2); document.getElementById('lblA').setAttribute('y', fy+22); document.getElementById('lblA').textContent = 'a=' + a;
            document.getElementById('lblB').setAttribute('x', fx2+dx/2+5); document.getElementById('lblB').setAttribute('y', (fy2+fy3)/2+dy/2); document.getElementById('lblB').textContent = 'b=' + b;
            document.getElementById('lblC').setAttribute('x', fx-22); document.getElementById('lblC').setAttribute('y', (fy+fy4)/2+6); document.getElementById('lblC').textContent = 'c=' + c;
            document.getElementById('volLbl').setAttribute('x', fx+sa/2); document.getElementById('volLbl').setAttribute('y', (fy+fy4)/2+8);
            document.getElementById('volLbl').textContent = hacim + ' cm³';
        }
        document.addEventListener('click', function(e) {
            if (e.target.tagName === 'BUTTON' && !e.target.hasAttribute('data-spam-locked')) {
                e.target.setAttribute('data-spam-locked','true'); e.target.style.opacity='0.7'; e.target.style.pointerEvents='none';
                setTimeout(() => { e.target.removeAttribute('data-spam-locked'); e.target.style.opacity='1'; e.target.style.pointerEvents='auto'; }, 400);
            }
        });
        update();
    </script>
</body>
</html>
