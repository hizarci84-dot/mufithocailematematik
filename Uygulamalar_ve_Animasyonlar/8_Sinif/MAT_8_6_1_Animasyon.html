<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merkezi Eğilim Animasyonu</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#0F0E17; --primary:#8B5CF6; --secondary:#10B981; --tertiary:#06B6D4; --danger:#F43F5E; --accent:#F59E0B; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Outfit',sans-serif; }
        body { background:linear-gradient(135deg,var(--bg),#161625); color:#F8FAFC; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px; }
        .header { width:100%; max-width:1000px; display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,0.05); padding:15px 25px; border-radius:20px; border:1px solid rgba(139,92,246,0.2); margin-bottom:20px; }
        .header-left { display:flex; align-items:center; gap:15px; font-weight:600; font-size:1.2rem; }
        .header-left img { width:50px; height:50px; border-radius:50%; background:white; padding:2px; }
        .kazanim { background:var(--primary); color:white; padding:5px 15px; border-radius:20px; font-weight:800; font-size:0.9rem; }
        h1 { font-size:2.2rem; color:var(--tertiary); font-weight:900; text-align:center; }
        .subtitle { color:#94A3B8; font-size:1.1rem; margin-top:5px; text-align:center; margin-bottom:20px; }
        .canvas-area { position:relative; width:100%; max-width:800px; height:450px; background:#11111A; border-radius:24px; border:1px solid rgba(255,255,255,0.05); box-shadow:inset 0 0 50px rgba(0,0,0,0.5); overflow:hidden; }
        canvas { position:absolute; top:0; left:0; }
        .expl-text { background:rgba(139,92,246,0.15); border:1px solid rgba(139,92,246,0.3); padding:15px 25px; border-radius:12px; font-size:1.25rem; color:white; font-weight:800; text-align:center; width:100%; max-width:800px; margin-bottom:15px; transition:0.5s; }
        .btn-play { background:var(--primary); color:white; border:none; padding:15px 40px; border-radius:50px; font-size:1.2rem; font-weight:900; cursor:pointer; transition:all 0.3s; box-shadow:0 10px 20px rgba(139,92,246,0.4); margin-top:30px; }
        .btn-play:hover { transform:translateY(-3px) scale(1.05); }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=8B5CF6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.8.6.1. Merkezi Eğilim (Animasyon)</div>
    </div>
    <h1>Denge Noktası: Ortalama</h1>
    <p class="subtitle">Ortalama, sayı doğrusunda tüm verilerin "denge noktasıdır". Aykırı değer onu nasıl etkiler?</p>
    <div class="expl-text" id="explText">1. 7 öğrencinin sınav notu: 5, 6, 7, 7, 8, 8, 9</div>
    <div class="canvas-area">
        <canvas id="cvs" width="800" height="450"></canvas>
    </div>
    <button class="btn-play" id="btnPlay" onclick="runAnim()">Animasyonu Başlat</button>
    <script>
        const cvs=document.getElementById('cvs');const ctx=cvs.getContext('2d');
        const W=800,H=450;
        const normalData=[5,6,7,7,8,8,9];
        const outlierData=[5,6,7,7,8,8,25]; // 25 is outlier
        const sleep=ms=>new Promise(r=>setTimeout(r,ms));

        function calcStats(data){
            let sum=data.reduce((a,b)=>a+b,0);
            let mean=sum/data.length;
            let sorted=[...data].sort((a,b)=>a-b);
            let mid=Math.floor(sorted.length/2);
            let median=sorted.length%2===0?(sorted[mid-1]+sorted[mid])/2:sorted[mid];
            let freq={};data.forEach(v=>freq[v]=(freq[v]||0)+1);
            let maxF=Math.max(...Object.values(freq));
            let modes=Object.keys(freq).filter(k=>freq[k]===maxF).map(Number);
            return {mean,median,modes};
        }

        function drawScene(data,phase,showOutlier=false){
            ctx.clearRect(0,0,W,H);
            let {mean,median,modes}=calcStats(data);
            let minV=Math.min(...data)-2, maxV=Math.max(...data)+2;
            function px(v){return Math.max(40, Math.min(W-40, 60+(v-minV)/(maxV-minV)*(W-120)));}

            // Background
            ctx.fillStyle='#11111A';ctx.fillRect(0,0,W,H);

            // Number line
            ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=2;
            ctx.beginPath();ctx.moveTo(40,H-100);ctx.lineTo(W-40,H-100);ctx.stroke();
            // Tick marks
            for(let v=Math.ceil(minV);v<=Math.floor(maxV);v++){
                let x=px(v);
                ctx.beginPath();ctx.moveTo(x,H-105);ctx.lineTo(x,H-95);ctx.stroke();
                ctx.fillStyle='#94A3B8';ctx.font='600 12px Outfit';ctx.textAlign='center';
                ctx.fillText(v,x,H-82);
            }

            // Balance beam (tilted based on mean vs median difference)
            if(phase>=2){
                let beamCenter=px(mean);
                let tilt = showOutlier ? 5 : 0;
                ctx.save();ctx.translate(beamCenter,H-100);ctx.rotate(tilt*Math.PI/180);
                ctx.strokeStyle=showOutlier?'#F43F5E':'#10B981';ctx.lineWidth=8;ctx.lineCap='round';
                ctx.beginPath();ctx.moveTo(-200,0);ctx.lineTo(200,0);ctx.stroke();
                ctx.restore();
                // Pivot triangle
                ctx.fillStyle=showOutlier?'#F43F5E':'#10B981';
                ctx.beginPath();ctx.moveTo(beamCenter,H-90);
                ctx.lineTo(beamCenter-15,H-70);ctx.lineTo(beamCenter+15,H-70);ctx.closePath();ctx.fill();
            }

            // Data points (balls)
            if(phase>=1){
                data.forEach((v,i)=>{
                    let x=px(v);
                    let isOutlier=showOutlier&&v>20;
                    ctx.beginPath();ctx.arc(x,H-130,15,0,Math.PI*2);
                    ctx.fillStyle=isOutlier?'#F43F5E':modes.includes(v)?'#10B981':'#8B5CF6';
                    ctx.fill();ctx.strokeStyle='white';ctx.lineWidth=2;ctx.stroke();
                    ctx.fillStyle='white';ctx.font='700 13px Outfit';ctx.textAlign='center';
                    ctx.fillText(v,x,H-125);
                });
            }

            // Mean line
            if(phase>=3){
                let x=px(mean);
                let closeToMedian = phase>=4 && Math.abs(mean-median)<1.5;
                let meanLabelY = closeToMedian ? H-200 : H-175;
                ctx.strokeStyle='#8B5CF6';ctx.lineWidth=3;ctx.setLineDash([]);
                ctx.beginPath();ctx.moveTo(x,H-165);ctx.lineTo(x,H-100);ctx.stroke();
                ctx.fillStyle='#8B5CF6';ctx.font='900 13px Outfit';ctx.textAlign='center';
                ctx.fillText('x̄='+mean.toFixed(1),x,meanLabelY);
                ctx.fillText('Ortalama',x,meanLabelY+15);
            }

            // Median line
            if(phase>=4){
                let x=px(median);
                ctx.strokeStyle='#F43F5E';ctx.lineWidth=3;ctx.setLineDash([6,4]);
                ctx.beginPath();ctx.moveTo(x,H-165);ctx.lineTo(x,H-100);ctx.stroke();
                ctx.setLineDash([]);
                ctx.fillStyle='#F43F5E';ctx.font='900 13px Outfit';ctx.textAlign='center';
                ctx.fillText('Me='+median,x,H-175);
                ctx.fillText('Medyan',x,H-160);
            }

            // Comparison
            if(phase>=5){
                ctx.fillStyle='white';ctx.font='700 15px Outfit';ctx.textAlign='center';
                let msg=showOutlier?'Aykırı değer (25) ortalamayi yukarı çekti, ama medyan yerinde kaldı!':'Ortalama ve medyan birbirine yakın → Veri dengeli.';
                ctx.fillStyle=showOutlier?'#F43F5E':'#10B981';
                ctx.font='800 16px Outfit';
                ctx.fillText(msg,W/2,50);
            }
        }

        async function runAnim(){
            document.getElementById('btnPlay').style.display='none';
            const et=document.getElementById('explText');
            // Phase 1: show data
            drawScene(normalData,1);
            await sleep(1000);
            et.textContent='2. Denge noktasını (ortalamasını) hesaplayalım...';
            drawScene(normalData,2);
            await sleep(1000);
            drawScene(normalData,3);
            await sleep(1000);
            et.textContent='3. Medyan da belirlensin...';
            drawScene(normalData,4);
            await sleep(1000);
            drawScene(normalData,5);
            await sleep(2500);
            // Outlier
            et.textContent='4. Şimdi bir öğrenci 25 aldı (aykırı değer). Ne olur?';
            drawScene(outlierData,1,true);
            await sleep(1200);
            drawScene(outlierData,2,true);
            await sleep(800);
            drawScene(outlierData,3,true);
            await sleep(800);
            drawScene(outlierData,4,true);
            await sleep(800);
            drawScene(outlierData,5,true);
            et.style.color='var(--accent)';
            et.textContent='Aykırı değer ortalamayi etkiler ama medyanı etkilemez! Bu yüzden medyan daha "güvenilir" bir ölçüdür.';
        }
        drawScene(normalData,1);
    </script>
</body>
</html>
