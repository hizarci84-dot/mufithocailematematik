<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prizma Katman Dolumu Animasyonu</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#0F0E17; --primary:#8B5CF6; --secondary:#10B981; --tertiary:#06B6D4; --danger:#F43F5E; --accent:#F59E0B; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Outfit',sans-serif; }
        body { background:linear-gradient(135deg,var(--bg),#161625); color:#F8FAFC; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px; }
        .header { width:100%; max-width:1000px; display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,0.05); padding:15px 25px; border-radius:20px; border:1px solid rgba(139,92,246,0.2); margin-bottom:20px; }
        .header-left { display:flex; align-items:center; gap:15px; font-weight:600; font-size:1.2rem; }
        .header-left img { width:50px; height:50px; border-radius:50%; background:white; padding:2px; }
        .kazanim { background:var(--primary); color:white; padding:5px 15px; border-radius:20px; font-weight:800; font-size:0.9rem; }
        .title-area { text-align:center; margin-bottom:20px; }
        h1 { font-size:2.2rem; color:var(--tertiary); font-weight:900; }
        .subtitle { color:#94A3B8; font-size:1.1rem; margin-top:5px; }
        .canvas-area { position:relative; width:100%; max-width:800px; height:460px; background:#11111A; border-radius:24px; border:1px solid rgba(255,255,255,0.05); box-shadow:inset 0 0 50px rgba(0,0,0,0.5); overflow:hidden; display:flex; align-items:center; justify-content:center; }
        .expl-text { background:rgba(139,92,246,0.15); border:1px solid rgba(139,92,246,0.3); padding:15px 25px; border-radius:12px; font-size:1.25rem; color:white; font-weight:800; text-align:center; width:100%; max-width:800px; margin-bottom:15px; transition:0.5s; }
        .layer { position:absolute; width:180px; height:25px; border-radius:5px; left:50%; transform:translateX(-50%); transition:bottom 0.6s cubic-bezier(0.175,0.885,0.32,1.275), opacity 0.5s; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:0.9rem; color:rgba(0,0,0,0.7); }
        .btn-play { background:var(--primary); color:white; border:none; padding:15px 40px; border-radius:50px; font-size:1.2rem; font-weight:900; cursor:pointer; transition:all 0.3s; box-shadow:0 10px 20px rgba(139,92,246,0.4); margin-top:30px; }
        .btn-play:hover { transform:translateY(-3px) scale(1.05); }
        .formula-box { position:absolute; bottom:20px; right:30px; background:rgba(0,0,0,0.9); border:2px solid var(--accent); padding:12px 25px; border-radius:20px; font-size:1.2rem; font-weight:900; color:white; opacity:0; transition:all 1s; text-align:center; }
        /* Box outline (prism container) */
        .box-outline { position:absolute; bottom:60px; left:50%; transform:translateX(-50%); width:200px; height:250px; border:3px solid rgba(255,255,255,0.3); border-radius:5px; }
        .a-label { position:absolute; bottom:310px; left:50%; transform:translateX(-50%); color:white; font-weight:900; }
        .h-label { position:absolute; bottom:60px; left:calc(50% + 110px); height:250px; display:flex; align-items:center; color:var(--accent); font-weight:900; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=8B5CF6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.8.4.4. Prizma Hacmi (Animasyon)</div>
    </div>
    <div class="title-area">
        <h1>Katman Katman Dolum (Hacim)</h1>
        <p class="subtitle">Hacim = Taban Alanı × Yükseklik. Katmanlar üst üste eklenerek prizma dolur.</p>
    </div>
    <div class="expl-text" id="explText">1. Priizma tabanı 5×4 = 20 cm² alanlı bir dikdörtgendir.</div>
    <div class="canvas-area">
        <div class="box-outline" id="boxOutline"></div>
        <div class="a-label" id="aLbl">Taban Alanı = 20 cm²</div>
        <div class="h-label" id="hLbl">Yükseklik = 6 cm</div>
        <!-- Layers stack: will be added by JS -->
        <div id="layerContainer" style="position:absolute;bottom:60px;left:50%;transform:translateX(-50%);width:200px;height:250px;overflow:hidden;display:flex;flex-direction:column-reverse;gap:3px;padding:3px;"></div>
        <div class="formula-box" id="fBox">
            Hacim = 20 × 6 = <span style="color:var(--accent)">120 cm³</span>
        </div>
    </div>
    <button class="btn-play" id="btnPlay" onclick="runAnim()">Doldurmaya Başla</button>
    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const colors = ['#10B981','#06B6D4','#8B5CF6','#F59E0B','#F43F5E','#EC4899'];
        async function runAnim() {
            document.getElementById('btnPlay').style.display='none';
            const et = document.getElementById('explText');
            const container = document.getElementById('layerContainer');
            for(let i=1; i<=6; i++) {
                et.textContent = `2. ${i}. katman ekleniyor... (${i} × 20 = ${i*20} cm³)`;
                const layer = document.createElement('div');
                layer.style.cssText = `width:100%;height:38px;background:${colors[(i-1)%colors.length]};border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:0.9rem;color:rgba(0,0,0,0.8);flex-shrink:0;opacity:0;transition:opacity 0.5s;`;
                layer.textContent = `Katman ${i}: 20 cm²`;
                container.appendChild(layer);
                await sleep(50);
                layer.style.opacity = '1';
                await sleep(600);
            }
            et.style.color = 'var(--secondary)';
            et.textContent = '6 katmanın hepsi doldu! Hacim = Taban Alanı (20) × Yükseklik (6) = 120 cm³';
            document.getElementById('fBox').style.opacity = '1';
        }
    </script>
</body>
</html>
