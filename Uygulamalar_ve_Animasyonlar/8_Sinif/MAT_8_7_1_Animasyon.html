<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Örnek Uzayı ve Olasılık</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#0F0E17; --primary:#8B5CF6; --secondary:#10B981; --tertiary:#06B6D4; --danger:#F43F5E; --accent:#F59E0B; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Outfit',sans-serif; }
        body { background:linear-gradient(135deg,var(--bg),#161625); color:#F8FAFC; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px; overflow-x:hidden; }
        
        /* Header */
        .header { width:100%; max-width:1000px; display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,0.05); padding:15px 25px; border-radius:20px; border:1px solid rgba(139,92,246,0.2); margin-bottom:20px; backdrop-filter:blur(10px); }
        .header-left { display:flex; align-items:center; gap:15px; font-weight:600; font-size:1.2rem; }
        .header-left img { width:50px; height:50px; border-radius:50%; background:white; padding:2px; }
        .kazanim { background:var(--primary); color:white; padding:5px 15px; border-radius:20px; font-weight:800; font-size:0.9rem; }
        
        h1 { font-size:2.4rem; color:var(--tertiary); font-weight:900; text-align:center; text-shadow:0 0 20px rgba(6,182,212,0.3); }
        .subtitle { color:#94A3B8; font-size:1.1rem; margin-top:5px; text-align:center; margin-bottom:20px; font-weight:600; }
        
        /* Explanation Banner */
        .expl-text { background:rgba(139,92,246,0.15); border:1px solid rgba(139,92,246,0.3); padding:15px 25px; border-radius:15px; font-size:1.3rem; color:white; font-weight:800; text-align:center; width:100%; max-width:900px; margin-bottom:20px; transition:all 0.5s; backdrop-filter:blur(5px); box-shadow:0 8px 32px rgba(0,0,0,0.3); min-height:60px; display:flex; align-items:center; justify-content:center; }
        
        /* Main Layout */
        .main-container { display:flex; width:100%; max-width:1000px; gap:20px; flex-wrap:wrap; justify-content:center; }
        
        /* Left Panel - Controls */
        .controls { flex:1; min-width:280px; display:flex; flex-direction:column; gap:15px; }
        .exp-btn { background:rgba(255,255,255,0.05); border:2px solid transparent; padding:20px; border-radius:20px; color:white; font-size:1.2rem; font-weight:800; cursor:pointer; transition:all 0.3s; display:flex; align-items:center; gap:15px; text-align:left; }
        .exp-btn:hover { background:rgba(255,255,255,0.1); transform:translateY(-2px); }
        .exp-btn.active { border-color:var(--primary); background:rgba(139,92,246,0.1); box-shadow:0 0 20px rgba(139,92,246,0.2); }
        .exp-icon { font-size:2.5rem; background:rgba(255,255,255,0.1); width:60px; height:60px; display:flex; align-items:center; justify-content:center; border-radius:15px; }
        
        /* Right Panel - Stage */
        .stage { flex:2; min-width:320px; background:#11111A; border:1px solid rgba(255,255,255,0.1); border-radius:24px; padding:30px; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; min-height:450px; overflow:hidden; box-shadow:inset 0 0 50px rgba(0,0,0,0.5); }
        
        /* The Object */
        .object-container { height:120px; display:flex; align-items:center; justify-content:center; margin-bottom:20px; perspective:1000px; }
        .the-object { font-size:5rem; transition:transform 0.5s; user-select:none; filter:drop-shadow(0 10px 15px rgba(0,0,0,0.5)); }
        
        /* Spin Animations */
        @keyframes flipCoin { 0% { transform:rotateY(0deg) translateY(0); } 50% { transform:rotateY(900deg) translateY(-50px) scale(1.2); } 100% { transform:rotateY(1800deg) translateY(0); } }
        @keyframes rollDie { 0% { transform:rotateX(0) rotateY(0) translateY(0); } 50% { transform:rotateX(720deg) rotateY(360deg) translateY(-50px) scale(1.2); } 100% { transform:rotateX(1080deg) rotateY(720deg) translateY(0); } }
        @keyframes drawBall { 0% { transform:translateY(50px) scale(0); opacity:0; } 50% { transform:translateY(-20px) scale(1.2); opacity:1; } 100% { transform:translateY(0) scale(1); opacity:1; } }
        
        .anim-coin { animation:flipCoin 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        .anim-die { animation:rollDie 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        .anim-ball { animation:drawBall 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }

        /* Sample Space Nodes */
        .sample-space-area { width:100%; display:flex; flex-wrap:wrap; justify-content:center; gap:15px; margin-top:20px; min-height:100px; }
        .node { width:60px; height:60px; border-radius:50%; background:rgba(255,255,255,0.05); border:2px dashed rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center; font-size:1.8rem; font-weight:900; opacity:0; transform:scale(0); transition:all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .node.show { opacity:1; transform:scale(1); border-style:solid; }
        .node.highlight { background:var(--secondary); border-color:var(--secondary); color:white; transform:scale(1.1); box-shadow:0 0 20px rgba(16,185,129,0.5); }
        .node.fade { opacity:0.3; transform:scale(0.9); border-color:rgba(255,255,255,0.1); }
        
        /* Math Rule Box */
        .math-rule { position:absolute; bottom:20px; left:50%; transform:translateX(-50%); background:rgba(15,14,23,0.9); border:2px solid var(--accent); padding:15px 30px; border-radius:20px; font-size:1.3rem; font-weight:900; color:white; text-align:center; opacity:0; transition:all 0.5s; white-space:nowrap; box-shadow:0 10px 30px rgba(245,158,11,0.2); }
        .math-rule span { color:var(--accent); font-size:1.5rem; }
        
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=8B5CF6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.8.7.1. Örnek Uzayı ve Olasılık (Etkileşimli)</div>
    </div>
    
    <h1>Örnek Uzayı ve Olaylar</h1>
    <p class="subtitle">Bir deneyin tüm olası sonuçları = Örnek Uzay (S). Olasılık = İstenen / Tüm Durumlar</p>
    
    <div class="expl-text" id="explText">👇 Sol menüden bir deney seçerek başlayın.</div>
    
    <div class="main-container">
        <!-- Controls -->
        <div class="controls">
            <button class="exp-btn" id="btnCoin" onclick="runExperiment('coin')">
                <div class="exp-icon" style="color:#F59E0B">🪙</div>
                <div>
                    <div style="font-size:1.4rem;">Madeni Para</div>
                    <div style="font-size:0.9rem; color:#94A3B8; font-weight:600;">Yazı gelme olasılığı</div>
                </div>
            </button>
            <button class="exp-btn" id="btnDie" onclick="runExperiment('die')">
                <div class="exp-icon" style="color:#8B5CF6">🎲</div>
                <div>
                    <div style="font-size:1.4rem;">Zar Atma</div>
                    <div style="font-size:0.9rem; color:#94A3B8; font-weight:600;">Tek sayı gelme olasılığı</div>
                </div>
            </button>
            <button class="exp-btn" id="btnBalls" onclick="runExperiment('balls')">
                <div class="exp-icon" style="color:#F43F5E">🔴</div>
                <div>
                    <div style="font-size:1.4rem;">Torbadan Top Çekme</div>
                    <div style="font-size:0.9rem; color:#94A3B8; font-weight:600;">3 Kırmızı, 2 Mavi</div>
                </div>
            </button>
        </div>
        
        <!-- Stage -->
        <div class="stage">
            <div class="object-container">
                <div class="the-object" id="theObject">❓</div>
            </div>
            
            <div style="font-size:1.2rem; font-weight:800; color:#94A3B8; margin-bottom:10px; opacity:0; transition:0.5s;" id="sLabel">Örnek Uzay (S)</div>
            
            <div class="sample-space-area" id="spaceArea">
                <!-- Nodes generated via JS -->
            </div>
            
            <div class="math-rule" id="mathRule">
                P(Olay) = <span>İstenen</span> / <span>Tüm</span>
            </div>
        </div>
    </div>

    <script>
        const explText = document.getElementById('explText');
        const theObject = document.getElementById('theObject');
        const spaceArea = document.getElementById('spaceArea');
        const mathRule = document.getElementById('mathRule');
        const sLabel = document.getElementById('sLabel');
        let isAnimating = false;

        const experiments = {
            coin: {
                icon: '🪙', animClass: 'anim-coin',
                space: [{id:'Y',icon:'Y'}, {id:'T',icon:'T'}],
                eventName: "Yazı Gelmesi",
                targets: ['Y']
            },
            die: {
                icon: '🎲', animClass: 'anim-die',
                space: [{id:'1',icon:'⚀'}, {id:'2',icon:'⚁'}, {id:'3',icon:'⚂'}, {id:'4',icon:'⚃'}, {id:'5',icon:'⚄'}, {id:'6',icon:'⚅'}],
                eventName: "Tek Sayı Gelmesi",
                targets: ['1','3','5']
            },
            balls: {
                icon: '🔮', animClass: 'anim-ball',
                space: [
                    {id:'K1',icon:'🔴',color:'#F43F5E'}, {id:'K2',icon:'🔴',color:'#F43F5E'}, {id:'K3',icon:'🔴',color:'#F43F5E'},
                    {id:'M1',icon:'🔵',color:'#3B82F6'}, {id:'M2',icon:'🔵',color:'#3B82F6'}
                ],
                eventName: "Kırmızı Top Çekilmesi",
                targets: ['K1','K2','K3']
            }
        };

        const sleep = ms => new Promise(r => setTimeout(r, ms));

        async function runExperiment(type) {
            if(isAnimating) return;
            isAnimating = true;
            
            // UI Reset
            document.querySelectorAll('.exp-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn' + type.charAt(0).toUpperCase() + type.slice(1)).classList.add('active');
            
            mathRule.style.opacity = '0';
            sLabel.style.opacity = '0';
            spaceArea.innerHTML = '';
            theObject.className = 'the-object';
            void theObject.offsetWidth; // trigger reflow
            
            const exp = experiments[type];
            theObject.textContent = exp.icon;
            
            // 1. Perform action
            explText.innerHTML = `Deney yapılıyor...`;
            theObject.classList.add(exp.animClass);
            await sleep(1500); // Wait for anim
            
            // 2. Show Sample Space
            explText.innerHTML = `Deneyin tüm olası sonuçları kümesine <b>Örnek Uzay (S)</b> denir.`;
            sLabel.style.opacity = '1';
            
            for(let i=0; i<exp.space.length; i++) {
                let s = exp.space[i];
                let node = document.createElement('div');
                node.className = 'node';
                node.id = 'node_' + s.id;
                node.innerHTML = s.icon;
                if(s.color) node.style.color = s.color;
                spaceArea.appendChild(node);
                
                await sleep(150);
                node.classList.add('show');
            }
            
            await sleep(2000);
            
            // 3. Highlight specific event
            explText.innerHTML = `Olay: <b>${exp.eventName}</b><br>Sadece istenen durumları işaretleyelim.`;
            let desiredCount = 0;
            
            document.querySelectorAll('.node').forEach(node => {
                let id = node.id.replace('node_','');
                if(exp.targets.includes(id)) {
                    node.classList.add('highlight');
                    desiredCount++;
                } else {
                    node.classList.add('fade');
                }
            });
            
            await sleep(2000);
            
            // 4. Show Math Rule
            explText.innerHTML = `Sonuç: Olasılık = İstenen Durumlar / Tüm Durumlar`;
            mathRule.innerHTML = `P(${exp.eventName}) = <span>${desiredCount}</span> / <span>${exp.space.length}</span>`;
            mathRule.style.opacity = '1';
            
            isAnimating = false;
        }
    </script>
</body>
</html>
