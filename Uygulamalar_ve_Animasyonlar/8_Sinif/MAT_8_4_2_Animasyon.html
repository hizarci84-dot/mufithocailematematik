<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çemberin Açınımı Animasyonu</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#0F0E17; --primary:#8B5CF6; --secondary:#10B981; --tertiary:#06B6D4; --danger:#F43F5E; --accent:#F59E0B; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Outfit',sans-serif; }
        body { background:linear-gradient(135deg,var(--bg),#161625); color:#F8FAFC; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px; }
        .header { width:100%; max-width:1000px; display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,0.05); padding:15px 25px; border-radius:20px; border:1px solid rgba(139,92,246,0.2); margin-bottom:20px; }
        .header-left { display:flex; align-items:center; gap:15px; font-weight:600; font-size:1.2rem; }
        .header-left img { width:50px; height:50px; border-radius:50%; background:white; padding:2px; }
        .kazanim { background:var(--primary); color:white; padding:5px 15px; border-radius:20px; font-weight:800; font-size:0.9rem; }
        .title-area { text-align:center; margin-bottom:20px; }
        h1 { font-size:2.2rem; color:var(--tertiary); font-weight:900; }
        .subtitle { color:#94A3B8; font-size:1.1rem; margin-top:5px; }
        .canvas-area { position:relative; width:100%; max-width:800px; height:460px; background:#11111A; border-radius:24px; border:1px solid rgba(255,255,255,0.05); box-shadow:inset 0 0 50px rgba(0,0,0,0.5); overflow:hidden; display:flex; align-items:center; justify-content:center; }
        .expl-text { background:rgba(139,92,246,0.15); border:1px solid rgba(139,92,246,0.3); padding:15px 25px; border-radius:12px; font-size:1.25rem; color:white; font-weight:800; text-align:center; width:100%; max-width:800px; margin-bottom:15px; transition:0.5s; }
        .btn-play { background:var(--primary); color:white; border:none; padding:15px 40px; border-radius:50px; font-size:1.2rem; font-weight:900; cursor:pointer; transition:all 0.3s; box-shadow:0 10px 20px rgba(139,92,246,0.4); margin-top:30px; }
        .btn-play:hover { transform:translateY(-3px) scale(1.05); }
        .formula-box { position:absolute; bottom:20px; background:rgba(0,0,0,0.9); border:2px solid var(--accent); padding:12px 30px; border-radius:20px; font-size:1.3rem; font-weight:900; color:white; opacity:0; transition:all 1s; text-align:center; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=8B5CF6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.8.4.2. Çevre Formülü (Animasyon)</div>
    </div>
    <div class="title-area">
        <h1>Çember → Doğru (2πr)</h1>
        <p class="subtitle">Çemberi açıp düzleştirdiğimizde uzunluğunun çapın tam π katı (≈3.14) olduğunu görürüz.</p>
    </div>
    <div class="expl-text" id="explText">1. Elimizde yarıçapı r olan bir çember var.</div>
    <div class="canvas-area">
        <svg width="700" height="350" viewBox="0 0 700 350" id="mainSvg">
            <!-- Circle: center (180,175) r=120 -->
            <circle id="circle" cx="180" cy="175" r="120" fill="rgba(244,63,94,0.1)" stroke="var(--danger)" stroke-width="5"/>
            <!-- Radius -->
            <line id="rLine" x1="180" y1="175" x2="300" y2="175" stroke="var(--tertiary)" stroke-width="3" stroke-dasharray="6,4"/>
            <text x="240" y="165" fill="var(--tertiary)" font-weight="900" font-family="Outfit" font-size="16">r</text>
            <!-- Unrolled line (initially invisible, positioned at bottom of circle) -->
            <!-- Circumference of r=120 → 2π×120 ≈ 753 px, but we scale: let's show it as 2πr in proportional display -->
            <!-- We show it starting at x=400 and going right to about x=400 + 2π×75 ≈ 400+471=871 — too wide. Let's use r=70px visually. 2π×70≈440px -->
            <line id="unrolled" x1="410" y1="290" x2="410" y2="290" stroke="var(--danger)" stroke-width="8" stroke-linecap="round" opacity="0" style="transition:all 2s linear;"/>
            <text id="unrolledLbl" x="540" y="320" text-anchor="middle" fill="var(--danger)" font-weight="900" font-family="Outfit" font-size="18" opacity="0">2πr ≈ 3.14 × 2r</text>
            <!-- Diameter line comparison -->
            <line id="diam1" x1="410" y1="260" x2="550" y2="260" stroke="var(--tertiary)" stroke-width="5" stroke-linecap="round" opacity="0"/>
            <line id="diam2" x1="550" y1="255" x2="690" y2="255" stroke="var(--tertiary)" stroke-width="5" stroke-linecap="round" opacity="0" stroke-dasharray="10,6"/>
            <text id="diamLbl" x="550" y="245" text-anchor="middle" fill="var(--tertiary)" font-weight="900" font-family="Outfit" font-size="14" opacity="0">2r (çap)</text>
            <!-- Pi highlight -->
            <text id="piLbl" x="550" y="215" text-anchor="middle" fill="var(--accent)" font-weight="900" font-family="Outfit" font-size="24" opacity="0">× π (≈3.14)</text>
        </svg>
        <div class="formula-box" id="fBox">
            Çevre = 2 × π × r &nbsp;|&nbsp; Veya: C = π × d
        </div>
    </div>
    <button class="btn-play" id="btnPlay" onclick="runAnim()">Çemberi Aç!</button>
    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        async function runAnim() {
            document.getElementById('btnPlay').style.display='none';
            const et = document.getElementById('explText');
            // Shrink circle and move up
            et.textContent = '2. Çemberi koparıp düzleştiriyoruz...';
            const circle = document.getElementById('circle');
            circle.style.transition = 'all 1.5s';
            circle.setAttribute('cy','80');
            circle.setAttribute('r','40');
            document.getElementById('rLine').style.opacity = '0';
            await sleep(1800);
            // Show unrolled line growing
            et.textContent = '3. Çemberin çevresi düzleştirince bir doğru parçasına dönüşür.';
            const ul = document.getElementById('unrolled');
            ul.style.opacity = '1';
            ul.setAttribute('x2', '850'); // grows to right — but viewBox is 700 so it goes off, that's fine
            await sleep(2000);
            // Show diameter comparison
            et.textContent = '4. Bu uzunluk tam olarak ÇAP\'ın π katıdır!';
            document.getElementById('diam1').style.opacity = '1';
            document.getElementById('diam1').style.transition = 'opacity 0.5s';
            document.getElementById('diamLbl').style.opacity = '1';
            document.getElementById('diamLbl').style.transition = 'opacity 0.5s';
            await sleep(800);
            document.getElementById('diam2').style.opacity = '1';
            document.getElementById('diam2').style.transition = 'opacity 0.5s';
            await sleep(800);
            document.getElementById('piLbl').style.opacity = '1';
            document.getElementById('piLbl').style.transition = 'opacity 0.5s';
            await sleep(1200);
            document.getElementById('unrolledLbl').style.opacity = '1';
            document.getElementById('unrolledLbl').style.transition = 'opacity 0.5s';
            et.style.color = 'var(--secondary)';
            et.textContent = 'C = 2πr formülü tam da bundan gelir. π sayısı Çevre ÷ Çap oranından başka bir şey değildir!';
            document.getElementById('fBox').style.opacity = '1';
        }
    </script>
</body>
</html>
