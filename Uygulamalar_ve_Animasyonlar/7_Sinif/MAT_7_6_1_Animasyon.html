<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olay ve Tümleyeni Animasyonu</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F0E17; --surface: #1A1A24; --text: #F8FAFC;
            --primary: #8B5CF6; --secondary: #10B981;
            --tertiary: #06B6D4; --danger: #F43F5E;
            --accent: #F59E0B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, var(--bg) 0%, #161625 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px; overflow-x: hidden;
        }

        .header {
            width: 100%; max-width: 1000px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(139, 92, 246, 0.2); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area { text-align: center; margin-bottom: 20px;}
        h1 { font-size: 2.2rem; color: var(--tertiary); font-weight: 900;}
        .subtitle { color: #94A3B8; font-size: 1.1rem; margin-top: 5px;}

        .canvas-area {
            position: relative; width: 100%; max-width: 800px; height: 450px; 
            background: #11111A; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.4); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden;
        }

        .expl-text {
            position: absolute; top: 30px; font-size: 1.5rem; color: white; font-weight: 800;
            opacity: 1; transition: 0.5s; text-align: center; width: 80%; text-shadow: 0 5px 10px black; z-index: 10;
        }

        /* Puzzle logic using SVG */
        .puzzle-container {
            width: 400px; height: 300px; position: relative;
        }

        svg {
            position: absolute; width: 100%; height: 100%; overflow: visible;
        }

        .piece1 { fill: var(--secondary); filter: drop-shadow(-5px 5px 15px rgba(0,0,0,0.5)); transform: translateX(-100px); opacity: 0; transition: all 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .piece2 { fill: var(--danger); filter: drop-shadow(5px 5px 15px rgba(0,0,0,0.5)); transform: translateX(100px); opacity: 0; transition: all 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        .p-text {
            fill: white; font-weight: 900; font-size: 24px; text-anchor: middle; opacity: 0; transition: 1s;
        }

        .one-whole {
            position: absolute; width: 100%; height: 100%; border: 6px solid white; border-radius: 10px;
            opacity: 0; transition: 1s; pointer-events: none; box-shadow: 0 0 30px white, inset 0 0 30px white;
        }

        .btn-play {
            background: var(--primary); color: white; border: none; padding: 15px 40px; border-radius: 50px;
            font-size: 1.2rem; font-weight: 900; cursor: pointer; transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.4); margin-top: 30px; z-index: 10;
        }
        .btn-play:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 15px 25px rgba(139, 92, 246, 0.6); }

        .formula-box {
            position: absolute; bottom: 20px; background: rgba(0,0,0,0.7); border: 2px solid var(--accent);
            padding: 10px 30px; border-radius: 20px; font-size: 1.5rem; font-weight: 900; color: white;
            opacity: 0; transform: translateY(20px); transition: all 1s; z-index: 10; display: flex; gap: 15px; align-items: center;
        }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=8B5CF6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.7.6.1. Olasılık Hesaplama (Animasyon)</div>
    </div>

    <div class="title-area">
        <h1>Tümleyen Olay (Yapboz İspatı)</h1>
        <p class="subtitle">Bir olayın olma olasılığı ile olmama olasılığı birbirini tam 1'e tamamlar.</p>
    </div>

    <div class="canvas-area">
        
        <div class="expl-text" id="explText">1. Bir olayın gerçekleşme olasılığını düşünelim.</div>

        <div class="puzzle-container">
            <div class="one-whole" id="oneWhole"></div>
            <svg viewBox="0 0 400 300">
                <!-- Left Puzzle Piece (60%) -->
                <path d="M 0 0 L 240 0 C 260 0, 260 50, 240 50 C 210 50, 210 100, 240 100 L 240 300 L 0 300 Z" class="piece1" id="p1" />
                <text x="100" y="150" class="p-text" id="t1">%60 (Olma)</text>

                <!-- Right Puzzle Piece (40%) -->
                <!-- Translates perfectly into the gap of p1 -->
                <path d="M 240 0 L 400 0 L 400 300 L 240 300 L 240 100 C 210 100, 210 50, 240 50 C 260 50, 260 0, 240 0 Z" class="piece2" id="p2" />
                <text x="320" y="150" class="p-text" id="t2">%40 (Olmama)</text>
            </svg>
        </div>

        <div class="formula-box" id="formulaBox">
            <span style="color:var(--secondary)">%60</span> + <span style="color:var(--danger)">%40</span> = <span style="color:var(--accent)">%100 (1 Tam)</span>
        </div>

    </div>

    <button class="btn-play" id="btnPlay" onclick="runAnim()">Birleştir</button>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const btnPlay = document.getElementById('btnPlay');
        const explText = document.getElementById('explText');
        
        const p1 = document.getElementById('p1');
        const p2 = document.getElementById('p2');
        const t1 = document.getElementById('t1');
        const t2 = document.getElementById('t2');
        const oneWhole = document.getElementById('oneWhole');
        const formulaBox = document.getElementById('formulaBox');

        async function runAnim() {
            btnPlay.disabled = true;
            btnPlay.style.opacity = 0.5;

            // Reset
            p1.style.transform = "translateX(-150px)"; p1.style.opacity = 0;
            p2.style.transform = "translateX(150px)"; p2.style.opacity = 0;
            t1.style.opacity = 0; t2.style.opacity = 0;
            oneWhole.style.opacity = 0;
            formulaBox.style.opacity = 0; formulaBox.style.transform = "translateY(20px)";

            explText.innerText = "1. Bir olayın gerçekleşme olasılığı (Örn: %60)...";
            
            await sleep(1000);

            p1.style.transform = "translateX(-50px)"; p1.style.opacity = 1;
            t1.style.opacity = 1;

            await sleep(2000);

            explText.innerText = "2. Ve bu olayın gerçekleşMeme olasılığı (Tümleyen, %40)...";

            p2.style.transform = "translateX(50px)"; p2.style.opacity = 1;
            t2.style.opacity = 1;

            await sleep(2500);

            explText.innerText = "3. Bu ikisi birleştiğinde 'Kesin Olay' olan 1 Tam (100%) ortaya çıkar!";

            p1.style.transform = "translateX(0px)";
            p2.style.transform = "translateX(0px)";

            await sleep(1500);
            
            oneWhole.style.opacity = 1;
            formulaBox.style.opacity = 1; formulaBox.style.transform = "translateY(0)";

            await sleep(2000);

            explText.style.color = "var(--secondary)";
            explText.innerText = "P(A) + P(A') = 1";

            btnPlay.disabled = false;
            btnPlay.style.opacity = 1;
            btnPlay.innerText = "Tekrar İzle";
        }
    </script>
</body>
</html>
