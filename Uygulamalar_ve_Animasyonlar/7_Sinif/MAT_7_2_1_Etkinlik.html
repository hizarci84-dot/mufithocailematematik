<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cebirsel Karo Laboratuvarı</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F0E17; --surface: #1A1A24; --text: #F8FAFC;
            --primary: #8B5CF6; --secondary: #10B981;
            --tertiary: #06B6D4; --danger: #F43F5E;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, var(--bg) 0%, #161625 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px; overflow-x: hidden;
        }

        .header {
            width: 100%; max-width: 1000px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(139, 92, 246, 0.2); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .container {
            width: 100%; max-width: 1000px; display: grid; grid-template-columns: 250px 1fr; gap: 20px;
        }

        /* Tools Panel */
        .tools-panel {
            background: rgba(255,255,255,0.03); border-radius: 20px; padding: 25px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); display: flex; flex-direction: column; gap: 15px;
        }
        .tools-panel h2 { font-size: 1.5rem; color: var(--tertiary); font-weight: 900; margin-bottom: 10px;}

        .tile-btn {
            background: rgba(0,0,0,0.3); border: 2px solid #334155; border-radius: 12px; padding: 15px;
            display: flex; align-items: center; gap: 15px; cursor: pointer; transition: all 0.3s;
        }
        .tile-btn:hover { border-color: var(--primary); background: rgba(139, 92, 246, 0.1); transform: translateX(5px);}

        .tile-icon { display: flex; align-items: center; justify-content: center; font-weight: 900; color: white;}
        /* Dimensions of physical tiles */
        .t-x-pos { width: 30px; height: 80px; background: var(--secondary); box-shadow: inset 0 0 10px rgba(0,0,0,0.3);}
        .t-x-neg { width: 30px; height: 80px; background: var(--danger); box-shadow: inset 0 0 10px rgba(0,0,0,0.3);}
        .t-1-pos { width: 30px; height: 30px; background: var(--tertiary); box-shadow: inset 0 0 10px rgba(0,0,0,0.3);}
        .t-1-neg { width: 30px; height: 30px; background: var(--danger); box-shadow: inset 0 0 10px rgba(0,0,0,0.3);}

        .tile-desc { font-weight: 800; font-size: 1.1rem; color: white;}

        .btn-clear {
            background: transparent; border: 2px solid var(--danger); color: var(--danger); padding: 12px;
            border-radius: 12px; font-weight: 900; font-size: 1.1rem; cursor: pointer; margin-top: auto;
            transition: 0.3s;
        }
        .btn-clear:hover { background: var(--danger); color: white;}

        /* Canvas Panel */
        .canvas-panel {
            background: #11111A; border-radius: 20px; padding: 25px; border: 1px solid rgba(255,255,255,0.05);
            display: flex; flex-direction: column;
        }
        .cp-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
        }
        .cp-title { font-size: 1.8rem; font-weight: 900; color: white;}

        /* The algebraic expression result */
        .expression-box {
            background: rgba(0,0,0,0.5); padding: 15px 30px; border-radius: 15px; border: 2px solid var(--primary);
            font-size: 2.5rem; font-weight: 900; color: var(--secondary); min-width: 200px; text-align: center;
            box-shadow: 0 5px 20px rgba(139, 92, 246, 0.2); letter-spacing: 2px;
        }

        .drop-area {
            flex-grow: 1; background: rgba(255,255,255,0.02); border: 2px dashed #334155; border-radius: 15px;
            position: relative; overflow: hidden; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 10px; padding: 20px;
        }
        .drop-area.empty::after {
            content: "Model oluşturmak için soldaki karolara tıklayın.";
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #475569; font-size: 1.2rem; font-weight: 600; pointer-events: none;
        }

        /* Draggable elements in canvas */
        .canvas-tile {
            display: flex; align-items: center; justify-content: center; font-weight: 900; color: white;
            border-radius: 4px; box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            cursor: pointer;
        }
        .canvas-tile:hover { filter: brightness(1.2); }
        .canvas-tile::before {
            content: '×'; position: absolute; top: -5px; right: -5px; background: var(--danger); width: 15px; height: 15px;
            border-radius: 50%; font-size: 10px; display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: 0.2s;
        }
        .canvas-tile:hover::before { opacity: 1; }

        @keyframes popIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
            .expression-box { font-size: 2rem; padding: 10px 20px;}
            .drop-area { min-height: 300px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=8B5CF6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.7.2.1. Cebirsel İfadelerle İşlemler (Modelleme)</div>
    </div>

    <div class="container">
        
        <!-- Tools Panel -->
        <div class="tools-panel">
            <h2>🧱 Cebir Karoları</h2>
            
            <div class="tile-btn" onclick="addTile('x', 1)">
                <div class="tile-icon t-x-pos">+x</div>
                <div class="tile-desc">+x Karosu</div>
            </div>
            
            <div class="tile-btn" onclick="addTile('x', -1)">
                <div class="tile-icon t-x-neg">-x</div>
                <div class="tile-desc">-x Karosu</div>
            </div>

            <div class="tile-btn" onclick="addTile('num', 1)">
                <div class="tile-icon t-1-pos">+1</div>
                <div class="tile-desc">+1 Karosu</div>
            </div>

            <div class="tile-btn" onclick="addTile('num', -1)">
                <div class="tile-icon t-1-neg">-1</div>
                <div class="tile-desc">-1 Karosu</div>
            </div>

            <button class="btn-clear" onclick="clearCanvas()">Tümünü Temizle</button>
        </div>

        <!-- Canvas Panel -->
        <div class="canvas-panel">
            <div class="cp-header">
                <div class="cp-title">Cebirsel İfade:</div>
                <div class="expression-box" id="exprBox">0</div>
            </div>

            <div class="drop-area empty" id="dropArea">
                <!-- Tiles injected here -->
            </div>
        </div>

    </div>

    <script>
        const dropArea = document.getElementById('dropArea');
        const exprBox = document.getElementById('exprBox');

        let counts = {
            xPos: 0,
            xNeg: 0,
            numPos: 0,
            numNeg: 0
        };

        function updateExpression() {
            // Simplify (+x and -x cancel out, +1 and -1 cancel out)
            // But visually we keep them on canvas unless the user clicks them to remove
            // The mathematical expression should represent what is VISIBLE.
            // Some models prefer raw counts, but simplified is better for learning.
            // Let's just write exactly what's there, then simplify.
            // Actually, showing simplified is best.
            
            let netX = counts.xPos - counts.xNeg;
            let netNum = counts.numPos - counts.numNeg;

            let expr = "";

            if(netX === 0 && netNum === 0) {
                expr = "0";
                dropArea.classList.add("empty");
            } else {
                dropArea.classList.remove("empty");

                // X part
                if(netX === 1) expr += "x";
                else if(netX === -1) expr += "-x";
                else if(netX > 1) expr += netX + "x";
                else if(netX < -1) expr += netX + "x";

                // Num part
                if(netNum > 0) {
                    if(expr !== "") expr += " + " + netNum;
                    else expr += netNum;
                } else if(netNum < 0) {
                    if(expr !== "") expr += " - " + Math.abs(netNum);
                    else expr += netNum;
                }
            }

            exprBox.innerText = expr;

            // Update Colors based on sign
            if(expr === "0") exprBox.style.color = "#94A3B8";
            else if(netX < 0 || netNum < 0) exprBox.style.color = "var(--danger)";
            else exprBox.style.color = "var(--secondary)";
        }

        function addTile(type, sign) {
            let el = document.createElement('div');
            el.className = "canvas-tile";
            
            if(type === 'x') {
                if(sign > 0) {
                    el.classList.add("t-x-pos"); el.innerText = "+x"; counts.xPos++;
                } else {
                    el.classList.add("t-x-neg"); el.innerText = "-x"; counts.xNeg++;
                }
            } else {
                if(sign > 0) {
                    el.classList.add("t-1-pos"); el.innerText = "+1"; counts.numPos++;
                } else {
                    el.classList.add("t-1-neg"); el.innerText = "-1"; counts.numNeg++;
                }
            }

            el.onclick = function() {
                // Remove tile
                if(type === 'x') {
                    if(sign > 0) counts.xPos--;
                    else counts.xNeg--;
                } else {
                    if(sign > 0) counts.numPos--;
                    else counts.numNeg--;
                }
                dropArea.removeChild(el);
                updateExpression();
            };

            dropArea.appendChild(el);
            updateExpression();
        }

        function clearCanvas() {
            dropArea.innerHTML = "";
            counts = { xPos: 0, xNeg: 0, numPos: 0, numNeg: 0 };
            updateExpression();
        }

    </script>

    <script>
        // Global spam click prevention for Etkinlik files
        document.addEventListener('click', function(e) {
            if (e.target.tagName === 'BUTTON' && !e.target.hasAttribute('data-spam-locked')) {
                e.target.setAttribute('data-spam-locked', 'true');
                let originalOpacity = e.target.style.opacity || '1';
                e.target.style.opacity = '0.7';
                e.target.style.pointerEvents = 'none';
                setTimeout(() => {
                    e.target.removeAttribute('data-spam-locked');
                    e.target.style.opacity = originalOpacity;
                    e.target.style.pointerEvents = 'auto';
                }, 400);
            }
        });
    </script>
</body>
</html>
