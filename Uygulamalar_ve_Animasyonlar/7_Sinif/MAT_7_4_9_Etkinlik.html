<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yamuk Kes-Yapıştır Laboratuvarı</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F0E17; --surface: #1A1A24; --text: #F8FAFC;
            --primary: #8B5CF6; --secondary: #10B981;
            --tertiary: #06B6D4; --danger: #F43F5E;
            --accent: #F59E0B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, var(--bg) 0%, #161625 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px; overflow-x: hidden;
        }

        .header {
            width: 100%; max-width: 1000px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(139, 92, 246, 0.2); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area { text-align: center; margin-bottom: 20px;}
        h1 { font-size: 2.2rem; color: var(--tertiary); font-weight: 900;}
        .subtitle { color: #94A3B8; font-size: 1.1rem; margin-top: 5px;}

        .main-container {
            display: flex; gap: 30px; width: 100%; max-width: 1000px; flex-wrap: wrap; justify-content: center;
        }

        .panel {
            background: #11111A; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.4); 
            padding: 30px; display: flex; flex-direction: column; align-items: center; width: 100%; position: relative;
        }

        .interactive-area {
            width: 100%; height: 350px; position: relative; background: rgba(0,0,0,0.3); border-radius: 15px;
            overflow: hidden; border: 1px dashed rgba(255,255,255,0.2);
        }

        /* SVG Trapezoid styling */
        svg { width: 100%; height: 100%; }

        .shape {
            cursor: pointer; transition: all 1s ease-in-out;
        }

        /* We will draw a trapezoid: a=100 (top), c=200 (bottom), h=100 */
        /* Points: (50,0) to (150,0) to (200,100) to (0,100) */
        
        .btn-action {
            background: var(--primary); color: white; border: none; padding: 15px 40px; border-radius: 50px;
            font-size: 1.2rem; font-weight: 900; cursor: pointer; transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.4); margin-top: 30px;
        }
        .btn-action:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 15px 25px rgba(139, 92, 246, 0.6); }
        .btn-action:disabled { background: #334155; box-shadow: none; cursor: not-allowed; transform: none;}

        .formula-box {
            background: rgba(16, 185, 129, 0.1); border: 2px solid var(--secondary); padding: 15px 30px; border-radius: 15px;
            font-size: 1.5rem; font-weight: 900; color: white; margin-top: 20px; opacity: 0; transition: 1s;
        }

        .alert-box {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            background: rgba(16, 185, 129, 0.95); border: 2px solid white; color: white;
            padding: 30px 50px; border-radius: 20px; font-weight: 900; font-size: 2rem;
            opacity: 0; transition: all 0.5s; text-align: center; z-index: 100;
            backdrop-filter: blur(10px); box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=8B5CF6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.7.4.9. Çokgen Alanları (Etkinlik)</div>
    </div>

    <div class="title-area">
        <h1>Yamuğun Sırrı</h1>
        <p class="subtitle">Aynı yamuktan bir tane daha kopyalayıp ters çevirin ve birleştirin!</p>
    </div>

    <div class="main-container">
        
        <div class="panel">
            
            <div class="interactive-area">
                <svg viewBox="0 0 800 350" id="svgArea">
                    <!-- Base Trapezoid (Left aligned) -->
                    <!-- Points: (100, 100) -> (200, 100) -> (250, 200) -> (50, 200) -->
                    <!-- Top a=100, Bottom c=200, Height h=100 -->
                    <g id="t1" class="shape" transform="translate(150, 80)">
                        <polygon points="50,0 150,0 200,100 0,100" fill="var(--primary)" stroke="white" stroke-width="2"/>
                        <text x="100" y="-10" fill="white" font-weight="900" text-anchor="middle">a (Üst)</text>
                        <text x="100" y="125" fill="white" font-weight="900" text-anchor="middle">c (Alt)</text>
                        <text x="25" y="55" fill="white" font-weight="900" text-anchor="middle">h</text>
                    </g>

                    <!-- Cloned Trapezoid (Starts identical, overlapping, or hidden) -->
                    <g id="t2" class="shape" transform="translate(150, 80)" opacity="0">
                        <polygon points="50,0 150,0 200,100 0,100" fill="var(--tertiary)" stroke="white" stroke-width="2"/>
                        <text x="100" y="-10" fill="white" font-weight="900" text-anchor="middle">a</text>
                        <text x="100" y="125" fill="white" font-weight="900" text-anchor="middle">c</text>
                    </g>
                </svg>
            </div>

            <button class="btn-action" id="btnAction" onclick="nextStep()">1. Eşini Kopyala</button>

            <div class="formula-box" id="formulaBox">
                Paralelkenarın Alanı = (a + c) × h<br>
                <span style="color:var(--accent);">Bizim Yamuğun Alanı = (a + c) × h / 2</span>
            </div>

        </div>

    </div>

    <div class="alert-box" id="alertBox">MÜKEMMEL! İki yamuk bir PARALELKENAR oluşturur!</div>

    <script>
        const t2 = document.getElementById('t2');
        const btnAction = document.getElementById('btnAction');
        const formulaBox = document.getElementById('formulaBox');
        const alertBox = document.getElementById('alertBox');

        let step = 0;

        function nextStep() {
            if(step === 0) {
                // Step 1: Show clone
                t2.setAttribute("opacity", "0.8");
                t2.setAttribute("transform", "translate(150, 80)"); // same pos
                btnAction.innerText = "2. Ters Çevir ve Birleştir";
                step = 1;
            } else if (step === 1) {
                // Step 2: Rotate and move to form parallelogram
                // Center of rotation for the shape (approx 100, 50)
                // We want to attach the left slanted side of t2 to the right slanted side of t1.
                // t1 right side is (150,0) to (200,100).
                // If we rotate t2 180 deg around (100,50), it becomes upside down.
                // Points after rot(180, 100, 50): 
                // (50,0)->(150,100)
                // (150,0)->(50,100)
                // (200,100)->(0,0)
                // (0,100)->(200,0)
                // Wait, easier approach: just use transform: translate(...) rotate(...) 
                // A standard transform for this proof is:
                // Translate X by half the bottom base + top base so they snap.
                // Actually, just hardcode the transform for this specific SVG shape:
                // The new shape needs to be upside down, attached to the right.
                // So rot 180, and translate to the right.
                t2.setAttribute("transform", "translate(350, 80) rotate(180, 100, 50)");
                
                btnAction.innerText = "3. Alan Formülünü Çıkar";
                step = 2;
            } else if (step === 2) {
                // Step 3: Show formula
                formulaBox.style.opacity = 1;
                btnAction.style.display = "none";
                
                alertBox.style.opacity = 1;
                alertBox.style.transform = "translate(-50%, -50%) scale(1)";
                setTimeout(() => {
                    alertBox.style.opacity = 0;
                    alertBox.style.transform = "translate(-50%, -50%) scale(0)";
                }, 3000);
            }
        }
    </script>

    <script>
        // Global spam click prevention for Etkinlik files
        document.addEventListener('click', function(e) {
            if (e.target.tagName === 'BUTTON' && !e.target.hasAttribute('data-spam-locked')) {
                e.target.setAttribute('data-spam-locked', 'true');
                let originalOpacity = e.target.style.opacity || '1';
                e.target.style.opacity = '0.7';
                e.target.style.pointerEvents = 'none';
                setTimeout(() => {
                    e.target.removeAttribute('data-spam-locked');
                    e.target.style.opacity = originalOpacity;
                    e.target.style.pointerEvents = 'auto';
                }, 400);
            }
        });
    </script>
</body>
</html>
