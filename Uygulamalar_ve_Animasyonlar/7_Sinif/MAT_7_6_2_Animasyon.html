<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çarkıfelek Animasyonu</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F0E17; --surface: #1A1A24; --text: #F8FAFC;
            --primary: #8B5CF6; --secondary: #10B981;
            --tertiary: #06B6D4; --danger: #F43F5E;
            --accent: #F59E0B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, var(--bg) 0%, #161625 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px; overflow-x: hidden;
        }

        .header {
            width: 100%; max-width: 1000px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(139, 92, 246, 0.2); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area { text-align: center; margin-bottom: 20px;}
        h1 { font-size: 2.2rem; color: var(--tertiary); font-weight: 900;}
        .subtitle { color: #94A3B8; font-size: 1.1rem; margin-top: 5px;}

        .canvas-area {
            position: relative; width: 100%; max-width: 800px; height: 450px; 
            background: #11111A; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.4); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden;
        }

        .expl-text {
            position: absolute; top: 20px; font-size: 1.5rem; color: white; font-weight: 800;
            opacity: 1; transition: 0.5s; text-align: center; width: 80%; text-shadow: 0 5px 10px black; z-index: 10;
        }

        .wheel-container {
            position: relative; width: 300px; height: 300px; margin-top: 20px;
        }

        .wheel {
            width: 100%; height: 100%; border-radius: 50%; position: relative;
            background: conic-gradient(var(--danger) 0% 25%, var(--tertiary) 25% 50%, var(--primary) 50% 75%, var(--accent) 75% 100%);
            box-shadow: 0 0 20px rgba(0,0,0,0.5), inset 0 0 20px rgba(0,0,0,0.5);
            transition: transform 3s cubic-bezier(0.25, 0.1, 0.25, 1), background 1s;
        }

        /* Marker */
        .pointer {
            position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent;
            border-top: 30px solid white; z-index: 10; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5));
        }

        .btn-play {
            background: var(--primary); color: white; border: none; padding: 15px 40px; border-radius: 50px;
            font-size: 1.2rem; font-weight: 900; cursor: pointer; transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.4); margin-top: 30px; z-index: 10;
        }
        .btn-play:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 15px 25px rgba(139, 92, 246, 0.6); }

        .labels {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0;
            border-radius: 50%;
        }
        .l-text { position: absolute; transform: translate(-50%, -50%); font-weight: 900; font-size: 1.5rem; color: white; text-shadow: 0 2px 5px black;}
        /* Hardcoded for 4 equal slices */
        .lt-1 { top: 20%; right: 20%; }
        .lt-2 { bottom: 20%; right: 20%; }
        .lt-3 { bottom: 20%; left: 20%; }
        .lt-4 { top: 20%; left: 20%; }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=8B5CF6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.7.6.2. Eşit Olasılık (Animasyon)</div>
    </div>

    <div class="title-area">
        <h1>Çarkıfelek Alanı</h1>
        <p class="subtitle">Eşit alan kaplayan olayların gerçekleşme olasılıkları eşittir.</p>
    </div>

    <div class="canvas-area">
        
        <div class="expl-text" id="explText">1. Çarkımız 4 eşit parçaya bölünmüş durumda.</div>

        <div class="wheel-container">
            <div class="pointer"></div>
            <div class="wheel" id="wheel">
                <div class="labels" id="labels">
                    <div class="l-text lt-1">%25</div>
                    <div class="l-text lt-2">%25</div>
                    <div class="l-text lt-3">%25</div>
                    <div class="l-text lt-4">%25</div>
                </div>
            </div>
        </div>

    </div>

    <button class="btn-play" id="btnPlay" onclick="runAnim()">Döndür ve İncele</button>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const btnPlay = document.getElementById('btnPlay');
        const explText = document.getElementById('explText');
        const wheel = document.getElementById('wheel');
        const labels = document.getElementById('labels');

        async function runAnim() {
            btnPlay.disabled = true;
            btnPlay.style.opacity = 0.5;

            // Phase 1: Spin equal
            explText.innerText = "1. Çark 4 eşit renge bölündüğü için, her rengin gelme olasılığı 'Eşit Olasılıklıdır' (%25).";
            
            wheel.style.transform = "rotate(1080deg)"; // Spin 3 times
            await sleep(3500);

            // Phase 2: Change probability
            explText.innerText = "2. Şimdi kırmızı alanı büyütelim...";
            wheel.style.transition = "background 1s";
            wheel.style.background = "conic-gradient(var(--danger) 0% 50%, var(--tertiary) 50% 70%, var(--primary) 70% 85%, var(--accent) 85% 100%)";
            
            labels.innerHTML = `
                <div class="l-text" style="top: 20%; right: 20%;">%50</div>
                <div class="l-text" style="bottom: 10%; right: 40%;">%20</div>
                <div class="l-text" style="bottom: 30%; left: 10%;">%15</div>
                <div class="l-text" style="top: 20%; left: 20%;">%15</div>
            `;

            await sleep(2000);

            explText.innerText = "3. Kırmızı alan daha büyük olduğu için kırmızı gelme ihtimali daha fazladır. Artık 'Eşit Olasılıklı Değil'dir.";

            wheel.style.transition = "transform 3s cubic-bezier(0.25, 0.1, 0.25, 1)";
            wheel.style.transform = "rotate(2160deg)"; // Spin again
            
            await sleep(3500);

            explText.style.color = "var(--secondary)";
            explText.innerText = "Kural: Alan büyüdükçe (çıktı sayısı arttıkça) o olayın gerçekleşme olasılığı artar.";

            btnPlay.style.display = "none"; // One time flow to avoid breaking rotation logic
        }
    </script>
</body>
</html>
