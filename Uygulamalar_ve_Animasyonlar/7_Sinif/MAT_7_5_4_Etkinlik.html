<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ortanca (Medyan) Laboratuvarı</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F0E17; --surface: #1A1A24; --text: #F8FAFC;
            --primary: #8B5CF6; --secondary: #10B981;
            --tertiary: #06B6D4; --danger: #F43F5E;
            --accent: #F59E0B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, var(--bg) 0%, #161625 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px; overflow-x: hidden;
        }

        .header {
            width: 100%; max-width: 1000px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(139, 92, 246, 0.2); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area { text-align: center; margin-bottom: 20px;}
        h1 { font-size: 2.2rem; color: var(--tertiary); font-weight: 900;}
        .subtitle { color: #94A3B8; font-size: 1.1rem; margin-top: 5px;}

        .main-container {
            display: flex; gap: 30px; width: 100%; max-width: 1000px; flex-wrap: wrap; justify-content: center;
        }

        .panel {
            background: #11111A; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.4); 
            padding: 40px; display: flex; flex-direction: column; align-items: center; width: 100%;
        }

        .expl-text {
            font-size: 1.3rem; font-weight: 800; color: white; text-align: center; margin-bottom: 30px;
            background: rgba(139, 92, 246, 0.1); padding: 15px 30px; border-radius: 15px; border-left: 5px solid var(--primary);
        }

        .num-container {
            display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; min-height: 80px;
        }

        .num-box {
            width: 60px; height: 60px; background: var(--surface); border: 2px solid #334155;
            display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: 900;
            border-radius: 12px; cursor: pointer; transition: all 0.3s;
        }
        .num-box.active {
            background: var(--primary); border-color: var(--primary); transform: scale(1.1); box-shadow: 0 10px 20px rgba(139, 92, 246, 0.4);
        }
        .num-box.eliminated {
            opacity: 0.2; transform: scale(0.8); pointer-events: none; background: #334155;
        }
        .num-box.median {
            background: var(--accent); border-color: var(--accent); transform: scale(1.2); box-shadow: 0 0 30px rgba(245, 158, 11, 0.6);
            color: #11111A;
        }

        .btn-action {
            background: var(--secondary); color: white; border: none; padding: 15px 40px; border-radius: 50px;
            font-size: 1.2rem; font-weight: 900; cursor: pointer; transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.4); margin-top: 40px;
        }
        .btn-action:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 15px 25px rgba(16, 185, 129, 0.6); }

        .alert-box {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            background: rgba(245, 158, 11, 0.95); border: 2px solid white; color: #11111A;
            padding: 30px 50px; border-radius: 20px; font-weight: 900; font-size: 2rem;
            opacity: 0; transition: all 0.5s; text-align: center; z-index: 100;
            backdrop-filter: blur(10px); box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=8B5CF6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.7.5.4. Ortanca (Etkinlik)</div>
    </div>

    <div class="title-area">
        <h1>Ortanca (Medyan) Avı</h1>
        <p class="subtitle">Adımları takip ederek veri grubunun tam ortasındaki sayıyı bulun.</p>
    </div>

    <div class="main-container">
        
        <div class="panel">
            
            <div class="expl-text" id="explText">1. Ortancayı bulmak için sayılar ÖNCE KÜÇÜKTEN BÜYÜĞE SIRALANMALIDIR. Aşağıdaki butona tıkla.</div>

            <!-- Initial unsorted array -->
            <div class="num-container" id="numContainer">
                <div class="num-box">45</div>
                <div class="num-box">12</div>
                <div class="num-box">89</div>
                <div class="num-box">34</div>
                <div class="num-box">7</div>
                <div class="num-box">55</div>
                <div class="num-box">21</div>
            </div>

            <button class="btn-action" id="btnAction" onclick="nextStep()">Sırala</button>

        </div>

    </div>

    <div class="alert-box" id="alertBox">İŞTE ORTANCA (MEDYAN): 34!</div>

    <script>
        const btnAction = document.getElementById('btnAction');
        const explText = document.getElementById('explText');
        const numContainer = document.getElementById('numContainer');
        const alertBox = document.getElementById('alertBox');

        // Initial array
        let arr = [45, 12, 89, 34, 7, 55, 21];
        let sortedArr = [...arr].sort((a,b)=>a-b); // 7, 12, 21, 34, 45, 55, 89
        let step = 0;
        let leftIdx = 0;
        let rightIdx = sortedArr.length - 1;

        function nextStep() {
            if(step === 0) {
                // Sort
                numContainer.innerHTML = "";
                sortedArr.forEach(n => {
                    let div = document.createElement('div');
                    div.className = "num-box active";
                    div.innerText = n;
                    numContainer.appendChild(div);
                });

                explText.innerText = "2. Sıralama tamam! Şimdi 'Ele' butonuna basarak her iki uçtan (en küçük ve en büyük) birer sayı eleyelim.";
                btnAction.innerText = "Uçlardan Ele";
                btnAction.style.background = "var(--danger)";
                btnAction.style.boxShadow = "0 10px 20px rgba(244, 63, 94, 0.4)";
                
                step = 1;
            } 
            else if (step === 1) {
                if(leftIdx === rightIdx) {
                    // Median found
                    let boxes = numContainer.querySelectorAll('.num-box');
                    boxes[leftIdx].classList.remove('active');
                    boxes[leftIdx].classList.add('median');
                    
                    explText.innerText = "TEBRİKLER! Veri grubunun tam ortasındaki sayıyı buldunuz.";
                    btnAction.style.display = "none";
                    
                    alertBox.style.opacity = 1;
                    alertBox.style.transform = "translate(-50%, -50%) scale(1)";
                    
                } else {
                    // Eliminate ends
                    let boxes = numContainer.querySelectorAll('.num-box');
                    boxes[leftIdx].classList.remove('active');
                    boxes[leftIdx].classList.add('eliminated');
                    boxes[rightIdx].classList.remove('active');
                    boxes[rightIdx].classList.add('eliminated');
                    
                    leftIdx++;
                    rightIdx--;

                    if(leftIdx === rightIdx) {
                        btnAction.innerText = "Sonucu Gör";
                        btnAction.style.background = "var(--accent)";
                        btnAction.style.color = "#11111A";
                        btnAction.style.boxShadow = "0 10px 20px rgba(245, 158, 11, 0.4)";
                        explText.innerText = "Geriye tek bir sayı kaldı! O halde sonuç...";
                    }
                }
            }
        }
    </script>

    <script>
        // Global spam click prevention for Etkinlik files
        document.addEventListener('click', function(e) {
            if (e.target.tagName === 'BUTTON' && !e.target.hasAttribute('data-spam-locked')) {
                e.target.setAttribute('data-spam-locked', 'true');
                let originalOpacity = e.target.style.opacity || '1';
                e.target.style.opacity = '0.7';
                e.target.style.pointerEvents = 'none';
                setTimeout(() => {
                    e.target.removeAttribute('data-spam-locked');
                    e.target.style.opacity = originalOpacity;
                    e.target.style.pointerEvents = 'auto';
                }, 400);
            }
        });
    </script>
</body>
</html>
