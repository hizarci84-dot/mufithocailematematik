<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daire Grafiği İspat Animasyonu</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F0E17; --surface: #1A1A24; --text: #F8FAFC;
            --primary: #8B5CF6; --secondary: #10B981;
            --tertiary: #06B6D4; --danger: #F43F5E;
            --accent: #F59E0B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, var(--bg) 0%, #161625 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px; overflow-x: hidden;
        }

        .header {
            width: 100%; max-width: 1000px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(139, 92, 246, 0.2); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area { text-align: center; margin-bottom: 20px;}
        h1 { font-size: 2.2rem; color: var(--tertiary); font-weight: 900;}
        .subtitle { color: #94A3B8; font-size: 1.1rem; margin-top: 5px;}

        .canvas-area {
            position: relative; width: 100%; max-width: 800px; height: 500px; 
            background: #11111A; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.4); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden;
        }

        .expl-text {
            position: absolute; top: 30px; font-size: 1.5rem; color: white; font-weight: 800;
            opacity: 1; transition: 0.5s; text-align: center; width: 80%; text-shadow: 0 5px 10px black; z-index: 10;
        }

        /* SVG animation */
        svg { width: 100%; height: 100%; position: absolute; top: 0; left: 0; overflow: visible;}
        
        .bar-rect { transition: all 1s ease-in-out; }
        .circle-path { fill: none; stroke-width: 50; stroke-linecap: butt; transition: stroke-dasharray 2s cubic-bezier(0.4, 0, 0.2, 1), stroke-dashoffset 2s cubic-bezier(0.4, 0, 0.2, 1); }

        .btn-play {
            background: var(--primary); color: white; border: none; padding: 15px 40px; border-radius: 50px;
            font-size: 1.2rem; font-weight: 900; cursor: pointer; transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.4); margin-top: 30px; z-index: 10;
        }
        .btn-play:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 15px 25px rgba(139, 92, 246, 0.6); }

        .data-box {
            position: absolute; bottom: 30px; background: rgba(0,0,0,0.7); border: 2px solid var(--accent);
            padding: 15px 30px; border-radius: 20px; font-size: 1.5rem; font-weight: 900; color: white;
            opacity: 0; transform: translateY(20px); transition: all 1s; z-index: 10;
            display: flex; gap: 30px;
        }
        .db-item span { display: block; font-size: 1rem; color: #94A3B8; margin-bottom: 5px; }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=8B5CF6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.7.5.2. Daire Grafiği (Animasyon)</div>
    </div>

    <div class="title-area">
        <h1>Bütünün Kıvrılması (%100 = 360°)</h1>
        <p class="subtitle">Düz bir çubuk grafiğinin bükülerek bir daire grafiğine dönüşmesini izleyin.</p>
    </div>

    <div class="canvas-area">
        
        <div class="expl-text" id="explText">1. Tüm verileri tek bir çizgi üzerinde %100'lük bir çubuk gibi düşünelim.</div>

        <svg viewBox="0 0 800 500" id="svgArea">
            
            <!-- Phase 1: Bar Chart (Hidden initially, then shown, then hidden when circle appears) -->
            <g id="barGroup" transform="translate(100, 225)">
                <!-- Length 600 total -->
                <rect x="0" y="0" width="300" height="50" fill="var(--primary)" class="bar-rect" id="bR1"/>
                <rect x="300" y="0" width="200" height="50" fill="var(--tertiary)" class="bar-rect" id="bR2"/>
                <rect x="500" y="0" width="100" height="50" fill="var(--danger)" class="bar-rect" id="bR3"/>
                
                <text x="150" y="-10" fill="white" font-weight="900" text-anchor="middle" class="bar-rect">%50</text>
                <text x="400" y="-10" fill="white" font-weight="900" text-anchor="middle" class="bar-rect">%33</text>
                <text x="550" y="-10" fill="white" font-weight="900" text-anchor="middle" class="bar-rect">%17</text>
            </g>

            <!-- Phase 2: Pie Chart (Circle stroke) -->
            <!-- r=100. Circumference = 2*pi*100 = 628.318. Center (400,250) -->
            <!-- Transform rotate -90 to start from top -->
            <g id="pieGroup" transform="translate(400, 250) rotate(-90)" opacity="0">
                <!-- We animate stroke-dasharray from 0 to target -->
                <circle cx="0" cy="0" r="100" stroke="var(--primary)" class="circle-path" id="cP1" stroke-dasharray="0 628.318" stroke-dashoffset="0"></circle>
                <circle cx="0" cy="0" r="100" stroke="var(--tertiary)" class="circle-path" id="cP2" stroke-dasharray="0 628.318" stroke-dashoffset="0"></circle>
                <circle cx="0" cy="0" r="100" stroke="var(--danger)" class="circle-path" id="cP3" stroke-dasharray="0 628.318" stroke-dashoffset="0"></circle>
            </g>

            <g id="pieLabels" opacity="0" style="transition: 1s;">
                <!-- Labels positioned manually based on angle -->
                <text x="450" y="150" fill="var(--primary)" font-weight="900" font-size="20">180°</text>
                <text x="250" y="320" fill="var(--tertiary)" font-weight="900" font-size="20">120°</text>
                <text x="350" y="150" fill="var(--danger)" font-weight="900" font-size="20">60°</text>
            </g>

        </svg>

        <div class="data-box" id="dataBox">
            <div class="db-item"><span>%100</span>360°</div>
            <div style="width:2px; background:rgba(255,255,255,0.2);"></div>
            <div class="db-item"><span>%50</span>180°</div>
            <div style="width:2px; background:rgba(255,255,255,0.2);"></div>
            <div class="db-item"><span>%33.3</span>120°</div>
            <div style="width:2px; background:rgba(255,255,255,0.2);"></div>
            <div class="db-item"><span>%16.6</span>60°</div>
        </div>

    </div>

    <button class="btn-play" id="btnPlay" onclick="runAnim()">Bükülmeyi Başlat</button>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const btnPlay = document.getElementById('btnPlay');
        const explText = document.getElementById('explText');
        
        const barGroup = document.getElementById('barGroup');
        const pieGroup = document.getElementById('pieGroup');
        const pieLabels = document.getElementById('pieLabels');
        const dataBox = document.getElementById('dataBox');

        const cP1 = document.getElementById('cP1');
        const cP2 = document.getElementById('cP2');
        const cP3 = document.getElementById('cP3');

        const C = 2 * Math.PI * 100; // 628.318

        async function runAnim() {
            btnPlay.disabled = true;
            btnPlay.style.opacity = 0.5;

            // Reset
            barGroup.style.opacity = 1;
            pieGroup.style.opacity = 0;
            pieLabels.style.opacity = 0;
            dataBox.style.opacity = 0;
            dataBox.style.transform = "translateY(20px)";

            cP1.style.transition = "none"; cP2.style.transition = "none"; cP3.style.transition = "none";
            cP1.setAttribute("stroke-dasharray", `0 ${C}`);
            cP2.setAttribute("stroke-dasharray", `0 ${C}`);
            cP3.setAttribute("stroke-dasharray", `0 ${C}`);

            explText.innerText = "1. Tüm verileri tek bir çizgi üzerinde %100'lük bir çubuk gibi düşünelim.";

            await sleep(2500);

            explText.innerText = "2. Çubuğu kendi etrafında bükerek 360 derecelik bir çember oluşturalım.";

            barGroup.style.opacity = 0;
            pieGroup.style.opacity = 1;

            // Animate pie slices drawing themselves
            await sleep(100);
            cP1.style.transition = "stroke-dasharray 2s cubic-bezier(0.4, 0, 0.2, 1), stroke-dashoffset 2s cubic-bezier(0.4, 0, 0.2, 1)";
            cP2.style.transition = "stroke-dasharray 2s cubic-bezier(0.4, 0, 0.2, 1), stroke-dashoffset 2s cubic-bezier(0.4, 0, 0.2, 1)";
            cP3.style.transition = "stroke-dasharray 2s cubic-bezier(0.4, 0, 0.2, 1), stroke-dashoffset 2s cubic-bezier(0.4, 0, 0.2, 1)";

            // 50%, 33.3%, 16.6%
            let val1 = 0.50 * C;
            let val2 = 0.3333 * C;
            let val3 = 0.1666 * C;

            cP1.setAttribute("stroke-dasharray", `${val1} ${C}`);
            cP1.setAttribute("stroke-dashoffset", 0);

            cP2.setAttribute("stroke-dasharray", `${val2} ${C}`);
            cP2.setAttribute("stroke-dashoffset", -val1);

            cP3.setAttribute("stroke-dasharray", `${val3} ${C}`);
            cP3.setAttribute("stroke-dashoffset", -(val1 + val2));

            await sleep(2500);

            explText.innerText = "3. Yüzdelik oranlar, 360 derecenin içerisindeki merkez açılara dönüşür.";
            
            pieLabels.style.opacity = 1;
            dataBox.style.opacity = 1;
            dataBox.style.transform = "translateY(0)";

            await sleep(3000);
            
            explText.style.color = "var(--secondary)";
            explText.innerText = "Parça - Bütün ilişkisini göstermek için Daire Grafiği kullanılır.";

            btnPlay.disabled = false;
            btnPlay.style.opacity = 1;
            btnPlay.innerText = "Tekrar İzle";
        }
    </script>
</body>
</html>
