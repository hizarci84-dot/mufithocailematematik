<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daire Dilimi Animasyonu</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F0E17; --surface: #1A1A24; --text: #F8FAFC;
            --primary: #8B5CF6; --secondary: #10B981;
            --tertiary: #06B6D4; --danger: #F43F5E;
            --accent: #F59E0B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, var(--bg) 0%, #161625 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px; overflow-x: hidden;
        }

        .header {
            width: 100%; max-width: 1000px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(139, 92, 246, 0.2); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area { text-align: center; margin-bottom: 20px;}
        h1 { font-size: 2.2rem; color: var(--tertiary); font-weight: 900;}
        .subtitle { color: #94A3B8; font-size: 1.1rem; margin-top: 5px;}

        .canvas-area {
            position: relative; width: 100%; max-width: 800px; height: 500px; 
            background: #11111A; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.4); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden;
        }

        .expl-text {
            position: absolute; top: 30px; font-size: 1.5rem; color: white; font-weight: 800;
            opacity: 1; transition: 0.5s; text-align: center; width: 80%; text-shadow: 0 5px 10px black; z-index: 10;
        }

        .canvas-content {
            display: flex; width: 100%; align-items: center; justify-content: space-around;
        }

        .circle-view {
            width: 250px; height: 250px; position: relative;
        }

        svg { width: 100%; height: 100%; overflow: visible; }
        .circle-bg { fill: rgba(255,255,255,0.05); stroke: rgba(255,255,255,0.2); stroke-width: 2; }
        .sector { fill: var(--primary); }
        .radius-line { stroke: white; stroke-width: 3; }

        /* The bar chart / proportion visual */
        .bar-container {
            width: 80px; height: 250px; background: rgba(255,255,255,0.05); border: 2px solid #334155;
            position: relative; border-radius: 10px; overflow: hidden;
        }
        .bar-fill {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 0%;
            background: var(--tertiary); transition: height 0.1s linear;
        }
        .bar-label {
            position: absolute; bottom: -30px; width: 100%; text-align: center; color: var(--tertiary);
            font-weight: 900; font-size: 1.2rem;
        }

        .data-box {
            background: rgba(0,0,0,0.5); padding: 20px; border-radius: 15px; border: 2px solid var(--secondary);
            font-size: 1.5rem; font-weight: 900; color: white; text-align: center; min-width: 200px;
        }
        .data-box span { color: var(--accent); font-size: 2rem;}

        .btn-play {
            background: var(--primary); color: white; border: none; padding: 15px 40px; border-radius: 50px;
            font-size: 1.2rem; font-weight: 900; cursor: pointer; transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.4); margin-top: 30px; z-index: 10;
        }
        .btn-play:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 15px 25px rgba(139, 92, 246, 0.6); }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=8B5CF6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.7.4.8. Daire Dilimi (Animasyon)</div>
    </div>

    <div class="title-area">
        <h1>Otomatik Alan Süpürgesi</h1>
        <p class="subtitle">Bir silecek gibi hareket eden yarıçapın, açıyı büyüttükçe alanı nasıl doğru orantılı doldurduğunu izleyin.</p>
    </div>

    <div class="canvas-area">
        
        <div class="expl-text" id="explText">1. Yarıçap kolu dönerek alanı süpürmeye başlar.</div>

        <div class="canvas-content">
            
            <div class="circle-view">
                <svg viewBox="-110 -110 220 220">
                    <circle cx="0" cy="0" r="100" class="circle-bg"></circle>
                    <path id="sectorPath" class="sector" d="M 0 0 L 100 0 Z"></path>
                    <line x1="0" y1="0" x2="100" y2="0" class="radius-line" style="stroke:rgba(255,255,255,0.5)"></line>
                    <line id="angleLine" x1="0" y1="0" x2="100" y2="0" class="radius-line"></line>
                </svg>
            </div>

            <div class="bar-container">
                <div class="bar-fill" id="barFill"></div>
                <div class="bar-label">Alan Oranı</div>
            </div>

            <div class="data-box">
                Açı: <span id="valAngle">0</span>°<br>
                Oran: <span id="valRatio">0</span>%
            </div>

        </div>

    </div>

    <button class="btn-play" id="btnPlay" onclick="runAnim()">Animasyonu Başlat</button>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const btnPlay = document.getElementById('btnPlay');
        const explText = document.getElementById('explText');
        const sectorPath = document.getElementById('sectorPath');
        const angleLine = document.getElementById('angleLine');
        const barFill = document.getElementById('barFill');
        const valAngle = document.getElementById('valAngle');
        const valRatio = document.getElementById('valRatio');

        const radius = 100;

        async function runAnim() {
            btnPlay.disabled = true;
            btnPlay.style.opacity = 0.5;

            explText.innerText = "1. Yarıçap kolu dönerek alanı süpürmeye başlar.";

            // 0 to 360 animation loop
            for(let deg = 0; deg <= 360; deg++) {
                
                // Update SVG
                let rad = deg * (Math.PI / 180);
                let x = radius * Math.cos(rad);
                let y = radius * Math.sin(rad);
                let largeArc = deg > 180 ? 1 : 0;
                
                if(deg === 0) {
                    sectorPath.setAttribute("d", "");
                } else if(deg === 360) {
                    sectorPath.setAttribute("d", `M 100 0 A 100 100 0 1 1 99.9 0 Z`);
                } else {
                    let d = `M 0 0 L 100 0 A 100 100 0 ${largeArc} 1 ${x} ${y} Z`;
                    sectorPath.setAttribute("d", d);
                }

                angleLine.setAttribute("x2", x);
                angleLine.setAttribute("y2", y);

                // Update UI
                valAngle.innerText = deg;
                let ratio = (deg / 360) * 100;
                valRatio.innerText = ratio.toFixed(0);
                barFill.style.height = ratio + "%";

                if(deg === 90) {
                    explText.innerText = "90° -> Çeyrek Daire (%25)";
                    await sleep(1000);
                } else if (deg === 180) {
                    explText.innerText = "180° -> Yarım Daire (%50)";
                    await sleep(1000);
                } else if (deg === 270) {
                    explText.innerText = "270° -> Üç Çeyrek Daire (%75)";
                    await sleep(1000);
                } else if (deg === 360) {
                    explText.innerText = "360° -> Tam Daire (%100). Açı ile Alan TAM ORANTILIDIR!";
                }

                await sleep(10);
            }

            explText.style.color = "var(--secondary)";

            btnPlay.disabled = false;
            btnPlay.style.opacity = 1;
            btnPlay.innerText = "Tekrar İzle";
        }
    </script>
</body>
</html>
