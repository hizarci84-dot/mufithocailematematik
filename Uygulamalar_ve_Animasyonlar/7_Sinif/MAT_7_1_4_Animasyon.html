<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çok Adımlı İşlemler (Animasyon)</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F0E17; --surface: #1A1A24; --text: #F8FAFC;
            --primary: #8B5CF6; --secondary: #10B981;
            --tertiary: #06B6D4; --danger: #F43F5E;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, var(--bg) 0%, #161625 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px; overflow-x: hidden;
        }

        .header {
            width: 100%; max-width: 1000px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(139, 92, 246, 0.2); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area { text-align: center; margin-bottom: 20px;}
        h1 { font-size: 2.2rem; color: var(--tertiary); font-weight: 900;}
        .subtitle { color: #94A3B8; font-size: 1.1rem; margin-top: 5px;}

        .canvas-area {
            position: relative; width: 100%; max-width: 900px; min-height: 400px; 
            background: #11111A; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.4); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px;
        }

        /* Fraction CSS */
        .fraction {
            display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
            vertical-align: middle; line-height: 1.2; font-size: 2rem; font-weight: 900; margin: 0 10px;
            transition: all 0.5s;
        }
        .frac-top { border-bottom: 3px solid white; padding: 0 10px; transition: all 0.5s;}
        .frac-bot { padding: 0 10px; transition: all 0.5s;}
        
        .operator { font-size: 2rem; font-weight: 900; color: #94A3B8; margin: 0 5px; transition: all 0.5s;}
        
        .big-fraction {
            display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
            vertical-align: middle; margin: 0 15px; transition: all 0.5s;
        }
        .big-frac-top { border-bottom: 4px solid var(--primary); padding: 15px 10px; display: flex; align-items: center;}
        .big-frac-bot { padding: 15px 10px; display: flex; align-items: center;}

        .highlight {
            animation: glow 1s infinite alternate;
        }
        @keyframes glow {
            0% { filter: drop-shadow(0 0 5px var(--secondary)); color: var(--secondary); border-color: var(--secondary);}
            100% { filter: drop-shadow(0 0 15px var(--secondary)); color: white; border-color: white;}
        }

        .expl-text {
            position: absolute; top: 20px; font-size: 1.5rem; color: var(--accent); font-weight: 800;
            opacity: 0; transition: 0.5s; text-align: center; width: 80%;
        }

        .btn-play {
            background: var(--primary); color: white; border: none; padding: 15px 40px; border-radius: 50px;
            font-size: 1.2rem; font-weight: 900; cursor: pointer; transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.4); margin-top: 30px;
        }
        .btn-play:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 15px 25px rgba(139, 92, 246, 0.6); }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=8B5CF6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.7.1.4. Çok Adımlı İşlemler (Animasyon)</div>
    </div>

    <div class="title-area">
        <h1>Merdiven İşlemi Animasyonu</h1>
        <p class="subtitle">İşlem önceliğine uyarak otomatik çözülen karmaşık kesri izleyin.</p>
    </div>

    <div class="canvas-area">
        
        <div class="expl-text" id="explText">Önce pay (üst taraf) ve payda (alt taraf) hesaplanır.</div>
        
        <div class="big-fraction" id="mainEq">
            <div class="big-frac-top" id="topPart">
                <span class="operator">(</span>
                <div class="fraction"><div class="frac-top">1</div><div class="frac-bot">2</div></div>
                <span class="operator">+</span>
                <div class="fraction"><div class="frac-top">1</div><div class="frac-bot">3</div></div>
                <span class="operator">)</span>
            </div>
            <div class="big-frac-bot" id="botPart">
                <span class="operator">(</span>
                <span class="operator" style="color:white; margin:0 10px;">1</span>
                <span class="operator">-</span>
                <div class="fraction"><div class="frac-top">1</div><div class="frac-bot">4</div></div>
                <span class="operator">)</span>
            </div>
        </div>

    </div>

    <button class="btn-play" id="btnPlay" onclick="runSolveAnim()">Animasyonu Başlat</button>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const btnPlay = document.getElementById('btnPlay');
        const explText = document.getElementById('explText');
        const topPart = document.getElementById('topPart');
        const botPart = document.getElementById('botPart');
        const mainEq = document.getElementById('mainEq');

        async function runSolveAnim() {
            btnPlay.disabled = true;
            btnPlay.style.opacity = 0.5;

            // Reset
            topPart.innerHTML = `
                <span class="operator">(</span>
                <div class="fraction"><div class="frac-top">1</div><div class="frac-bot">2</div></div>
                <span class="operator">+</span>
                <div class="fraction"><div class="frac-top">1</div><div class="frac-bot">3</div></div>
                <span class="operator">)</span>
            `;
            botPart.innerHTML = `
                <span class="operator">(</span>
                <span class="operator" style="color:white; margin:0 10px;">1</span>
                <span class="operator">-</span>
                <div class="fraction"><div class="frac-top">1</div><div class="frac-bot">4</div></div>
                <span class="operator">)</span>
            `;
            mainEq.style.flexDirection = "column";

            explText.style.opacity = 1;
            explText.innerText = "Adım 1: Pay kısmındaki toplama işlemi (Payda eşitlenir)";
            
            topPart.classList.add('highlight');
            await sleep(2000);

            topPart.classList.remove('highlight');
            topPart.innerHTML = `<div class="fraction" style="color:var(--secondary);"><div class="frac-top">5</div><div class="frac-bot">6</div></div>`;
            
            await sleep(1500);

            explText.innerText = "Adım 2: Payda kısmındaki çıkarma işlemi";
            botPart.classList.add('highlight');
            await sleep(2000);

            botPart.classList.remove('highlight');
            botPart.innerHTML = `<div class="fraction" style="color:var(--tertiary);"><div class="frac-top">3</div><div class="frac-bot">4</div></div>`;

            await sleep(2000);

            explText.innerText = "Adım 3: Ana kesir çizgisi BÖLME demektir. Birinci aynen kalır, ikinci ters çevrilip çarpılır.";
            
            // Transform visually to horizontal multiplication
            mainEq.innerHTML = `
                <div style="display:flex; align-items:center;">
                    <div class="fraction" style="color:var(--secondary);"><div class="frac-top">5</div><div class="frac-bot">6</div></div>
                    <span class="operator" style="color:white;">X</span>
                    <div class="fraction" style="color:var(--tertiary);"><div class="frac-top">4</div><div class="frac-bot">3</div></div>
                </div>
            `;
            
            await sleep(3000);

            explText.innerText = "Sonuç: 20/18 çıkar. 2 ile sadeleştirilince 10/9 elde edilir.";
            
            mainEq.innerHTML = `
                <span class="operator" style="color:white;">=</span>
                <div class="fraction" style="color:var(--primary); font-size:3rem;"><div class="frac-top">10</div><div class="frac-bot">9</div></div>
            `;

            btnPlay.disabled = false;
            btnPlay.style.opacity = 1;
            btnPlay.innerText = "Tekrar İzle";
        }

    </script>
</body>
</html>
