<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İnteraktif Orta Dikme İnşası</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F0E17; --surface: #1A1A24; --text: #F8FAFC;
            --primary: #8B5CF6; --secondary: #10B981;
            --tertiary: #06B6D4; --danger: #F43F5E;
            --accent: #F59E0B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, var(--bg) 0%, #161625 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px; overflow-x: hidden;
        }

        .header {
            width: 100%; max-width: 1000px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(139, 92, 246, 0.2); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area { text-align: center; margin-bottom: 20px;}
        h1 { font-size: 2.2rem; color: var(--tertiary); font-weight: 900;}
        .subtitle { color: #94A3B8; font-size: 1.1rem; margin-top: 5px;}

        .canvas-area {
            position: relative; width: 100%; max-width: 800px; height: 500px; 
            background: #11111A; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.4); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden;
        }

        .instruction-bar {
            background: rgba(255,255,255,0.05); width: 100%; padding: 15px; text-align: center;
            font-size: 1.2rem; font-weight: 600; color: var(--accent); position: absolute; top: 0; left: 0; z-index: 10;
        }

        svg { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }

        .line-base { stroke: white; stroke-width: 4; stroke-linecap: round;}
        
        /* Interactive points */
        .pt-btn { fill: var(--primary); cursor: pointer; transition: all 0.3s; r: 10;}
        .pt-btn:hover { fill: var(--tertiary); r: 15; }
        
        .pt-intersect { fill: transparent; stroke: var(--secondary); stroke-width: 3; cursor: pointer; r: 12; opacity: 0; pointer-events: none; transition: opacity 0.5s;}
        .pt-intersect:hover { fill: rgba(16, 185, 129, 0.5); }
        .pt-intersect.active { pointer-events: all; opacity: 1; animation: pulse 1.5s infinite;}

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16,185,129,0.7); }
            70% { box-shadow: 0 0 0 10px rgba(16,185,129,0); }
            100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); }
        }

        /* Arcs */
        .arc { stroke: var(--tertiary); stroke-width: 2; fill: transparent; stroke-dasharray: 5 5; opacity: 0; transition: opacity 1s;}

        /* Final line */
        .bisector { stroke: var(--secondary); stroke-width: 4; opacity: 0; transition: opacity 1s;}

        .alert-box {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            background: rgba(16, 185, 129, 0.95); border: 2px solid white; color: white;
            padding: 30px 50px; border-radius: 20px; font-weight: 900; font-size: 2rem;
            opacity: 0; transition: all 0.5s; text-align: center; z-index: 100;
            backdrop-filter: blur(10px); box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=8B5CF6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.7.3.2. Orta Dikme İnşası (Etkinlik)</div>
    </div>

    <div class="title-area">
        <h1>Pergel ve Cetvel Simülatörü</h1>
        <p class="subtitle">Hiç ölçüm yapmadan, sadece yay çizerek doğruyu tam ortadan ikiye bölün.</p>
    </div>

    <div class="canvas-area">
        
        <div class="instruction-bar" id="inst">Adım 1: Pergelin sivri ucunu batırmak için sol uç noktasına (A) tıklayın.</div>

        <svg viewBox="0 0 800 500">
            <!-- Base Line from (200, 250) to (600, 250) -->
            <line x1="200" y1="250" x2="600" y2="250" class="line-base"></line>
            
            <text x="170" y="255" fill="white" font-family="Outfit" font-size="1.2rem" font-weight="900">A</text>
            <text x="615" y="255" fill="white" font-family="Outfit" font-size="1.2rem" font-weight="900">B</text>

            <!-- Arcs -->
            <!-- Arc A: Center(200,250), radius 250 -->
            <!-- Arc B: Center(600,250), radius 250 -->
            <circle cx="200" cy="250" r="250" class="arc" id="arcA"></circle>
            <circle cx="600" cy="250" r="250" class="arc" id="arcB"></circle>

            <!-- Intersection points -->
            <!-- Intersections of two circles (r=250, distance=400): mid x=400, y offset is sqrt(250^2 - 200^2) = 150 -->
            <!-- Top: (400, 100), Bottom: (400, 400) -->
            <circle cx="400" cy="100" class="pt-intersect" id="intTop" onclick="clickIntersect('top')"></circle>
            <circle cx="400" cy="400" class="pt-intersect" id="intBot" onclick="clickIntersect('bot')"></circle>

            <!-- Bisector Line -->
            <line x1="400" y1="50" x2="400" y2="450" class="bisector" id="bisectorLine"></line>

            <!-- Endpoints -->
            <circle cx="200" cy="250" class="pt-btn" id="ptA" onclick="clickA()"></circle>
            <circle cx="600" cy="250" class="pt-btn" id="ptB" onclick="clickB()"></circle>

        </svg>

    </div>

    <div class="alert-box" id="alertBox">TEBRİKLER! Orta Dikme Çizildi.</div>

    <script>
        const ptA = document.getElementById('ptA');
        const ptB = document.getElementById('ptB');
        const arcA = document.getElementById('arcA');
        const arcB = document.getElementById('arcB');
        const intTop = document.getElementById('intTop');
        const intBot = document.getElementById('intBot');
        const bisectorLine = document.getElementById('bisectorLine');
        const inst = document.getElementById('inst');
        const alertBox = document.getElementById('alertBox');

        let state = 0; // 0=waiting A, 1=waiting B, 2=waiting Top, 3=waiting Bot
        let topClicked = false;
        let botClicked = false;

        function clickA() {
            if(state === 0) {
                arcA.style.opacity = 0.5;
                ptA.style.fill = "#334155";
                ptA.style.pointerEvents = "none";
                state = 1;
                inst.innerText = "Adım 2: Şimdi pergelin açıklığını bozmadan sağ uca (B) tıklayarak diğer yayı çizin.";
            }
        }

        function clickB() {
            if(state === 1) {
                arcB.style.opacity = 0.5;
                ptB.style.fill = "#334155";
                ptB.style.pointerEvents = "none";
                state = 2;
                
                inst.innerText = "Adım 3: Yayların kesiştiği noktalara tıklayarak referans noktalarını belirleyin.";
                intTop.classList.add('active');
                intBot.classList.add('active');
            }
        }

        function clickIntersect(type) {
            if(type === 'top') {
                intTop.style.fill = "var(--secondary)";
                topClicked = true;
            } else {
                intBot.style.fill = "var(--secondary)";
                botClicked = true;
            }

            if(topClicked && botClicked) {
                finishConstruction();
            }
        }

        function finishConstruction() {
            intTop.classList.remove('active');
            intBot.classList.remove('active');
            bisectorLine.style.opacity = 1;
            inst.innerText = "Kusursuz! Cetvel yardımıyla bu iki nokta birleştirilerek Orta Dikme elde edildi.";
            inst.style.color = "var(--secondary)";

            setTimeout(() => {
                alertBox.style.opacity = 1;
                alertBox.style.transform = "translate(-50%, -50%) scale(1)";
                setTimeout(() => {
                    alertBox.style.opacity = 0;
                    alertBox.style.transform = "translate(-50%, -50%) scale(0)";
                }, 3000);
            }, 1000);
        }

    </script>

    <script>
        // Global spam click prevention for Etkinlik files
        document.addEventListener('click', function(e) {
            if (e.target.tagName === 'BUTTON' && !e.target.hasAttribute('data-spam-locked')) {
                e.target.setAttribute('data-spam-locked', 'true');
                let originalOpacity = e.target.style.opacity || '1';
                e.target.style.opacity = '0.7';
                e.target.style.pointerEvents = 'none';
                setTimeout(() => {
                    e.target.removeAttribute('data-spam-locked');
                    e.target.style.opacity = originalOpacity;
                    e.target.style.pointerEvents = 'auto';
                }, 400);
            }
        });
    </script>
</body>
</html>
