<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonsuzluğa Yakınlaştırma (Sayı Doğrusu)</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F0E17; --surface: #1A1A24; --text: #F8FAFC;
            --primary: #8B5CF6; --secondary: #10B981;
            --tertiary: #06B6D4; --danger: #F43F5E;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, var(--bg) 0%, #161625 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px; overflow-x: hidden;
        }

        .header {
            width: 100%; max-width: 1000px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(139, 92, 246, 0.2); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area { text-align: center; margin-bottom: 30px;}
        h1 { font-size: 2.2rem; color: var(--tertiary); font-weight: 900;}
        .subtitle { color: #94A3B8; font-size: 1.1rem; margin-top: 5px;}

        .canvas-area {
            position: relative; width: 100%; max-width: 900px; height: 400px; 
            background: #11111A; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.4); 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* Number Line Base */
        .number-line {
            width: 80%; height: 6px; background: #334155; position: relative; border-radius: 3px;
            transition: all 1s ease-in-out; margin-bottom: 20px;
        }

        .nl-tick {
            position: absolute; width: 4px; height: 30px; background: var(--primary); top: -12px;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            transition: all 1s ease-in-out;
        }

        .tick-label {
            margin-top: 40px; color: white; font-weight: 900; font-size: 1.5rem; white-space: nowrap;
        }

        .fraction {
            display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
            vertical-align: middle; line-height: 1.2;
        }
        .frac-top { border-bottom: 2px solid white; padding: 0 5px;}
        .frac-bot { padding: 0 5px;}

        /* Mid tick that appears on zoom */
        .mid-tick {
            background: var(--secondary); opacity: 0; z-index: 5;
        }
        .mid-tick .tick-label { color: var(--secondary); }

        .btn-zoom {
            background: var(--primary); color: white; border: none; padding: 15px 40px; border-radius: 50px;
            font-size: 1.2rem; font-weight: 900; cursor: pointer; transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.4); margin-top: 30px;
        }
        .btn-zoom:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 15px 25px rgba(139, 92, 246, 0.6); }

        /* Magnifying Glass Effect */
        .magnifier {
            position: absolute; width: 150px; height: 150px; border: 5px solid rgba(255,255,255,0.2);
            border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            box-shadow: 0 0 0 9999px rgba(0,0,0,0.6), inset 0 0 20px rgba(255,255,255,0.2);
            pointer-events: none; transition: all 1s ease-in-out; z-index: 10;
            display: flex; align-items: center; justify-content: center; backdrop-filter: blur(2px);
        }

        .mag-handle {
            position: absolute; width: 20px; height: 100px; background: rgba(255,255,255,0.2);
            bottom: -80px; right: -50px; transform: rotate(-45deg); border-radius: 10px;
        }

        .mag-text {
            font-size: 1.5rem; font-weight: 900; color: var(--secondary);
            text-shadow: 0 2px 5px black; opacity: 0; transition: opacity 0.5s;
        }

        .alert-box {
            position: absolute; top: 20px; background: rgba(16, 185, 129, 0.2); border: 2px solid var(--secondary);
            color: var(--secondary); padding: 10px 20px; border-radius: 15px; font-weight: 800; font-size: 1.2rem;
            opacity: 0; transform: translateY(-20px); transition: all 0.5s; text-align: center; z-index: 20;
        }

        @media (max-width: 768px) {
            .number-line { width: 90%; }
            .magnifier { width: 100px; height: 100px; }
            .alert-box { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=8B5CF6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.7.1.3. İki Rasyonel Sayı Arasındaki Sonsuzluk</div>
    </div>

    <div class="title-area">
        <h1>Sonsuzluğa Zoom (Sıralama)</h1>
        <p class="subtitle">Herhangi iki rasyonel sayı arasında daima başka bir rasyonel sayı vardır.</p>
    </div>

    <div class="canvas-area">
        
        <div class="alert-box" id="alertBox">Paydalar Genişletiliyor!</div>

        <div class="number-line" id="nLine">
            
            <div class="nl-tick" id="tickLeft" style="left: 10%;">
                <div class="tick-label" id="lblLeft">
                    <div class="fraction"><div class="frac-top">1</div><div class="frac-bot">2</div></div>
                </div>
            </div>

            <div class="nl-tick mid-tick" id="tickMid" style="left: 50%;">
                <div class="tick-label" id="lblMid">
                    <div class="fraction"><div class="frac-top">?</div><div class="frac-bot">?</div></div>
                </div>
            </div>

            <div class="nl-tick" id="tickRight" style="left: 90%;">
                <div class="tick-label" id="lblRight">
                    <div class="fraction"><div class="frac-top">3</div><div class="frac-bot">5</div></div>
                </div>
            </div>

            <div class="magnifier" id="magnifier">
                <div class="mag-handle"></div>
                <div class="mag-text" id="magText">Yaklaştırılıyor...</div>
            </div>

        </div>

    </div>

    <button class="btn-zoom" id="btnZoom" onclick="runZoom()">Araya Yakınlaş (Büyüteç)</button>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const btnZoom = document.getElementById('btnZoom');
        const alertBox = document.getElementById('alertBox');
        
        const tickLeft = document.getElementById('tickLeft');
        const lblLeft = document.getElementById('lblLeft');
        
        const tickRight = document.getElementById('tickRight');
        const lblRight = document.getElementById('lblRight');
        
        const tickMid = document.getElementById('tickMid');
        const lblMid = document.getElementById('lblMid');

        const magnifier = document.getElementById('magnifier');
        const magText = document.getElementById('magText');

        // State machine
        // 1/2 and 3/5 -> common denominator: 5/10 and 6/10 -> expand *2: 10/20 and 12/20 -> mid is 11/20
        let stage = 0; 
        
        function getFracHTML(top, bot) {
            return `<div class="fraction"><div class="frac-top">${top}</div><div class="frac-bot">${bot}</div></div>`;
        }

        async function runZoom() {
            btnZoom.disabled = true;

            if(stage === 0) {
                // Step 1: Payda eşitleme (5/10 ve 6/10)
                alertBox.innerText = "Paydalar eşitleniyor (10'da birleşir)";
                alertBox.style.opacity = 1;
                alertBox.style.transform = "translateY(0)";
                
                await sleep(1500);
                lblLeft.innerHTML = getFracHTML("5", "10");
                lblRight.innerHTML = getFracHTML("6", "10");
                
                alertBox.style.opacity = 0;
                alertBox.style.transform = "translateY(-20px)";
                await sleep(1000);

                btnZoom.innerText = "5 ile 6 arasında tam sayı yok! Daha da yakınlaş...";
                stage = 1;
                btnZoom.disabled = false;

            } else if (stage === 1) {
                // Step 2: Magnifier appears
                magnifier.style.transform = "translate(-50%, -50%) scale(1)";
                await sleep(1000);
                
                magText.style.opacity = 1;
                await sleep(1500);
                
                // Expand by 2 (10/20 and 12/20)
                alertBox.innerText = "Kesirler 2 ile genişletiliyor...";
                alertBox.style.opacity = 1;
                alertBox.style.transform = "translateY(0)";

                lblLeft.innerHTML = getFracHTML("10", "20");
                lblRight.innerHTML = getFracHTML("12", "20");
                
                await sleep(1500);
                alertBox.style.opacity = 0;
                magText.style.opacity = 0;

                // Move them to sides again conceptually by removing magnifier
                magnifier.style.transform = "translate(-50%, -50%) scale(3)"; // zoom effect
                magnifier.style.opacity = 0;
                await sleep(1000);

                // Reveal middle tick
                lblMid.innerHTML = getFracHTML("11", "20");
                tickMid.style.opacity = 1;
                
                alertBox.innerText = "Tebrikler! Araya 11/20 girdi.";
                alertBox.style.opacity = 1;
                alertBox.style.transform = "translateY(0)";
                
                await sleep(2000);
                
                btnZoom.innerText = "11/20 ile 12/20 arasına da yakınlaşabilir miyiz?";
                stage = 2;
                btnZoom.disabled = false;
            
            } else if (stage === 2) {
                // Keep zooming endlessly conceptually
                alertBox.style.opacity = 0;
                tickLeft.style.left = "-20%"; // push out
                tickMid.style.left = "10%"; // moves to left
                tickRight.style.left = "90%"; // stays

                await sleep(1000);
                
                // Now we have 11/20 and 12/20
                // Expand by 10 => 110/200 and 120/200
                alertBox.innerText = "İstediğimiz kadar genişletebiliriz!";
                alertBox.style.opacity = 1;
                
                lblMid.innerHTML = getFracHTML("110", "200");
                lblRight.innerHTML = getFracHTML("120", "200");

                await sleep(1500);

                // Reveal new tick at 115/200
                let tNew = document.createElement('div');
                tNew.className = "nl-tick mid-tick";
                tNew.style.left = "50%";
                tNew.style.opacity = 1;
                tNew.innerHTML = `<div class="tick-label">${getFracHTML("115", "200")}</div>`;
                document.getElementById('nLine').appendChild(tNew);

                await sleep(1000);
                alertBox.innerText = "KURAL: İki rasyonel sayı arasında DAİMA sonsuz sayıda rasyonel sayı vardır!";
                alertBox.style.background = "rgba(139, 92, 246, 0.2)";
                alertBox.style.borderColor = "var(--primary)";
                alertBox.style.color = "var(--primary)";

                btnZoom.innerText = "Deney Tamamlandı";
            }
        }

    </script>

    <script>
        // Global spam click prevention for Etkinlik files
        document.addEventListener('click', function(e) {
            if (e.target.tagName === 'BUTTON' && !e.target.hasAttribute('data-spam-locked')) {
                e.target.setAttribute('data-spam-locked', 'true');
                let originalOpacity = e.target.style.opacity || '1';
                e.target.style.opacity = '0.7';
                e.target.style.pointerEvents = 'none';
                setTimeout(() => {
                    e.target.removeAttribute('data-spam-locked');
                    e.target.style.opacity = originalOpacity;
                    e.target.style.pointerEvents = 'auto';
                }, 400);
            }
        });
    </script>
</body>
</html>
