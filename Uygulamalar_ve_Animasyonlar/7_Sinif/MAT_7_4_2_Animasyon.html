<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yüzey Alanı Animasyonu</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F0E17; --surface: #1A1A24; --text: #F8FAFC;
            --primary: #8B5CF6; --secondary: #10B981;
            --tertiary: #06B6D4; --danger: #F43F5E;
            --accent: #F59E0B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, var(--bg) 0%, #161625 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px; overflow-x: hidden;
        }

        .header {
            width: 100%; max-width: 1000px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(139, 92, 246, 0.2); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area { text-align: center; margin-bottom: 20px;}
        h1 { font-size: 2.2rem; color: var(--tertiary); font-weight: 900;}
        .subtitle { color: #94A3B8; font-size: 1.1rem; margin-top: 5px;}

        .canvas-area {
            position: relative; width: 100%; max-width: 800px; height: 500px; 
            background: #11111A; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.4); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden;
            perspective: 1000px;
        }

        .expl-text {
            position: absolute; top: 30px; font-size: 1.5rem; color: white; font-weight: 800;
            opacity: 1; transition: 0.5s; text-align: center; width: 80%; text-shadow: 0 5px 10px black; z-index: 10;
        }

        .formula-box {
            position: absolute; bottom: 30px; background: rgba(0,0,0,0.5); border: 2px solid var(--primary);
            padding: 15px 30px; border-radius: 20px; font-size: 2rem; font-weight: 900; color: white;
            opacity: 0; transform: translateY(20px); transition: all 1s; z-index: 10;
        }

        /* 3D Box */
        .box {
            width: 150px; height: 100px; position: relative;
            transform-style: preserve-3d; transform: rotateX(-20deg) rotateY(-30deg);
            transition: transform 1.5s ease-in-out;
        }

        .face {
            position: absolute; border: 2px solid rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; font-weight: 900; color: white; transition: all 2s ease-in-out; opacity: 0.9;
        }

        /* a=150, b=100, c=80 */
        /* Front/Back: 150x100 */
        .f-front  { width: 150px; height: 100px; transform: translateZ(40px); background: rgba(139, 92, 246, 0.8); }
        .f-back   { width: 150px; height: 100px; transform: rotateY(180deg) translateZ(40px); background: rgba(139, 92, 246, 0.8); }
        
        /* Left/Right: 80x100 */
        .f-right  { width: 80px; height: 100px; transform: rotateY(90deg) translateZ(110px); left: 35px; background: rgba(6, 182, 212, 0.8); }
        .f-left   { width: 80px; height: 100px; transform: rotateY(-90deg) translateZ(35px); left: 35px; background: rgba(6, 182, 212, 0.8); }
        
        /* Top/Bottom: 150x80 */
        .f-top    { width: 150px; height: 80px; transform: rotateX(90deg) translateZ(40px); top: 10px; background: rgba(16, 185, 129, 0.8); }
        .f-bottom { width: 150px; height: 80px; transform: rotateX(-90deg) translateZ(60px); top: 10px; background: rgba(16, 185, 129, 0.8); }

        .btn-play {
            background: var(--primary); color: white; border: none; padding: 15px 40px; border-radius: 50px;
            font-size: 1.2rem; font-weight: 900; cursor: pointer; transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.4); margin-top: 30px; z-index: 10;
        }
        .btn-play:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 15px 25px rgba(139, 92, 246, 0.6); }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=8B5CF6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.7.4.2. Prizma Yüzey Alanı (Animasyon)</div>
    </div>

    <div class="title-area">
        <h1>Alanların Dağılımı</h1>
        <p class="subtitle">Kapalı bir prizmanın 6 yüzeye ayrılarak formülün nasıl türetildiğini izleyin.</p>
    </div>

    <div class="canvas-area">
        
        <div class="expl-text" id="explText">Dikdörtgenler prizması karşılıklı 3 çift eş yüzeyden oluşur.</div>

        <div class="box" id="box">
            <div class="face f-front" id="fFront">Ön</div>
            <div class="face f-back" id="fBack">Arka</div>
            <div class="face f-right" id="fRight">Sağ</div>
            <div class="face f-left" id="fLeft">Sol</div>
            <div class="face f-top" id="fTop">Üst</div>
            <div class="face f-bottom" id="fBottom">Alt</div>
        </div>

        <div class="formula-box" id="formulaBox">
            <span style="color:var(--primary)">2(ab)</span> + <span style="color:var(--secondary)">2(ac)</span> + <span style="color:var(--tertiary)">2(bc)</span>
        </div>

    </div>

    <button class="btn-play" id="btnPlay" onclick="runAnim()">Animasyonu Başlat</button>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const btnPlay = document.getElementById('btnPlay');
        const explText = document.getElementById('explText');
        const box = document.getElementById('box');
        const formulaBox = document.getElementById('formulaBox');

        const fFront = document.getElementById('fFront');
        const fBack = document.getElementById('fBack');
        const fRight = document.getElementById('fRight');
        const fLeft = document.getElementById('fLeft');
        const fTop = document.getElementById('fTop');
        const fBottom = document.getElementById('fBottom');

        async function runAnim() {
            btnPlay.disabled = true;
            btnPlay.style.opacity = 0.5;

            // Reset
            box.style.transform = "rotateX(-20deg) rotateY(-30deg)";
            fFront.style.transform = "translateZ(40px)";
            fBack.style.transform = "rotateY(180deg) translateZ(40px)";
            fRight.style.transform = "rotateY(90deg) translateZ(110px)";
            fLeft.style.transform = "rotateY(-90deg) translateZ(35px)";
            fTop.style.transform = "rotateX(90deg) translateZ(40px)";
            fBottom.style.transform = "rotateX(-90deg) translateZ(60px)";
            formulaBox.style.opacity = 0;
            formulaBox.style.transform = "translateY(20px)";

            explText.innerText = "Kutuyu düz bir zemine doğru açalım...";

            await sleep(2000);

            // Explode / Unfold
            box.style.transform = "rotateX(0deg) rotateY(0deg) scale(0.8)";
            
            // Layout flat
            fFront.style.transform = "translateZ(0) translate(0, 0)";
            fBack.style.transform = "translateZ(0) translate(0, -200px)"; // moved up
            
            fTop.style.transform = "translateZ(0) translate(0, -100px)"; // moved top
            fBottom.style.transform = "translateZ(0) translate(0, 100px)"; // moved bottom
            
            fLeft.style.transform = "translateZ(0) translate(-120px, 0)"; // left
            fRight.style.transform = "translateZ(0) translate(160px, 0)"; // right

            await sleep(2500);

            explText.innerText = "Mor: Ön-Arka, Yeşil: Üst-Alt, Mavi: Sağ-Sol alanları temsil eder.";

            await sleep(2500);

            explText.innerText = "Bunların hepsinin toplamı YÜZEY ALANI formülünü verir.";
            
            formulaBox.style.opacity = 1;
            formulaBox.style.transform = "translateY(0)";

            await sleep(2500);

            explText.style.color = "var(--secondary)";

            btnPlay.disabled = false;
            btnPlay.style.opacity = 1;
            btnPlay.innerText = "Tekrar İzle";
        }
    </script>
</body>
</html>
