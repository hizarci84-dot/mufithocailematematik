<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tepe Değer (Mod) Laboratuvarı</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F0E17; --surface: #1A1A24; --text: #F8FAFC;
            --primary: #8B5CF6; --secondary: #10B981;
            --tertiary: #06B6D4; --danger: #F43F5E;
            --accent: #F59E0B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, var(--bg) 0%, #161625 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px; overflow-x: hidden;
        }

        .header {
            width: 100%; max-width: 1000px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(139, 92, 246, 0.2); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area { text-align: center; margin-bottom: 20px;}
        h1 { font-size: 2.2rem; color: var(--tertiary); font-weight: 900;}
        .subtitle { color: #94A3B8; font-size: 1.1rem; margin-top: 5px;}

        .main-container {
            display: flex; gap: 30px; width: 100%; max-width: 1000px; flex-wrap: wrap; justify-content: center;
        }

        .panel {
            background: #11111A; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.4); 
            padding: 30px; display: flex; flex-direction: column; align-items: center; width: 100%;
        }

        .expl-text {
            font-size: 1.2rem; font-weight: 800; color: white; text-align: center; margin-bottom: 20px;
            background: rgba(139, 92, 246, 0.1); padding: 15px 30px; border-radius: 15px; border-left: 5px solid var(--primary);
        }

        .source-area {
            display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 40px; min-height: 50px;
        }

        .draggable-num {
            width: 50px; height: 50px; background: var(--primary); color: white; border-radius: 10px;
            display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 900;
            cursor: pointer; transition: 0.2s; box-shadow: 0 5px 15px rgba(0,0,0,0.5); user-select: none;
        }
        .draggable-num:hover { transform: translateY(-5px); background: var(--tertiary); }
        .draggable-num.hidden { opacity: 0; pointer-events: none; }

        .buckets-area {
            display: flex; gap: 20px; justify-content: center; width: 100%; align-items: flex-end; height: 250px;
            border-bottom: 4px solid #334155; padding-bottom: 10px;
        }

        .bucket {
            width: 80px; display: flex; flex-direction: column-reverse; align-items: center; gap: 5px;
            position: relative;
        }

        .bucket-label {
            position: absolute; bottom: -35px; color: #94A3B8; font-weight: 900; font-size: 1.2rem;
        }

        .stacked-num {
            width: 50px; height: 50px; background: var(--secondary); color: white; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 900;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5); animation: dropIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes dropIn {
            0% { transform: translateY(-50px) scale(0.5); opacity: 0;}
            100% { transform: translateY(0) scale(1); opacity: 1;}
        }

        .btn-action {
            background: var(--accent); color: #11111A; border: none; padding: 15px 40px; border-radius: 50px;
            font-size: 1.2rem; font-weight: 900; cursor: pointer; transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(245, 158, 11, 0.4); margin-top: 50px; display: none;
        }
        .btn-action:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 15px 25px rgba(245, 158, 11, 0.6); }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=8B5CF6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.7.5.5. Tepe Değer (Etkinlik)</div>
    </div>

    <div class="title-area">
        <h1>Mod (Tepe Değer) Kulesi</h1>
        <p class="subtitle">En çok tekrar eden sayıyı (Tepe Değeri) bulmak için sayıları kendi kutusuna gönderin.</p>
    </div>

    <div class="main-container">
        
        <div class="panel">
            
            <div class="expl-text" id="explText">Tüm sayıların üzerine tıklayarak ait oldukları kuleye yerleşmelerini sağlayın.</div>

            <div class="source-area" id="sourceArea">
                <div class="draggable-num" onclick="moveToBucket(this, 10)">10</div>
                <div class="draggable-num" onclick="moveToBucket(this, 20)">20</div>
                <div class="draggable-num" onclick="moveToBucket(this, 10)">10</div>
                <div class="draggable-num" onclick="moveToBucket(this, 30)">30</div>
                <div class="draggable-num" onclick="moveToBucket(this, 20)">20</div>
                <div class="draggable-num" onclick="moveToBucket(this, 20)">20</div>
                <div class="draggable-num" onclick="moveToBucket(this, 40)">40</div>
                <div class="draggable-num" onclick="moveToBucket(this, 10)">10</div>
                <div class="draggable-num" onclick="moveToBucket(this, 20)">20</div>
            </div>

            <div class="buckets-area" id="bucketsArea">
                <div class="bucket" id="b10">
                    <div class="bucket-label">10</div>
                </div>
                <div class="bucket" id="b20">
                    <div class="bucket-label">20</div>
                </div>
                <div class="bucket" id="b30">
                    <div class="bucket-label">30</div>
                </div>
                <div class="bucket" id="b40">
                    <div class="bucket-label">40</div>
                </div>
            </div>

            <button class="btn-action" id="btnAction" onclick="checkMod()">Tepe Değeri Bul</button>

        </div>

    </div>

    <script>
        let placedCount = 0;
        const totalCount = 9;

        function moveToBucket(el, val) {
            el.classList.add('hidden'); // hide original
            
            let bucket = document.getElementById('b' + val);
            
            let stacked = document.createElement('div');
            stacked.className = 'stacked-num';
            stacked.innerText = val;
            
            // Append so it stacks from bottom up due to flex column-reverse
            bucket.appendChild(stacked);

            placedCount++;

            if(placedCount === totalCount) {
                document.getElementById('explText').innerText = "Tüm sayılar yerleşti! Şimdi 'Tepe Değeri Bul' butonuna tıklayarak hangi kulenin en yüksek olduğunu görelim.";
                document.getElementById('btnAction').style.display = "block";
            }
        }

        function checkMod() {
            let b10 = document.getElementById('b10').children.length - 1; // subtract 1 for label
            let b20 = document.getElementById('b20').children.length - 1;
            let b30 = document.getElementById('b30').children.length - 1;
            let b40 = document.getElementById('b40').children.length - 1;

            // highlight highest
            let max = Math.max(b10, b20, b30, b40);
            
            let modVal = 0;
            if(b10 === max) modVal = 10;
            if(b20 === max) modVal = 20;
            if(b30 === max) modVal = 30;
            if(b40 === max) modVal = 40;

            let modBucket = document.getElementById('b' + modVal);
            
            // Highlight children
            for(let i=1; i<modBucket.children.length; i++) {
                modBucket.children[i].style.background = "var(--accent)";
                modBucket.children[i].style.color = "#11111A";
                modBucket.children[i].style.boxShadow = "0 0 20px rgba(245, 158, 11, 0.8)";
            }

            document.getElementById('explText').innerText = `TEBRİKLER! En çok tekrar eden sayı ${modVal} oldu. Bu grubun Tepe Değeri (Mod) ${modVal}'dir.`;
            document.getElementById('btnAction').style.display = "none";
        }
    </script>

    <script>
        // Global spam click prevention for Etkinlik files
        document.addEventListener('click', function(e) {
            if (e.target.tagName === 'BUTTON' && !e.target.hasAttribute('data-spam-locked')) {
                e.target.setAttribute('data-spam-locked', 'true');
                let originalOpacity = e.target.style.opacity || '1';
                e.target.style.opacity = '0.7';
                e.target.style.pointerEvents = 'none';
                setTimeout(() => {
                    e.target.removeAttribute('data-spam-locked');
                    e.target.style.opacity = originalOpacity;
                    e.target.style.pointerEvents = 'auto';
                }, 400);
            }
        });
    </script>
</body>
</html>
