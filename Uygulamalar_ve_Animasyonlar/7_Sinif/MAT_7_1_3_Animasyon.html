<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonsuzluğa Yakınlaştırma (Animasyon)</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F0E17; --surface: #1A1A24; --text: #F8FAFC;
            --primary: #8B5CF6; --secondary: #10B981;
            --tertiary: #06B6D4; --danger: #F43F5E;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, var(--bg) 0%, #161625 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px; overflow-x: hidden;
        }

        .header {
            width: 100%; max-width: 1000px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(139, 92, 246, 0.2); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area { text-align: center; margin-bottom: 30px;}
        h1 { font-size: 2.2rem; color: var(--tertiary); font-weight: 900;}
        .subtitle { color: #94A3B8; font-size: 1.1rem; margin-top: 5px;}

        .canvas-area {
            position: relative; width: 100%; max-width: 900px; height: 400px; 
            background: #11111A; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.4); 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .number-line {
            width: 80%; height: 6px; background: #334155; position: relative; border-radius: 3px;
            transition: all 1.5s ease-in-out; margin-bottom: 20px;
        }

        .nl-tick {
            position: absolute; width: 4px; height: 30px; background: var(--primary); top: -12px;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            transition: all 1.5s ease-in-out;
        }

        .tick-label { margin-top: 40px; color: white; font-weight: 900; font-size: 1.5rem; white-space: nowrap; transition: 0.5s; }

        .fraction {
            display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
            vertical-align: middle; line-height: 1.2;
        }
        .frac-top { border-bottom: 2px solid white; padding: 0 5px;}
        .frac-bot { padding: 0 5px;}

        .mid-tick { background: var(--secondary); opacity: 0; z-index: 5; }
        .mid-tick .tick-label { color: var(--secondary); }

        .btn-play {
            background: var(--primary); color: white; border: none; padding: 15px 40px; border-radius: 50px;
            font-size: 1.2rem; font-weight: 900; cursor: pointer; transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.4); margin-top: 30px;
        }
        .btn-play:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 15px 25px rgba(139, 92, 246, 0.6); }

        .magnifier {
            position: absolute; width: 150px; height: 150px; border: 5px solid rgba(255,255,255,0.2);
            border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            box-shadow: 0 0 0 9999px rgba(0,0,0,0.6), inset 0 0 20px rgba(255,255,255,0.2);
            pointer-events: none; transition: all 1.5s ease-in-out; z-index: 10;
            display: flex; align-items: center; justify-content: center; backdrop-filter: blur(2px);
        }
        .mag-handle {
            position: absolute; width: 20px; height: 100px; background: rgba(255,255,255,0.2);
            bottom: -80px; right: -50px; transform: rotate(-45deg); border-radius: 10px;
        }
        .mag-text {
            font-size: 1.5rem; font-weight: 900; color: var(--secondary);
            text-shadow: 0 2px 5px black; opacity: 0; transition: opacity 0.5s;
        }

        .expl-text {
            position: absolute; top: 30px; font-size: 1.5rem; color: var(--tertiary); font-weight: 800;
            opacity: 0; transition: 0.5s; text-align: center; width: 80%;
        }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=8B5CF6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.7.1.3. Sonsuzluğa Yakınlaştırma (Animasyon)</div>
    </div>

    <div class="title-area">
        <h1>Otomatik Zoom Animasyonu</h1>
        <p class="subtitle">Herhangi iki rasyonel sayı arasında daima başka bir rasyonel sayı bulunduğunun kanıtı.</p>
    </div>

    <div class="canvas-area">
        
        <div class="expl-text" id="explText">1/2 ile 3/5 arasında bir sayı arıyoruz.</div>

        <div class="number-line" id="nLine">
            
            <div class="nl-tick" id="tickLeft" style="left: 20%;">
                <div class="tick-label" id="lblLeft">
                    <div class="fraction"><div class="frac-top">1</div><div class="frac-bot">2</div></div>
                </div>
            </div>

            <div class="nl-tick mid-tick" id="tickMid" style="left: 50%;">
                <div class="tick-label" id="lblMid">
                    <div class="fraction"><div class="frac-top">11</div><div class="frac-bot">20</div></div>
                </div>
            </div>

            <div class="nl-tick" id="tickRight" style="left: 80%;">
                <div class="tick-label" id="lblRight">
                    <div class="fraction"><div class="frac-top">3</div><div class="frac-bot">5</div></div>
                </div>
            </div>

            <div class="magnifier" id="magnifier">
                <div class="mag-handle"></div>
                <div class="mag-text" id="magText">Yaklaştırılıyor...</div>
            </div>

        </div>

    </div>

    <button class="btn-play" id="btnPlay" onclick="runZoomAnim()">Animasyonu Başlat</button>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const btnPlay = document.getElementById('btnPlay');
        const explText = document.getElementById('explText');
        
        const tickLeft = document.getElementById('tickLeft');
        const lblLeft = document.getElementById('lblLeft');
        const tickRight = document.getElementById('tickRight');
        const lblRight = document.getElementById('lblRight');
        const tickMid = document.getElementById('tickMid');
        const lblMid = document.getElementById('lblMid');

        const magnifier = document.getElementById('magnifier');
        const magText = document.getElementById('magText');

        function getFracHTML(top, bot) {
            return `<div class="fraction"><div class="frac-top">${top}</div><div class="frac-bot">${bot}</div></div>`;
        }

        async function runZoomAnim() {
            btnPlay.disabled = true;
            btnPlay.style.opacity = 0.5;

            // Reset
            lblLeft.innerHTML = getFracHTML("1", "2");
            lblRight.innerHTML = getFracHTML("3", "5");
            tickLeft.style.left = "20%";
            tickRight.style.left = "80%";
            tickMid.style.opacity = 0;
            tickMid.style.left = "50%";
            
            explText.style.opacity = 1;
            explText.innerText = "Önce kesirlerin paydalarını 10'da eşitleriz.";
            await sleep(2500);

            lblLeft.innerHTML = getFracHTML("5", "10");
            lblRight.innerHTML = getFracHTML("6", "10");
            
            await sleep(2000);

            explText.innerText = "5 ile 6 arasında tam sayı yok. O halde aralığa BÜYÜTEÇLE yaklaşıyoruz (2 ile genişletiyoruz).";
            
            magnifier.style.transform = "translate(-50%, -50%) scale(1)";
            await sleep(1500);
            magText.style.opacity = 1;
            
            lblLeft.innerHTML = getFracHTML("10", "20");
            lblRight.innerHTML = getFracHTML("12", "20");

            tickLeft.style.left = "-20%"; // push out for zoom effect
            tickRight.style.left = "120%"; 

            await sleep(2000);
            
            magText.style.opacity = 0;
            magnifier.style.transform = "translate(-50%, -50%) scale(4)"; // zoom out
            magnifier.style.opacity = 0;
            
            explText.innerText = "Artık 10/20 ile 12/20 arasına girdik! Tam ortalarında 11/20 var.";
            tickMid.style.opacity = 1;

            // bring them back somewhat visually
            tickLeft.style.left = "10%";
            tickRight.style.left = "90%";

            await sleep(3000);

            explText.innerText = "Bu mantıkla paydaları büyüterek ARALARA sonsuz sayı sığdırabiliriz!";
            explText.style.color = "var(--secondary)";

            btnPlay.disabled = false;
            btnPlay.style.opacity = 1;
            btnPlay.innerText = "Tekrar İzle";
        }

    </script>
</body>
</html>
