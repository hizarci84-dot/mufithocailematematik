<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yağan Küpler Animasyonu</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F0E17; --surface: #1A1A24; --text: #F8FAFC;
            --primary: #8B5CF6; --secondary: #10B981;
            --tertiary: #06B6D4; --danger: #F43F5E;
            --accent: #F59E0B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, var(--bg) 0%, #161625 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px; overflow-x: hidden;
        }

        .header {
            width: 100%; max-width: 1000px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(139, 92, 246, 0.2); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area { text-align: center; margin-bottom: 20px;}
        h1 { font-size: 2.2rem; color: var(--tertiary); font-weight: 900;}
        .subtitle { color: #94A3B8; font-size: 1.1rem; margin-top: 5px;}

        .canvas-area {
            position: relative; width: 100%; max-width: 800px; height: 500px; 
            background: #11111A; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.4); 
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 40px; overflow: hidden;
        }

        .tank {
            width: 400px; height: 250px; border: 4px solid rgba(6, 182, 212, 0.5);
            border-top: none; position: relative; background: rgba(6, 182, 212, 0.05);
            display: flex; flex-wrap: wrap-reverse; align-content: flex-start; justify-content: flex-start;
            gap: 2px; padding: 2px;
        }

        .unit-cube {
            width: 47px; height: 47px; background: var(--primary); border: 2px solid white;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.3); opacity: 0;
            /* transform will be handled by JS */
        }

        .counter-box {
            position: absolute; top: 30px; background: rgba(0,0,0,0.5); border: 2px solid var(--accent);
            padding: 15px 40px; border-radius: 20px; font-size: 2rem; font-weight: 900; color: white;
            text-align: center;
        }
        .counter-box span { color: var(--accent); font-size: 3rem;}

        .btn-play {
            background: var(--primary); color: white; border: none; padding: 15px 40px; border-radius: 50px;
            font-size: 1.2rem; font-weight: 900; cursor: pointer; transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.4); margin-top: 30px; z-index: 10;
        }
        .btn-play:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 15px 25px rgba(139, 92, 246, 0.6); }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=8B5CF6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.7.4.3. Eş Nesnelerle Hacim (Animasyon)</div>
    </div>

    <div class="title-area">
        <h1>Otomatik Hacim Doldurma</h1>
        <p class="subtitle">Bir cismin hacminin, o cismi dolduran eş nesnelerin sayısına eşit olduğunu izleyin.</p>
    </div>

    <div class="canvas-area">
        
        <div class="counter-box">Sayım: <br><span id="counter">0</span></div>

        <div class="tank" id="tank"></div>

    </div>

    <button class="btn-play" id="btnPlay" onclick="runRain()">Animasyonu Başlat</button>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const btnPlay = document.getElementById('btnPlay');
        const tank = document.getElementById('tank');
        const counter = document.getElementById('counter');

        const totalCubes = 40; // 8 cols x 5 rows (width 400/50=8, height 250/50=5)

        async function runRain() {
            btnPlay.disabled = true;
            btnPlay.style.opacity = 0.5;
            tank.innerHTML = "";
            counter.innerText = "0";

            for(let i=1; i<=totalCubes; i++) {
                let cube = document.createElement('div');
                cube.className = 'unit-cube';
                
                // Set initial position high up
                cube.style.transform = "translateY(-400px)";
                tank.appendChild(cube);

                // Animate drop
                cube.animate([
                    { opacity: 0, transform: "translateY(-400px)" },
                    { opacity: 1, transform: "translateY(0)" }
                ], { duration: 150, fill: "forwards", easing: "ease-in" });

                counter.innerText = i;
                
                // Speed up as it goes
                let delay = Math.max(20, 100 - (i*2));
                await sleep(delay);
            }

            counter.style.color = "var(--secondary)";
            await sleep(500);

            btnPlay.disabled = false;
            btnPlay.style.opacity = 1;
            btnPlay.innerText = "Tekrar İzle";
        }
    </script>
</body>
</html>
