<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ortanca Animasyonu</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F0E17; --surface: #1A1A24; --text: #F8FAFC;
            --primary: #8B5CF6; --secondary: #10B981;
            --tertiary: #06B6D4; --danger: #F43F5E;
            --accent: #F59E0B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, var(--bg) 0%, #161625 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px; overflow-x: hidden;
        }

        .header {
            width: 100%; max-width: 1000px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(139, 92, 246, 0.2); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area { text-align: center; margin-bottom: 20px;}
        h1 { font-size: 2.2rem; color: var(--tertiary); font-weight: 900;}
        .subtitle { color: #94A3B8; font-size: 1.1rem; margin-top: 5px;}

        .canvas-area {
            position: relative; width: 100%; max-width: 800px; height: 400px; 
            background: #11111A; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.4); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden;
        }

        .expl-text {
            position: absolute; top: 30px; font-size: 1.5rem; color: white; font-weight: 800;
            opacity: 1; transition: 0.5s; text-align: center; width: 80%; text-shadow: 0 5px 10px black; z-index: 10;
        }

        .num-track {
            position: relative; width: 100%; height: 100px; display: flex; align-items: center; justify-content: center;
        }

        .n-box {
            position: absolute; width: 60px; height: 60px; background: var(--primary);
            display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: 900;
            color: white; border-radius: 12px; transition: all 1s cubic-bezier(0.4, 0, 0.2, 1);
            left: 50%; transform: translateX(-50%);
        }

        .btn-play {
            background: var(--primary); color: white; border: none; padding: 15px 40px; border-radius: 50px;
            font-size: 1.2rem; font-weight: 900; cursor: pointer; transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.4); margin-top: 30px; z-index: 10;
        }
        .btn-play:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 15px 25px rgba(139, 92, 246, 0.6); }

        .formula-box {
            position: absolute; bottom: 30px; background: rgba(0,0,0,0.5); border: 2px solid var(--accent);
            padding: 15px 30px; border-radius: 20px; font-size: 2rem; font-weight: 900; color: var(--accent);
            opacity: 0; transform: translateY(20px); transition: all 1s; z-index: 10;
        }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=8B5CF6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.7.5.4. Ortanca (Animasyon)</div>
    </div>

    <div class="title-area">
        <h1>Otomatik Sıralama ve Eleme</h1>
        <p class="subtitle">Veri grubunun ortancasındaki sayının otomatik olarak nasıl ayıklandığını izleyin.</p>
    </div>

    <div class="canvas-area">
        
        <div class="expl-text" id="explText">1. Karmaşık halde verilmiş sayılar dizisi.</div>

        <div class="num-track" id="numTrack">
            <!-- 9 numbers -->
            <div class="n-box" id="n0">44</div>
            <div class="n-box" id="n1">12</div>
            <div class="n-box" id="n2">98</div>
            <div class="n-box" id="n3">5</div>
            <div class="n-box" id="n4">67</div>
            <div class="n-box" id="n5">23</div>
            <div class="n-box" id="n6">100</div>
            <div class="n-box" id="n7">34</div>
            <div class="n-box" id="n8">55</div>
        </div>

        <div class="formula-box" id="formulaBox">
            Ortanca = 44
        </div>

    </div>

    <button class="btn-play" id="btnPlay" onclick="runAnim()">Algoritmayı Başlat</button>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const btnPlay = document.getElementById('btnPlay');
        const explText = document.getElementById('explText');
        const numTrack = document.getElementById('numTrack');
        const formulaBox = document.getElementById('formulaBox');

        // Initial unordered
        const raw = [44, 12, 98, 5, 67, 23, 100, 34, 55];
        
        // Target sorted
        // 5, 12, 23, 34, 44, 55, 67, 98, 100
        const sorted = [...raw].sort((a,b) => a-b);
        
        // Find which index in raw goes to which index in sorted
        const mapping = raw.map(val => sorted.indexOf(val));

        const boxes = [];
        for(let i=0; i<9; i++) {
            boxes.push(document.getElementById("n" + i));
        }

        async function runAnim() {
            btnPlay.disabled = true;
            btnPlay.style.opacity = 0.5;

            // Reset
            formulaBox.style.opacity = 0; formulaBox.style.transform = "translateY(20px)";
            explText.innerText = "1. Karmaşık halde verilmiş sayılar dizisi.";
            
            // Random scatter
            boxes.forEach((b, i) => {
                b.style.transition = "none";
                b.style.opacity = 1; b.style.transform = "translateX(-50%) scale(1)";
                b.style.background = "var(--primary)"; b.style.color = "white";
                
                let rx = (Math.random() * 600) - 300;
                let ry = (Math.random() * 100) - 50;
                b.style.left = `calc(50% + ${rx}px)`;
                b.style.top = `calc(50% + ${ry}px)`;
            });

            // Reflow
            numTrack.getBoundingClientRect();
            
            await sleep(1000);

            // Step 2: Sort into a line
            explText.innerText = "2. İlk kural: Sayılar KÜÇÜKTEN BÜYÜĞE sıralanır.";
            
            let startX = -280;
            let spacing = 70;

            boxes.forEach((b, i) => {
                b.style.transition = "all 1.5s cubic-bezier(0.4, 0, 0.2, 1)";
                
                let sortedIdx = mapping[i];
                let px = startX + (sortedIdx * spacing);
                
                b.style.left = `calc(50% + ${px}px)`;
                b.style.top = "50%";
                b.style.transform = "translate(-50%, -50%) scale(1)";
            });

            await sleep(2500);

            explText.innerText = "3. Uçlardaki sayılar karşılıklı olarak elenir.";

            // Step 3: Eliminate ends
            let left = 0;
            let right = 8;
            
            while(left < right) {
                // Find the DOM elements that are at 'left' and 'right' sorted positions
                let lBox = boxes[raw.indexOf(sorted[left])];
                let rBox = boxes[raw.indexOf(sorted[right])];

                lBox.style.background = "var(--danger)";
                rBox.style.background = "var(--danger)";

                await sleep(500);

                lBox.style.opacity = 0; lBox.style.transform = "translate(-50%, -50%) scale(0)";
                rBox.style.opacity = 0; rBox.style.transform = "translate(-50%, -50%) scale(0)";

                left++;
                right--;

                await sleep(500);
            }

            // Left === Right is the median
            explText.innerText = "4. Geriye kalan tek sayı MEDYAN (Ortanca) değeridir.";

            let medBox = boxes[raw.indexOf(sorted[left])];
            medBox.style.background = "var(--accent)";
            medBox.style.color = "#11111A";
            medBox.style.transform = "translate(-50%, -50%) scale(1.5)";
            medBox.style.zIndex = "10";

            await sleep(1500);

            formulaBox.style.opacity = 1;
            formulaBox.style.transform = "translateY(0)";

            await sleep(2000);

            btnPlay.disabled = false;
            btnPlay.style.opacity = 1;
            btnPlay.innerText = "Tekrar İzle";
        }

        // initial scatter
        boxes.forEach((b, i) => {
            let rx = (Math.random() * 600) - 300;
            let ry = (Math.random() * 100) - 50;
            b.style.left = `calc(50% + ${rx}px)`;
            b.style.top = `calc(50% + ${ry}px)`;
            b.style.transform = "translate(-50%, -50%) scale(1)";
        });

    </script>
</body>
</html>
