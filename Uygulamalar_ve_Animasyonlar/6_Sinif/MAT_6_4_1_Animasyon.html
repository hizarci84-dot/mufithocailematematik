<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alan Ölçüleri - Animasyon</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F172A; --text: #F8FAFC;
            --primary: #3B82F6; --secondary: #10B981;
            --tertiary: #F59E0B; --danger: #F43F5E;
            --purple: #8B5CF6; --cyan: #06B6D4;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px;
        }

        .header {
            width: 100%; max-width: 900px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--tertiary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area { text-align: center; width: 100%; max-width: 800px; margin-bottom: 20px; height: 110px;}
        h1 { font-size: 2.2rem; color: var(--tertiary); text-shadow: 0 5px 15px rgba(0,0,0,0.5); line-height: 1.3;}
        .subtitle { font-size: 1.2rem; color: #94A3B8; margin-top: 10px; line-height: 1.5; min-height: 55px;}
        .subtitle span { color: white; font-weight: 800; background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 5px;}

        .canvas-area {
            position: relative; width: 100%; max-width: 800px; height: 450px; 
            background: #0B1120; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.3); 
            overflow: hidden; display: flex; align-items: center; justify-content: center;
        }

        .square-container {
            position: relative; width: 300px; height: 300px; transition: transform 2s ease-in-out;
        }

        .big-square {
            position: absolute; top:0; left:0; width: 100%; height: 100%;
            background: rgba(59, 130, 246, 0.2); border: 4px solid var(--primary);
            display: flex; align-items: center; justify-content: center; transition: all 1s;
        }
        .big-text { font-size: 3rem; font-weight: 900; color: white; text-shadow: 0 0 10px var(--primary); transition: opacity 0.5s;}

        .grid-container {
            position: absolute; top:0; left:0; width: 100%; height: 100%;
            display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(10, 1fr);
            opacity: 0; transition: opacity 1s;
        }
        
        .small-square {
            border: 1px solid rgba(16, 185, 129, 0.4); background: rgba(16, 185, 129, 0.1);
            transform: scale(0); transition: transform 0.5s;
        }

        .label-top {
            position: absolute; top: -30px; left: 50%; transform: translateX(-50%);
            font-size: 1.5rem; font-weight: 900; color: var(--primary); transition: all 1s;
        }
        .label-side {
            position: absolute; left: -80px; top: 50%; transform: translateY(-50%);
            font-size: 1.5rem; font-weight: 900; color: var(--primary); transition: all 1s;
        }

        .math-eq {
            position: absolute; right: 50px; top: 50%; transform: translateY(-50%);
            font-size: 2rem; font-weight: 900; color: white; opacity: 0; transition: opacity 1s;
            background: rgba(0,0,0,0.5); padding: 20px; border-radius: 15px; border: 2px dashed var(--secondary);
            text-align: center;
        }

        .btn-start {
            margin-top: 30px; background: var(--tertiary); color: white; border: none; padding: 15px 40px; border-radius: 50px;
            font-size: 1.2rem; font-weight: 800; cursor: pointer; transition: all 0.3s; box-shadow: 0 10px 20px rgba(245, 158, 11, 0.4);
        }
        .btn-start:hover { transform: scale(1.05); }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=3B82F6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.6.4.1. Alan Ölçüleri ve 100 Katı Kuralı</div>
    </div>

    <div class="title-area">
        <h1 id="mTitle">Neden Yüzer Yüzer Büyür?</h1>
        <p class="subtitle" id="mSub">Uzunluk ölçüleri 10'ar 10'ar değişirken, alan ölçüleri neden <span>100'er 100'er</span> değişir? Birlikte keşfedelim.</p>
    </div>

    <div class="canvas-area">
        
        <div class="square-container" id="sqC">
            <div class="label-top" id="lblT">1 metre</div>
            <div class="label-side" id="lblS">1 metre</div>
            
            <div class="big-square" id="bgSq">
                <div class="big-text" id="bTxt">1 m²</div>
            </div>

            <div class="grid-container" id="gridC">
                <!-- 100 squares will be injected here via JS -->
            </div>
        </div>

        <div class="math-eq" id="mEq">
            10 dm x 10 dm <br>
            <span style="color:var(--secondary); font-size: 3rem;">= 100 dm²</span>
        </div>

    </div>

    <button class="btn-start" id="startBtn" onclick="runTimeline()">Animasyonu Başlat</button>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const mTitle = document.getElementById('mTitle');
        const mSub = document.getElementById('mSub');
        const startBtn = document.getElementById('startBtn');
        const gridC = document.getElementById('gridC');

        // Create 100 small squares
        for(let i=0; i<100; i++) {
            let div = document.createElement('div');
            div.className = 'small-square';
            div.id = 'ss' + i;
            gridC.appendChild(div);
        }

        async function runTimeline() {
            startBtn.style.display = 'none';

            // Reset
            document.getElementById('sqC').style.transform = "translateX(0)";
            document.getElementById('mEq').style.opacity = 0;
            document.getElementById('bTxt').style.opacity = 1;
            gridC.style.opacity = 0;
            document.querySelectorAll('.small-square').forEach(el => el.style.transform = 'scale(0)');
            document.getElementById('lblT').innerText = "1 metre";
            document.getElementById('lblT').style.color = "var(--primary)";
            document.getElementById('lblS').innerText = "1 metre";
            document.getElementById('lblS').style.color = "var(--primary)";

            // Step 1: Base Square
            mTitle.innerText = "1 Metrekarelik Bir Alan";
            mSub.innerHTML = "Kenar uzunluğu 1 metre olan bir karenin alanı <span>1 m²</span>'dir. (1 x 1 = 1)";
            await sleep(3500);

            // Step 2: Length Conversion
            mTitle.innerText = "Uzunlukları Çevirelim";
            mSub.innerHTML = "Biliyoruz ki uzunluk ölçülerinde <span>1 metre = 10 desimetre (dm)</span>'dir.";
            
            document.getElementById('lblT').style.opacity = 0;
            document.getElementById('lblS').style.opacity = 0;
            await sleep(500);
            document.getElementById('lblT').innerText = "10 dm";
            document.getElementById('lblT').style.color = "var(--secondary)";
            document.getElementById('lblS').innerText = "10 dm";
            document.getElementById('lblS').style.color = "var(--secondary)";
            document.getElementById('lblT').style.opacity = 1;
            document.getElementById('lblS').style.opacity = 1;

            await sleep(3500);

            // Step 3: Grid visualization
            mTitle.innerText = "İçini Dolduralım";
            mSub.innerHTML = "Enine 10 parça, boyuna 10 parça... Toplam kaç tane <span>1 dm²</span>'lik küçük kare sığar?";
            
            document.getElementById('bTxt').style.opacity = 0;
            gridC.style.opacity = 1;

            // Animate grid popping in
            let squares = document.querySelectorAll('.small-square');
            for(let i=0; i<100; i+=10) {
                for(let j=0; j<10; j++) {
                    squares[i+j].style.transform = 'scale(1)';
                }
                await sleep(200);
            }

            await sleep(2000);

            // Step 4: Conclusion
            mTitle.innerText = "İşte 100 Katın Sırrı!";
            mSub.innerHTML = "Alan hesabı iki boyutlu olduğu için, uzunluktaki 10 kat değişimi alan hesabında <span>10 x 10 = 100 kat</span> olarak yansır!";
            
            document.getElementById('sqC').style.transform = "translateX(-150px)";
            await sleep(1000);
            document.getElementById('mEq').style.opacity = 1;

            setTimeout(() => {
                startBtn.style.display = 'block';
                startBtn.innerText = "Tekrar İzle";
            }, 5000);
        }
    </script>
</body>
</html>
