<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi'nin Keşfi - Animasyon</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F172A; --text: #F8FAFC;
            --primary: #3B82F6; --secondary: #10B981;
            --tertiary: #F59E0B; --danger: #F43F5E;
            --purple: #8B5CF6; --cyan: #06B6D4;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px;
        }

        .header {
            width: 100%; max-width: 900px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--purple); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area { text-align: center; width: 100%; max-width: 800px; margin-bottom: 20px; height: 110px;}
        h1 { font-size: 2.2rem; color: var(--purple); text-shadow: 0 5px 15px rgba(0,0,0,0.5); line-height: 1.3;}
        .subtitle { font-size: 1.2rem; color: #94A3B8; margin-top: 10px; line-height: 1.5; min-height: 55px;}
        .subtitle span { color: white; font-weight: 800; background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 5px;}

        .canvas-area {
            position: relative; width: 100%; max-width: 800px; height: 400px; 
            background: #0B1120; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.3); 
            overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .road {
            position: absolute; bottom: 80px; width: 90%; height: 4px; background: rgba(255,255,255,0.2);
            left: 5%; border-radius: 2px;
        }

        /* The wheel: diameter = 100px. Circ = 314px. */
        .wheel-container {
            position: absolute; bottom: 82px; left: 100px; width: 100px; height: 100px;
            transition: all 4s linear; z-index: 10;
        }
        
        .wheel {
            width: 100%; height: 100%; border-radius: 50%; border: 4px solid var(--primary);
            position: relative; transition: all 4s linear; background: rgba(59, 130, 246, 0.1);
        }
        
        /* The starting point marker on the wheel */
        .marker {
            position: absolute; width: 10px; height: 10px; background: var(--danger);
            border-radius: 50%; bottom: -7px; left: 41px; 
        }

        .diameter-line {
            position: absolute; width: 100%; height: 2px; background: var(--tertiary);
            top: 48px; left: 0;
        }

        .unrolled-line {
            position: absolute; bottom: 82px; left: 150px; height: 6px; background: var(--primary);
            width: 0px; transition: width 4s linear; border-radius: 3px;
        }

        .ruler {
            position: absolute; bottom: 40px; left: 150px; width: 314px; height: 20px;
            border-left: 2px solid white; border-right: 2px solid white; border-bottom: 2px solid white;
            opacity: 0; transition: opacity 1s; display: flex; justify-content: center; align-items: flex-end;
        }
        .ruler span { position: absolute; bottom: -25px; font-weight: 800; color: white;}

        .diam-copies {
            position: absolute; bottom: 95px; left: 150px; display: flex; opacity: 0; transition: opacity 1s;
        }
        .dc {
            width: 100px; height: 10px; border-bottom: 3px dashed var(--tertiary); position: relative;
        }
        .dc-last {
            width: 14.15px; height: 10px; border-bottom: 3px solid var(--danger); position: relative;
        }

        .btn-start {
            margin-top: 30px; background: var(--purple); color: white; border: none; padding: 15px 40px; border-radius: 50px;
            font-size: 1.2rem; font-weight: 800; cursor: pointer; transition: all 0.3s; box-shadow: 0 10px 20px rgba(139, 92, 246, 0.4);
        }
        .btn-start:hover { transform: scale(1.05); }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=3B82F6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.6.4.4. Pi'nin Keşfi</div>
    </div>

    <div class="title-area">
        <h1 id="mTitle">Sonsuzluğun Sayısı: Pi</h1>
        <p class="subtitle" id="mSub">Herhangi bir çemberin uzunluğu, acaba çapının kaç katıdır? <span>Yuvarlayıp görelim.</span></p>
    </div>

    <div class="canvas-area">
        <div class="road"></div>
        
        <div class="wheel-container" id="wC">
            <div class="wheel" id="whl">
                <div class="marker"></div>
                <div class="diameter-line"></div>
            </div>
            <div style="position: absolute; top: -30px; width: 100%; text-align: center; color: var(--tertiary); font-weight: 900;" id="dLabel">Çap = 1 birim</div>
        </div>

        <div class="unrolled-line" id="uLine"></div>

        <div class="diam-copies" id="dCopies">
            <div class="dc"><span style="position:absolute; top:-25px; left:40px; color:var(--tertiary); font-weight:800;">1</span></div>
            <div class="dc"><span style="position:absolute; top:-25px; left:40px; color:var(--tertiary); font-weight:800;">2</span></div>
            <div class="dc"><span style="position:absolute; top:-25px; left:40px; color:var(--tertiary); font-weight:800;">3</span></div>
            <div class="dc-last"><span style="position:absolute; top:-25px; left:5px; color:var(--danger); font-weight:800; font-size:0.8rem;">0.14</span></div>
        </div>

        <div class="ruler" id="ruler">
            <span>Çevre Uzunluğu</span>
        </div>

    </div>

    <button class="btn-start" id="startBtn" onclick="runTimeline()">Çemberi Yuvarla</button>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const mTitle = document.getElementById('mTitle');
        const mSub = document.getElementById('mSub');
        const startBtn = document.getElementById('startBtn');
        const wC = document.getElementById('wC');
        const whl = document.getElementById('whl');
        const uLine = document.getElementById('uLine');
        const ruler = document.getElementById('ruler');
        const dCopies = document.getElementById('dCopies');
        
        async function runTimeline() {
            startBtn.style.display = 'none';

            // Reset
            wC.style.transition = 'none';
            whl.style.transition = 'none';
            uLine.style.transition = 'none';
            
            wC.style.transform = 'translateX(0)';
            whl.style.transform = 'rotate(0deg)';
            uLine.style.width = '0px';
            ruler.style.opacity = 0;
            dCopies.style.opacity = 0;

            await sleep(100);

            // Turn on transitions
            wC.style.transition = 'all 4s linear';
            whl.style.transition = 'all 4s linear';
            uLine.style.transition = 'width 4s linear';

            mTitle.innerText = "Tam 1 Tur Dönüyor";
            mSub.innerHTML = "Kırmızı nokta yere değene kadar ilerlediğinde, kendi <span>Çevre Uzunluğu</span> kadar yol almış olur.";

            // Start rolling (distance = PI * 100 = 314px)
            wC.style.transform = 'translateX(314px)'; // Move right
            whl.style.transform = 'rotate(360deg)'; // Spin
            uLine.style.width = '314px'; // Draw trail

            await sleep(4500);

            mTitle.innerText = "Yol Bitti. Peki Ne Kadar?";
            mSub.innerHTML = "Çizilen bu mavi yol, çemberin tam uzunluğudur (Çevresi).";
            
            ruler.style.opacity = 1;
            await sleep(3000);

            mTitle.innerText = "Çap İle Karşılaştıralım";
            mSub.innerHTML = "Bu uzunluğun içine çemberin kendi çapından (sarı çizgi) tam <span>3 tane</span> sığıyor, artı biraz da artıyor!";
            
            dCopies.style.opacity = 1;
            await sleep(4000);

            mTitle.innerText = "İşte Pi (π) Sayısı!";
            mSub.innerHTML = "Hangi çemberi denerseniz deneyin sonuç değişmez: <span>Çevre / Çap = 3,14159... (π)</span>";

            setTimeout(() => {
                startBtn.style.display = 'block';
                startBtn.innerText = "Tekrar İzle";
            }, 6000);
        }
    </script>
</body>
</html>
