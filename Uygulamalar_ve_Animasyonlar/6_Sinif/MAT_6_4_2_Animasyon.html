<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alan Formüllerinin Sırrı - Animasyon</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F172A; --text: #F8FAFC;
            --primary: #3B82F6; --secondary: #10B981;
            --tertiary: #F59E0B; --danger: #F43F5E;
            --purple: #8B5CF6; --cyan: #06B6D4;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px;
        }

        .header {
            width: 100%; max-width: 900px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--secondary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area { text-align: center; width: 100%; max-width: 800px; margin-bottom: 20px; height: 110px;}
        h1 { font-size: 2.2rem; color: var(--secondary); text-shadow: 0 5px 15px rgba(0,0,0,0.5); line-height: 1.3;}
        .subtitle { font-size: 1.2rem; color: #94A3B8; margin-top: 10px; line-height: 1.5; min-height: 55px;}
        .subtitle span { color: white; font-weight: 800; background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 5px;}

        .canvas-area {
            position: relative; width: 100%; max-width: 800px; height: 450px; 
            background: #0B1120; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.3); 
            overflow: hidden; display: flex; align-items: center; justify-content: center;
        }

        .base-shape {
            position: absolute; fill: rgba(16, 185, 129, 0.2); stroke: var(--secondary); stroke-width: 4;
            transition: all 1.5s ease-in-out;
        }
        
        .cut-part {
            position: absolute; fill: rgba(16, 185, 129, 0.4); stroke: var(--secondary); stroke-width: 4;
            transition: all 1.5s ease-in-out;
        }

        .formula-box {
            position: absolute; bottom: 30px; background: rgba(0,0,0,0.7); border: 2px solid white;
            padding: 10px 25px; border-radius: 15px; font-size: 1.5rem; font-weight: 900; color: white;
            opacity: 0; transition: opacity 0.5s; text-align: center;
        }

        .labels {
            position: absolute; font-size: 1.2rem; font-weight: 900; color: white; opacity: 0; transition: opacity 0.5s;
        }

        .btn-start {
            margin-top: 30px; background: var(--secondary); color: white; border: none; padding: 15px 40px; border-radius: 50px;
            font-size: 1.2rem; font-weight: 800; cursor: pointer; transition: all 0.3s; box-shadow: 0 10px 20px rgba(16, 185, 129, 0.4);
        }
        .btn-start:hover { transform: scale(1.05); }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=3B82F6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.6.4.2. Alan Formüllerinin Sırrı</div>
    </div>

    <div class="title-area">
        <h1 id="mTitle">Her Şeyin Başı Dikdörtgen</h1>
        <p class="subtitle" id="mSub">Bütün alan formülleri aslında bir yapboz gibi <span>Dikdörtgen</span>'den türetilmiştir.</p>
    </div>

    <div class="canvas-area">
        <svg width="800" height="450" style="position: absolute; top:0; left:0;">
            <!-- Base shape (Main body) -->
            <polygon class="base-shape" id="mainPoly" points="250,150 550,150 550,300 250,300" />
            <!-- Cut part (used for transformation) -->
            <polygon class="cut-part" id="cutPoly" points="250,150 250,150 250,300 250,300" style="opacity: 0;" />
            <!-- Diagonal cut for triangle -->
            <polygon class="cut-part" id="diagPoly" points="0,0 0,0 0,0" style="fill:rgba(59,130,246,0.3); stroke:var(--primary); opacity:0;" />
        </svg>

        <div class="labels" id="lblBase" style="top: 310px; left: 380px;">Taban (a)</div>
        <div class="labels" id="lblHeight" style="top: 210px; left: 190px;">Yükseklik (h)</div>
        
        <div class="formula-box" id="fBox">Alan = a x h</div>

    </div>

    <button class="btn-start" id="startBtn" onclick="runTimeline()">Keşfe Başla</button>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const mTitle = document.getElementById('mTitle');
        const mSub = document.getElementById('mSub');
        const startBtn = document.getElementById('startBtn');
        const mainPoly = document.getElementById('mainPoly');
        const cutPoly = document.getElementById('cutPoly');
        const diagPoly = document.getElementById('diagPoly');
        
        async function runTimeline() {
            startBtn.style.display = 'none';

            // Reset to Rectangle
            mainPoly.setAttribute('points', '250,150 550,150 550,300 250,300');
            mainPoly.style.fill = 'rgba(16, 185, 129, 0.2)';
            mainPoly.style.stroke = 'var(--secondary)';
            cutPoly.style.opacity = 0;
            diagPoly.style.opacity = 0;
            document.getElementById('fBox').style.opacity = 0;
            document.getElementById('lblBase').style.opacity = 0;
            document.getElementById('lblHeight').style.opacity = 0;

            await sleep(1000);

            // Step 1: Rectangle
            mTitle.innerText = "Temel Kural: Dikdörtgen";
            mSub.innerHTML = "Dikdörtgenin alanı <span>Taban x Yükseklik</span> (Kısa kenar x Uzun kenar) formülüyle bulunur.";
            
            document.getElementById('lblBase').style.opacity = 1;
            document.getElementById('lblHeight').style.opacity = 1;
            document.getElementById('fBox').innerText = "Alan = a x h";
            document.getElementById('fBox').style.borderColor = "var(--secondary)";
            document.getElementById('fBox').style.opacity = 1;

            await sleep(4000);

            // Step 2: Parallelogram transformation (Cut and Move)
            mTitle.innerText = "Paralelkenara Dönüşüm";
            mSub.innerHTML = "Dikdörtgenin bir ucundan kestiğimiz üçgeni diğer uca eklersek ne olur? Alan <span>değişmez!</span>";
            
            // Show the cut piece on the left
            cutPoly.setAttribute('points', '250,150 350,300 250,300'); // triangle to cut
            cutPoly.style.opacity = 1;
            // Update main body to trapezoid
            mainPoly.setAttribute('points', '250,150 550,150 550,300 350,300');
            
            await sleep(2000);
            
            // Move the cut piece to the right
            cutPoly.setAttribute('points', '550,150 650,300 550,300');
            
            await sleep(2000);

            mSub.innerHTML = "Şekil <span>Paralelkenar</span> oldu ama kapladığı yer (alan) hala aynı. O yüzden formülü de aynı: <span>Taban x Yükseklik</span>";
            document.getElementById('lblBase').style.left = "430px";
            await sleep(4000);

            // Step 3: Triangle transformation
            mTitle.innerText = "Sıra Üçgende!";
            mSub.innerHTML = "Peki elimizdeki bu şekli tam köşegeninden ikiye bölersek ne olur?";
            
            // Transform back to simple rectangle for ease of splitting visual
            cutPoly.style.opacity = 0;
            mainPoly.setAttribute('points', '250,150 550,150 550,300 250,300');
            document.getElementById('lblBase').style.left = "380px";
            
            await sleep(2000);

            // Split into two triangles
            // Bottom-left triangle
            mainPoly.setAttribute('points', '250,150 550,300 250,300');
            mainPoly.style.fill = 'rgba(59, 130, 246, 0.2)';
            mainPoly.style.stroke = 'var(--primary)';
            
            // Top-right triangle (slides away)
            diagPoly.setAttribute('points', '250,150 550,150 550,300');
            diagPoly.style.opacity = 1;

            await sleep(1000);
            // Slide top-right triangle up and fade
            diagPoly.setAttribute('points', '270,110 570,110 570,260');
            diagPoly.style.opacity = 0;

            await sleep(1500);

            mTitle.innerText = "Üçgenin Alanı";
            mSub.innerHTML = "Dikdörtgen tam ortadan iki eş üçgene ayrıldı! Yani üçgenin alanı, dikdörtgenin alanının <span>YARISIDIR.</span>";
            
            document.getElementById('fBox').innerHTML = "Alan = <span style='font-size:1.2rem;'>(Taban x Yükseklik)</span> / 2";
            document.getElementById('fBox').style.borderColor = "var(--primary)";

            setTimeout(() => {
                startBtn.style.display = 'block';
                startBtn.innerText = "Tekrar İzle";
            }, 5000);
        }
    </script>
</body>
</html>
