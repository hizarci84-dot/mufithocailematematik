<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Açı ve Yay Uzunluğu - Animasyon</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F172A; --text: #F8FAFC;
            --primary: #3B82F6; --secondary: #10B981;
            --tertiary: #F59E0B; --danger: #F43F5E;
            --purple: #8B5CF6; --cyan: #06B6D4;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px;
        }

        .header {
            width: 100%; max-width: 900px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--tertiary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area { text-align: center; width: 100%; max-width: 800px; margin-bottom: 20px; height: 110px;}
        h1 { font-size: 2.2rem; color: var(--tertiary); text-shadow: 0 5px 15px rgba(0,0,0,0.5); line-height: 1.3;}
        .subtitle { font-size: 1.2rem; color: #94A3B8; margin-top: 10px; line-height: 1.5; min-height: 55px;}
        .subtitle span { color: white; font-weight: 800; background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 5px;}

        .canvas-area {
            position: relative; width: 100%; max-width: 800px; height: 450px; 
            background: #0B1120; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.3); 
            overflow: hidden; display: flex; align-items: center; justify-content: center;
        }

        .circle-base {
            fill: rgba(255,255,255,0.05); stroke: rgba(255,255,255,0.2); stroke-width: 4;
        }
        .center-dot { fill: white; }

        .pizza-slice {
            fill: rgba(245, 158, 11, 0.3); stroke: var(--tertiary); stroke-width: 2; transition: all 1s; opacity: 0;
        }
        .arc-highlight {
            fill: none; stroke: var(--danger); stroke-width: 8; transition: stroke-dasharray 1s linear; stroke-dasharray: 0 2000;
        }

        .info-panel {
            position: absolute; right: 20px; top: 20px; background: rgba(0,0,0,0.8);
            border: 2px solid var(--tertiary); border-radius: 15px; padding: 20px; width: 220px;
            color: white; font-size: 1.1rem; opacity: 0; transition: opacity 1s; transform: translateX(50px);
        }
        .info-panel.show { opacity: 1; transform: translateX(0); }
        .ip-row { margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        .ip-val { font-size: 1.5rem; font-weight: 900; color: white; display: block; margin-top: 5px;}

        .btn-start {
            margin-top: 30px; background: var(--tertiary); color: white; border: none; padding: 15px 40px; border-radius: 50px;
            font-size: 1.2rem; font-weight: 800; cursor: pointer; transition: all 0.3s; box-shadow: 0 10px 20px rgba(245, 158, 11, 0.4);
        }
        .btn-start:hover { transform: scale(1.05); }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=3B82F6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.6.4.6. Açı ve Yay Uzunluğu</div>
    </div>

    <div class="title-area">
        <h1 id="mTitle">Pizza Dilimi Kuralı</h1>
        <p class="subtitle" id="mSub">Bir çemberin tamamı 360 derecedir. Peki bir dilimin kenar (yay) uzunluğu neye bağlıdır?</p>
    </div>

    <div class="canvas-area">
        
        <svg width="800" height="450" style="position: absolute; top:0; left:0;">
            <circle cx="250" cy="225" r="150" class="circle-base" />
            
            <!-- Slice Path -->
            <path id="slice" class="pizza-slice" d="M 250 225 L 400 225 A 150 150 0 0 1 250 375 Z" />
            
            <!-- Arc Highlight -->
            <!-- Circumference of r=150 is 2*pi*150 = 942.47 -->
            <!-- 90 deg = 942.47/4 = 235.61 -->
            <path id="arc" class="arc-highlight" d="M 400 225 A 150 150 0 0 1 250 375" />

            <!-- Labels in SVG -->
            <text id="lblAngle" x="270" y="250" fill="white" font-weight="900" font-size="20px" style="opacity:0; transition:0.5s;">90°</text>

            <circle cx="250" cy="225" r="5" class="center-dot" />
        </svg>

        <div class="info-panel" id="panel">
            <div class="ip-row">
                Tüm Çevre (360°)
                <span class="ip-val" style="color:var(--secondary);">120 cm</span>
            </div>
            <div class="ip-row" id="r1" style="opacity:0; transition: 1s;">
                Oran (Kesir)
                <span class="ip-val" id="v1" style="color:var(--primary);">?</span>
            </div>
            <div class="ip-row" id="r2" style="opacity:0; transition: 1s; border:none;">
                Yay Uzunluğu
                <span class="ip-val" id="v2" style="color:var(--danger); font-size: 2rem;">?</span>
            </div>
        </div>

    </div>

    <button class="btn-start" id="startBtn" onclick="runTimeline()">Analiz Et</button>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const mTitle = document.getElementById('mTitle');
        const mSub = document.getElementById('mSub');
        const startBtn = document.getElementById('startBtn');
        const slice = document.getElementById('slice');
        const arc = document.getElementById('arc');
        const lblAngle = document.getElementById('lblAngle');
        
        async function runTimeline() {
            startBtn.style.display = 'none';

            // Reset
            slice.style.opacity = 0;
            arc.style.strokeDasharray = "0 2000";
            lblAngle.style.opacity = 0;
            document.getElementById('panel').classList.remove('show');
            document.getElementById('r1').style.opacity = 0;
            document.getElementById('r2').style.opacity = 0;

            await sleep(500);

            // Intro
            mTitle.innerText = "Yarım Çember (180°)";
            mSub.innerHTML = "Açımız 180° olduğunda, bu 360'ın <span>yarısıdır</span> (1/2). Yani çemberin yarısı kaplanır.";
            
            // Draw 180 slice
            slice.setAttribute('d', 'M 250 225 L 400 225 A 150 150 0 0 1 100 225 Z');
            arc.setAttribute('d', 'M 400 225 A 150 150 0 0 1 100 225');
            slice.style.opacity = 1;
            
            lblAngle.innerText = "180°";
            lblAngle.setAttribute('x', '220');
            lblAngle.setAttribute('y', '270');
            lblAngle.style.opacity = 1;

            document.getElementById('panel').classList.add('show');
            await sleep(1000);
            
            arc.style.strokeDasharray = "471.23 2000"; // Pi*150
            await sleep(1500);

            document.getElementById('r1').style.opacity = 1;
            document.getElementById('v1').innerText = "180 / 360 = 1/2";
            await sleep(1000);
            
            document.getElementById('r2').style.opacity = 1;
            document.getElementById('v2').innerText = "120 ÷ 2 = 60 cm";
            
            await sleep(4000);

            // 90 degrees
            mTitle.innerText = "Çeyrek Çember (90°)";
            mSub.innerHTML = "Açımız 90° olduğunda, bu 360'ın <span>çeyreğidir</span> (1/4).";
            
            // Draw 90 slice
            slice.setAttribute('d', 'M 250 225 L 400 225 A 150 150 0 0 1 250 375 Z');
            arc.setAttribute('d', 'M 400 225 A 150 150 0 0 1 250 375');
            arc.style.strokeDasharray = "0 2000";
            lblAngle.innerText = "90°";
            lblAngle.setAttribute('x', '260');
            lblAngle.setAttribute('y', '250');
            
            document.getElementById('r1').style.opacity = 0;
            document.getElementById('r2').style.opacity = 0;
            
            await sleep(1500);
            
            arc.style.strokeDasharray = "235.61 2000"; // Pi*150/2
            await sleep(1500);

            document.getElementById('r1').style.opacity = 1;
            document.getElementById('v1').innerText = "90 / 360 = 1/4";
            await sleep(1000);
            
            document.getElementById('r2').style.opacity = 1;
            document.getElementById('v2').innerText = "120 ÷ 4 = 30 cm";

            await sleep(4000);

            // Summary
            mTitle.innerText = "Orantı Kuralı";
            mSub.innerHTML = "Merkez açı, tam açı (360) içinde <span>hangi orana sahipse</span>; Gördüğü yay da, çevre uzunluğunun <span>o kadarıdır!</span>";

            setTimeout(() => {
                startBtn.style.display = 'block';
                startBtn.innerText = "Tekrar İzle";
            }, 5000);
        }
    </script>
</body>
</html>
