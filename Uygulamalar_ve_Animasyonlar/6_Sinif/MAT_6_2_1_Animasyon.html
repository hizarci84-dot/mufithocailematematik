<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cebirsel İfadeler - Animasyon</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F172A; --text: #F8FAFC;
            --primary: #3B82F6; --secondary: #10B981;
            --tertiary: #F59E0B; --danger: #F43F5E;
            --purple: #8B5CF6; --cyan: #06B6D4;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px;
        }

        .header {
            width: 100%; max-width: 900px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--tertiary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area { text-align: center; width: 100%; max-width: 800px; margin-bottom: 20px; height: 110px;}
        h1 { font-size: 2.2rem; color: var(--tertiary); text-shadow: 0 5px 15px rgba(0,0,0,0.5); line-height: 1.3;}
        .subtitle { font-size: 1.2rem; color: #94A3B8; margin-top: 10px; line-height: 1.5; min-height: 55px;}
        .subtitle span { color: white; font-weight: 800; background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 5px;}

        .canvas-area {
            position: relative; width: 100%; max-width: 800px; height: 450px; 
            background: #0B1120; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.3); 
            overflow: hidden; display: flex; align-items: center; justify-content: center;
        }

        .scene { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.8s; pointer-events: none;}
        .scene.active { opacity: 1; z-index: 10; }

        /* SCENE 1 */
        .box-container { display: flex; align-items: center; gap: 20px; margin-bottom: 30px;}
        .mystery-box {
            width: 100px; height: 100px; background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 15px; display: flex; align-items: center; justify-content: center;
            font-size: 4rem; font-weight: 900; color: white; box-shadow: 0 10px 20px rgba(139, 92, 246, 0.4);
            border: 4px solid #a78bfa; position: relative; transition: all 0.5s;
        }
        .box-lid {
            position: absolute; top: -10px; width: 110px; height: 20px; background: #a78bfa;
            border-radius: 10px; transition: transform 0.5s; transform-origin: left center;
        }
        .mystery-box.open .box-lid { transform: rotate(-100deg); }

        .item-plus { font-size: 4rem; color: white; font-weight: 900; opacity: 0; transform: scale(0.5); transition: all 0.5s;}
        .item-coin { font-size: 3rem; background: var(--tertiary); color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 4px solid #fbbf24; opacity: 0; transform: translateY(-50px); transition: all 0.5s;}

        .eq-text { font-size: 4rem; font-weight: 900; color: white; display: flex; gap: 10px; opacity:0; transition: opacity 0.5s;}
        .var-x { color: var(--purple); }
        .const-val { color: var(--tertiary); }

        /* SCENE 2 */
        .person-container { display: flex; align-items: flex-end; gap: 50px; margin-bottom: 30px; height: 200px;}
        .person { display: flex; flex-direction: column; align-items: center; gap: 10px;}
        .p-icon { font-size: 5rem; line-height: 1; transition: all 0.5s;}
        .p-name { font-size: 1.5rem; font-weight: 900; color: white;}
        .p-age { font-size: 1.2rem; color: #94A3B8; font-weight: 600; background: rgba(255,255,255,0.1); padding: 5px 15px; border-radius: 20px; opacity:0; transition: all 0.5s;}

        .btn-start {
            margin-top: 30px; background: var(--tertiary); color: white; border: none; padding: 15px 40px; border-radius: 50px;
            font-size: 1.2rem; font-weight: 800; cursor: pointer; transition: all 0.3s; box-shadow: 0 10px 20px rgba(245, 158, 11, 0.4);
        }
        .btn-start:hover { transform: scale(1.05); }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=3B82F6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.6.2.1. Cebirsel İfadeler</div>
    </div>

    <div class="title-area">
        <h1 id="mTitle">Bilinmeyenin Peşinde: Cebir</h1>
        <p class="subtitle" id="mSub">Bazen matematikte bir sayıyı tam olarak bilemeyiz. O zaman imdadımıza <span>Değişkenler (Harfler)</span> yetişir!</p>
    </div>

    <div class="canvas-area">
        
        <!-- SCENE 1 -->
        <div class="scene active" id="sc1">
            <div class="box-container">
                <div class="mystery-box" id="mBox">
                    <div class="box-lid"></div>
                    ?
                </div>
                <div class="item-plus" id="iPlus">+</div>
                <div class="item-coin" id="iCoin1">1</div>
                <div class="item-coin" id="iCoin2">1</div>
                <div class="item-coin" id="iCoin3">1</div>
            </div>
            
            <div class="eq-text" id="eq1">
                <span class="var-x">x</span> + <span class="const-val">3</span>
            </div>
        </div>

        <!-- SCENE 2 -->
        <div class="scene" id="sc2">
            <div class="person-container">
                <div class="person" id="p1">
                    <div class="p-icon">👧</div>
                    <div class="p-name">Ayşe</div>
                    <div class="p-age" id="age1">Yaşı: <b>x</b></div>
                </div>
                <div class="person" id="p2">
                    <div class="p-icon" style="font-size: 7rem;">👦</div>
                    <div class="p-name">Ali</div>
                    <div class="p-age" id="age2">Yaşı: <b>x + 5</b></div>
                </div>
            </div>
            <div style="font-size:1.5rem; color:var(--tertiary); font-weight:800; text-align:center; opacity:0; transition:all 0.5s;" id="msg2">Ali'nin yaşı Ayşe'nin yaşından 5 fazladır.</div>
        </div>

    </div>

    <button class="btn-start" id="startBtn" onclick="runTimeline()">Animasyonu Başlat</button>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const mTitle = document.getElementById('mTitle');
        const mSub = document.getElementById('mSub');
        const startBtn = document.getElementById('startBtn');
        
        async function runTimeline() {
            startBtn.style.display = 'none';

            // SCENE 1
            document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
            document.getElementById('sc1').classList.add('active');
            
            mTitle.innerText = "Kutunun İçinde Ne Var?";
            mSub.innerHTML = "İçinde ne kadar altın olduğunu bilmediğimiz bu Gizemli Kutu'ya matematikte <span>'x'</span> deriz.";
            
            await sleep(2500);
            document.getElementById('mBox').innerHTML = `<div class="box-lid"></div>x`;
            
            await sleep(1500);
            mTitle.innerText = "Kutuya Eklenenler";
            mSub.innerHTML = "Diyelim ki bu kutunun yanına <span>3 tane daha</span> altın koyduk.";
            
            document.getElementById('iPlus').style.opacity = 1;
            document.getElementById('iPlus').style.transform = "scale(1)";
            
            await sleep(500);
            document.getElementById('iCoin1').style.opacity = 1;
            document.getElementById('iCoin1').style.transform = "translateY(0)";
            await sleep(300);
            document.getElementById('iCoin2').style.opacity = 1;
            document.getElementById('iCoin2').style.transform = "translateY(0)";
            await sleep(300);
            document.getElementById('iCoin3').style.opacity = 1;
            document.getElementById('iCoin3').style.transform = "translateY(0)";
            
            await sleep(1500);
            mTitle.innerText = "Cebirsel İfade Doğuyor";
            mSub.innerHTML = "İşte bu durumun matematikçesi: <span>Kutunun içindekiler (x) + Dışarıdakiler (3)</span>";
            document.getElementById('eq1').style.opacity = 1;

            await sleep(4000);

            // SCENE 2
            document.getElementById('sc1').classList.remove('active');
            document.getElementById('sc2').classList.add('active');
            
            mTitle.innerText = "Günlük Hayattan Cebire";
            mSub.innerHTML = "Gerçek hayattaki bilinmezlikleri de harflerle modelleriz.";
            
            await sleep(2000);
            document.getElementById('msg2').style.opacity = 1;
            
            await sleep(1500);
            document.getElementById('age1').style.opacity = 1;
            mSub.innerHTML = "Ayşe'nin yaşını bilmediğimiz için ona <span>'x'</span> diyoruz.";
            
            await sleep(2500);
            document.getElementById('age2').style.opacity = 1;
            mSub.innerHTML = "Ali ondan 5 yaş büyük olduğu için, Ali'nin yaşı otomatik olarak <span>'x + 5'</span> olur!";

            setTimeout(() => {
                startBtn.style.display = 'block';
                startBtn.innerText = "Tekrar İzle";
            }, 4000);
        }
    </script>
</body>
</html>
