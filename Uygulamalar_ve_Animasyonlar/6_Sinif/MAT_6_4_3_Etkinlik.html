<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mimarlık Ofisi</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F172A; --surface: #1E293B; --text: #F8FAFC;
            --primary: #3B82F6; --secondary: #10B981;
            --tertiary: #F59E0B; --danger: #F43F5E;
            --purple: #8B5CF6; --cyan: #06B6D4;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, var(--bg) 0%, var(--surface) 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px;
        }

        .header {
            width: 100%; max-width: 1000px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--cyan); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .container {
            width: 100%; max-width: 900px; display: flex; gap: 20px;
        }

        .blueprint-panel {
            flex: 1.5; background: #0B1120; border-radius: 20px; border: 2px solid var(--primary);
            position: relative; overflow: hidden; height: 450px;
            background-image: linear-gradient(rgba(59, 130, 246, 0.2) 1px, transparent 1px),
            linear-gradient(90deg, rgba(59, 130, 246, 0.2) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .bp-title {
            position: absolute; top: 10px; left: 15px; font-weight: 900; color: var(--primary); font-size: 1.2rem;
            text-transform: uppercase; letter-spacing: 2px;
        }

        .calc-panel {
            flex: 1; background: rgba(255,255,255,0.03); border-radius: 20px; padding: 25px;
            border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex; flex-direction: column; gap: 15px;
        }

        .calc-panel h2 { font-size: 1.8rem; color: var(--cyan); margin-bottom: 5px; font-weight: 900;}
        .desc { font-size: 0.95rem; color: #94A3B8; margin-bottom: 15px; line-height: 1.4;}

        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-weight: 600; font-size: 1rem; color: white;}
        .input-wrapper { display: flex; align-items: center; gap: 10px; }
        .input-wrapper input {
            background: rgba(0,0,0,0.5); border: 2px solid #334155; color: white;
            font-size: 1.2rem; font-weight: 800; padding: 10px; border-radius: 8px; width: 120px; outline: none; transition: 0.3s;
        }
        .input-wrapper input:focus { border-color: var(--cyan); }
        .unit { font-weight: 800; color: #94A3B8; }

        .btn-check {
            background: var(--cyan); color: white; border: none; padding: 15px; border-radius: 10px;
            font-size: 1.2rem; font-weight: 900; cursor: pointer; transition: all 0.3s; margin-top: 10px;
        }
        .btn-check:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(6,182,212,0.4);}

        .feedback { font-size: 1rem; font-weight: 800; padding: 10px; border-radius: 8px; display: none; text-align: center;}
        .feedback.error { background: rgba(244, 63, 94, 0.1); color: var(--danger); border: 1px solid var(--danger); display: block;}
        .feedback.success { background: rgba(16, 185, 129, 0.1); color: var(--secondary); border: 1px solid var(--secondary); display: block;}

        /* SVG Styles */
        .room-poly { fill: rgba(255,255,255,0.1); stroke: white; stroke-width: 3; transition: 0.3s;}
        .room-poly:hover { fill: rgba(59, 130, 246, 0.3); }
        .bp-lbl { font-size: 1rem; font-weight: 800; fill: #94A3B8; }
        .bp-val { font-size: 1.2rem; font-weight: 900; fill: white; }

        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .blueprint-panel { height: 350px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=3B82F6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.6.4.3. Mimarlık Ofisi</div>
    </div>

    <div class="container">
        
        <div class="blueprint-panel">
            <div class="bp-title">PROJE: VİLLA ZEMİNİ</div>
            
            <svg width="100%" height="100%" style="position:absolute; top:0; left:0;">
                
                <!-- Living Room (Parallelogram) -->
                <!-- Points: 100,100 -> 350,100 -> 300,300 -> 50,300 -->
                <polygon class="room-poly" points="100,100 350,100 300,300 50,300" />
                <text x="140" y="210" fill="white" font-weight="900" font-size="24px">SALON</text>
                
                <!-- Kitchen (Triangle) attached to right side of living room -->
                <!-- Points: 350,100 -> 500,200 -> 300,300 -->
                <polygon class="room-poly" points="350,100 500,200 300,300" />
                <text x="360" y="210" fill="white" font-weight="900" font-size="20px">MUTFAK</text>

                <!-- Measurements -->
                <!-- Living room Base -->
                <line x1="50" y1="320" x2="300" y2="320" stroke="var(--primary)" stroke-width="2" />
                <text class="bp-val" x="150" y="340" fill="var(--primary)">12 m</text>
                
                <!-- Living room Height -->
                <line x1="100" y1="100" x2="100" y2="300" stroke="var(--danger)" stroke-width="2" stroke-dasharray="4" />
                <text class="bp-val" x="40" y="190" fill="var(--danger)">8 m</text>

                <!-- Kitchen Height (from base 350,100-300,300 ... wait, let's make it simpler: base is the vertical-like side? No, let's draw height horizontally) -->
                <!-- The rightmost point of triangle is 500,200. The intersection of height with 350,100-300,300 is roughly x=325, y=200 -->
                <line x1="325" y1="200" x2="500" y2="200" stroke="var(--tertiary)" stroke-width="2" stroke-dasharray="4" />
                <text class="bp-val" x="400" y="190" fill="var(--tertiary)">7 m</text>
                
                <!-- Kitchen Base (The shared side doesn't have a simple vertical length. Let's add a label specifically for the shared border as the 'base') -->
                <text class="bp-val" x="290" y="160" fill="var(--tertiary)" transform="rotate(-76 350,100)">Taban = 10 m</text>
                <!-- To avoid math confusion in UI, let's explicitly label the Kitchen Base next to the line -->
                <text class="bp-lbl" x="325" y="140" fill="white">Ortak Duvar: 10m</text>

            </svg>
        </div>

        <div class="calc-panel">
            <h2>Maliyet Raporu</h2>
            <p class="desc">Zemine <b>metrekaresi 300 TL</b> olan özel parke döşenecektir. Raporu doldurarak müşteriye toplam fiyatı çıkarınız.</p>
            
            <div class="input-group">
                <label>1. Salon Alanı (Paralelkenar)</label>
                <div class="input-wrapper">
                    <input type="number" id="inp1" placeholder="..."> <span class="unit">m²</span>
                </div>
            </div>

            <div class="input-group">
                <label>2. Mutfak Alanı (Üçgen)</label>
                <div class="input-wrapper">
                    <input type="number" id="inp2" placeholder="..."> <span class="unit">m²</span>
                </div>
            </div>

            <div class="input-group">
                <label>3. Toplam Alan</label>
                <div class="input-wrapper">
                    <input type="number" id="inp3" placeholder="..."> <span class="unit">m²</span>
                </div>
            </div>

            <div class="input-group" style="margin-top:10px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px;">
                <label style="color:var(--secondary); font-size: 1.2rem;">TOPLAM MALİYET</label>
                <div class="input-wrapper">
                    <input type="number" id="inp4" placeholder="..." style="width: 150px; border-color: var(--secondary);"> <span class="unit" style="color:var(--secondary);">TL</span>
                </div>
            </div>

            <button class="btn-check" onclick="checkReport()">Raporu Onayla</button>
            <div class="feedback" id="fb"></div>

        </div>

    </div>

    <script>
        // Correct answers
        const ans1 = 12 * 8; // 96
        const ans2 = (10 * 7) / 2; // 35
        const ans3 = ans1 + ans2; // 131
        const costPerM2 = 300;
        const ans4 = ans3 * costPerM2; // 39300

        function checkReport() {
            let v1 = parseInt(document.getElementById('inp1').value);
            let v2 = parseInt(document.getElementById('inp2').value);
            let v3 = parseInt(document.getElementById('inp3').value);
            let v4 = parseInt(document.getElementById('inp4').value);
            let fb = document.getElementById('fb');

            if(isNaN(v1) || isNaN(v2) || isNaN(v3) || isNaN(v4)) {
                fb.className = "feedback error";
                fb.innerText = "Lütfen tüm alanları doldurunuz.";
                return;
            }

            if(v1 === ans1 && v2 === ans2 && v3 === ans3 && v4 === ans4) {
                fb.className = "feedback success";
                fb.innerHTML = "<b>Harika İş!</b><br>Tüm hesaplamalar doğru. Müşteriye fiyat teklifi başarıyla sunuldu.";
                document.querySelectorAll('input').forEach(inp => {
                    inp.style.borderColor = "var(--secondary)";
                    inp.disabled = true;
                });
                document.querySelector('.btn-check').style.display = "none";
            } else {
                let msg = "Bazı hatalar var:<br>";
                if(v1 !== ans1) msg += "- Salon alanında hata var (Taban x Yükseklik).<br>";
                if(v2 !== ans2) msg += "- Mutfak alanında hata var (Taban x Yükseklik / 2).<br>";
                if(v1 === ans1 && v2 === ans2 && v3 !== ans3) msg += "- Toplama işlemini kontrol et.<br>";
                if(v3 === ans3 && v4 !== ans4) msg += "- Toplam maliyeti m² fiyatı ile çarpmayı unutma.<br>";
                
                fb.className = "feedback error";
                fb.innerHTML = msg;
            }
        }
    </script>
</body>
</html>
