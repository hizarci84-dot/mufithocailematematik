<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kesişim Laboratuvarı</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F172A; --surface: #1E293B; --text: #F8FAFC;
            --primary: #3B82F6; --secondary: #10B981;
            --tertiary: #F59E0B; --danger: #F43F5E;
            --purple: #8B5CF6; --cyan: #06B6D4;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, var(--bg) 0%, var(--surface) 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px;
        }

        .header {
            width: 100%; max-width: 1000px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--cyan); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .container {
            width: 100%; max-width: 1000px; display: flex; flex-direction: column; gap: 20px;
        }

        .input-panel {
            background: rgba(255,255,255,0.03); border-radius: 20px; padding: 30px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: center;
        }

        .input-panel h2 { font-size: 1.8rem; color: var(--cyan); margin-bottom: 20px; font-weight: 900;}

        .input-group { display: flex; justify-content: center; gap: 15px; align-items: center;}
        input[type="number"] {
            background: #0B1120; border: 2px solid var(--cyan); color: white;
            font-size: 2rem; font-weight: 900; width: 120px; text-align: center; padding: 10px; border-radius: 15px;
            outline: none; transition: all 0.3s;
        }
        input[type="number"]:focus { box-shadow: 0 0 15px rgba(6, 182, 212, 0.3);}
        
        .btn-calc {
            background: var(--cyan); color: white; border: none; padding: 15px 30px; border-radius: 15px;
            font-size: 1.2rem; font-weight: 900; cursor: pointer; transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(6, 182, 212, 0.4);
        }
        .btn-calc:hover { transform: translateY(-2px); box-shadow: 0 15px 25px rgba(6, 182, 212, 0.6); }

        /* Tabs */
        .tabs { display: flex; gap: 10px; justify-content: center; margin-top: 20px;}
        .tab-btn {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: #94A3B8; padding: 10px 25px; border-radius: 15px; font-size: 1.1rem; font-weight: 800;
            cursor: pointer; transition: all 0.3s;
        }
        .tab-btn.active { background: var(--cyan); color: white; border-color: var(--cyan); box-shadow: 0 5px 15px rgba(6,182,212,0.3);}
        
        /* Results Area */
        .tab-content {
            background: rgba(255,255,255,0.02); border-radius: 20px; padding: 30px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2); display: none; flex-direction: column; gap: 20px;
        }
        .tab-content.active { display: flex; animation: fadeIn 0.5s;}
        @keyframes fadeIn { from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)} }

        .list-row { display: flex; align-items: center; gap: 15px;}
        .lr-label { font-size: 1.5rem; font-weight: 900; width: 100px; text-align: right; color: #94A3B8;}
        
        .lr-items { display: flex; flex-wrap: wrap; gap: 8px;}
        .item-box {
            background: rgba(0,0,0,0.3); color: white; padding: 8px 15px; border-radius: 8px; font-size: 1.2rem; font-weight: 800; border: 1px solid rgba(255,255,255,0.1); transition: all 0.3s;
        }
        .item-box.common {
            background: var(--tertiary); color: white; border-color: var(--tertiary); box-shadow: 0 0 15px rgba(245, 158, 11, 0.5); transform: scale(1.1); z-index: 10;
        }
        
        .result-msg {
            background: rgba(245, 158, 11, 0.1); color: var(--tertiary); padding: 15px; text-align: center; font-size: 1.2rem; font-weight: 800; border-radius: 10px; margin-top: 10px; border: 1px dashed var(--tertiary);
        }

        @media (max-width: 768px) {
            .header { flex-direction: column; gap: 10px; }
            .input-group { flex-direction: column; }
            .list-row { flex-direction: column; text-align: center; }
            .lr-label { text-align: center; width: 100%;}
            .lr-items { justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=3B82F6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.6.1.4. Kesişim Laboratuvarı</div>
    </div>

    <div class="container">
        
        <div class="input-panel">
            <h2>🔗 İki Sayıyı Karşılaştır!</h2>
            <div class="input-group">
                <input type="number" id="num1" min="2" max="100" value="12">
                <span style="font-size: 1.5rem; color:#94A3B8; font-weight:900;">ve</span>
                <input type="number" id="num2" min="2" max="100" value="18">
                <button class="btn-calc" onclick="calculate()">Kesişimi Bul ➔</button>
            </div>
            
            <div class="tabs" id="tabsContainer" style="display:none;">
                <button class="tab-btn active" onclick="switchTab(1)">Ortak Bölenler (Çarpanlar)</button>
                <button class="tab-btn" onclick="switchTab(2)">Ortak Katlar</button>
            </div>
        </div>

        <!-- TAB 1: Bölenler -->
        <div class="tab-content" id="tab1">
            <div class="list-row">
                <div class="lr-label" id="l1_n1">12:</div>
                <div class="lr-items" id="fList1"></div>
            </div>
            <div class="list-row">
                <div class="lr-label" id="l1_n2">18:</div>
                <div class="lr-items" id="fList2"></div>
            </div>
            <div class="result-msg" id="fMsg"></div>
        </div>

        <!-- TAB 2: Katlar -->
        <div class="tab-content" id="tab2">
            <div class="list-row">
                <div class="lr-label" id="l2_n1">12:</div>
                <div class="lr-items" id="mList1"></div>
            </div>
            <div class="list-row">
                <div class="lr-label" id="l2_n2">18:</div>
                <div class="lr-items" id="mList2"></div>
            </div>
            <div class="result-msg" id="mMsg"></div>
        </div>

    </div>

    <script>
        function getFactors(n) {
            let f = [];
            for(let i=1; i<=n; i++) if(n % i === 0) f.push(i);
            return f;
        }

        function switchTab(num) {
            document.querySelectorAll('.tab-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i+1 === num);
            });
            document.getElementById('tab1').classList.toggle('active', num === 1);
            document.getElementById('tab2').classList.toggle('active', num === 2);
        }

        function calculate() {
            let n1 = parseInt(document.getElementById('num1').value);
            let n2 = parseInt(document.getElementById('num2').value);
            if(isNaN(n1) || isNaN(n2) || n1<1 || n2<1) { alert("Geçerli sayılar girin."); return; }

            document.getElementById('tabsContainer').style.display = 'flex';
            document.getElementById('l1_n1').innerText = n1 + ':';
            document.getElementById('l1_n2').innerText = n2 + ':';
            document.getElementById('l2_n1').innerText = n1 + ':';
            document.getElementById('l2_n2').innerText = n2 + ':';

            // FACTORS
            let f1 = getFactors(n1);
            let f2 = getFactors(n2);
            let commonF = f1.filter(v => f2.includes(v));
            
            document.getElementById('fList1').innerHTML = f1.map(v => `<div class="item-box ${commonF.includes(v)?'common':''}">${v}</div>`).join('');
            document.getElementById('fList2').innerHTML = f2.map(v => `<div class="item-box ${commonF.includes(v)?'common':''}">${v}</div>`).join('');
            
            let fMsg = `İki sayının ortak bölenleri: <span>${commonF.join(', ')}</span><br>`;
            if(commonF.length === 1 && commonF[0] === 1) {
                fMsg += "(Sadece 1'de kesiştikleri için ARALARINDA ASALDIRLAR!)";
            } else {
                fMsg += `(Ortak bölenlerin en büyüğü: <b>${Math.max(...commonF)}</b>)`;
            }
            document.getElementById('fMsg').innerHTML = fMsg;

            // MULTIPLES
            let m1 = [], m2 = [];
            let maxLimit = Math.max(n1, n2) * 15; // generate enough to find some commons
            for(let i=1; i*n1 <= maxLimit; i++) m1.push(i*n1);
            for(let i=1; i*n2 <= maxLimit; i++) m2.push(i*n2);

            let commonM = m1.filter(v => m2.includes(v));
            
            // Limit render to first 12 items or so, but ensure we show some commons
            let r_m1 = m1.slice(0, 12);
            let r_m2 = m2.slice(0, 12);

            document.getElementById('mList1').innerHTML = r_m1.map(v => `<div class="item-box ${commonM.includes(v)?'common':''}">${v}</div>`).join('') + `<div class="item-box" style="background:transparent; border-color:transparent;">...</div>`;
            document.getElementById('mList2').innerHTML = r_m2.map(v => `<div class="item-box ${commonM.includes(v)?'common':''}">${v}</div>`).join('') + `<div class="item-box" style="background:transparent; border-color:transparent;">...</div>`;
            
            let mMsg = "";
            if(commonM.length > 0) {
                mMsg = `İki sayının ortak katları: <span>${commonM.slice(0,3).join(', ')}...</span> şeklinde sonsuza gider.<br>`;
                mMsg += `(İlk karşılaştıkları yani en küçük ortak katları: <b>${commonM[0]}</b>)`;
            } else {
                mMsg = "Ortak katları bulmak için sayıları daha da büyütmemiz gerekiyor.";
            }
            document.getElementById('mMsg').innerHTML = mMsg;

            // Default to tab 1
            switchTab(1);
        }

        // Enter key handling
        document.querySelectorAll('input').forEach(inp => {
            inp.addEventListener('keypress', e => { if(e.key==='Enter') calculate(); });
        });
    </script>
</body>
</html>
