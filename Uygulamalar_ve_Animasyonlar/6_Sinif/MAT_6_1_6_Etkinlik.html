<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devirli Kesir Avcısı</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F172A; --surface: #1E293B; --text: #F8FAFC;
            --primary: #3B82F6; --secondary: #10B981;
            --tertiary: #F59E0B; --danger: #F43F5E;
            --purple: #8B5CF6; --cyan: #06B6D4;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, var(--bg) 0%, var(--surface) 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px;
        }

        .header {
            width: 100%; max-width: 1000px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--danger); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .container {
            width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 20px;
        }

        .input-panel {
            background: rgba(255,255,255,0.03); border-radius: 20px; padding: 30px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: center;
        }

        .input-panel h2 { font-size: 1.8rem; color: var(--danger); margin-bottom: 20px; font-weight: 900;}

        .fraction-input-group {
            display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 20px;
        }
        input[type="number"] {
            background: #0B1120; border: 2px solid var(--danger); color: white;
            font-size: 2rem; font-weight: 900; width: 120px; text-align: center; padding: 10px; border-radius: 15px;
            outline: none; transition: all 0.3s;
        }
        input[type="number"]:focus { box-shadow: 0 0 15px rgba(244, 63, 94, 0.3);}
        
        .f-line { width: 150px; height: 4px; background: white; border-radius: 2px;}

        .btn-calc {
            background: var(--danger); color: white; border: none; padding: 15px 30px; border-radius: 15px;
            font-size: 1.2rem; font-weight: 900; cursor: pointer; transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(244, 63, 94, 0.4);
        }
        .btn-calc:hover { transform: translateY(-2px); box-shadow: 0 15px 25px rgba(244, 63, 94, 0.6); }

        /* Resolution Area */
        .result-area {
            background: rgba(255,255,255,0.02); border-radius: 20px; padding: 30px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2); display: flex; flex-direction: column; align-items: center; text-align: center;
            opacity: 0; transform: translateY(20px); transition: all 0.5s; pointer-events: none;
        }
        .result-area.show { opacity: 1; transform: translateY(0); pointer-events: auto; }

        .r-title { font-size: 1.5rem; font-weight: 900; margin-bottom: 20px; padding: 10px 20px; border-radius: 15px;}
        .r-title.terminating { background: rgba(16, 185, 129, 0.1); color: var(--secondary); border: 1px dashed var(--secondary);}
        .r-title.repeating { background: rgba(244, 63, 94, 0.1); color: var(--danger); border: 1px dashed var(--danger);}

        .r-equation { font-size: 4rem; font-weight: 900; color: white; margin-bottom: 20px; display: flex; align-items: center; gap: 20px;}
        .r-left { display: flex; flex-direction: column; align-items: center; font-size: 2.5rem;}
        .r-line { width: 100%; height: 4px; background: white; margin: 5px 0;}
        .r-right { color: var(--tertiary); }
        .repeating-bar { text-decoration: overline; color: var(--danger); }

        @media (max-width: 768px) {
            .header { flex-direction: column; gap: 10px; }
            .r-equation { flex-direction: column; font-size: 3rem;}
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=3B82F6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.6.1.6. Devirli Kesir Avcısı</div>
    </div>

    <div class="container">
        
        <div class="input-panel">
            <h2>🎯 Kesrini Gir, Sırrını Çözelim!</h2>
            <div class="fraction-input-group">
                <input type="number" id="numTop" value="1" placeholder="Pay">
                <div class="f-line"></div>
                <input type="number" id="numBot" value="3" placeholder="Payda">
            </div>
            <button class="btn-calc" onclick="calculate()">Bölme İşlemini Yap ➔</button>
            <p style="color:#94A3B8; margin-top:15px; font-size:0.9rem;">(Bölme işlemi hiç bitecek mi, yoksa sonsuza kadar tekrar mı edecek?)</p>
        </div>

        <div class="result-area" id="rArea">
            <div class="r-title" id="rTitle">Sonuç</div>
            
            <div class="r-equation">
                <div class="r-left">
                    <div id="rTop">1</div>
                    <div class="r-line"></div>
                    <div id="rBot">3</div>
                </div>
                <div style="color:white;">=</div>
                <div class="r-right" id="rVal">0,<span class="repeating-bar">3</span></div>
            </div>

            <p style="color:#94A3B8; font-size:1.1rem; font-weight:600; line-height: 1.5;" id="rDesc"></p>
        </div>

    </div>

    <script>
        // Decimal to repeating decimal converter algorithm
        function getDecimalRep(numerator, denominator) {
            if(numerator === 0) return { isRepeating: false, result: "0" };
            
            let res = "";
            let integerPart = Math.floor(numerator / denominator);
            res += integerPart;
            
            let remainder = numerator % denominator;
            if(remainder === 0) {
                return { isRepeating: false, result: res };
            }
            
            res += ",";
            let remMap = new Map();
            let fracPart = "";
            
            while(remainder !== 0 && !remMap.has(remainder)) {
                remMap.set(remainder, fracPart.length);
                remainder *= 10;
                let digit = Math.floor(remainder / denominator);
                fracPart += digit;
                remainder %= denominator;
            }
            
            if(remainder === 0) {
                return { isRepeating: false, result: res + fracPart };
            } else {
                let repeatIndex = remMap.get(remainder);
                let nonRepeat = fracPart.substring(0, repeatIndex);
                let repeat = fracPart.substring(repeatIndex);
                return { isRepeating: true, result: res + nonRepeat + `<span class="repeating-bar">${repeat}</span>` };
            }
        }

        const numTop = document.getElementById('numTop');
        const numBot = document.getElementById('numBot');
        const rArea = document.getElementById('rArea');
        
        function calculate() {
            let t = parseInt(numTop.value);
            let b = parseInt(numBot.value);
            
            if(isNaN(t) || isNaN(b) || b === 0) {
                alert("Geçerli sayılar girin. Payda 0 olamaz!");
                return;
            }

            rArea.classList.remove('show');
            
            setTimeout(() => {
                document.getElementById('rTop').innerText = t;
                document.getElementById('rBot').innerText = b;

                let data = getDecimalRep(t, b);
                document.getElementById('rVal').innerHTML = data.result;

                let rTitle = document.getElementById('rTitle');
                let rDesc = document.getElementById('rDesc');

                if(data.isRepeating) {
                    rTitle.className = "r-title repeating";
                    rTitle.innerText = "🚨 Devirli Ondalık Gösterim";
                    rDesc.innerHTML = `Payı paydaya böldüğümüzde bölme işlemi <b>HİÇ BİTMEZ</b>. Kalan sayılar sürekli tekrar eder. Bu yüzden tekrar eden kısmın üzerine <b>devir çizgisi</b> koyarız.`;
                } else {
                    rTitle.className = "r-title terminating";
                    rTitle.innerText = "✅ Sonlu Ondalık Gösterim";
                    rDesc.innerHTML = `Payı paydaya böldüğümüzde bölme işlemi <b>TAM OLARAK BİTER</b> (kalan 0 olur). Tekrar eden bir sayı yoktur.`;
                }

                rArea.classList.add('show');

            }, 300);
        }

        // Run once
        calculate();
        
        document.querySelectorAll('input').forEach(inp => {
            inp.addEventListener('keypress', e => { if(e.key==='Enter') calculate(); });
        });
    </script>
</body>
</html>
