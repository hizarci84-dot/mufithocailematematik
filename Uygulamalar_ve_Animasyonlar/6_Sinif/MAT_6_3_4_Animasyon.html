<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Açıların Yolculuğu - Animasyon</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F172A; --text: #F8FAFC;
            --primary: #3B82F6; --secondary: #10B981;
            --tertiary: #F59E0B; --danger: #F43F5E;
            --purple: #8B5CF6; --cyan: #06B6D4;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px;
        }

        .header {
            width: 100%; max-width: 900px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--cyan); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area { text-align: center; width: 100%; max-width: 800px; margin-bottom: 20px; height: 110px;}
        h1 { font-size: 2.2rem; color: var(--cyan); text-shadow: 0 5px 15px rgba(0,0,0,0.5); line-height: 1.3;}
        .subtitle { font-size: 1.2rem; color: #94A3B8; margin-top: 10px; line-height: 1.5; min-height: 55px;}
        .subtitle span { color: white; font-weight: 800; background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 5px;}

        .canvas-area {
            position: relative; width: 100%; max-width: 800px; height: 450px; 
            background: #0B1120; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.3); 
            overflow: hidden; display: flex; align-items: center; justify-content: center;
        }

        /* The SVG Drawing */
        .shape-path {
            stroke: #64748B; stroke-width: 3; fill: rgba(100, 116, 139, 0.1); transition: all 1s;
        }
        .tri-path {
            stroke: var(--primary); stroke-width: 3; fill: rgba(59, 130, 246, 0.2); transition: all 1s; opacity: 0;
        }

        .angle-arc {
            fill: transparent; stroke-width: 3; opacity: 0; transition: all 0.5s;
        }
        
        .angle-text {
            font-size: 24px; font-weight: 900; fill: white; opacity: 0; transition: all 0.5s;
            text-shadow: 0 0 5px black;
        }

        .btn-start {
            margin-top: 30px; background: var(--cyan); color: white; border: none; padding: 15px 40px; border-radius: 50px;
            font-size: 1.2rem; font-weight: 800; cursor: pointer; transition: all 0.3s; box-shadow: 0 10px 20px rgba(6, 182, 212, 0.4);
        }
        .btn-start:hover { transform: scale(1.05); }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=3B82F6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.6.3.4. Açıların Yolculuğu</div>
    </div>

    <div class="title-area">
        <h1 id="mTitle">Gizemi Çözmek</h1>
        <p class="subtitle" id="mSub">Bir problemi çözerken şekillerin özellikleri bizim dedektif ipuçlarımızdır.</p>
    </div>

    <div class="canvas-area">
        
        <svg width="600" height="350" viewBox="0 0 600 350" style="position: absolute; top:50px; left:100px;">
            <!-- Parallelogram ABCD -->
            <!-- A(100, 300), B(500, 300), C(600, 100), D(200, 100) -->
            <polygon class="shape-path" id="pgram" points="100,300 500,300 600,100 200,100" />
            
            <!-- Triangle inside: Isosceles ADE where E is on AB. Let E be (300, 300) -->
            <!-- ADE: A(100,300), D(200,100), E(300,300) -->
            <polygon class="tri-path" id="tri" points="100,300 300,300 200,100" />

            <!-- Labels for Vertices -->
            <text x="80" y="320" font-size="20" fill="#94A3B8" font-weight="800">A</text>
            <text x="510" y="320" font-size="20" fill="#94A3B8" font-weight="800">B</text>
            <text x="610" y="90" font-size="20" fill="#94A3B8" font-weight="800">C</text>
            <text x="180" y="90" font-size="20" fill="#94A3B8" font-weight="800">D</text>
            <text x="310" y="320" font-size="20" fill="#94A3B8" font-weight="800" id="lblE" style="opacity:0;">E</text>

            <!-- Angle C = 70 -->
            <path class="angle-arc" id="arcC" d="M 570 100 A 30 30 0 0 0 585 130" stroke="white" />
            <text class="angle-text" id="txtC" x="545" y="145">70°</text>

            <!-- Angle A -->
            <path class="angle-arc" id="arcA" d="M 130 300 A 30 30 0 0 0 115 270" stroke="var(--danger)" />
            <text class="angle-text" id="txtA" x="135" y="290">?</text>

            <!-- Marks for isosceles -->
            <line x1="135" y1="200" x2="155" y2="190" stroke="var(--secondary)" stroke-width="4" id="m1" style="opacity:0;" />
            <line x1="265" y1="200" x2="245" y2="190" stroke="var(--secondary)" stroke-width="4" id="m2" style="opacity:0;" />

            <!-- Angle E inside triangle -->
            <path class="angle-arc" id="arcE" d="M 270 300 A 30 30 0 0 1 285 270" stroke="var(--tertiary)" />
            <text class="angle-text" id="txtE" x="250" y="290">?</text>

            <!-- Angle ADE -->
            <path class="angle-arc" id="arcD" d="M 185 130 A 30 30 0 0 1 215 130" stroke="var(--purple)" />
            <text class="angle-text" id="txtD" x="185" y="160">?</text>
        </svg>

    </div>

    <button class="btn-start" id="startBtn" onclick="runTimeline()">Animasyonu Başlat</button>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const mTitle = document.getElementById('mTitle');
        const mSub = document.getElementById('mSub');
        const startBtn = document.getElementById('startBtn');
        
        async function runTimeline() {
            startBtn.style.display = 'none';

            // Reset
            document.getElementById('tri').style.opacity = 0;
            document.getElementById('lblE').style.opacity = 0;
            ['arcC','arcA','arcE','arcD'].forEach(id => document.getElementById(id).style.opacity = 0);
            ['txtC','txtA','txtE','txtD'].forEach(id => {
                document.getElementById(id).style.opacity = 0;
                document.getElementById(id).style.fill = 'white';
            });
            document.getElementById('m1').style.opacity = 0;
            document.getElementById('m2').style.opacity = 0;

            document.getElementById('txtA').textContent = "?";
            document.getElementById('txtE').textContent = "?";
            document.getElementById('txtD').textContent = "?";

            // Intro Problem
            mTitle.innerText = "Problem: Karışık Şekiller";
            mSub.innerHTML = "ABCD bir paralelkenar. <span>C açısı 70°</span> olarak verilmiş.";
            
            document.getElementById('arcC').style.opacity = 1;
            document.getElementById('txtC').style.opacity = 1;

            await sleep(3000);

            // Step 1: Parallelogram property
            mTitle.innerText = "Adım 1: Paralelkenar Kuralı";
            mSub.innerHTML = "Paralelkenarda <span>karşılıklı çapraz açılar birbirine eşittir.</span> Öyleyse A açısı da 70° olmalı.";
            
            document.getElementById('arcA').style.opacity = 1;
            document.getElementById('txtA').style.opacity = 1;
            
            await sleep(2000);
            document.getElementById('txtA').textContent = "70°";
            document.getElementById('txtA').style.fill = "var(--danger)";
            
            await sleep(3000);

            // Step 2: Introduce Triangle
            mTitle.innerText = "Adım 2: Yeni Bilgi (İkizkenar Üçgen)";
            mSub.innerHTML = "Soruda ADE üçgeninin <span>ikizkenar</span> olduğu söyleniyor (AD = DE).";
            
            document.getElementById('tri').style.opacity = 1;
            document.getElementById('lblE').style.opacity = 1;
            await sleep(1000);
            document.getElementById('m1').style.opacity = 1;
            document.getElementById('m2').style.opacity = 1;
            
            await sleep(3000);

            // Step 3: Base angles
            mTitle.innerText = "Adım 3: İkizkenar Kuralı";
            mSub.innerHTML = "İkizkenar üçgende taban açıları eşittir. A açısı 70° ise, <span>E açısı da 70°'dir.</span>";
            
            document.getElementById('arcE').style.opacity = 1;
            document.getElementById('txtE').style.opacity = 1;
            
            await sleep(2000);
            document.getElementById('txtE').textContent = "70°";
            document.getElementById('txtE').style.fill = "var(--tertiary)";
            
            await sleep(3000);

            // Step 4: Triangle sum
            mTitle.innerText = "Adım 4: Üçgenin İç Açıları Toplamı";
            mSub.innerHTML = "Üçgenin iç açılar toplamı 180°'dir. (70 + 70 = 140). <span>Tepe açısına (D) 40° kalır!</span>";
            
            document.getElementById('arcD').style.opacity = 1;
            document.getElementById('txtD').style.opacity = 1;
            
            await sleep(2000);
            document.getElementById('txtD').textContent = "40°";
            document.getElementById('txtD').style.fill = "var(--purple)";
            document.getElementById('arcD').style.stroke = "var(--purple)";

            setTimeout(() => {
                startBtn.style.display = 'block';
                startBtn.innerText = "Tekrar İzle";
            }, 5000);
        }
    </script>
</body>
</html>
