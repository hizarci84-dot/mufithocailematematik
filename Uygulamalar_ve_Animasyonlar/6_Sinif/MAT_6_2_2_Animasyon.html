<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Örüntülerin Dili - Animasyon</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F172A; --text: #F8FAFC;
            --primary: #3B82F6; --secondary: #10B981;
            --tertiary: #F59E0B; --danger: #F43F5E;
            --purple: #8B5CF6; --cyan: #06B6D4;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px;
        }

        .header {
            width: 100%; max-width: 900px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--secondary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area { text-align: center; width: 100%; max-width: 800px; margin-bottom: 20px; height: 110px;}
        h1 { font-size: 2.2rem; color: var(--secondary); text-shadow: 0 5px 15px rgba(0,0,0,0.5); line-height: 1.3;}
        .subtitle { font-size: 1.2rem; color: #94A3B8; margin-top: 10px; line-height: 1.5; min-height: 55px;}
        .subtitle span { color: white; font-weight: 800; background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 5px;}

        .canvas-area {
            position: relative; width: 100%; max-width: 800px; height: 450px; 
            background: #0B1120; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.3); 
            overflow: hidden; display: flex; align-items: center; justify-content: center;
        }

        .scene { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.8s; pointer-events: none;}
        .scene.active { opacity: 1; z-index: 10; }

        .pattern-grid { display: flex; gap: 40px; align-items: flex-end; height: 250px; margin-bottom: 30px;}
        
        .step { display: flex; flex-direction: column; align-items: center; gap: 10px;}
        .s-title { font-size: 1.2rem; color: #94A3B8; font-weight: 800;}
        .s-blocks { display: flex; flex-direction: column-reverse; gap: 5px;}
        
        .block {
            width: 40px; height: 40px; background: linear-gradient(135deg, var(--secondary), #059669);
            border-radius: 8px; border: 2px solid #34d399; opacity: 0; transform: scale(0); transition: all 0.5s;
        }
        
        .block.show { opacity: 1; transform: scale(1); }
        .block.diff { background: linear-gradient(135deg, var(--tertiary), #d97706); border-color: #fbbf24;}

        .rule-box {
            font-size: 2.5rem; font-weight: 900; color: white; background: rgba(0,0,0,0.5); padding: 15px 30px;
            border-radius: 20px; border: 2px dashed rgba(255,255,255,0.2); opacity: 0; transform: translateY(20px); transition: all 0.5s;
        }

        .btn-start {
            margin-top: 30px; background: var(--secondary); color: white; border: none; padding: 15px 40px; border-radius: 50px;
            font-size: 1.2rem; font-weight: 800; cursor: pointer; transition: all 0.3s; box-shadow: 0 10px 20px rgba(16, 185, 129, 0.4);
        }
        .btn-start:hover { transform: scale(1.05); }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=3B82F6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.6.2.2. Örüntülerin Dili</div>
    </div>

    <div class="title-area">
        <h1 id="mTitle">Örüntünün Şifresi: Kuralı Bulmak</h1>
        <p class="subtitle" id="mSub">Şekiller veya sayılar belirli bir kurala göre artar. Biz buna <span>Cebirsel Kural (Genel Terim)</span> diyoruz.</p>
    </div>

    <div class="canvas-area">
        
        <div class="scene active" id="sc1">
            
            <div class="pattern-grid">
                
                <div class="step">
                    <div class="s-title">1. Adım</div>
                    <div class="s-blocks" id="st1">
                        <div class="block b-base"></div>
                        <div class="block b-base"></div>
                        <div class="block b-base"></div>
                    </div>
                </div>

                <div class="step">
                    <div class="s-title">2. Adım</div>
                    <div class="s-blocks" id="st2">
                        <div class="block b-base"></div>
                        <div class="block b-base"></div>
                        <div class="block b-base"></div>
                        <div class="block b-diff"></div>
                        <div class="block b-diff"></div>
                    </div>
                </div>

                <div class="step">
                    <div class="s-title">3. Adım</div>
                    <div class="s-blocks" id="st3">
                        <div class="block b-base"></div>
                        <div class="block b-base"></div>
                        <div class="block b-base"></div>
                        <div class="block b-diff"></div>
                        <div class="block b-diff"></div>
                        <div class="block b-diff"></div>
                        <div class="block b-diff"></div>
                    </div>
                </div>

            </div>

            <div class="rule-box" id="rBox">
                Kural: <span style="color:var(--tertiary);">2n</span> + <span style="color:var(--secondary);">1</span>
            </div>

        </div>

    </div>

    <button class="btn-start" id="startBtn" onclick="runTimeline()">Animasyonu Başlat</button>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const mTitle = document.getElementById('mTitle');
        const mSub = document.getElementById('mSub');
        const startBtn = document.getElementById('startBtn');
        
        async function runTimeline() {
            startBtn.style.display = 'none';

            // Reset
            document.querySelectorAll('.block').forEach(b => {
                b.classList.remove('show');
                b.classList.remove('diff');
            });
            document.getElementById('rBox').style.opacity = 0;
            document.getElementById('rBox').style.transform = "translateY(20px)";
            document.getElementById('rBox').innerHTML = ``;
            
            mTitle.innerText = "1. Adımı İnceleyelim";
            mSub.innerHTML = "İlk adımda toplam <span>3 blok</span> var.";
            
            let st1Blocks = document.querySelectorAll('#st1 .block');
            for(let b of st1Blocks) { b.classList.add('show'); await sleep(200); }
            
            await sleep(1500);

            mTitle.innerText = "2. Adımda Ne Değişti?";
            mSub.innerHTML = "Önceki 3 bloğa <span>2 yeni blok</span> daha eklendi. (Toplam 5)";
            
            let st2Blocks = document.querySelectorAll('#st2 .block');
            for(let i=0; i<3; i++) { st2Blocks[i].classList.add('show'); }
            await sleep(800);
            for(let i=3; i<5; i++) { 
                st2Blocks[i].classList.add('diff');
                st2Blocks[i].classList.add('show'); 
                await sleep(300); 
            }

            await sleep(1500);

            mTitle.innerText = "3. Adımda Kural Belli Oldu";
            mSub.innerHTML = "Yine <span>+2 blok</span> daha eklendi. (Toplam 7). Demek ki sürekli 2 artıyor!";
            
            let st3Blocks = document.querySelectorAll('#st3 .block');
            for(let i=0; i<3; i++) { st3Blocks[i].classList.add('show'); }
            for(let i=3; i<5; i++) { st3Blocks[i].classList.add('diff'); st3Blocks[i].classList.add('show'); }
            await sleep(800);
            for(let i=5; i<7; i++) { 
                st3Blocks[i].classList.add('diff');
                st3Blocks[i].classList.add('show'); 
                await sleep(300); 
            }

            await sleep(2000);

            mTitle.innerText = "Cebirsel Şifre Çözülüyor";
            mSub.innerHTML = "Sürekli 2 arttığı için kuralda <span>2n</span> vardır. 1. adımda 3 olması için 2n'e 1 ekleriz: <span>2n + 1</span>";
            
            let rBox = document.getElementById('rBox');
            rBox.innerHTML = `Kural: <span style="color:var(--tertiary);">2n</span> + <span style="color:var(--secondary);">1</span>`;
            rBox.style.opacity = 1;
            rBox.style.transform = "translateY(0)";

            setTimeout(() => {
                startBtn.style.display = 'block';
                startBtn.innerText = "Tekrar İzle";
            }, 4000);
        }
    </script>
</body>
</html>
