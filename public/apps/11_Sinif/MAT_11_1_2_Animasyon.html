<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11.1.2 - Trigonometrik Denklem Öteleme ve Kesişim Animasyonu</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root {
            --bg-color: #0A0A12;
            --panel-bg: #151522;
            --primary: #00F0FF; /* Neon Cyan */
            --secondary: #FF00E4; /* Neon Pink */
            --accent: #FFE600; /* Neon Yellow */
            --text-main: #FFFFFF;
            --text-muted: #8A8A9E;
            --grid-line: rgba(0, 240, 255, 0.12);
            --axis-line: rgba(0, 240, 255, 0.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        
        body {
            background-color: var(--bg-color); color: var(--text-main);
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding: 20px; overflow-x: hidden;
            background-image: 
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .header {
            width: 100%; max-width: 1200px; display: flex; justify-content: space-between; align-items: center;
            padding: 15px 25px; background: rgba(21, 21, 34, 0.85); backdrop-filter: blur(10px);
            border-radius: 16px; border: 1px solid rgba(0, 240, 255, 0.3);
            margin-bottom: 20px; box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
        }
        
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 800; color: var(--primary); font-size: 1.1rem; }
        .header-left img { width: 45px; height: 45px; border-radius: 10px; border: 1px solid var(--primary); }
        .kazanim { background: rgba(0, 240, 255, 0.1); padding: 8px 15px; border-radius: 8px; color: var(--primary); font-weight: 600; font-size: 0.85rem; border: 1px solid rgba(0, 240, 255, 0.3); }

        h1 { font-size: 2rem; font-weight: 900; margin-bottom: 8px; text-align: center; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 0 10px rgba(0, 240, 255, 0.5); }
        .subtitle { color: var(--text-muted); font-size: 1rem; margin-bottom: 25px; text-align: center; max-width: 900px; }

        .workspace { display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 1200px; align-items: center; }

        .anim-container {
            display: flex; width: 100%; height: 500px; position: relative;
            background: #0A0A12; border-radius: 16px; border: 2px solid var(--primary);
            overflow: hidden; box-shadow: 0 0 30px rgba(0, 240, 255, 0.15) inset;
        }

        svg { width: 100%; height: 100%; display: block; }
        
        .svg-grid { stroke: rgba(255,255,255,0.06); stroke-width: 0.03; }
        .svg-axis { stroke: var(--axis-line); stroke-width: 0.06; }
        
        .path-f { fill: none; stroke: var(--primary); stroke-width: 0.08; stroke-linecap: round; filter: drop-shadow(0 0 5px var(--primary)); }
        .path-g { fill: none; stroke: var(--secondary); stroke-width: 0.08; stroke-linecap: round; filter: drop-shadow(0 0 5px var(--secondary)); }
        
        .scan-line { stroke: var(--accent); stroke-width: 0.08; opacity: 0.8; filter: drop-shadow(0 0 8px var(--accent)); }
        .root-point { fill: var(--accent); stroke: var(--bg-color); stroke-width: 0.04; r: 0.15; filter: drop-shadow(0 0 8px var(--accent)); }
        .root-line { stroke: rgba(255, 230, 0, 0.6); stroke-width: 0.04; stroke-dasharray: 0.1, 0.1; }
        
        .svg-label { fill: var(--text-muted); font-size: 0.25px; font-weight: 600; font-family: 'Outfit', sans-serif; }
        .svg-axis-title { fill: var(--primary); font-size: 0.35px; font-weight: 800; font-family: 'Outfit', sans-serif; }

        .controls {
            display: flex; gap: 20px; background: var(--panel-bg); justify-content: space-between; align-items: center;
            padding: 20px 30px; border-radius: 16px; border: 1px solid rgba(255, 0, 228, 0.3);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5); width: 100%; flex-wrap: wrap;
        }

        .btn-play {
            background: var(--primary); color: #0A0A12; border: none; padding: 14px 40px; border-radius: 12px;
            font-size: 1.2rem; font-weight: 900; cursor: pointer; transition: 0.3s; box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }
        .btn-play:hover { transform: scale(1.05); box-shadow: 0 0 25px rgba(0, 240, 255, 0.7); }
        .btn-play:disabled { background: #333; color: #666; cursor: not-allowed; box-shadow: none; transform: none; }

        .status-box {
            background: rgba(0,0,0,0.6); border: 1px dashed var(--accent); padding: 15px 30px;
            border-radius: 12px; font-size: 1.3rem; text-align: center; color: var(--accent); flex: 1;
            min-height: 60px; display: flex; align-items: center; justify-content: center; font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=00F0FF&color=000'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.11.1.2. Trigonometrik Denklemlerde Öteleme ve Kesişim</div>
    </div>
    
    <h1>Öteleme ve Kesişim Analizi</h1>
    <p class="subtitle"><strong>Adım 1:</strong> sin(x)'in π/6 kadar sağa ötelenmesi. <strong>Adım 2:</strong> sin(x - π/6) = cos(x) denklemini sağlayan köklerin tespiti.</p>
    
    <div class="workspace">
        <div class="anim-container">
            <svg id="graphSvg" viewBox="-0.5 -3.5 7.5 7" preserveAspectRatio="xMidYMid meet">
                <g transform="scale(1, -1)">
                    <g id="gridGroup"></g>
                    
                    <!-- Axes -->
                    <line x1="-0.5" y1="0" x2="7.0" y2="0" class="svg-axis" />
                    <line x1="0" y1="-3.5" x2="0" y2="3.5" class="svg-axis" />
                    
                    <!-- Paths -->
                    <path id="pathG" class="path-g" d="" /> <!-- cos(x) -->
                    <path id="pathF" class="path-f" d="" /> <!-- sin(x) -> shifted -->
                    
                    <!-- Laser Scan Line -->
                    <line id="scanLine" class="scan-line" x1="-1" y1="-3.5" x2="-1" y2="3.5" display="none" />
                    
                    <!-- Found Roots Container -->
                    <g id="foundRootsGroup"></g>
                </g>
                <g id="labelsGroup"></g>
            </svg>
        </div>

        <div class="controls">
            <button class="btn-play" id="btnPlay" onclick="startAnimationSequence()">ANİMASYONU BAŞLAT</button>

            <div class="status-box" id="mathOutput">
                <!-- Clean Rendered TeX -->
            </div>
        </div>
    </div>

    <script>
        const btnPlay = document.getElementById('btnPlay');
        const pathF = document.getElementById('pathF');
        const pathG = document.getElementById('pathG');
        const scanLine = document.getElementById('scanLine');
        const foundRootsGroup = document.getElementById('foundRootsGroup');
        const mathOutput = document.getElementById('mathOutput');
        
        let isTypesetting = false;
        let pendingTex = null;
        let animState = 0; // 0: Idle, 1: Shifting, 2: Scanning, 3: Done
        let shiftAmount = 0;
        let targetShift = Math.PI / 6; // π/6 right shift
        let scanX = 0;
        let discoveredRoots = [];

        function drawGrid() {
            let gridHtml = '';
            let labelHtml = '';
            
            for(let y = -3; y <= 3; y += 1) {
                if(y !== 0) {
                    gridHtml += `<line x1="-0.5" y1="${y}" x2="7.0" y2="${y}" class="svg-grid" />`;
                    labelHtml += `<text x="-0.2" y="${-y + 0.12}" class="svg-label" text-anchor="end">${y}</text>`;
                }
            }
            
            let piSteps = [
                {val: 0, str: "0", y: 0.4},
                {val: Math.PI/6, str: "π/6", y: -0.4},
                {val: Math.PI/2, str: "π/2", y: 0.4},
                {val: Math.PI, str: "π", y: 0.4},
                {val: 1.5*Math.PI, str: "3π/2", y: 0.4},
                {val: 2*Math.PI, str: "2π", y: 0.4}
            ];
            
            piSteps.forEach(step => {
                gridHtml += `<line x1="${step.val}" y1="-3" x2="${step.val}" y2="3" class="svg-grid" />`;
                labelHtml += `<text x="${step.val}" y="${step.y}" class="svg-label" text-anchor="middle">${step.str}</text>`;
            });
            
            labelHtml += `<text x="6.8" y="-0.15" class="svg-axis-title">x</text>`;
            labelHtml += `<text x="0.15" y="-3.1" class="svg-axis-title">y</text>`;

            document.getElementById('gridGroup').innerHTML = gridHtml;
            document.getElementById('labelsGroup').innerHTML = labelHtml;
        }

        function renderMathClean(texString) {
            if (isTypesetting) {
                pendingTex = texString;
                return;
            }
            isTypesetting = true;
            
            let temp = document.createElement('div');
            temp.style.position = 'absolute';
            temp.style.top = '-9999px';
            temp.style.left = '-9999px';
            temp.style.visibility = 'hidden';
            temp.innerHTML = texString;
            document.body.appendChild(temp);
            
            MathJax.typesetPromise([temp]).then(() => {
                mathOutput.innerHTML = temp.innerHTML;
                if (temp.parentNode) document.body.removeChild(temp);
                isTypesetting = false;
                
                if (pendingTex) {
                    let next = pendingTex;
                    pendingTex = null;
                    renderMathClean(next);
                }
            }).catch(err => {
                if (temp.parentNode) document.body.removeChild(temp);
                isTypesetting = false;
            });
        }

        function drawCurves(currentShift) {
            let step = 0.02;
            let dF = "";
            let dG = "";
            
            for(let x = 0; x <= 2 * Math.PI; x += step) {
                let yF = Math.sin(x - currentShift);
                let yG = Math.cos(x);
                dF += (x === 0 ? "M" : "L") + ` ${x.toFixed(3)} ${yF.toFixed(3)}`;
                dG += (x === 0 ? "M" : "L") + ` ${x.toFixed(3)} ${yG.toFixed(3)}`;
            }
            
            pathF.setAttribute("d", dF);
            pathG.setAttribute("d", dG);
        }
        
        function renderRoots() {
            let html = "";
            let rootTexArr = [];
            
            discoveredRoots.forEach((rt, i) => {
                html += `<line x1="${rt.x}" y1="0" x2="${rt.x}" y2="${rt.y}" class="root-line" />`;
                html += `<circle cx="${rt.x}" cy="${rt.y}" class="root-point" />`;
                
                let deg = Math.round((rt.x * 180) / Math.PI);
                rootTexArr.push(`x_${i+1} = ${deg}^\\circ`);
            });
            foundRootsGroup.innerHTML = html;
            
            if(discoveredRoots.length > 0) {
                renderMathClean(`\\( \\sin(x - \\pi/6) = \\cos(x) \\quad \\Rightarrow \\quad \\mathbf{\\text{Ç}} = \\{ ${rootTexArr.join(', ')} \\} \\)`);
            }
        }

        function startAnimationSequence() {
            if(animState !== 0 && animState !== 3) return;
            
            // Reset
            btnPlay.disabled = true;
            shiftAmount = 0;
            scanX = 0;
            discoveredRoots = [];
            foundRootsGroup.innerHTML = "";
            scanLine.style.display = "none";
            animState = 1;
            
            renderMathClean(`\\( \\sin(x) \\quad \\text{ve} \\quad \\cos(x) \\)`);
            drawCurves(shiftAmount);
            
            setTimeout(() => {
                renderMathClean(`\\( \\text{Adım 1: } \\sin(x) \\text{ sağa doğru } \\pi/6 \\text{ öteleniyor...} \\)`);
                requestAnimationFrame(animShift);
            }, 1000);
        }

        function animShift() {
            shiftAmount += 0.005;
            if(shiftAmount >= targetShift) {
                shiftAmount = targetShift;
                drawCurves(shiftAmount);
                renderMathClean(`\\( \\sin(x - \\pi/6) = \\cos(x) \\text{ için Kök Aranıyor...} \\)`);
                
                setTimeout(() => {
                    animState = 2;
                    scanLine.style.display = "block";
                    requestAnimationFrame(animScan);
                }, 1000);
                return;
            }
            drawCurves(shiftAmount);
            requestAnimationFrame(animShift);
        }
        
        function animScan() {
            scanX += 0.02;
            scanLine.setAttribute("x1", scanX);
            scanLine.setAttribute("x2", scanX);
            
            // Check for known roots of sin(x - pi/6) = cos(x) which are x = pi/3 and x = 4pi/3
            let r1 = Math.PI / 3;
            let r2 = 4 * Math.PI / 3;
            
            if(Math.abs(scanX - r1) < 0.02 && discoveredRoots.length === 0) {
                discoveredRoots.push({x: r1, y: Math.cos(r1)});
                renderRoots();
            }
            if(Math.abs(scanX - r2) < 0.02 && discoveredRoots.length === 1) {
                discoveredRoots.push({x: r2, y: Math.cos(r2)});
                renderRoots();
            }
            
            if(scanX >= 2 * Math.PI) {
                animState = 3;
                scanLine.style.display = "none";
                btnPlay.disabled = false;
                btnPlay.innerText = "YENİDEN OYNAT";
                return;
            }
            
            requestAnimationFrame(animScan);
        }

        window.onload = () => {
            drawGrid();
            drawCurves(0);
            renderMathClean(`\\( \\sin(x) \\quad \\text{ve} \\quad \\cos(x) \\)`);
        };
    </script>
</body>
</html>
