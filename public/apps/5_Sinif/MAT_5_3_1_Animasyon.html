<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometrinin Evrimi Animasyonu</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F172A;
            --text: #F8FAFC;
            --primary: #F472B6; /* Pink */
            --accent: #38BDF8; /* Light Blue */
            --highlight: #FDE047; /* Yellow */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: radial-gradient(circle at center, #1E293B 0%, var(--bg) 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 20px;
            overflow: hidden;
        }

        .header {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 900px;
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1); z-index: 100;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--primary); color: #0F172A; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area {
            position: absolute; top: 120px; text-align: center; width: 100%; z-index: 50;
        }
        h1 { font-size: 2.5rem; color: var(--highlight); text-shadow: 0 5px 15px rgba(0,0,0,0.5); transition: opacity 0.5s;}
        p.subtitle { font-size: 1.4rem; color: #94A3B8; margin-top: 10px; transition: opacity 0.5s;}

        /* Canvas Area */
        .canvas {
            position: relative; width: 100%; max-width: 800px; height: 400px;
            display: flex; align-items: center; justify-content: center;
        }

        /* SVG Shapes */
        svg { width: 100%; height: 100%; overflow: visible; }
        
        .shape-path {
            fill: none; stroke: var(--accent); stroke-width: 8; stroke-linecap: round;
            opacity: 0; transition: all 1s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .shape-point {
            fill: var(--primary); stroke: white; stroke-width: 4;
            opacity: 0; transition: all 0.5s;
        }
        
        /* Initial states */
        #l-main { stroke-dasharray: 400; stroke-dashoffset: 400; }
        #c-main { stroke-dasharray: 1000; stroke-dashoffset: 1000; }
        
        /* Specific States */
        /* Nokta */
        .show-point #p-center { opacity: 1; r: 12; }
        
        /* Doğru Parçası */
        .show-segment #l-main { opacity: 1; stroke-dashoffset: 0; }
        .show-segment #p-left, .show-segment #p-right { opacity: 1; r: 10; }
        
        /* Işın */
        .show-ray #l-main { opacity: 1; stroke-dashoffset: 0; marker-end: url(#arrowhead); }
        .show-ray #p-left { opacity: 1; r: 10; }
        .show-ray #p-right { opacity: 0; }
        
        /* Doğru */
        .show-line #l-main { opacity: 1; stroke-dashoffset: 0; marker-start: url(#arrowhead-rev); marker-end: url(#arrowhead); }
        .show-line #p-left, .show-line #p-right { opacity: 0; }

        /* Açı */
        .show-angle #p-center { opacity: 1; r: 10; }
        .show-angle #l-ray1, .show-angle #l-ray2 { opacity: 1; marker-end: url(#arrowhead); }
        .show-angle #l-ray1 { transform: rotate(-30deg); transform-origin: 400px 200px; }
        .show-angle #l-ray2 { transform: rotate(30deg); transform-origin: 400px 200px; }

        /* Çember */
        .show-circle #p-center { opacity: 1; r: 8; fill: white;}
        .show-circle #c-main { opacity: 1; stroke-dashoffset: 0; }
        .show-circle #l-radius { opacity: 1; stroke-dasharray: 5 10; stroke-width: 4; stroke: #94A3B8;}

        /* Dikme */
        .show-perpend #l-horiz { opacity: 1; marker-start: url(#arrowhead-rev); marker-end: url(#arrowhead); }
        .show-perpend #l-vert { opacity: 1; stroke: var(--primary); }
        .show-perpend #rect-90 { opacity: 1; }

        /* Controls */
        #replayBtn { 
            position: absolute; bottom: 40px; 
            background: var(--primary); color: white; border: none; 
            padding: 15px 40px; border-radius: 50px; font-size: 1.2rem; font-weight: 800; 
            cursor: pointer; opacity: 0; pointer-events: none; transition: all 0.5s ease;
            box-shadow: 0 10px 20px rgba(244, 114, 182, 0.4);
        }
        #replayBtn.visible { opacity: 1; pointer-events: auto; }
        #replayBtn:hover { transform: scale(1.05); background: #BE185D;}

        @media (max-width: 768px) {
            .header { top: 10px; flex-direction: column; gap: 10px; width: 90%;}
            .title-area { top: 150px; }
            h1 { font-size: 1.8rem; }
            p.subtitle { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.5.3.1. Temel Geometrik Çizimler</div>
    </div>

    <div class="title-area">
        <h1 id="mainTitle">Geometrinin Başlangıcı</h1>
        <p class="subtitle" id="subTitle">Her şey kalemin kâğıtta bıraktığı bir izle başlar...</p>
    </div>

    <div class="canvas" id="canvas">
        <svg viewBox="0 0 800 400">
            <defs>
                <marker id="arrowhead" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
                    <polygon points="0 0, 6 3, 0 6" fill="var(--accent)" />
                </marker>
                <marker id="arrowhead-rev" markerWidth="6" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
                    <polygon points="0 0, 6 3, 0 6" fill="var(--accent)" />
                </marker>
            </defs>

            <!-- Line, Segment, Ray -->
            <line id="l-main" class="shape-path" x1="200" y1="200" x2="600" y2="200" />
            <circle id="p-left" class="shape-point" cx="200" cy="200" r="0" />
            <circle id="p-right" class="shape-point" cx="600" cy="200" r="0" />

            <!-- Center Point -->
            <circle id="p-center" class="shape-point" cx="400" cy="200" r="0" />

            <!-- Angle Rays -->
            <line id="l-ray1" class="shape-path" x1="400" y1="200" x2="600" y2="200" />
            <line id="l-ray2" class="shape-path" x1="400" y1="200" x2="600" y2="200" />

            <!-- Circle -->
            <circle id="c-main" class="shape-path" cx="400" cy="200" r="120" />
            <line id="l-radius" class="shape-path" x1="400" y1="200" x2="520" y2="200" />

            <!-- Perpendicular -->
            <line id="l-horiz" class="shape-path" x1="200" y1="300" x2="600" y2="300" />
            <line id="l-vert" class="shape-path" x1="400" y1="100" x2="400" y2="300" />
            <rect id="rect-90" class="shape-path" x="400" y="270" width="30" height="30" stroke="var(--primary)" stroke-width="4" />
        </svg>
    </div>

    <button id="replayBtn" onclick="startSequence()">Animasyonu Tekrarla</button>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        
        async function startSequence() {
            const canvas = document.getElementById('canvas');
            const title = document.getElementById('mainTitle');
            const sub = document.getElementById('subTitle');
            const btn = document.getElementById('replayBtn');

            // Reset
            canvas.className = 'canvas';
            btn.classList.remove('visible');
            
            await sleep(500);

            // 1. NOKTA
            title.innerText = "NOKTA";
            sub.innerText = "Her şey kalemin kâğıtta bıraktığı bu izle başlar.";
            canvas.classList.add('show-point');
            await sleep(3500);

            // 2. DOĞRU PARÇASI
            canvas.className = 'canvas show-segment';
            title.innerText = "DOĞRU PARÇASI";
            sub.innerText = "Sınırsız nokta aynı hizada dizilir. İki ucu da kapalıdır.";
            await sleep(4000);

            // 3. IŞIN
            canvas.className = 'canvas show-ray';
            title.innerText = "IŞIN";
            sub.innerText = "Bir ucu kapalı, diğer ucu sonsuza uzanır (Lazer gibi).";
            await sleep(4000);

            // 4. DOĞRU
            canvas.className = 'canvas show-line';
            title.innerText = "DOĞRU";
            sub.innerText = "Her iki ucu da sonsuza kadar dümdüz uzanır.";
            await sleep(4000);

            // 5. AÇI
            canvas.className = 'canvas show-angle';
            title.innerText = "AÇI";
            sub.innerText = "Aynı başlangıç noktasından çıkan iki ışının arasındaki dönme miktarıdır.";
            await sleep(4000);

            // 6. ÇEMBER
            canvas.className = 'canvas show-circle';
            title.innerText = "ÇEMBER";
            sub.innerText = "Bir merkeze eşit uzaklıktaki tüm noktaların oluşturduğu şekildir (Pergel ile çizilir).";
            await sleep(4000);

            // 7. DİKME
            canvas.className = 'canvas show-perpend';
            title.innerText = "DİKME";
            sub.innerText = "Bir doğruya dışındaki noktadan inilen en kısa yoldur (Gönye ile çizilir).";
            await sleep(4000);
            
            btn.classList.add('visible');
        }
        
        window.onload = startSequence;
    </script>
</body>
</html>
