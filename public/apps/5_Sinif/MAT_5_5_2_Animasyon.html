<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sayılar Yalan Söyler mi? - Animasyon</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F172A;
            --text: #F8FAFC;
            --primary: #F43F5E; /* Danger */
            --secondary: #3B82F6; /* Blue */
            --tertiary: #10B981; /* Green */
            --amber: #F59E0B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px; overflow-x: hidden;
        }

        .header {
            width: 100%; max-width: 900px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area { text-align: center; width: 100%; max-width: 800px; margin-bottom: 20px; height: 120px;}
        h1 { font-size: 2.2rem; color: var(--primary); text-shadow: 0 5px 15px rgba(0,0,0,0.5); line-height: 1.3;}
        .subtitle { font-size: 1.2rem; color: #94A3B8; margin-top: 10px; line-height: 1.5; min-height: 55px;}
        .subtitle span { color: white; font-weight: 800; background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 5px;}

        .canvas-area {
            position: relative; width: 100%; max-width: 800px; height: 450px; 
            background: #0B1120; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.3); 
            overflow: hidden; display: flex; align-items: center; justify-content: center;
        }

        .scene { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.8s; pointer-events: none;}
        .scene.active { opacity: 1; z-index: 10; }

        /* Fake Chart Scene */
        .fake-chart { width: 400px; height: 300px; border-left: 3px solid white; border-bottom: 3px solid white; position: relative; display: flex; align-items: flex-end; justify-content: space-around; padding: 0 20px; margin-left: 50px;}
        
        .fc-y { position: absolute; left: -50px; bottom: 0; top: 0; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end; font-weight: 800; color: #94A3B8;}
        
        .bar { width: 100px; border-radius: 5px 5px 0 0; position: relative; display: flex; justify-content: center; transition: all 1.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .b-a { background: var(--secondary); height: 250px; } /* Rep: 100 */
        .b-b { background: var(--tertiary); height: 125px; } /* Rep: 95 when origin is 90 */
        
        .b-val { position: absolute; top: -30px; font-weight: 900; font-size: 1.5rem; color: white;}
        .b-lbl { position: absolute; bottom: -35px; font-weight: 800; font-size: 1.2rem; color: white;}

        /* Alert Overlay */
        .alert-box {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            background: var(--danger); color: white; padding: 25px 40px; border-radius: 20px;
            font-size: 2rem; font-weight: 900; box-shadow: 0 15px 40px rgba(244, 63, 94, 0.5);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); text-align: center; z-index: 20;
        }
        .alert-box.show { transform: translate(-50%, -50%) scale(1); }

        .btn-start {
            margin-top: 30px; background: var(--amber); color: #0F172A; border: none; padding: 15px 40px; border-radius: 50px;
            font-size: 1.2rem; font-weight: 900; cursor: pointer; transition: all 0.3s; box-shadow: 0 10px 20px rgba(245, 158, 11, 0.4);
        }
        .btn-start:hover { transform: scale(1.05); }

        @media (max-width: 768px) {
            .header { flex-direction: column; gap: 10px; }
            h1 { font-size: 1.5rem; }
            .canvas-area { height: 350px; }
            .title-area { height: 140px; }
            .fake-chart { width: 250px; height: 200px; }
            .bar { width: 60px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.5.5.2. Hatalı Grafikler ve Analiz</div>
    </div>

    <div class="title-area">
        <h1 id="mTitle">Sayılar Bize Yalan Söyler mi?</h1>
        <p class="subtitle" id="mSub">"Sayılar yalan söylemez ama <span>grafikleri çizenler yalan söyleyebilir!</span>"</p>
    </div>

    <div class="canvas-area">
        
        <div class="scene active" id="sc1">
            <div class="fake-chart">
                <div class="fc-y" id="yAxis">
                    <span>100</span><span>98</span><span>96</span><span>94</span><span>92</span><span>90</span>
                </div>
                <div class="bar b-a" id="barA"><div class="b-val">100</div><div class="b-lbl">Biz</div></div>
                <div class="bar b-b" id="barB"><div class="b-val">95</div><div class="b-lbl">Rakip</div></div>
            </div>
        </div>

        <div id="alertBox" class="alert-box">MANİPÜLASYON TESPİT EDİLDİ!</div>

    </div>

    <button class="btn-start" id="startBtn" onclick="runTimeline()">Hileyi Ortaya Çıkar</button>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        
        const mTitle = document.getElementById('mTitle');
        const mSub = document.getElementById('mSub');
        const startBtn = document.getElementById('startBtn');
        const yAxis = document.getElementById('yAxis');
        const barA = document.getElementById('barA');
        const barB = document.getElementById('barB');
        const alertBox = document.getElementById('alertBox');

        async function runTimeline() {
            startBtn.style.display = 'none';

            // SCENE 1
            mTitle.innerText = "İllüzyona Dikkat Edin!";
            mSub.innerHTML = "Sol taraftaki firmaya göre, rakibini ikiye katlamış gibi görünüyor değil mi?";
            await sleep(4000);

            // SCENE 2
            alertBox.classList.add('show');
            await sleep(2000);
            alertBox.classList.remove('show');
            
            mTitle.innerText = "Eksen (Sıfır) Hilesi";
            mSub.innerHTML = "Lütfen dikey eksene (sayılara) dikkatli bakın. <span>0'dan değil 90'dan başlamış!</span>";
            await sleep(3500);

            // FIXING THE CHART
            mTitle.innerText = "Gerçekleri Görelim";
            mSub.innerHTML = "Grafiği 0'dan başlattığımızda aradaki farkın <span>aslında ne kadar küçük olduğunu</span> görürsünüz.";
            
            yAxis.innerHTML = "<span>100</span><span>75</span><span>50</span><span>25</span><span>0</span>";
            
            // Re-calculate heights
            // Container is 300px. 100 = 300px.
            barA.style.height = "300px";
            barB.style.height = "285px"; // 95% of 300
            
            await sleep(4000);

            // CONCLUSION
            mTitle.innerText = "İstatistik Dedektifi Olun";
            mSub.innerHTML = "Size sunulan her grafiğe hemen inanmayın, <span>eleştirel gözle inceleyin!</span> 🕵️‍♂️";
            
            setTimeout(() => {
                startBtn.style.display = 'block';
                startBtn.innerText = "Tekrar İzle";
            }, 3000);
        }
    </script>
</body>
</html>
