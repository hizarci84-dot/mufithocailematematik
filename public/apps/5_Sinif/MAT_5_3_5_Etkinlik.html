<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çokgenlerin Doğuşu - İnteraktif Laboratuvar</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F172A;
            --surface: #1E293B;
            --text: #F8FAFC;
            --primary: #8B5CF6; /* Purple */
            --secondary: #F43F5E; /* Rose */
            --tertiary: #10B981; /* Green */
            --highlight: #FDE047; /* Yellow */
            --line-color: #38BDF8; /* Blue */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, var(--bg) 0%, var(--surface) 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px;
        }

        .header {
            width: 100%; max-width: 1000px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .container {
            width: 100%; max-width: 1000px; display: grid; grid-template-columns: 1fr 300px; gap: 20px;
        }

        .canvas-area {
            background: #0B1120; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            position: relative; height: 550px; display: flex; flex-direction: column; align-items: center;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5); overflow: hidden;
        }

        .tools-area {
            display: flex; flex-direction: column; gap: 15px;
        }

        .panel {
            background: rgba(255,255,255,0.03); border-radius: 20px; padding: 20px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .panel-title { font-size: 1.2rem; font-weight: 800; color: var(--highlight); margin-bottom: 15px; border-bottom: 2px solid rgba(255,255,255,0.1); padding-bottom: 10px;}
        
        .mode-btn {
            width: 100%; background: rgba(255,255,255,0.05); color: white; border: none; padding: 12px 15px; border-radius: 12px;
            font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-bottom: 10px; text-align: left;
            display: flex; justify-content: space-between; align-items: center;
        }
        .mode-btn.active { background: var(--primary); color: white; box-shadow: 0 5px 15px rgba(139, 92, 246, 0.4);}
        .mode-btn:hover:not(.active) { background: rgba(255,255,255,0.1); }

        .stat-box {
            display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 1rem; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 5px;
        }
        .stat-box span:first-child { color: #94A3B8; font-weight: 600;}
        .stat-box span:last-child { font-weight: 800; color: white;}

        .info-box {
            background: rgba(244, 63, 94, 0.1); border: 2px solid var(--secondary); padding: 15px; border-radius: 15px;
            margin-top: 15px; font-size: 0.95rem; line-height: 1.5; color: #FDA4AF;
        }
        .info-box span { font-weight: 800; color: white; }

        /* SVG Elements */
        svg { width: 100%; height: 100%; }
        
        .infinite-line { stroke: var(--line-color); stroke-width: 3; opacity: 0.6; }
        .polygon-shape { fill: rgba(139, 92, 246, 0.3); stroke: var(--primary); stroke-width: 4; stroke-linejoin: round; transition: fill 0.3s; }
        .polygon-shape:hover { fill: rgba(139, 92, 246, 0.5); }
        
        .vertex { fill: white; r: 8; cursor: grab; stroke: var(--bg); stroke-width: 3; transition: r 0.2s;}
        .vertex:hover { r: 12; fill: var(--highlight); }
        .vertex:active { cursor: grabbing; }

        .vertex-label { font-size: 16px; font-weight: 800; fill: var(--highlight); user-select: none; pointer-events: none;}

        .status-badge {
            position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.6); padding: 10px 20px;
            border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); font-weight: 800; font-size: 1.5rem;
            backdrop-filter: blur(5px); color: var(--highlight); text-transform: uppercase; letter-spacing: 2px;
        }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
            .canvas-area { height: 400px; }
            .header { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.5.3.5. Çokgenlerin Oluşumu</div>
    </div>

    <div class="container">
        
        <div class="canvas-area">
            <div class="status-badge" id="statusBadge">ÜÇGEN</div>
            <svg id="svgCanvas" viewBox="0 0 700 550">
                <g id="linesGroup"></g>
                <polygon id="polyShape" class="polygon-shape"></polygon>
                <g id="labelsGroup"></g>
                <g id="verticesGroup"></g>
            </svg>
        </div>

        <div class="tools-area">
            <div class="panel">
                <div class="panel-title">Kesişen Doğru Sayısı</div>
                <button class="mode-btn active" onclick="setPolygon(3)" id="btn3">3 Doğru (Üçgen) <span>△</span></button>
                <button class="mode-btn" onclick="setPolygon(4)" id="btn4">4 Doğru (Dörtgen) <span>▱</span></button>
                <button class="mode-btn" onclick="setPolygon(5)" id="btn5">5 Doğru (Beşgen) <span>⬟</span></button>
                <button class="mode-btn" onclick="setPolygon(6)" id="btn6">6 Doğru (Altıgen) <span>⬡</span></button>
            </div>

            <div class="panel">
                <div class="panel-title">Çokgen Analizi</div>
                <div class="stat-box"><span>Doğru Sayısı:</span> <span id="statLines">3</span></div>
                <div class="stat-box"><span>Kenar Sayısı:</span> <span id="statEdges">3</span></div>
                <div class="stat-box"><span>Köşe Sayısı:</span> <span id="statVertices">3</span></div>
                
                <div class="info-box" id="infoBox">
                    <span>3 adet doğru</span> ardışık olarak kesiştiğinde ortada kapalı bir bölge oluşturur. Bu kapalı şekle <span>ÜÇGEN</span> denir. Beyaz noktalardan tutup sürükleyebilirsin!
                </div>
            </div>
        </div>

    </div>

    <script>
        const svgCanvas = document.getElementById('svgCanvas');
        const linesGroup = document.getElementById('linesGroup');
        const polyShape = document.getElementById('polyShape');
        const verticesGroup = document.getElementById('verticesGroup');
        const labelsGroup = document.getElementById('labelsGroup');
        
        const statusBadge = document.getElementById('statusBadge');
        const statLines = document.getElementById('statLines');
        const statEdges = document.getElementById('statEdges');
        const statVertices = document.getElementById('statVertices');
        const infoBox = document.getElementById('infoBox');

        let points = [];
        let numSides = 3;
        const centerX = 350;
        const centerY = 275;
        const radius = 150;
        const labels = ['A', 'B', 'C', 'D', 'E', 'F'];

        let draggingPoint = null;

        // Initialize regular polygon points
        function initPoints(n) {
            points = [];
            for (let i = 0; i < n; i++) {
                // Offset by -90 deg so the first point is at the top
                let angle = (i * 360 / n - 90) * Math.PI / 180;
                points.push({
                    x: centerX + radius * Math.cos(angle),
                    y: centerY + radius * Math.sin(angle)
                });
            }
        }

        // Generate an infinite line passing through two points
        function getInfiniteLine(p1, p2) {
            let dx = p2.x - p1.x;
            let dy = p2.y - p1.y;
            // Extend 1000px in both directions
            let scale = 1000 / Math.sqrt(dx*dx + dy*dy);
            return {
                x1: p1.x - dx * scale,
                y1: p1.y - dy * scale,
                x2: p2.x + dx * scale,
                y2: p2.y + dy * scale
            };
        }

        function render() {
            // Draw Polygon
            let pointsStr = points.map(p => `${p.x},${p.y}`).join(' ');
            polyShape.setAttribute('points', pointsStr);

            // Draw Lines and Vertices
            linesGroup.innerHTML = '';
            verticesGroup.innerHTML = '';
            labelsGroup.innerHTML = '';

            for (let i = 0; i < numSides; i++) {
                let p1 = points[i];
                let p2 = points[(i + 1) % numSides];
                
                // Line
                let lineData = getInfiniteLine(p1, p2);
                let line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', lineData.x1);
                line.setAttribute('y1', lineData.y1);
                line.setAttribute('x2', lineData.x2);
                line.setAttribute('y2', lineData.y2);
                line.setAttribute('class', 'infinite-line');
                linesGroup.appendChild(line);

                // Vertex
                let circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', p1.x);
                circle.setAttribute('cy', p1.y);
                circle.setAttribute('class', 'vertex');
                circle.addEventListener('mousedown', (e) => startDrag(e, i));
                circle.addEventListener('touchstart', (e) => startDrag(e, i), {passive: false});
                verticesGroup.appendChild(circle);

                // Label
                let text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                // push label away from center
                let lx = p1.x + (p1.x - centerX) * 0.15;
                let ly = p1.y + (p1.y - centerY) * 0.15;
                text.setAttribute('x', lx);
                text.setAttribute('y', ly);
                text.setAttribute('class', 'vertex-label');
                text.setAttribute('text-anchor', 'middle');
                text.setAttribute('dominant-baseline', 'central');
                text.textContent = labels[i];
                labelsGroup.appendChild(text);
            }
        }

        // Drag Logic
        function startDrag(e, index) {
            e.preventDefault();
            draggingPoint = index;
        }

        function onDrag(e) {
            if (draggingPoint === null) return;
            e.preventDefault();

            let clientX = e.clientX;
            let clientY = e.clientY;
            
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }

            // Convert to SVG coordinates
            let rect = svgCanvas.getBoundingClientRect();
            // Assuming viewBox scale is 1:1 for simplicity, or calc ratio
            let scaleX = 700 / rect.width;
            let scaleY = 550 / rect.height;

            let x = (clientX - rect.left) * scaleX;
            let y = (clientY - rect.top) * scaleY;

            points[draggingPoint].x = x;
            points[draggingPoint].y = y;

            render();
        }

        function endDrag() {
            draggingPoint = null;
        }

        window.addEventListener('mousemove', onDrag);
        window.addEventListener('touchmove', onDrag, {passive: false});
        window.addEventListener('mouseup', endDrag);
        window.addEventListener('touchend', endDrag);

        const names = {3: "ÜÇGEN", 4: "DÖRTGEN", 5: "BEŞGEN", 6: "ALTIGEN"};

        window.setPolygon = function(n) {
            numSides = n;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn${n}`).classList.add('active');

            initPoints(n);
            render();

            statusBadge.innerText = names[n];
            statLines.innerText = n;
            statEdges.innerText = n;
            statVertices.innerText = n;

            infoBox.innerHTML = `<span>${n} adet doğru</span> ardışık olarak kesiştiğinde ortada kapalı bir bölge oluşturur. Bu kapalı şekle <span>${names[n]}</span> denir. Beyaz noktalardan (köşelerden) tutup sürükleyebilirsin!`;
        }

        // Start
        setPolygon(3);

    </script>
</body>
</html>
