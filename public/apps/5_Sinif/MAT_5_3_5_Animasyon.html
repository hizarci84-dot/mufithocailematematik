<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çokgenlerin Doğuşu Animasyonu</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F172A;
            --text: #F8FAFC;
            --primary: #8B5CF6; /* Purple */
            --secondary: #F43F5E; /* Rose */
            --tertiary: #10B981; /* Green */
            --highlight: #FDE047; /* Yellow */
            --line-color: #38BDF8; /* Blue */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px; overflow-x: hidden;
        }

        .header {
            width: 100%; max-width: 900px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area { text-align: center; width: 100%; max-width: 800px; margin-bottom: 20px; height: 120px;}
        h1 { font-size: 2.2rem; color: var(--highlight); text-shadow: 0 5px 15px rgba(0,0,0,0.5); line-height: 1.3; transition: opacity 0.5s;}
        .subtitle { font-size: 1.2rem; color: #94A3B8; margin-top: 10px; transition: opacity 0.5s; line-height: 1.5;}
        .subtitle span { color: white; font-weight: 800; background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 5px;}

        .canvas-area {
            position: relative; width: 100%; max-width: 800px; height: 450px; 
            background: #0B1120; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.3); 
            overflow: hidden; display: flex; align-items: center; justify-content: center;
        }

        svg { width: 100%; height: 100%; overflow: visible; }
        
        .anim-line { 
            stroke: var(--line-color); stroke-width: 4;
            opacity: 0.8;
            /* Animation handled by JS */
        }
        
        .polygon-fill { 
            fill: rgba(139, 92, 246, 0.4); stroke: none; opacity: 0; transition: opacity 1s; 
        }
        .polygon-outline {
            fill: none; stroke: var(--highlight); stroke-width: 5; opacity: 0; transition: opacity 1s; stroke-linejoin: round;
        }

        .vertex { fill: white; r: 0; stroke: var(--secondary); stroke-width: 3; transition: r 0.5s, stroke-width 0.5s;}
        .vertex-label { font-size: 20px; font-weight: 800; fill: var(--highlight); opacity: 0; transition: opacity 0.5s;}

        .btn-start {
            margin-top: 30px; background: var(--primary); color: white; border: none; padding: 15px 40px; border-radius: 50px;
            font-size: 1.2rem; font-weight: 800; cursor: pointer; transition: all 0.3s; box-shadow: 0 10px 20px rgba(139, 92, 246, 0.4);
        }
        .btn-start:hover { transform: scale(1.05); }

        @media (max-width: 768px) {
            .header { flex-direction: column; gap: 10px; }
            h1 { font-size: 1.5rem; }
            .canvas-area { height: 300px; }
            .title-area { height: 140px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.5.3.5. Çokgenlerin Oluşumu</div>
    </div>

    <div class="title-area">
        <h1 id="mTitle">Çokgen Nedir?</h1>
        <p class="subtitle" id="mSub">Doğruların kesişimiyle ortaya çıkan kapalı dünyalar...</p>
    </div>

    <div class="canvas-area">
        <svg viewBox="0 0 800 450" id="svgView">
            <!-- Polygon Background -->
            <polygon id="polyFill" class="polygon-fill"></polygon>
            
            <!-- Lines will be injected here -->
            <g id="linesGroup"></g>
            
            <!-- Polygon Outline (Kenarlar) -->
            <polygon id="polyOutline" class="polygon-outline"></polygon>
            
            <!-- Vertices and labels -->
            <g id="verticesGroup"></g>
            <g id="labelsGroup"></g>
        </svg>
    </div>

    <button class="btn-start" id="startBtn" onclick="runTimeline()">Animasyonu Başlat</button>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        
        const mTitle = document.getElementById('mTitle');
        const mSub = document.getElementById('mSub');
        const startBtn = document.getElementById('startBtn');
        const linesGroup = document.getElementById('linesGroup');
        const verticesGroup = document.getElementById('verticesGroup');
        const labelsGroup = document.getElementById('labelsGroup');
        const polyFill = document.getElementById('polyFill');
        const polyOutline = document.getElementById('polyOutline');

        const centerX = 400;
        const centerY = 225;

        function getLineLength(x1, y1, x2, y2) {
            return Math.sqrt((x2-x1)**2 + (y2-y1)**2);
        }

        async function drawAnimatedLine(x1, y1, x2, y2, duration = 1000) {
            let line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', x1);
            line.setAttribute('y1', y1);
            line.setAttribute('x2', x2);
            line.setAttribute('y2', y2);
            line.setAttribute('class', 'anim-line');
            
            let len = getLineLength(x1, y1, x2, y2);
            // Add extra to dasharray to prevent Safari round-cap artifacts
            line.style.strokeDasharray = (len + 10) + ' ' + (len + 10);
            line.style.strokeDashoffset = len + 10;
            linesGroup.appendChild(line);

            // Animate
            let startTime = performance.now();
            return new Promise(resolve => {
                function step(time) {
                    let progress = (time - startTime) / duration;
                    if (progress > 1) progress = 1;
                    
                    // Ease out
                    let ease = 1 - Math.pow(1 - progress, 3);
                    line.style.strokeDashoffset = (len + 10) - (len + 10) * ease;
                    
                    if (progress < 1) requestAnimationFrame(step);
                    else resolve();
                }
                requestAnimationFrame(step);
            });
        }

        function createVertex(cx, cy, labelStr) {
            // Circle
            let circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            circle.setAttribute('cx', cx);
            circle.setAttribute('cy', cy);
            circle.setAttribute('class', 'vertex');
            verticesGroup.appendChild(circle);
            
            // Trigger animation
            setTimeout(() => { circle.style.r = 8; }, 50);

            // Text
            let text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            // Offset text slightly outwards
            let lx = cx + (cx - centerX) * 0.2;
            let ly = cy + (cy - centerY) * 0.2;
            text.setAttribute('x', lx);
            text.setAttribute('y', ly);
            text.setAttribute('class', 'vertex-label');
            text.setAttribute('text-anchor', 'middle');
            text.setAttribute('dominant-baseline', 'central');
            text.textContent = labelStr;
            labelsGroup.appendChild(text);

            setTimeout(() => { text.style.opacity = 1; }, 200);
        }

        function clearCanvas() {
            linesGroup.innerHTML = '';
            verticesGroup.innerHTML = '';
            labelsGroup.innerHTML = '';
            polyFill.style.opacity = 0;
            polyOutline.style.opacity = 0;
            return sleep(1000); // wait for fade out
        }

        async function runTimeline() {
            startBtn.style.display = 'none';

            // SCENE 1: Triangle Creation
            await clearCanvas();
            mTitle.innerText = "1. Üçgenin Doğuşu";
            mSub.innerHTML = "Düzleme birinci sonsuz doğruyu çizelim.";
            // L1 (Horizontal-ish)
            await drawAnimatedLine(100, 350, 700, 350, 1500);
            await sleep(1000);

            mSub.innerHTML = "İkinci doğru ilkini kesti. Fakat alan hala <span>açık</span>. Bir şeyin içine hapsolmadık.";
            // L2 (Diagonal)
            await drawAnimatedLine(200, 450, 450, 50, 1500);
            await sleep(1500);

            mSub.innerHTML = "İşte sihir! <span>Son doğru, ilk doğruyla kesiştiğinde</span> her şey değişir.";
            // L3 (Diagonal back)
            await drawAnimatedLine(600, 450, 350, 50, 1500);
            await sleep(1000);

            mSub.innerHTML = "En az üç doğrunun kapattığı bu bölgeye <span>ÜÇGEN</span> adını veriyoruz.";
            // True mathematical intersections for Triangle
            polyFill.setAttribute('points', "400,130 262.5,350 537.5,350"); 
            polyFill.style.opacity = 1;
            await sleep(3000);

            mSub.innerHTML = "Doğruların kesiştiği bu 3 noktaya <span>Köşe (A, B, C)</span> denir.";
            createVertex(400, 130, "A"); await sleep(500);
            createVertex(262.5, 350, "B"); await sleep(500);
            createVertex(537.5, 350, "C"); await sleep(2000);

            mSub.innerHTML = "Köşeler arasında kalan, doğruların sınır kısımlarına ise <span>Kenar</span> denir.";
            polyOutline.setAttribute('points', "400,130 262.5,350 537.5,350");
            polyOutline.style.opacity = 1;
            
            // Pulse outline
            for(let i=0; i<3; i++) {
                polyOutline.style.strokeWidth = 10;
                await sleep(400);
                polyOutline.style.strokeWidth = 5;
                await sleep(400);
            }
            await sleep(2000);


            // SCENE 2: Quadrilateral
            mTitle.innerText = "2. Dörtgenin Doğuşu";
            mSub.innerHTML = "Peki ya 4 doğru kesişseydi?";
            await clearCanvas();

            // L1 top
            await drawAnimatedLine(150, 150, 650, 150, 1000);
            // L2 right
            await drawAnimatedLine(600, 50, 500, 400, 1000);
            // L3 bottom
            await drawAnimatedLine(650, 350, 150, 350, 1000);
            
            mSub.innerHTML = "Dördüncü doğru, birinci doğruyla kesişerek kapıyı kapatıyor!";
            // L4 left
            await drawAnimatedLine(200, 400, 300, 50, 1000);
            await sleep(500);

            // True mathematical intersections for Quadrilateral
            polyFill.setAttribute('points', "271.4,150 571.4,150 514.3,350 214.3,350");
            polyFill.style.opacity = 1;
            mSub.innerHTML = "Karşınızda 4 köşesi ve 4 kenarı olan bir <span>DÖRTGEN!</span>";
            
            createVertex(271.4, 150, "K");
            createVertex(571.4, 150, "L");
            createVertex(514.3, 350, "M");
            createVertex(214.3, 350, "N");
            await sleep(3500);


            // END
            mTitle.innerText = "Altın Kural!";
            mSub.innerHTML = "Çokgenler, sonsuz doğruların düzlemde kesişerek oluşturduğu <span>kapalı şekillerdir.</span> 🎓";
            
            setTimeout(() => {
                startBtn.style.display = 'block';
                startBtn.innerText = "Tekrar İzle";
            }, 3000);
        }
    </script>
</body>
</html>
