<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pisagor Su Deneyi (Animasyon)</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <!-- MATHJAX -->
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root { --bg:#0F0E17; --primary:#8B5CF6; --secondary:#10B981; --tertiary:#06B6D4; --danger:#F43F5E; --accent:#F59E0B; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Outfit',sans-serif; }
        body { background:linear-gradient(135deg,var(--bg),#161625); color:#F8FAFC; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px; overflow-x:hidden; }
        
        .header { width:100%; max-width:1100px; display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,0.05); padding:15px 25px; border-radius:20px; border:1px solid rgba(139,92,246,0.2); margin-bottom:20px; backdrop-filter:blur(10px); }
        .header-left { display:flex; align-items:center; gap:15px; font-weight:600; font-size:1.2rem; }
        .header-left img { width:50px; height:50px; border-radius:50%; background:white; padding:2px; }
        .kazanim { background:var(--primary); color:white; padding:8px 20px; border-radius:20px; font-weight:800; font-size:1rem; box-shadow: 0 0 20px rgba(139,92,246,0.4); }
        
        h1 { font-size:2.5rem; color:var(--tertiary); font-weight:900; text-align:center; margin-bottom:5px; }
        .subtitle { color:#94A3B8; font-size:1.15rem; text-align:center; margin-bottom:25px; font-weight:600; max-width:800px; }
        
        .workspace { width:100%; max-width:1100px; background:#11111A; border:1px solid rgba(255,255,255,0.1); border-radius:24px; padding:30px; box-shadow:inset 0 0 50px rgba(0,0,0,0.5); display:flex; flex-direction:column; align-items:center; min-height:600px; position:relative; overflow:hidden; }
        
        .expl-text { background:rgba(139,92,246,0.15); border:1px solid rgba(139,92,246,0.4); padding:15px 25px; border-radius:15px; font-size:1.3rem; color:white; font-weight:800; text-align:center; width:100%; margin-bottom:20px; transition:all 0.5s; box-shadow:0 8px 32px rgba(0,0,0,0.3); min-height:65px; display:flex; align-items:center; justify-content:center; }
        
        .math-rule-box { background:rgba(15,14,23,0.95); border:2px solid #334155; padding:15px 30px; border-radius:15px; font-size:1.6rem; font-weight:900; color:white; display:flex; align-items:center; justify-content:center; transition:0.5s; min-width:400px; box-shadow:0 10px 20px rgba(0,0,0,0.5); margin-bottom:30px; }
        
        /* Experiment Area */
        .svg-container { position:relative; width:600px; height:500px; background:rgba(255,255,255,0.02); border-radius:10px; border:1px solid rgba(255,255,255,0.1); display:flex; justify-content:center; align-items:center; overflow:hidden; }
        
        .outline { fill:transparent; stroke:rgba(255,255,255,0.3); stroke-width:3; }
        .triangle { fill:rgba(139,92,246,0.2); stroke:var(--primary); stroke-width:4; }
        
        /* Water inside squares */
        /* To make water level drop/rise properly, we need rects inside clipPaths */
        .water { fill:var(--tertiary); opacity:0.8; transition:all 4s linear; filter:drop-shadow(0 0 10px var(--tertiary)); }
        
        .lbl { fill:white; font-family:Outfit; font-weight:900; font-size:24px; text-anchor:middle; dominant-baseline: middle; }

    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=8B5CF6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.9.4.2. Pisagor Bağıntısı (Animasyon)</div>
    </div>
    
    <h1>Pisagor Su Deneyi</h1>
    <p class="subtitle">Dik üçgenin dik kenarları üzerine kurulan karelerin alanları toplamı, hipotenüs üzerine kurulan karenin alanına eşittir.</p>
    
    <div class="workspace">
        <div class="expl-text" id="explText">Simülasyon başlıyor... (3-4-5 dik üçgeni)</div>
        
        <div class="math-rule-box" id="ruleBox">
            <span id="mathOutput">\( a^2 + b^2 = c^2 \)</span>
        </div>
        
        <div class="svg-container">
            <svg width="100%" height="100%" viewBox="0 0 600 500" preserveAspectRatio="xMidYMid meet" id="mainSvg">
                <defs>
                    <!-- Clip path for Square a (3x3 = 9) -->
                    <!-- Top-Left Square -->
                    <clipPath id="clipA">
                        <polygon points="135,160 225,40 345,130 255,250" />
                    </clipPath>
                    
                    <!-- Clip path for Square b (4x4 = 16) -->
                    <!-- Top-Right Square -->
                    <clipPath id="clipB">
                        <polygon points="255,250 345,130 505,250 415,370" />
                    </clipPath>
                    
                    <!-- Clip path for Square c (5x5 = 25) -->
                    <!-- Bottom Square -->
                    <clipPath id="clipC">
                        <polygon points="135,160 255,250 345,370 225,490 15,370" />
                        <!-- Wait, let's just make the triangle horizontal for easier coordinates. -->
                    </clipPath>
                </defs>
                <!-- Redoing coordinates for a horizontal hypotenuse triangle -->
                <!-- 
                   Let triangle vertices be:
                   A (top right angle)
                   B (bottom left)
                   C (bottom right)
                   
                   To make water flow down, let Hypotenuse (BC) be horizontal at the bottom.
                   Length c = 5 (say 250px).
                   B = (175, 250), C = (425, 250).
                   Height of A from BC: a*b/c = 3*4/5 = 2.4 (120px).
                   Projection of A on BC: b^2/c = 16/5 = 3.2 from C? No, from B it's a^2/c = 9/5 = 1.8 (90px).
                   So A = (175 + 90, 250 - 120) = (265, 130).
                   
                   Square on a (AB): length 3 (150px).
                   Vertices: A(265, 130), B(175, 250)
                   Vector AB = (-90, 120). Normal = (-120, -90).
                   So outer vertices: A + N = (145, 40), B + N = (55, 160).
                   Polygon A: 265,130 -> 175,250 -> 55,160 -> 145,40
                   
                   Square on b (AC): length 4 (200px).
                   Vertices: A(265, 130), C(425, 250)
                   Vector AC = (160, 120). Normal = (120, -160).
                   Outer vertices: A + N = (385, -30), C + N = (545, 90).
                   Polygon B: 265,130 -> 425,250 -> 545,90 -> 385,-30
                   
                   Square on c (BC): length 5 (250px).
                   Vertices: B(175, 250), C(425, 250)
                   Downward Normal = (0, 250).
                   Outer vertices: B + N = (175, 500), C + N = (425, 500).
                   Polygon C: 175,250 -> 425,250 -> 425,500 -> 175,500
                -->
                
                <defs>
                    <clipPath id="clipA_new">
                        <polygon points="265,130 175,250 55,160 145,40" />
                    </clipPath>
                    <clipPath id="clipB_new">
                        <polygon points="265,130 425,250 545,90 385,-30" />
                    </clipPath>
                    <clipPath id="clipC_new">
                        <polygon points="175,250 425,250 425,500 175,500" />
                    </clipPath>
                </defs>
                
                <!-- Center Triangle -->
                <polygon points="265,130 175,250 425,250" class="triangle" />
                <text x="210" y="210" fill="#8B5CF6" font-family="Outfit" font-weight="900" font-size="20">a=3</text>
                <text x="340" y="210" fill="#8B5CF6" font-family="Outfit" font-weight="900" font-size="20">b=4</text>
                <text x="300" y="240" fill="#8B5CF6" font-family="Outfit" font-weight="900" font-size="20">c=5</text>
                
                <!-- Square Outlines -->
                <polygon points="265,130 175,250 55,160 145,40" class="outline" />
                <polygon points="265,130 425,250 545,90 385,-30" class="outline" />
                <polygon points="175,250 425,250 425,500 175,500" class="outline" />
                
                <!-- Water Rects (to be animated) -->
                <!-- For A: Y ranges from 40 to 250. Full height 210. -->
                <rect class="water" id="waterA" x="0" y="0" width="300" height="300" clip-path="url(#clipA_new)" />
                
                <!-- For B: Y ranges from -30 to 250. Full height 280. -->
                <rect class="water" id="waterB" x="200" y="-50" width="400" height="350" clip-path="url(#clipB_new)" />
                
                <!-- For C: Y ranges from 250 to 500. We start height at 0 (so y=500, height=0). -->
                <rect class="water" id="waterC" x="175" y="500" width="250" height="0" clip-path="url(#clipC_new)" />
                
                <!-- Text inside squares -->
                <text x="145" y="150" class="lbl">a²=9</text>
                <text x="400" y="130" class="lbl">b²=16</text>
                <text x="300" y="380" class="lbl" id="lblC">c²=25</text>
            </svg>
        </div>
        
    </div>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const explText = document.getElementById('explText');
        const waterA = document.getElementById('waterA');
        const waterB = document.getElementById('waterB');
        const waterC = document.getElementById('waterC');
        
        function updateMath(texString) {
            document.getElementById('mathOutput').innerHTML = texString;
            MathJax.typesetPromise([document.getElementById('mathOutput')]);
        }

        async function runSequence() {
            MathJax.typesetPromise();
            await sleep(2000);
            
            explText.innerHTML = "Dik kenarlar (a=3 ve b=4) üzerine kurulan karelerin içi su (alan) ile doludur.";
            updateMath(`\\( 3^2 + 4^2 = ? \\)`);
            await sleep(4000);
            
            explText.innerHTML = "Şimdi makineyi çalıştırıyoruz. Yukarıdaki karelerin içindeki su, hipotenüs (c=5) üzerindeki kareye akacak.";
            
            // Animation Trigger
            // Empty A and B
            waterA.style.transform = "translateY(250px)";
            waterB.style.transform = "translateY(300px)";
            
            // Fill C with smooth animation (CSS transitions don't work on SVG attributes set via JS)
            const duration = 4000;
            const startTime = performance.now();
            const startY = 500, endY = 250;
            const startH = 0, endH = 250;
            function animateWaterC(now) {
                let t = Math.min((now - startTime) / duration, 1);
                let eased = t * t * (3 - 2 * t); // smoothstep
                waterC.setAttribute('y', startY + (endY - startY) * eased);
                waterC.setAttribute('height', startH + (endH - startH) * eased);
                if (t < 1) requestAnimationFrame(animateWaterC);
            }
            requestAnimationFrame(animateWaterC);
            
            ruleBox.style.borderColor = "var(--tertiary)";
            ruleBox.style.boxShadow = "0 0 30px rgba(6,182,212,0.5)";
            
            await sleep(4000); // 4 seconds for water to flow
            
            explText.innerHTML = "Dikkat! Su miktarı (alan) tamı tamına yetti. Hiç boşluk kalmadı, hiç su taşmadı.";
            updateMath(`\\( 9 + 16 = 25 \\)`);
            
            await sleep(3500);
            
            explText.innerHTML = "Bu ünlü görsel ispat (Pisagor Su Deneyi), <b>a² + b² = c²</b> teoreminin en somut halidir.";
            updateMath(`\\( a^2 + b^2 = c^2 \\)`);
            ruleBox.style.borderColor = "var(--secondary)";
            ruleBox.style.boxShadow = "0 0 30px rgba(16,185,129,0.5)";
            
            await sleep(4000);
            explText.innerHTML = "🔄 Animasyon bitti. Sayfayı yenileyerek suyun akışını tekrar izleyebilirsiniz.";
        }

        window.onload = runSequence;
    </script>
</body>
</html>
