<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sayı Aralıkları ve Kümeler</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#0F0E17; --primary:#8B5CF6; --secondary:#10B981; --tertiary:#06B6D4; --danger:#F43F5E; --accent:#F59E0B; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Outfit',sans-serif; }
        body { background:linear-gradient(135deg,var(--bg),#161625); color:#F8FAFC; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px; overflow-x:hidden; }
        
        .header { width:100%; max-width:1100px; display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,0.05); padding:15px 25px; border-radius:20px; border:1px solid rgba(139,92,246,0.2); margin-bottom:20px; backdrop-filter:blur(10px); }
        .header-left { display:flex; align-items:center; gap:15px; font-weight:600; font-size:1.2rem; }
        .header-left img { width:50px; height:50px; border-radius:50%; background:white; padding:2px; }
        .kazanim { background:var(--primary); color:white; padding:8px 20px; border-radius:20px; font-weight:800; font-size:1rem; box-shadow: 0 0 20px rgba(139,92,246,0.4); }
        
        h1 { font-size:2.5rem; color:var(--tertiary); font-weight:900; text-align:center; margin-bottom:5px; }
        .subtitle { color:#94A3B8; font-size:1.15rem; text-align:center; margin-bottom:25px; font-weight:600; max-width:800px; }
        
        .expl-text { background:rgba(139,92,246,0.15); border:1px solid rgba(139,92,246,0.4); padding:15px 25px; border-radius:15px; font-size:1.3rem; color:white; font-weight:800; text-align:center; width:100%; max-width:1100px; margin-bottom:20px; transition:all 0.5s; backdrop-filter:blur(5px); box-shadow:0 8px 32px rgba(0,0,0,0.3); min-height:65px; display:flex; align-items:center; justify-content:center; }
        
        .stage { width:100%; max-width:1100px; background:#11111A; border:1px solid rgba(255,255,255,0.1); border-radius:24px; position:relative; min-height:500px; overflow:hidden; box-shadow:inset 0 0 50px rgba(0,0,0,0.5); display:flex; flex-direction:column; align-items:center; justify-content:center; padding: 40px 20px; }
        
        /* Number Line Base */
        .number-line-container { position:relative; width:90%; height:80px; margin-top:50px; }
        .number-line { position:absolute; top:40px; left:0; width:100%; height:4px; background:rgba(255,255,255,0.2); border-radius:2px; }
        .tick { position:absolute; top:30px; width:2px; height:24px; background:rgba(255,255,255,0.4); transform:translateX(-50%); }
        .tick-label { position:absolute; top:60px; transform:translateX(-50%); font-weight:900; font-size:1.2rem; color:#94A3B8; }
        
        /* Radar Range */
        .radar-center { position:absolute; top:35px; left:50%; width:14px; height:14px; border-radius:50%; background:var(--danger); transform:translateX(-50%); box-shadow:0 0 20px var(--danger); opacity:0; transition:1s; z-index:10;}
        .radar-range { position:absolute; top:35px; height:14px; background:rgba(244,63,94,0.4); border-radius:7px; opacity:0; transition:all 1s cubic-bezier(0.2, 0.8, 0.2, 1); transform:translateY(-50%); z-index:5;}
        
        /* Set Beams (Kesişim) */
        .beam { position:absolute; height:0; top:-200px; opacity:0; transition:all 1.5s ease-in-out; border-radius:0 0 10px 10px; z-index:4; mix-blend-mode: screen; }
        .beam-a { background:linear-gradient(to bottom, rgba(139,92,246,0) 0%, rgba(139,92,246,0.8) 100%); }
        .beam-b { background:linear-gradient(to bottom, rgba(16,185,129,0) 0%, rgba(16,185,129,0.8) 100%); }
        
        .beam-range { position:absolute; top:40px; height:6px; transform:translateY(-50%); opacity:0; transition:0.5s; z-index:6; }
        .beam-range-a { background:var(--primary); }
        .beam-range-b { background:var(--secondary); }
        
        /* Open/Closed Circles */
        .circle-open { position:absolute; width:14px; height:14px; border-radius:50%; border:3px solid; background:#11111A; transform:translate(-50%, -50%); top:40px; z-index:8; opacity:0; transition:0.5s; }
        .circle-closed { position:absolute; width:14px; height:14px; border-radius:50%; background:currentColor; transform:translate(-50%, -50%); top:40px; z-index:8; opacity:0; transition:0.5s; }
        
        /* Math Rule Box */
        .math-rule-box { position:absolute; bottom:30px; left:50%; transform:translateX(-50%); background:rgba(15,14,23,0.95); border:2px solid var(--tertiary); padding:15px 30px; border-radius:15px; font-size:1.8rem; font-weight:900; color:white; display:flex; align-items:center; justify-content:center; gap:10px; opacity:0; transition:0.5s; font-family:'Courier New', monospace; box-shadow:0 10px 30px rgba(6,182,212,0.3); }
        .math-rule-box .abs-bar { color:var(--tertiary); border-left:2px solid var(--tertiary); border-right:2px solid var(--tertiary); padding:0 8px; }
        
        .btn-action { background:var(--primary); color:white; border:none; padding:15px 40px; border-radius:50px; font-size:1.2rem; font-weight:900; cursor:pointer; box-shadow:0 10px 20px rgba(139,92,246,0.4); margin-top:30px; transition:0.3s; z-index:20; }
        .btn-action:hover { transform:translateY(-3px); box-shadow:0 15px 25px rgba(139,92,246,0.6); }

    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=8B5CF6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.9.1.2. Gerçek Sayı Aralıkları (Animasyon)</div>
    </div>
    
    <h1>Radar Menzili ve Kümelerin Kesişimi</h1>
    <p class="subtitle">Mutlak değerin bir "uzaklık" olduğunu keşfedin. Aralıkların sayı doğrusunda nasıl birleştiğini izleyin.</p>
    
    <div class="expl-text" id="explText">👇 Animasyonu başlatmak için butona tıklayın.</div>
    
    <div class="stage">
        
        <div class="number-line-container" id="nlCont">
            <div class="number-line"></div>
            <!-- Ticks -2 to 8 -->
            <script>
                for(let i=-2; i<=8; i++) {
                    let pct = ((i + 2) / 10) * 100;
                    document.write(`<div class="tick" style="left:${pct}%"></div>`);
                    document.write(`<div class="tick-label" style="left:${pct}%">${i}</div>`);
                }
            </script>
            
            <!-- Radar Elements -->
            <div class="radar-center" id="radarCenter" style="left:50%;"></div>
            <div class="radar-range" id="radarRange" style="left:50%; width:0;"></div>
            
            <div class="circle-closed" id="mutStart" style="color:var(--danger); left:30%;"></div>
            <div class="circle-closed" id="mutEnd" style="color:var(--danger); left:70%;"></div>
            
            <!-- Beam Elements -->
            <!-- Beam A: [1, 5) -->
            <div class="beam beam-a" id="beamA" style="left:30%; width:40%;"></div>
            <div class="beam-range beam-range-a" id="beamRangeA" style="left:30%; width:40%;"></div>
            <div class="circle-closed" id="aStart" style="color:var(--primary); left:30%;"></div>
            <div class="circle-open" id="aEnd" style="border-color:var(--primary); left:70%;"></div>
            
            <!-- Beam B: (3, 7] -->
            <div class="beam beam-b" id="beamB" style="left:50%; width:40%;"></div>
            <div class="beam-range beam-range-b" id="beamRangeB" style="left:50%; width:40%;"></div>
            <div class="circle-open" id="bStart" style="border-color:var(--secondary); left:50%;"></div>
            <div class="circle-closed" id="bEnd" style="color:var(--secondary); left:90%;"></div>
            
        </div>
        
        <div class="math-rule-box" id="ruleBox">
            <!-- Dynamic Content -->
        </div>
        
        <button class="btn-action" id="btnPlay" onclick="runSequence()" style="display:none">Animasyonu Başlat</button>
    </div>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const expl = document.getElementById('explText');
        const rule = document.getElementById('ruleBox');
        
        async function runSequence() {
            document.getElementById('btnPlay').style.display = 'none';
            
            // PART 1: Radar (Absolute Value)
            expl.innerHTML = "📡 Bir radar istasyonu sayı doğrusunda <b>3</b> noktasına kuruldu.";
            let rCenter = document.getElementById('radarCenter');
            rCenter.style.opacity = '1';
            
            await sleep(2000);
            
            expl.innerHTML = "Sinyalin ulaşabildiği maksimum mesafe (tolerans) <b>2 birimdir</b>.";
            let rRange = document.getElementById('radarRange');
            let mStart = document.getElementById('mutStart');
            let mEnd = document.getElementById('mutEnd');
            
            rRange.style.opacity = '1';
            rRange.style.left = '30%'; // 1 position
            rRange.style.width = '40%'; // length 4 (from 1 to 5)
            
            await sleep(1500);
            mStart.style.opacity = '1';
            mEnd.style.opacity = '1';
            
            rule.innerHTML = `<span class="abs-bar">x - 3</span> &le; 2`;
            rule.style.opacity = '1';
            rule.style.borderColor = "var(--danger)";
            
            expl.innerHTML = "Matematikte '3 noktasına en fazla 2 birim uzaklık' cümlesi <b>Mutlak Değer</b> ile ifade edilir: |x - 3| ≤ 2";
            
            await sleep(5000);
            
            // Clear Part 1
            rCenter.style.opacity = '0';
            rRange.style.opacity = '0';
            mStart.style.opacity = '0';
            mEnd.style.opacity = '0';
            rule.style.opacity = '0';
            
            await sleep(1000);
            
            // PART 2: Sets Intersection
            expl.innerHTML = "🛸 Şimdi gökyüzünden sayı doğrusuna inen lazer ışınlarını inceleyelim. Mavi Işın: <b>A = [1, 5)</b> aralığını tarıyor.";
            
            let beamA = document.getElementById('beamA');
            let brA = document.getElementById('beamRangeA');
            let aS = document.getElementById('aStart');
            let aE = document.getElementById('aEnd');
            
            beamA.style.height = "240px";
            beamA.style.opacity = "1";
            await sleep(1000);
            brA.style.opacity = '1';
            aS.style.opacity = '1';
            aE.style.opacity = '1';
            
            await sleep(2500);
            
            expl.innerHTML = "Sarı Işın: <b>B = (3, 7]</b> aralığını tarıyor.";
            let beamB = document.getElementById('beamB');
            let brB = document.getElementById('beamRangeB');
            let bS = document.getElementById('bStart');
            let bE = document.getElementById('bEnd');
            
            beamB.style.height = "240px";
            beamB.style.opacity = "1";
            await sleep(1000);
            brB.style.opacity = '1';
            bS.style.opacity = '1';
            bE.style.opacity = '1';
            
            await sleep(2500);
            
            expl.innerHTML = "✨ İki ışının üst üste bindiği yer <b>Kesişim Kümesidir (A ∩ B)</b>. Renklerin birleştiği bölgeye dikkat edin.";
            
            rule.innerHTML = `<span style="color:white; font-family:'Outfit';">A ∩ B = (3, 5)</span>`;
            rule.style.borderColor = "var(--accent)";
            rule.style.opacity = '1';
            
            // Make non-intersecting parts of beams fade slightly to emphasize center
            document.querySelectorAll('.beam').forEach(b => b.style.mixBlendMode = "plus-lighter");
            
            await sleep(5000);
            expl.innerHTML = "🔄 Tekrar izlemek için sayfayı yenileyebilirsiniz.";
        }
        window.onload = () => { runSequence(); };
    </script>
</body>
</html>
