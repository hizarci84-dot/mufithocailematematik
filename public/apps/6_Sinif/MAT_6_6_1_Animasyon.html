<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Büyük Sayılar Kanunu - Animasyon</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F172A; --text: #F8FAFC;
            --primary: #3B82F6; --secondary: #10B981;
            --tertiary: #F59E0B; --danger: #F43F5E;
            --purple: #8B5CF6; --cyan: #06B6D4;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px; overflow-x: hidden;
        }

        .header {
            width: 100%; max-width: 900px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--tertiary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area { text-align: center; width: 100%; max-width: 800px; margin-bottom: 20px; height: 110px;}
        h1 { font-size: 2.2rem; color: var(--tertiary); text-shadow: 0 5px 15px rgba(0,0,0,0.5); line-height: 1.3; transition: all 0.5s;}
        .subtitle { font-size: 1.2rem; color: #94A3B8; margin-top: 10px; line-height: 1.5; min-height: 55px; transition: all 0.5s;}
        .subtitle span { color: white; font-weight: 800; background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 5px;}

        .canvas-area {
            position: relative; width: 100%; max-width: 800px; height: 450px; 
            background: #0B1120; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.3); 
            overflow: hidden; display: flex; align-items: center; justify-content: center; flex-direction: column;
        }

        .coin-container {
            position: relative; width: 120px; height: 120px; perspective: 1000px; margin-bottom: 30px;
            transition: all 0.5s;
        }
        .coin {
            width: 100%; height: 100%; position: absolute; transform-style: preserve-3d;
            transition: transform 1s ease-out; border-radius: 50%;
            box-shadow: 0 10px 30px rgba(245, 158, 11, 0.5);
        }
        .coin-face {
            width: 100%; height: 100%; position: absolute; backface-visibility: hidden;
            display: flex; align-items: center; justify-content: center; font-size: 3rem; font-weight: 900;
            border-radius: 50%; border: 6px solid #B45309;
        }
        .coin-front { background: radial-gradient(circle, #FCD34D, #F59E0B); color: #78350F; } /* YAZI */
        .coin-back { background: radial-gradient(circle, #E2E8F0, #94A3B8); color: #334155; transform: rotateY(180deg); } /* TURA */

        .coin.flip-anim { animation: fastFlip 0.2s linear infinite; }
        @keyframes fastFlip { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(360deg); } }

        .stats-panel {
            display: flex; gap: 40px; opacity: 0; transform: translateY(20px); transition: all 0.8s;
        }
        .stat-box {
            background: rgba(255,255,255,0.05); border: 2px solid; padding: 20px 30px; border-radius: 20px;
            text-align: center; display: flex; flex-direction: column; align-items: center; min-width: 150px;
        }
        .sb-yazi { border-color: var(--tertiary); box-shadow: 0 5px 20px rgba(245, 158, 11, 0.2);}
        .sb-tura { border-color: var(--cyan); box-shadow: 0 5px 20px rgba(6, 182, 212, 0.2);}
        
        .sb-title { font-size: 1.2rem; font-weight: 800; color: #94A3B8; margin-bottom: 10px;}
        .sb-val { font-size: 3rem; font-weight: 900; color: white;}
        .sb-pct { font-size: 1.2rem; font-weight: 800; margin-top: 5px; padding: 5px 15px; border-radius: 10px; background: rgba(0,0,0,0.3);}
        .sb-yazi .sb-pct { color: var(--tertiary); }
        .sb-tura .sb-pct { color: var(--cyan); }

        .fast-forward {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 17, 32, 0.8); z-index: 10; display: flex; flex-direction: column;
            align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: 0.5s;
        }
        .ff-text { font-size: 4rem; font-weight: 900; color: var(--secondary); margin-bottom: 10px; font-variant-numeric: tabular-nums;}
        .ff-sub { font-size: 1.5rem; color: white; font-weight: 800; letter-spacing: 2px;}

        .btn-start {
            margin-top: 30px; background: var(--tertiary); color: white; border: none; padding: 15px 40px; border-radius: 50px;
            font-size: 1.2rem; font-weight: 800; cursor: pointer; transition: all 0.3s; box-shadow: 0 10px 20px rgba(245, 158, 11, 0.4);
        }
        .btn-start:hover { transform: scale(1.05); }
        .btn-start:disabled { background: #475569; box-shadow: none; cursor: not-allowed; transform: none;}

        @media (max-width: 768px) {
            .header { flex-direction: column; gap: 10px; }
            .stats-panel { gap: 15px; }
            .stat-box { padding: 15px; min-width: 120px; }
            .sb-val { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=3B82F6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.6.6.1. Deneysel Olasılık ve Büyük Sayılar Kanunu</div>
    </div>

    <div class="title-area">
        <h1 id="mTitle">Beklenti mi? Gerçeklik mi?</h1>
        <p class="subtitle" id="mSub">Bir madeni parayı havaya attığımızda Yazı gelme ihtimali teorik olarak <span>%50'dir</span> (Yarım ihtimal).</p>
    </div>

    <div class="canvas-area">
        
        <div class="coin-container" id="coinContainer">
            <div class="coin" id="coin">
                <div class="coin-face coin-front">Y</div>
                <div class="coin-face coin-back">T</div>
            </div>
        </div>

        <div class="stats-panel" id="sPanel">
            <div class="stat-box sb-yazi">
                <div class="sb-title">YAZI</div>
                <div class="sb-val" id="valY">0</div>
                <div class="sb-pct" id="pctY">%0</div>
            </div>
            <div class="stat-box sb-tura">
                <div class="sb-title">TURA</div>
                <div class="sb-val" id="valT">0</div>
                <div class="sb-pct" id="pctT">%0</div>
            </div>
        </div>

        <!-- Fast Forward Overlay -->
        <div class="fast-forward" id="ffOverlay">
            <div class="ff-text" id="ffCount">0</div>
            <div class="ff-sub">DENEY YAPILIYOR...</div>
        </div>

    </div>

    <button class="btn-start" id="startBtn" onclick="runTimeline()">Deneyi Başlat</button>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const mTitle = document.getElementById('mTitle');
        const mSub = document.getElementById('mSub');
        const startBtn = document.getElementById('startBtn');
        const coin = document.getElementById('coin');
        const coinContainer = document.getElementById('coinContainer');
        const sPanel = document.getElementById('sPanel');
        
        const valY = document.getElementById('valY');
        const pctY = document.getElementById('pctY');
        const valT = document.getElementById('valT');
        const pctT = document.getElementById('pctT');
        
        const ffOverlay = document.getElementById('ffOverlay');
        const ffCount = document.getElementById('ffCount');

        function updateStats(y, t) {
            let total = y + t;
            valY.innerText = y;
            valT.innerText = t;
            
            if(total === 0) return;
            let py = Math.round((y / total) * 100);
            let pt = 100 - py;
            
            pctY.innerText = "%" + py;
            pctT.innerText = "%" + pt;
        }

        async function runTimeline() {
            startBtn.disabled = true;
            
            // Reset
            updateStats(0, 0);
            sPanel.style.opacity = 0;
            sPanel.style.transform = "translateY(20px)";
            coin.className = "coin";
            coin.style.transform = "rotateY(0deg)";
            coinContainer.style.transform = "scale(1)";

            mTitle.innerText = "Sadece 10 Kez Atalım";
            mSub.innerHTML = "Eğer teorik olarak %50 ise, 10 atışta <span>tam olarak 5 Yazı, 5 Tura</span> mı bekleriz?";
            await sleep(2000);

            sPanel.style.opacity = 1;
            sPanel.style.transform = "translateY(0)";

            // Flip 10 times manually (Result: 7 Y, 3 T)
            let yCount = 0;
            let tCount = 0;
            let sequence = ['Y','T','Y','Y','Y','T','Y','T','Y','Y']; // 7 Y, 3 T

            for(let i=0; i<sequence.length; i++) {
                coin.className = "coin flip-anim";
                await sleep(400); // spin
                
                coin.className = "coin";
                if(sequence[i] === 'Y') {
                    coin.style.transform = "rotateY(" + (360 * 3) + "deg)"; // Land on Front
                    yCount++;
                } else {
                    coin.style.transform = "rotateY(" + (360 * 3 + 180) + "deg)"; // Land on Back
                    tCount++;
                }
                
                await sleep(400);
                updateStats(yCount, tCount);
                await sleep(300);
            }

            await sleep(1000);
            mTitle.innerText = "Deneysel Olasılık";
            mSub.innerHTML = "Gördüğünüz gibi 10 deneyin sonucunda <span>%70 Yazı</span> geldi! Teorik beklentiden uzaklaştık.";
            await sleep(4000);

            mTitle.innerText = "Peki Ya 1000 Kere Atsaydık?";
            mSub.innerHTML = "Büyük Sayılar Kanunu der ki: Deney sayısı arttıkça, sonuçlar <span>teorik olasılığa (%50)</span> yaklaşır.";
            
            coinContainer.style.transform = "scale(0.5)";
            await sleep(2000);

            // Fast forward to 1000
            ffOverlay.style.opacity = 1;
            coin.className = "coin flip-anim";

            // Target 1000 (Result: 498 Y, 502 T)
            let currentTotal = 10;
            let targetTotal = 1000;
            
            let interval = setInterval(() => {
                currentTotal += 13;
                if(currentTotal > targetTotal) currentTotal = targetTotal;
                
                ffCount.innerText = currentTotal;

                if(currentTotal === targetTotal) {
                    clearInterval(interval);
                }
            }, 30);

            await sleep(2500); // wait for counting animation

            ffOverlay.style.opacity = 0;
            coin.className = "coin";
            coin.style.transform = "rotateY(180deg)"; // ends on Tura to balance
            coinContainer.style.transform = "scale(1)";

            yCount = 498;
            tCount = 502;
            updateStats(yCount, tCount);

            await sleep(1000);
            mTitle.style.color = "var(--secondary)";
            mTitle.innerText = "Büyük Sayılar Kanunu Kanıtlandı!";
            mSub.innerHTML = "1000 deney sonucunda Yazı gelme oranı <span>%50'ye çok yaklaştı!</span>";

            setTimeout(() => {
                startBtn.disabled = false;
                startBtn.innerText = "Deneyi Tekrarla";
                mTitle.style.color = "var(--tertiary)";
            }, 4000);
        }
    </script>
</body>
</html>
