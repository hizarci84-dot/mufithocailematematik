<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algoritma ve Cebir - Animasyon</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F172A; --text: #F8FAFC;
            --primary: #3B82F6; --secondary: #10B981;
            --tertiary: #F59E0B; --danger: #F43F5E;
            --purple: #8B5CF6; --cyan: #06B6D4;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px;
        }

        .header {
            width: 100%; max-width: 900px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--danger); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area { text-align: center; width: 100%; max-width: 800px; margin-bottom: 20px; height: 110px;}
        h1 { font-size: 2.2rem; color: var(--danger); text-shadow: 0 5px 15px rgba(0,0,0,0.5); line-height: 1.3;}
        .subtitle { font-size: 1.2rem; color: #94A3B8; margin-top: 10px; line-height: 1.5; min-height: 55px;}
        .subtitle span { color: white; font-weight: 800; background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 5px;}

        .canvas-area {
            position: relative; width: 100%; max-width: 800px; height: 450px; 
            background: #0B1120; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.3); 
            overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .pipeline {
            display: flex; align-items: center; gap: 20px; position: relative; width: 100%; justify-content: center;
        }

        .p-block {
            background: #1E293B; border: 2px solid rgba(255,255,255,0.1); border-radius: 15px;
            padding: 20px; text-align: center; display: flex; flex-direction: column; align-items: center;
            opacity: 0; transform: translateY(-20px); transition: all 0.5s; z-index: 2; min-width: 150px;
        }
        .p-block.show { opacity: 1; transform: translateY(0); }

        .pb-title { font-size: 0.9rem; color: #94A3B8; font-weight: 800; margin-bottom: 10px; text-transform: uppercase;}
        .pb-content { font-size: 1.5rem; font-weight: 900; color: white;}
        .pb-desc { font-size: 1rem; color: var(--cyan); font-weight: 800; margin-top: 10px;}

        .arrow {
            font-size: 2rem; color: #3B82F6; font-weight: 900; opacity: 0; transition: all 0.5s;
        }
        .arrow.show { opacity: 1; }

        .data-packet {
            position: absolute; top: -30px; left: 100px; background: var(--tertiary); color: white;
            font-size: 1.5rem; font-weight: 900; padding: 10px 20px; border-radius: 10px;
            box-shadow: 0 5px 15px rgba(245, 158, 11, 0.5); border: 2px solid #fbbf24; z-index: 5;
            transition: all 1s ease-in-out; opacity: 0;
        }

        .btn-start {
            margin-top: 30px; background: var(--danger); color: white; border: none; padding: 15px 40px; border-radius: 50px;
            font-size: 1.2rem; font-weight: 800; cursor: pointer; transition: all 0.3s; box-shadow: 0 10px 20px rgba(244, 63, 94, 0.4);
        }
        .btn-start:hover { transform: scale(1.05); }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=3B82F6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.6.2.3. Cebirsel Algoritmalar</div>
    </div>

    <div class="title-area">
        <h1 id="mTitle">Algoritma Fabrikası</h1>
        <p class="subtitle" id="mSub">Cebirsel ifadeler, adım adım işleyen bir makine bandı (algoritma) gibidir.</p>
    </div>

    <div class="canvas-area">
        
        <div class="pipeline">
            
            <div class="p-block" id="b1" style="border-color: var(--primary);">
                <div class="pb-title">Girdi (Input)</div>
                <div class="pb-content" style="font-size: 3rem; color:var(--primary);">x</div>
            </div>

            <div class="arrow" id="a1">➔</div>

            <div class="p-block" id="b2" style="border-color: var(--secondary);">
                <div class="pb-title">1. İşlem Makinesi</div>
                <div class="pb-content">x 2</div>
                <div class="pb-desc">2 ile çarp</div>
            </div>

            <div class="arrow" id="a2">➔</div>

            <div class="p-block" id="b3" style="border-color: var(--tertiary);">
                <div class="pb-title">2. İşlem Makinesi</div>
                <div class="pb-content">+ 5</div>
                <div class="pb-desc">5 ekle</div>
            </div>

            <div class="arrow" id="a3">➔</div>

            <div class="p-block" id="b4" style="border-color: var(--danger);">
                <div class="pb-title">Çıktı (Output)</div>
                <div class="pb-content" id="finalOut" style="font-size: 2rem; color:var(--danger);">?</div>
            </div>

            <div class="data-packet" id="packet">x</div>

        </div>

    </div>

    <button class="btn-start" id="startBtn" onclick="runTimeline()">Çalıştır</button>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const mTitle = document.getElementById('mTitle');
        const mSub = document.getElementById('mSub');
        const startBtn = document.getElementById('startBtn');
        const packet = document.getElementById('packet');
        
        async function runTimeline() {
            startBtn.style.display = 'none';

            // Reset
            [1,2,3,4].forEach(i => document.getElementById(`b${i}`).classList.remove('show'));
            [1,2,3].forEach(i => document.getElementById(`a${i}`).classList.remove('show'));
            document.getElementById('finalOut').innerText = "?";
            packet.style.opacity = 0;
            packet.style.transform = "translate(0px, 0px)";
            packet.innerText = "x";
            
            await sleep(500);

            // Step 1
            document.getElementById('b1').classList.add('show');
            mTitle.innerText = "Başlangıç: Bilinmeyen (x)";
            mSub.innerHTML = "Algoritmamız bir <span>'x'</span> değeri alarak başlıyor.";
            
            await sleep(1500);
            packet.style.opacity = 1;
            
            // Move to 2
            document.getElementById('a1').classList.add('show');
            document.getElementById('b2').classList.add('show');
            mTitle.innerText = "Birinci Aşama";
            mSub.innerHTML = "Paketimiz <span>'2 ile çarp'</span> makinesine giriyor.";
            
            await sleep(1000);
            packet.style.transform = "translate(180px, 0)"; // move to b2
            await sleep(1000);
            packet.innerText = "2x"; // transform!
            
            await sleep(1500);
            
            // Move to 3
            document.getElementById('a2').classList.add('show');
            document.getElementById('b3').classList.add('show');
            mTitle.innerText = "İkinci Aşama";
            mSub.innerHTML = "Sonuç 2x oldu. Şimdi <span>'5 ekle'</span> makinesine ilerliyor.";
            
            await sleep(1000);
            packet.style.transform = "translate(380px, 0)"; // move to b3
            await sleep(1000);
            packet.innerText = "2x + 5"; // transform!
            
            await sleep(1500);

            // Output
            document.getElementById('a3').classList.add('show');
            document.getElementById('b4').classList.add('show');
            mTitle.innerText = "Final Çıktısı (Cebirsel İfade)";
            mSub.innerHTML = "Algoritmanın oluşturduğu son ifade: <span>2x + 5</span>";
            
            await sleep(1000);
            packet.style.transform = "translate(570px, 0)"; // move to b4
            await sleep(1000);
            
            packet.style.opacity = 0;
            document.getElementById('finalOut').innerText = "2x + 5";

            setTimeout(() => {
                startBtn.style.display = 'block';
                startBtn.innerText = "Tekrar İzle";
            }, 4000);
        }
    </script>
</body>
</html>
