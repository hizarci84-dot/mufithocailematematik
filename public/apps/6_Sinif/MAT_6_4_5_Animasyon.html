<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çember Çevre Problemi - Animasyon</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F172A; --text: #F8FAFC;
            --primary: #3B82F6; --secondary: #10B981;
            --tertiary: #F59E0B; --danger: #F43F5E;
            --purple: #8B5CF6; --cyan: #06B6D4;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px;
        }

        .header {
            width: 100%; max-width: 900px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--secondary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area { text-align: center; width: 100%; max-width: 800px; margin-bottom: 20px; height: 110px;}
        h1 { font-size: 2.2rem; color: var(--secondary); text-shadow: 0 5px 15px rgba(0,0,0,0.5); line-height: 1.3;}
        .subtitle { font-size: 1.2rem; color: #94A3B8; margin-top: 10px; line-height: 1.5; min-height: 55px;}
        .subtitle span { color: white; font-weight: 800; background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 5px;}

        .canvas-area {
            position: relative; width: 100%; max-width: 800px; height: 450px; 
            background: #0B1120; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.3); 
            overflow: hidden; display: flex; align-items: center; justify-content: center;
        }

        .road {
            position: absolute; bottom: 80px; width: 200%; height: 5px; background: rgba(255,255,255,0.2);
            left: 0; border-radius: 2px; transition: transform 6s linear;
        }

        /* Wheel diameter 120px */
        .bike-wheel {
            position: absolute; bottom: 82px; left: 150px; width: 120px; height: 120px;
            border-radius: 50%; border: 6px solid var(--text); z-index: 10;
            background: radial-gradient(circle, transparent 40%, rgba(255,255,255,0.05) 60%);
            transition: transform 6s linear; display: flex; align-items: center; justify-content: center;
        }
        
        .spoke {
            position: absolute; width: 2px; height: 100%; background: rgba(255,255,255,0.3);
        }

        .center-dot {
            width: 12px; height: 12px; background: var(--danger); border-radius: 50%; z-index: 5;
        }

        .radius-line {
            position: absolute; width: 50%; height: 4px; background: var(--danger);
            right: 0; top: 50%; transform: translateY(-50%); transform-origin: left center; z-index: 6;
        }

        .lbl-radius {
            position: absolute; top: 20px; right: 10px; font-weight: 900; color: var(--danger); font-size: 1.2rem;
            text-shadow: 0 0 5px black;
        }

        .info-panel {
            position: absolute; right: 20px; top: 20px; background: rgba(0,0,0,0.8);
            border: 2px solid var(--secondary); border-radius: 15px; padding: 20px; width: 300px;
            color: white; font-size: 1.1rem; opacity: 0; transition: opacity 1s; transform: translateX(50px);
        }
        .info-panel.show { opacity: 1; transform: translateX(0); }
        .ip-row { margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        .ip-val { font-size: 1.5rem; font-weight: 900; color: var(--tertiary); display: block; margin-top: 5px;}

        .btn-start {
            margin-top: 30px; background: var(--secondary); color: white; border: none; padding: 15px 40px; border-radius: 50px;
            font-size: 1.2rem; font-weight: 800; cursor: pointer; transition: all 0.3s; box-shadow: 0 10px 20px rgba(16, 185, 129, 0.4);
        }
        .btn-start:hover { transform: scale(1.05); }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=3B82F6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.6.4.5. Çember Problemleri</div>
    </div>

    <div class="title-area">
        <h1 id="mTitle">Bisiklet Turu</h1>
        <p class="subtitle" id="mSub">Yarıçapı 30 cm olan bir bisiklet tekerleği <span>50 tam tur</span> döndüğünde kaç metre yol alır? (π = 3 alınız)</p>
    </div>

    <div class="canvas-area">
        <div class="road" id="road"></div>
        
        <div class="bike-wheel" id="wheel">
            <div class="spoke" style="transform: rotate(0deg);"></div>
            <div class="spoke" style="transform: rotate(45deg);"></div>
            <div class="spoke" style="transform: rotate(90deg);"></div>
            <div class="spoke" style="transform: rotate(135deg);"></div>
            
            <div class="radius-line"></div>
            <div class="lbl-radius">r=30</div>
            
            <div class="center-dot"></div>
        </div>

        <div class="info-panel" id="panel">
            <div class="ip-row" id="r1" style="opacity:0; transition: 1s;">
                1 Tur (Çevre) = 2.π.r
                <span class="ip-val" id="v1">?</span>
            </div>
            <div class="ip-row" id="r2" style="opacity:0; transition: 1s;">
                Toplam Yol (50 Tur)
                <span class="ip-val" id="v2" style="color:var(--primary);">?</span>
            </div>
            <div class="ip-row" id="r3" style="opacity:0; transition: 1s; border:none;">
                Metreye Çevir
                <span class="ip-val" id="v3" style="color:var(--secondary); font-size: 2rem;">?</span>
            </div>
        </div>

    </div>

    <button class="btn-start" id="startBtn" onclick="runTimeline()">Çözümü Başlat</button>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const mTitle = document.getElementById('mTitle');
        const mSub = document.getElementById('mSub');
        const startBtn = document.getElementById('startBtn');
        
        async function runTimeline() {
            startBtn.style.display = 'none';

            // Reset
            document.getElementById('wheel').style.transition = 'none';
            document.getElementById('road').style.transition = 'none';
            document.getElementById('wheel').style.transform = 'rotate(0deg)';
            document.getElementById('road').style.transform = 'translateX(0)';

            document.getElementById('panel').classList.remove('show');
            ['r1','r2','r3'].forEach(id => document.getElementById(id).style.opacity = 0);
            document.getElementById('v1').innerText = "?";
            document.getElementById('v2').innerText = "?";
            document.getElementById('v3').innerText = "?";

            await sleep(100);

            // Intro
            mTitle.innerText = "Adım 1: Bir Turu Bul";
            mSub.innerHTML = "Tekerlek 1 tam tur döndüğünde <span>Çevresi</span> kadar yol alır.";
            
            document.getElementById('panel').classList.add('show');
            await sleep(2000);

            // Calculate Circ
            document.getElementById('r1').style.opacity = 1;
            await sleep(1000);
            document.getElementById('v1').innerText = "2 x 3 x 30 = 180 cm";
            
            await sleep(2500);

            // Step 2: Total rotations
            mTitle.innerText = "Adım 2: Toplam Yolu Bul";
            mSub.innerHTML = "Bir turda 180 cm gidiyorsa, <span>50 turda</span> ne kadar gider? Tekerleği döndürelim!";
            
            // Animation for rolling
            document.getElementById('wheel').style.transition = 'transform 5s linear';
            document.getElementById('road').style.transition = 'transform 5s linear';
            
            document.getElementById('wheel').style.transform = 'rotate(1800deg)'; // 5 rotations visually (represents 50)
            document.getElementById('road').style.transform = 'translateX(-100%)'; // road moving left simulates forward motion
            
            await sleep(2500); // midway calculation show
            document.getElementById('r2').style.opacity = 1;
            document.getElementById('v2').innerText = "180 x 50 = 9000 cm";

            await sleep(3500); // Wait for wheel to finish

            // Step 3: Convert unit
            mTitle.innerText = "Adım 3: Birim Dönüşümü";
            mSub.innerHTML = "Soru bizden Metre cinsinden istiyor. <span>1 Metre = 100 cm</span>'dir.";
            
            document.getElementById('r3').style.opacity = 1;
            await sleep(1500);
            document.getElementById('v3').innerText = "9000 ÷ 100 = 90 Metre";

            setTimeout(() => {
                startBtn.style.display = 'block';
                startBtn.innerText = "Tekrar İzle";
            }, 5000);
        }
    </script>
</body>
</html>
