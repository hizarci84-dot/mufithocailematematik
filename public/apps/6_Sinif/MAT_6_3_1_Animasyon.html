<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paralel Doğrular ve Kesen - Animasyon</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F172A; --text: #F8FAFC;
            --primary: #3B82F6; --secondary: #10B981;
            --tertiary: #F59E0B; --danger: #F43F5E;
            --purple: #8B5CF6; --cyan: #06B6D4;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px;
        }

        .header {
            width: 100%; max-width: 900px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--purple); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area { text-align: center; width: 100%; max-width: 800px; margin-bottom: 20px; height: 110px;}
        h1 { font-size: 2.2rem; color: var(--purple); text-shadow: 0 5px 15px rgba(0,0,0,0.5); line-height: 1.3;}
        .subtitle { font-size: 1.2rem; color: #94A3B8; margin-top: 10px; line-height: 1.5; min-height: 55px;}
        .subtitle span { color: white; font-weight: 800; background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 5px;}

        .canvas-area {
            position: relative; width: 100%; max-width: 800px; height: 450px; 
            background: #0B1120; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.3); 
            overflow: hidden; display: flex; align-items: center; justify-content: center;
        }

        .line-h {
            position: absolute; width: 80%; height: 6px; background: white; border-radius: 3px;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
        .line-h::before, .line-h::after {
            content: '◀'; position: absolute; top: -10px; color: white; font-size: 1.5rem;
        }
        .line-h::before { left: -5px; }
        .line-h::after { content: '▶'; right: -5px; }

        .l1 { top: 150px; }
        .l2 { top: 300px; }

        .line-v {
            position: absolute; width: 6px; height: 120%; background: var(--tertiary); border-radius: 3px;
            transform: rotate(20deg); box-shadow: 0 0 15px rgba(245, 158, 11, 0.5);
        }

        .angle {
            position: absolute; border: 4px solid transparent; border-radius: 50%;
            width: 80px; height: 80px; transform-origin: center; opacity: 0; transition: all 0.5s;
        }
        .angle-val {
            position: absolute; font-size: 1.2rem; font-weight: 900; color: white; opacity: 0; transition: all 0.5s;
        }

        /* Top Intersection (approx x: 55%, y: 150px) */
        .a1 { top: 110px; left: 45%; border-top-color: var(--primary); border-right-color: var(--primary); transform: rotate(-70deg); }
        .v1 { top: 110px; left: 51%; }
        
        .a2 { top: 110px; left: 39%; border-top-color: var(--danger); border-left-color: var(--danger); transform: rotate(20deg); }
        .v2 { top: 120px; left: 41%; }

        .a3 { top: 150px; left: 41%; border-bottom-color: var(--primary); border-left-color: var(--primary); transform: rotate(-70deg); }
        .v3 { top: 165px; left: 43%; }

        .a4 { top: 150px; left: 47%; border-bottom-color: var(--danger); border-right-color: var(--danger); transform: rotate(20deg); }
        .v4 { top: 160px; left: 53%; }

        /* Bottom Intersection (approx x: 45%, y: 300px) */
        .a5 { top: 260px; left: 40%; border-top-color: var(--primary); border-right-color: var(--primary); transform: rotate(-70deg); }
        .v5 { top: 260px; left: 46%; }
        
        .a6 { top: 260px; left: 34%; border-top-color: var(--danger); border-left-color: var(--danger); transform: rotate(20deg); }
        .v6 { top: 270px; left: 36%; }

        .a7 { top: 300px; left: 36%; border-bottom-color: var(--primary); border-left-color: var(--primary); transform: rotate(-70deg); }
        .v7 { top: 315px; left: 38%; }

        .a8 { top: 300px; left: 42%; border-bottom-color: var(--danger); border-right-color: var(--danger); transform: rotate(20deg); }
        .v8 { top: 310px; left: 48%; }

        /* Highlighting Classes */
        .h-primary { box-shadow: 0 0 20px var(--primary) inset, 0 0 20px var(--primary); background: rgba(59, 130, 246, 0.2);}
        .h-danger { box-shadow: 0 0 20px var(--danger) inset, 0 0 20px var(--danger); background: rgba(244, 63, 94, 0.2);}

        .btn-start {
            margin-top: 30px; background: var(--purple); color: white; border: none; padding: 15px 40px; border-radius: 50px;
            font-size: 1.2rem; font-weight: 800; cursor: pointer; transition: all 0.3s; box-shadow: 0 10px 20px rgba(139, 92, 246, 0.4);
        }
        .btn-start:hover { transform: scale(1.05); }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=3B82F6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.6.3.1. Paralel Doğrular ve Kesen</div>
    </div>

    <div class="title-area">
        <h1 id="mTitle">Geometrinin Çarpışması</h1>
        <p class="subtitle" id="mSub">İki paralel doğruyu kesen bir çizgi, <span>8 adet açı</span> oluşturur.</p>
    </div>

    <div class="canvas-area">
        
        <div class="line-h l1"></div>
        <div class="line-h l2"></div>
        <div class="line-v"></div>

        <div class="angle a1" id="a1"></div><div class="angle-val v1" id="v1">a</div>
        <div class="angle a2" id="a2"></div><div class="angle-val v2" id="v2">b</div>
        <div class="angle a3" id="a3"></div><div class="angle-val v3" id="v3">c</div>
        <div class="angle a4" id="a4"></div><div class="angle-val v4" id="v4">d</div>
        
        <div class="angle a5" id="a5"></div><div class="angle-val v5" id="v5">x</div>
        <div class="angle a6" id="a6"></div><div class="angle-val v6" id="v6">y</div>
        <div class="angle a7" id="a7"></div><div class="angle-val v7" id="v7">z</div>
        <div class="angle a8" id="a8"></div><div class="angle-val v8" id="v8">t</div>

    </div>

    <button class="btn-start" id="startBtn" onclick="runTimeline()">Animasyonu Başlat</button>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const mTitle = document.getElementById('mTitle');
        const mSub = document.getElementById('mSub');
        const startBtn = document.getElementById('startBtn');
        
        const resetAngles = () => {
            for(let i=1; i<=8; i++) {
                document.getElementById(`a${i}`).style.opacity = 0;
                document.getElementById(`a${i}`).className = `angle a${i}`;
                document.getElementById(`v${i}`).style.opacity = 0;
            }
        };

        const showAngles = (indices, addClass) => {
            indices.forEach(i => {
                document.getElementById(`a${i}`).style.opacity = 1;
                document.getElementById(`a${i}`).classList.add(addClass);
                document.getElementById(`v${i}`).style.opacity = 1;
            });
        };

        async function runTimeline() {
            startBtn.style.display = 'none';
            resetAngles();

            // Intro
            mTitle.innerText = "Ters Açılar";
            mSub.innerHTML = "Makasın ağzı gibi sırt sırta veren açılar <span>birbirine eşittir.</span>";
            
            showAngles([1, 3], 'h-primary'); // a and c
            showAngles([2, 4], 'h-danger'); // b and d
            await sleep(3500);

            // İç Bölge
            resetAngles();
            mTitle.innerText = "İç Bölgedekiler (İki paralelin arası)";
            mSub.innerHTML = "Paralel doğruların arasında kalan açılara odaklanalım: <span>c, d, x, y</span>";
            showAngles([3, 5], 'h-primary'); 
            showAngles([4, 6], 'h-danger');
            await sleep(3500);

            // İç Ters
            resetAngles();
            mTitle.innerText = "İç Ters Açılar (Z Kuralı)";
            mSub.innerHTML = "İç bölgede olup çapraz bakan açılar eşittir. (Z harfini hayal edin). <span>(c = x) ve (d = y)</span>";
            showAngles([3, 5], 'h-primary');
            await sleep(1500);
            resetAngles();
            showAngles([4, 6], 'h-danger');
            await sleep(2500);

            // Yöndeş
            resetAngles();
            mTitle.innerText = "Yöndeş Açılar";
            mSub.innerHTML = "Aynı yöne bakan açılar eşittir. Sanki açıyı asansörle aşağı taşımışız gibi! <span>(a = x), (b = y)</span>";
            showAngles([1, 5], 'h-primary');
            await sleep(1500);
            resetAngles();
            showAngles([2, 6], 'h-danger');
            await sleep(2500);

            // Dış Ters
            resetAngles();
            mTitle.innerText = "Dış Ters Açılar";
            mSub.innerHTML = "Hem dış bölgede hem çapraz bakanlar da eşittir. <span>(a = z) ve (b = t)</span>";
            showAngles([1, 7], 'h-primary');
            await sleep(1500);
            resetAngles();
            showAngles([2, 8], 'h-danger');
            await sleep(2500);

            // Conclusion
            resetAngles();
            mTitle.innerText = "Sadece İki Ölçü Yeter!";
            mSub.innerHTML = "Sadece 1 açıyı bilirsek, yöndeş, ters ve iç ters kurallarıyla <span>kalan 7 açıyı</span> bulabiliriz!";
            showAngles([1,3,5,7], 'h-primary');
            showAngles([2,4,6,8], 'h-danger');

            setTimeout(() => {
                startBtn.style.display = 'block';
                startBtn.innerText = "Tekrar İzle";
            }, 4000);
        }
    </script>
</body>
</html>
