<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ondalık Gösterimler - Animasyon</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F172A; --text: #F8FAFC;
            --primary: #3B82F6; --secondary: #10B981;
            --tertiary: #F59E0B; --danger: #F43F5E;
            --purple: #8B5CF6; --cyan: #06B6D4;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px;
        }

        .header {
            width: 100%; max-width: 900px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area { text-align: center; width: 100%; max-width: 800px; margin-bottom: 20px; height: 110px;}
        h1 { font-size: 2.2rem; color: var(--primary); text-shadow: 0 5px 15px rgba(0,0,0,0.5); line-height: 1.3;}
        .subtitle { font-size: 1.2rem; color: #94A3B8; margin-top: 10px; line-height: 1.5; min-height: 55px;}
        .subtitle span { color: white; font-weight: 800; background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 5px;}

        .canvas-area {
            position: relative; width: 100%; max-width: 800px; height: 450px; 
            background: #0B1120; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.3); 
            overflow: hidden; display: flex; align-items: center; justify-content: center;
        }

        .scene { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.8s; pointer-events: none;}
        .scene.active { opacity: 1; z-index: 10; }

        /* Num Display */
        .number-display {
            font-size: 5rem; font-weight: 900; color: white; display: flex; align-items: baseline; gap: 5px;
        }
        .whole { color: var(--secondary); }
        .comma { color: var(--danger); font-size: 6rem; line-height: 0.8;}
        .fraction { color: var(--primary); }

        .boxes-container { display: flex; gap: 20px; margin-top: 40px;}
        .b-col { display: flex; flex-direction: column; align-items: center; gap: 10px; opacity:0; transform: translateY(20px); transition: all 0.5s;}
        
        .b-title { font-size: 1.2rem; font-weight: 800; color: #94A3B8;}
        .b-fraction { font-size: 1.5rem; font-weight: 900; background: rgba(255,255,255,0.1); padding: 10px 20px; border-radius: 15px;}
        
        .b-col.c1 .b-title { color: var(--primary); }
        .b-col.c2 .b-title { color: var(--tertiary); }
        .b-col.c3 .b-title { color: var(--purple); }

        .btn-start {
            margin-top: 30px; background: var(--primary); color: white; border: none; padding: 15px 40px; border-radius: 50px;
            font-size: 1.2rem; font-weight: 800; cursor: pointer; transition: all 0.3s; box-shadow: 0 10px 20px rgba(59, 130, 246, 0.4);
        }
        .btn-start:hover { transform: scale(1.05); }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=3B82F6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.6.1.5. Ondalık Gösterimlerin Basamakları</div>
    </div>

    <div class="title-area">
        <h1 id="mTitle">Virgülün Ötesindeki Dünya</h1>
        <p class="subtitle" id="mSub">Bir sayıyı parçaladıkça <span>kesirlerin gücüyle</span> yeni basamaklar keşfederiz.</p>
    </div>

    <div class="canvas-area">
        
        <div class="scene active" id="sc1">
            <div class="number-display">
                <div class="whole" id="wNum">24</div>
                <div class="comma" id="wComma">,</div>
                <div class="fraction" id="fNum"></div>
            </div>
            
            <div class="boxes-container" id="bContainer">
                <div class="b-col c1" id="bc1">
                    <div class="b-title">Onda Birler</div>
                    <div class="b-fraction" id="bf1"><sup>1</sup>&frasl;<sub>10</sub></div>
                </div>
                <div class="b-col c2" id="bc2">
                    <div class="b-title">Yüzde Birler</div>
                    <div class="b-fraction" id="bf2"><sup>1</sup>&frasl;<sub>100</sub></div>
                </div>
                <div class="b-col c3" id="bc3">
                    <div class="b-title">Binde Birler</div>
                    <div class="b-fraction" id="bf3"><sup>1</sup>&frasl;<sub>1000</sub></div>
                </div>
            </div>
        </div>

    </div>

    <button class="btn-start" id="startBtn" onclick="runTimeline()">Animasyonu Başlat</button>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const mTitle = document.getElementById('mTitle');
        const mSub = document.getElementById('mSub');
        const startBtn = document.getElementById('startBtn');
        const fNum = document.getElementById('fNum');
        
        async function runTimeline() {
            startBtn.style.display = 'none';
            fNum.innerText = "";
            document.getElementById('bc1').style.opacity = 0;
            document.getElementById('bc2').style.opacity = 0;
            document.getElementById('bc3').style.opacity = 0;

            mTitle.innerText = "Tam Kısım";
            mSub.innerHTML = "Sol taraf tam sayıları temsil eder. Ancak sağ tarafa, yani <span>Virgülün Sağına</span> geçtiğimizde işler değişir.";
            await sleep(3000);

            // Step 1: Onda Birler
            mTitle.innerText = "Onda Birler Basamağı";
            mSub.innerHTML = "Bütünü 10 parçaya böldüğümüzde oluşan <span>Kesir Değeridir.</span>";
            fNum.innerHTML = "3";
            document.getElementById('bc1').style.opacity = 1;
            document.getElementById('bc1').style.transform = "translateY(0)";
            document.getElementById('bf1').innerHTML = "<sup>3</sup>&frasl;<sub>10</sub>";
            await sleep(3500);

            // Step 2: Yüzde Birler
            mTitle.innerText = "Yüzde Birler Basamağı";
            mSub.innerHTML = "Virgülden sonraki ikinci basamak, bütünü <span>100'e böler.</span>";
            fNum.innerHTML = "3<span style='color:var(--tertiary);'>5</span>";
            document.getElementById('bc2').style.opacity = 1;
            document.getElementById('bc2').style.transform = "translateY(0)";
            document.getElementById('bf2').innerHTML = "<sup>5</sup>&frasl;<sub>100</sub>";
            await sleep(3500);

            // Step 3: Binde Birler
            mTitle.innerText = "Binde Birler Basamağı";
            mSub.innerHTML = "Virgülden sonraki üçüncü basamak, minicik <span>1/1000'lik</span> dilimlerdir.";
            fNum.innerHTML = "3<span style='color:var(--tertiary);'>5</span><span style='color:var(--purple);'>8</span>";
            document.getElementById('bc3').style.opacity = 1;
            document.getElementById('bc3').style.transform = "translateY(0)";
            document.getElementById('bf3').innerHTML = "<sup>8</sup>&frasl;<sub>1000</sub>";
            
            await sleep(3000);
            mTitle.innerText = "Ondalık = Kesir";
            mSub.innerHTML = "Gördüğünüz gibi, ondalık sayılar aslında <span>Paydası 10, 100, 1000</span> olan kesirlerin farklı bir yazılışıdır!";

            setTimeout(() => {
                startBtn.style.display = 'block';
                startBtn.innerText = "Tekrar İzle";
            }, 4000);
        }
    </script>
</body>
</html>
