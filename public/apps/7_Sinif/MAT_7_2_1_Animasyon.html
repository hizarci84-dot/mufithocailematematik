<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cebirsel İfade Dağılma Özelliği (Animasyon)</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F0E17; --surface: #1A1A24; --text: #F8FAFC;
            --primary: #8B5CF6; --secondary: #10B981;
            --tertiary: #06B6D4; --danger: #F43F5E;
            --accent: #F59E0B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, var(--bg) 0%, #161625 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px; overflow-x: hidden;
        }

        .header {
            width: 100%; max-width: 1000px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(139, 92, 246, 0.2); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area { text-align: center; margin-bottom: 20px;}
        h1 { font-size: 2.2rem; color: var(--tertiary); font-weight: 900;}
        .subtitle { color: #94A3B8; font-size: 1.1rem; margin-top: 5px;}

        .canvas-area {
            position: relative; width: 100%; max-width: 900px; height: 500px; 
            background: #11111A; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.4); 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden;
        }

        /* Equation Base */
        .equation {
            font-size: 4rem; font-weight: 900; color: white; display: flex; align-items: center; gap: 10px;
            letter-spacing: 3px; z-index: 10;
        }

        .multiplier { color: var(--tertiary); }
        .bracket { color: #64748B; }
        .term-x { color: var(--secondary); }
        .term-num { color: var(--accent); }
        
        .arrow {
            position: absolute; border-top: 4px dashed var(--tertiary); border-right: 4px dashed var(--tertiary);
            width: 0; height: 50px; border-top-right-radius: 20px; transform-origin: left bottom; opacity: 0;
        }

        .arrow::after {
            content: ''; position: absolute; bottom: -10px; right: -10px; border-width: 10px; border-style: solid;
            border-color: var(--tertiary) transparent transparent transparent; transform: rotate(-45deg);
        }

        /* Result display */
        .result-box {
            position: absolute; bottom: 50px; background: rgba(139, 92, 246, 0.2); border: 2px solid var(--primary);
            padding: 20px 40px; border-radius: 20px; font-size: 3rem; font-weight: 900; color: white;
            opacity: 0; transform: translateY(20px); transition: all 1s; display: flex; gap: 15px;
        }

        .btn-play {
            background: var(--primary); color: white; border: none; padding: 15px 40px; border-radius: 50px;
            font-size: 1.2rem; font-weight: 900; cursor: pointer; transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.4); margin-top: 30px;
        }
        .btn-play:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 15px 25px rgba(139, 92, 246, 0.6); }

        .expl-text {
            position: absolute; top: 40px; font-size: 1.5rem; color: #94A3B8; font-weight: 600;
            opacity: 0; transition: 0.5s; text-align: center;
        }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=8B5CF6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.7.2.1. Cebirsel İfadelerde Dağılma Özelliği</div>
    </div>

    <div class="title-area">
        <h1>Çarpmanın Dağılma Özelliği (Animasyon)</h1>
        <p class="subtitle">Parantez dışındaki sayının, parantez içindeki her bir terimle nasıl çarpıldığını izleyin.</p>
    </div>

    <div class="canvas-area" id="canvas">
        <div class="expl-text" id="explText">Dışarıdaki çarpan (3), içerideki her terimi tek tek ziyaret eder.</div>
        
        <div class="equation" id="eqMain">
            <span class="multiplier" id="mul3">3</span>
            <span class="bracket">(</span>
            <span class="term-x" id="termX">2x</span>
            <span>+</span>
            <span class="term-num" id="term4">4</span>
            <span class="bracket">)</span>
        </div>

        <div class="arrow" id="arr1" style="top: 150px; left: 350px; height: 60px;"></div>
        <div class="arrow" id="arr2" style="top: 130px; left: 360px; height: 80px;"></div>

        <div class="result-box" id="resBox">
            <span style="color:var(--secondary);" id="res1"></span>
            <span id="resOp" style="opacity:0;">+</span>
            <span style="color:var(--accent);" id="res2"></span>
        </div>

    </div>

    <button class="btn-play" id="btnPlay" onclick="playAnim()">Animasyonu Başlat</button>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const btnPlay = document.getElementById('btnPlay');
        const eqMain = document.getElementById('eqMain');
        const arr1 = document.getElementById('arr1');
        const arr2 = document.getElementById('arr2');
        const resBox = document.getElementById('resBox');
        const res1 = document.getElementById('res1');
        const resOp = document.getElementById('resOp');
        const res2 = document.getElementById('res2');
        const explText = document.getElementById('explText');

        async function playAnim() {
            btnPlay.disabled = true;
            btnPlay.style.opacity = 0.5;

            // Reset
            arr1.style.opacity = 0; arr1.style.width = "0";
            arr2.style.opacity = 0; arr2.style.width = "0";
            resBox.style.opacity = 0; resBox.style.transform = "translateY(20px)";
            res1.innerText = ""; res2.innerText = ""; resOp.style.opacity = 0;
            explText.style.opacity = 1;

            await sleep(1000);

            // Arrow 1: 3 * 2x
            arr1.style.opacity = 1;
            arr1.style.transition = "width 1s";
            arr1.style.width = "70px"; // reaches 2x
            
            await sleep(1000);
            
            resBox.style.opacity = 1;
            resBox.style.transform = "translateY(0)";
            res1.innerText = "3 . 2x";
            
            await sleep(1500);
            res1.innerText = "6x"; // simplified
            
            await sleep(1000);

            // Arrow 2: 3 * 4
            arr2.style.opacity = 1;
            arr2.style.transition = "width 1.5s";
            arr2.style.width = "180px"; // reaches 4
            
            await sleep(1500);
            resOp.style.opacity = 1;
            res2.innerText = "3 . 4";

            await sleep(1500);
            res2.innerText = "12"; // simplified

            await sleep(1000);
            explText.innerText = "Sonuç: 6x + 12. Dağılma özelliği başarıyla uygulandı!";
            explText.style.color = "var(--secondary)";

            btnPlay.disabled = false;
            btnPlay.style.opacity = 1;
            btnPlay.innerText = "Tekrar İzle";
        }

    </script>
</body>
</html>
