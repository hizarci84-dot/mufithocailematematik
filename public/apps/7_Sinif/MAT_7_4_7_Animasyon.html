<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daire Alanı Animasyonu</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F0E17; --surface: #1A1A24; --text: #F8FAFC;
            --primary: #8B5CF6; --secondary: #10B981;
            --tertiary: #06B6D4; --danger: #F43F5E;
            --accent: #F59E0B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, var(--bg) 0%, #161625 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px; overflow-x: hidden;
        }

        .header {
            width: 100%; max-width: 1000px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(139, 92, 246, 0.2); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area { text-align: center; margin-bottom: 20px;}
        h1 { font-size: 2.2rem; color: var(--tertiary); font-weight: 900;}
        .subtitle { color: #94A3B8; font-size: 1.1rem; margin-top: 5px;}

        .canvas-area {
            position: relative; width: 100%; max-width: 800px; height: 500px; 
            background: #11111A; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.4); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden;
        }

        .expl-text {
            position: absolute; top: 30px; font-size: 1.5rem; color: white; font-weight: 800;
            opacity: 1; transition: 0.5s; text-align: center; width: 80%; text-shadow: 0 5px 10px black; z-index: 10;
        }

        .formula-box {
            position: absolute; bottom: 30px; background: rgba(0,0,0,0.5); border: 2px solid var(--accent);
            padding: 15px 30px; border-radius: 20px; font-size: 2rem; font-weight: 900; color: white;
            opacity: 0; transform: translateY(20px); transition: all 1s; z-index: 10;
        }

        svg { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }

        .btn-play {
            background: var(--primary); color: white; border: none; padding: 15px 40px; border-radius: 50px;
            font-size: 1.2rem; font-weight: 900; cursor: pointer; transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.4); margin-top: 30px; z-index: 10;
        }
        .btn-play:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 15px 25px rgba(139, 92, 246, 0.6); }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=8B5CF6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.7.4.7. Dairenin Alanı (Animasyon)</div>
    </div>

    <div class="title-area">
        <h1>π × r² İspatı</h1>
        <p class="subtitle">Çok fazla sayıda dilime ayrılan dairenin nasıl kusursuz bir dikdörtgene dönüştüğünü izleyin.</p>
    </div>

    <div class="canvas-area">
        
        <div class="expl-text" id="explText">1. Daireyi sonsuz dilime böldüğümüzü hayal edelim.</div>

        <svg viewBox="0 0 800 500" id="svgArea">
            <g id="circleG" transform="translate(400, 250)"></g>
            
            <g id="texts" style="opacity: 0; transition: 1s;">
                <text x="400" y="320" fill="var(--secondary)" font-size="20" font-weight="900" text-anchor="middle">Taban = Çevrenin Yarısı = πr</text>
                <text x="200" y="250" fill="var(--tertiary)" font-size="20" font-weight="900" text-anchor="end">Yükseklik = r</text>
            </g>
        </svg>

        <div class="formula-box" id="formulaBox">
            Alan = <span style="color:var(--secondary)">πr</span> × <span style="color:var(--tertiary)">r</span> = <span style="color:var(--accent)">πr²</span>
        </div>

    </div>

    <button class="btn-play" id="btnPlay" onclick="runAnim()">Animasyonu Başlat</button>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const btnPlay = document.getElementById('btnPlay');
        const explText = document.getElementById('explText');
        const circleG = document.getElementById('circleG');
        const texts = document.getElementById('texts');
        const formulaBox = document.getElementById('formulaBox');

        // Instead of 16, let's use 64 sectors for a smooth rectangle
        const numSectors = 64;
        const radius = 100;
        const angle = (2 * Math.PI) / numSectors;

        function getSectorPath() {
            const halfA = angle / 2;
            const x1 = radius * Math.sin(-halfA);
            const y1 = -radius * Math.cos(-halfA);
            const x2 = radius * Math.sin(halfA);
            const y2 = -radius * Math.cos(halfA);
            return `M 0 0 L ${x1} ${y1} A ${radius} ${radius} 0 0 1 ${x2} ${y2} Z`;
        }
        
        const pathStr = getSectorPath();

        // Create paths
        for(let i=0; i<numSectors; i++) {
            let path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("d", pathStr);
            path.setAttribute("fill", i%2===0 ? "rgba(139, 92, 246, 1)" : "rgba(16, 185, 129, 1)");
            path.setAttribute("stroke", "transparent"); // no stroke for seamless look
            path.id = "asec" + i;
            path.style.transition = "all 2s cubic-bezier(0.4, 0, 0.2, 1)";
            circleG.appendChild(path);
        }

        async function runAnim() {
            btnPlay.disabled = true;
            btnPlay.style.opacity = 0.5;

            // Reset
            texts.style.opacity = 0;
            formulaBox.style.opacity = 0;
            formulaBox.style.transform = "translateY(20px)";

            for(let i=0; i<numSectors; i++) {
                let path = document.getElementById("asec" + i);
                let currentAngleDeg = (i * 360 / numSectors);
                path.style.transition = "none";
                path.setAttribute("transform", `translate(0, 0) rotate(${currentAngleDeg})`);
            }
            
            // Force reflow
            circleG.getBoundingClientRect();

            explText.innerText = "1. Daireyi çok ince dilimlere ayırıyoruz.";

            await sleep(1500);

            explText.innerText = "2. Dilimleri tıpkı bir fermuar gibi içiçe diziyoruz.";

            // Animate to rectangle
            const secWidth = (2 * Math.PI * radius) / numSectors;
            const totalWidth = (numSectors/2) * secWidth;
            const startX = -totalWidth / 2 + secWidth/2;

            for(let i=0; i<numSectors; i++) {
                let path = document.getElementById("asec" + i);
                path.style.transition = "all 3s cubic-bezier(0.4, 0, 0.2, 1)";
                
                let isOdd = i % 2 !== 0;
                let pairIndex = Math.floor(i / 2);
                
                let rectX = startX + (pairIndex * secWidth);
                if(isOdd) rectX += secWidth / 2;
                
                let rectY = isOdd ? radius/2 : -radius/2;
                let rectRot = isOdd ? 180 : 0;

                path.setAttribute("transform", `translate(${rectX}, ${rectY}) rotate(${rectRot})`);
            }

            await sleep(3500);

            explText.innerText = "3. Ortaya çıkan şekil nerdeyse kusursuz bir dikdörtgendir.";
            texts.style.opacity = 1;

            await sleep(2500);

            explText.innerText = "Dikdörtgenin Alanı = Taban × Yükseklik";
            formulaBox.style.opacity = 1;
            formulaBox.style.transform = "translateY(0)";

            await sleep(2000);

            explText.style.color = "var(--secondary)";

            btnPlay.disabled = false;
            btnPlay.style.opacity = 1;
            btnPlay.innerText = "Tekrar İzle";
        }

        // initial set
        for(let i=0; i<numSectors; i++) {
            let path = document.getElementById("asec" + i);
            let currentAngleDeg = (i * 360 / numSectors);
            path.setAttribute("transform", `translate(0, 0) rotate(${currentAngleDeg})`);
        }
    </script>
</body>
</html>
