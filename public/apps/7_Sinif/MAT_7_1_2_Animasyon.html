<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devirli Ondalık Makinesi (Animasyon)</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F0E17; --surface: #1A1A24; --text: #F8FAFC;
            --primary: #8B5CF6; --secondary: #10B981;
            --tertiary: #06B6D4; --danger: #F43F5E;
            --accent: #F59E0B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, var(--bg) 0%, #161625 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px;
        }

        .header {
            width: 100%; max-width: 1000px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(139, 92, 246, 0.2); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area { text-align: center; margin-bottom: 20px;}
        h1 { font-size: 2.2rem; color: var(--tertiary); font-weight: 900;}
        .subtitle { color: #94A3B8; font-size: 1.1rem; margin-top: 5px;}

        .canvas-area {
            position: relative; width: 100%; max-width: 900px; min-height: 500px; 
            background: #11111A; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.4); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden;
        }

        .division-container {
            display: flex; font-size: 3rem; font-weight: 900; color: white; margin-top: 20px;
            font-family: monospace; position: relative;
        }
        
        .dividend { padding-right: 20px; border-right: 4px solid white; text-align: right;}
        .divisor { padding-left: 20px; border-bottom: 4px solid white; text-align: left; padding-bottom: 5px;}
        
        .quotient-area { position: absolute; top: 50px; left: 100%; margin-left: 20px; color: var(--tertiary); display: flex; align-items: center;}
        
        /* The overline for repeating decimals */
        .repeating-bar {
            position: absolute; top: -5px; height: 4px; background: var(--danger); left: 0; width: 0;
            transition: width 0.5s;
        }

        .steps-area {
            margin-top: 10px; width: 100%; display: flex; flex-direction: column; align-items: center; padding-right: 50px;
            font-size: 2rem; color: #94A3B8; font-family: monospace;
        }
        .step-row {
            display: flex; gap: 15px; opacity: 0; transform: translateY(10px); transition: all 0.5s; justify-content: flex-end; width: 200px;
        }
        .step-minus { color: var(--danger); }
        
        .expl-text {
            position: absolute; top: 40px; font-size: 1.5rem; color: var(--accent); font-weight: 600;
            opacity: 0; transition: 0.5s; text-align: center;
        }

        .btn-play {
            background: var(--primary); color: white; border: none; padding: 15px 40px; border-radius: 50px;
            font-size: 1.2rem; font-weight: 900; cursor: pointer; transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.4); margin-top: 30px;
        }
        .btn-play:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 15px 25px rgba(139, 92, 246, 0.6); }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=8B5CF6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.7.1.2. Devirli Ondalık Gösterim (Animasyon)</div>
    </div>

    <div class="title-area">
        <h1>Bölme İşlemi Animasyonu</h1>
        <p class="subtitle">Kalan sıfır olmadığında sayıların nasıl tekrar ettiğini (devrettiğini) izleyin.</p>
    </div>

    <div class="canvas-area">
        
        <div class="expl-text" id="explText">10'u 3'e bölüyoruz...</div>

        <div class="division-container" id="divContainer">
            <div class="dividend" id="dispNum">10</div>
            <div class="divisor" id="dispDen">3</div>
            
            <div class="quotient-area">
                <span id="dispQuot"></span>
                <div class="repeating-bar" id="repBar"></div>
            </div>
        </div>

        <div class="steps-area" id="stepsArea">
            <!-- Steps injected here -->
        </div>

    </div>

    <button class="btn-play" id="btnPlay" onclick="runAnim()">Animasyonu Başlat</button>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const btnPlay = document.getElementById('btnPlay');
        const explText = document.getElementById('explText');
        const dispQuot = document.getElementById('dispQuot');
        const repBar = document.getElementById('repBar');
        const stepsArea = document.getElementById('stepsArea');

        async function runAnim() {
            btnPlay.disabled = true;
            btnPlay.style.opacity = 0.5;

            dispQuot.innerHTML = "";
            repBar.style.width = "0";
            stepsArea.innerHTML = "";
            explText.style.opacity = 1;

            await sleep(1000);
            explText.innerText = "10'un içinde 3, 3 defa var.";
            
            dispQuot.innerHTML = "3";
            await sleep(1000);

            // Step 1
            await createStep(9, 1);
            await sleep(1500);

            explText.innerText = "Kalan 1. Bölmeye devam etmek için virgül koyup sıfır ekliyoruz.";
            dispQuot.innerHTML = "3,";
            
            // Bring zero
            let lastStep = stepsArea.lastElementChild;
            let lastRem = lastStep.querySelector('.rem-val');
            lastRem.innerText = "10";
            lastRem.style.color = "var(--accent)";
            
            await sleep(2000);

            explText.innerText = "Tekrar 10'un içinde 3 arıyoruz... 3 defa var.";
            dispQuot.innerHTML = "3,3";
            
            await sleep(1000);
            await createStep(9, 1);
            await sleep(1500);

            explText.innerText = "Yine kalan 1! Bir sıfır daha ekleyelim...";
            lastStep = stepsArea.lastElementChild;
            lastRem = lastStep.querySelector('.rem-val');
            lastRem.innerText = "10";
            lastRem.style.color = "var(--accent)";

            await sleep(1500);
            
            explText.innerText = "Hep aynı şey tekrar ediyor (Devrediyor).";
            dispQuot.innerHTML = `3,<span id="repTarget">3</span>`;
            
            await sleep(1500);

            // Draw line
            explText.innerText = "Tekrar eden sayının üzerine devir çizgisi çizilir.";
            explText.style.color = "var(--danger)";
            
            let rTarget = document.getElementById('repTarget');
            let rWidth = rTarget.offsetWidth;
            let rLeft = rTarget.offsetLeft;
            
            repBar.style.left = rLeft + "px";
            repBar.style.width = rWidth + "px";

            await sleep(1000);

            btnPlay.disabled = false;
            btnPlay.style.opacity = 1;
            btnPlay.innerText = "Tekrar İzle";
        }

        async function createStep(subVal, remVal) {
            let row = document.createElement('div');
            row.className = "step-row";
            row.innerHTML = `<span class="step-minus">-</span> <span>${subVal}</span> <span class="rem-val" style="border-top:2px solid; min-width:50px; text-align:right; display:block;">${remVal}</span>`;
            stepsArea.appendChild(row);
            await sleep(50);
            row.style.opacity = 1;
            row.style.transform = "translateY(0)";
        }

    </script>
</body>
</html>
