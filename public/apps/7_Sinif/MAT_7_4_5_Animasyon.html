<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1 Litre = 1 dm³ Animasyonu</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F0E17; --surface: #1A1A24; --text: #F8FAFC;
            --primary: #8B5CF6; --secondary: #10B981;
            --tertiary: #06B6D4; --danger: #F43F5E;
            --accent: #F59E0B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, var(--bg) 0%, #161625 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px; overflow-x: hidden;
        }

        .header {
            width: 100%; max-width: 1000px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(139, 92, 246, 0.2); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area { text-align: center; margin-bottom: 20px;}
        h1 { font-size: 2.2rem; color: var(--tertiary); font-weight: 900;}
        .subtitle { color: #94A3B8; font-size: 1.1rem; margin-top: 5px;}

        .canvas-area {
            position: relative; width: 100%; max-width: 800px; height: 500px; 
            background: #11111A; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.4); 
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 50px; overflow: hidden;
        }

        .expl-text {
            position: absolute; top: 30px; font-size: 1.5rem; color: white; font-weight: 800;
            opacity: 1; transition: 0.5s; text-align: center; width: 80%; text-shadow: 0 5px 10px black; z-index: 10;
        }

        .scene-flex { display: flex; align-items: flex-end; gap: 80px; margin-bottom: 20px;}

        /* The 1L Bottle */
        .bottle {
            width: 80px; height: 200px; border: 4px solid rgba(255,255,255,0.5); border-radius: 10px 10px 5px 5px;
            position: relative; border-top-width: 20px; border-top-left-radius: 20px; border-top-right-radius: 20px;
            transition: all 1s; transform-origin: bottom right;
        }
        .bottle::before { content: '1 L'; position: absolute; top: 40%; left: 0; width: 100%; text-align: center; font-weight: 900; font-size: 1.5rem; color: white; z-index: 5;}
        
        .bottle-liquid {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 100%;
            background: var(--tertiary); border-radius: 0 0 2px 2px; transition: height 3s linear;
        }

        /* The 1 dm3 Cube */
        .cube-tank {
            width: 150px; height: 150px; border: 4px solid var(--secondary); border-top: none;
            position: relative; background: rgba(16, 185, 129, 0.1);
        }
        .cube-tank::after {
            content: '1 dm³'; position: absolute; bottom: -35px; left: 0; width: 100%; text-align: center;
            color: var(--secondary); font-weight: 900; font-size: 1.5rem;
        }
        
        .cube-liquid {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 0%;
            background: var(--tertiary); transition: height 3s linear;
        }

        /* Pour stream */
        .stream {
            position: absolute; width: 15px; height: 0; background: var(--tertiary);
            left: 200px; top: 180px; border-radius: 10px; transition: height 0.5s; opacity: 0;
        }

        .btn-play {
            background: var(--primary); color: white; border: none; padding: 15px 40px; border-radius: 50px;
            font-size: 1.2rem; font-weight: 900; cursor: pointer; transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.4); margin-top: 30px; z-index: 10;
        }
        .btn-play:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 15px 25px rgba(139, 92, 246, 0.6); }

        .formula-box {
            position: absolute; top: 120px; background: rgba(0,0,0,0.5); border: 2px solid var(--accent);
            padding: 15px 30px; border-radius: 20px; font-size: 3rem; font-weight: 900; color: var(--accent);
            opacity: 0; transform: scale(0.5); transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 10;
        }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=8B5CF6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.7.4.5. Hacim Ölçme Birimleri (Animasyon)</div>
    </div>

    <div class="title-area">
        <h1>Sıvı ve Hacim Eşitliği</h1>
        <p class="subtitle">1 Litre suyun, her bir ayrıtı 10 cm (1 dm) olan küp şeklinde bir kaba tam olarak sığdığını ispatlayalım.</p>
    </div>

    <div class="canvas-area">
        
        <div class="expl-text" id="explText">Solda 1 Litrelik su şişesi, sağda ise 1 dm³ (10x10x10 cm) boş bir küp var.</div>
        
        <div class="formula-box" id="fBox">1 L = 1 dm³</div>

        <div class="stream" id="stream"></div>

        <div class="scene-flex">
            <div class="bottle" id="bottle">
                <div class="bottle-liquid" id="bottleLiquid"></div>
            </div>
            
            <div class="cube-tank">
                <div class="cube-liquid" id="cubeLiquid"></div>
            </div>
        </div>

    </div>

    <button class="btn-play" id="btnPlay" onclick="runAnim()">Animasyonu Başlat</button>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const btnPlay = document.getElementById('btnPlay');
        const explText = document.getElementById('explText');
        const bottle = document.getElementById('bottle');
        const bottleLiquid = document.getElementById('bottleLiquid');
        const cubeLiquid = document.getElementById('cubeLiquid');
        const stream = document.getElementById('stream');
        const fBox = document.getElementById('fBox');

        async function runAnim() {
            btnPlay.disabled = true;
            btnPlay.style.opacity = 0.5;

            // Reset
            bottle.style.transform = "rotate(0deg) translate(0, 0)";
            bottleLiquid.style.transition = "none";
            cubeLiquid.style.transition = "none";
            bottleLiquid.style.height = "100%";
            cubeLiquid.style.height = "0%";
            stream.style.opacity = 0; stream.style.height = "0px";
            fBox.style.opacity = 0; fBox.style.transform = "scale(0.5)";

            await sleep(1000);

            explText.innerText = "Şimdi 1 Litre suyu, 1 dm³'lük kaba dökelim...";
            
            // Tilt bottle and move
            bottle.style.transform = "translate(50px, -150px) rotate(60deg)";
            
            await sleep(1000);

            // Pouring
            stream.style.opacity = 1;
            stream.style.height = "150px";

            await sleep(500);

            bottleLiquid.style.transition = "height 3s linear";
            cubeLiquid.style.transition = "height 3s linear";

            bottleLiquid.style.height = "0%";
            cubeLiquid.style.height = "100%";

            await sleep(3000);

            stream.style.opacity = 0;
            bottle.style.transform = "rotate(0deg) translate(0, 0)";

            await sleep(1000);

            explText.innerText = "Kap tam ağzına kadar doldu! Ne taştı ne de eksik kaldı.";
            
            await sleep(2000);

            explText.innerText = "Böylece matematikteki en önemli köprüyü ispatladık:";
            
            fBox.style.opacity = 1;
            fBox.style.transform = "scale(1)";

            await sleep(2500);

            explText.style.color = "var(--secondary)";

            btnPlay.disabled = false;
            btnPlay.style.opacity = 1;
            btnPlay.innerText = "Tekrar İzle";
        }
    </script>
</body>
</html>
