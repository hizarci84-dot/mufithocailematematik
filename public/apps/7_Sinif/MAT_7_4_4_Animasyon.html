<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacim Formülü Animasyonu</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F0E17; --surface: #1A1A24; --text: #F8FAFC;
            --primary: #8B5CF6; --secondary: #10B981;
            --tertiary: #06B6D4; --danger: #F43F5E;
            --accent: #F59E0B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, var(--bg) 0%, #161625 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px; overflow-x: hidden;
        }

        .header {
            width: 100%; max-width: 1000px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(139, 92, 246, 0.2); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area { text-align: center; margin-bottom: 20px;}
        h1 { font-size: 2.2rem; color: var(--tertiary); font-weight: 900;}
        .subtitle { color: #94A3B8; font-size: 1.1rem; margin-top: 5px;}

        .canvas-area {
            position: relative; width: 100%; max-width: 800px; height: 500px; 
            background: #11111A; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.4); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden;
            perspective: 1200px;
        }

        .expl-text {
            position: absolute; top: 30px; font-size: 1.5rem; color: white; font-weight: 800;
            opacity: 1; transition: 0.5s; text-align: center; width: 80%; text-shadow: 0 5px 10px black; z-index: 10;
        }

        .formula-box {
            position: absolute; bottom: 30px; background: rgba(0,0,0,0.5); border: 2px solid var(--accent);
            padding: 15px 30px; border-radius: 20px; font-size: 2rem; font-weight: 900; color: white;
            opacity: 0; transform: translateY(20px); transition: all 1s; z-index: 10;
        }

        /* 3D Container */
        .scene {
            width: 200px; height: 200px; position: relative;
            transform-style: preserve-3d; transform: rotateX(-15deg) rotateY(30deg);
        }

        .wire-box {
            position: absolute; width: 200px; height: 200px; transform-style: preserve-3d;
            border: 2px dashed rgba(255,255,255,0.3);
        }
        
        .wire-box::before, .wire-box::after {
            content: ''; position: absolute; width: 200px; height: 200px; border: 2px dashed rgba(255,255,255,0.3);
        }
        .wire-box::before { transform: rotateY(90deg) translateZ(100px) translateX(-100px); }
        .wire-box::after { transform: rotateX(90deg) translateZ(100px) translateY(100px); }

        /* The sweeping plane */
        .sweep-plane {
            position: absolute; width: 200px; height: 200px; background: rgba(16, 185, 129, 0.8);
            border: 2px solid var(--secondary);
            transform: rotateX(90deg) translateZ(100px); /* start at bottom */
            box-shadow: 0 0 30px var(--secondary);
            display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 900;
        }

        /* The solid volume being generated */
        .solid-vol {
            position: absolute; width: 200px; background: rgba(16, 185, 129, 0.3);
            bottom: 0; height: 0; /* height grows */
            transform: rotateY(0deg) translateZ(100px);
            border: 1px solid rgba(16,185,129,0.5);
            transform-style: preserve-3d;
        }
        .solid-vol::before {
            content: ''; position: absolute; width: 200px; height: 100%; background: rgba(16, 185, 129, 0.3);
            transform: rotateY(90deg) translateZ(100px) translateX(-100px);
            border: 1px solid rgba(16,185,129,0.5);
        }

        .btn-play {
            background: var(--primary); color: white; border: none; padding: 15px 40px; border-radius: 50px;
            font-size: 1.2rem; font-weight: 900; cursor: pointer; transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.4); margin-top: 30px; z-index: 10;
        }
        .btn-play:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 15px 25px rgba(139, 92, 246, 0.6); }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=8B5CF6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.7.4.4. Hacim Bağıntısı (Animasyon)</div>
    </div>

    <div class="title-area">
        <h1>Taban Alanı x Yükseklik İspatı</h1>
        <p class="subtitle">Taban alanının yüksekliğe doğru süpürülmesi (integral mantığı) ile hacmin nasıl oluştuğunu izleyin.</p>
    </div>

    <div class="canvas-area">
        
        <div class="expl-text" id="explText">1. Önce prizmanın TABAN ALANI belirlenir.</div>

        <div class="scene">
            <div class="wire-box"></div>
            
            <div class="solid-vol" id="solidVol"></div>
            
            <div class="sweep-plane" id="sweepPlane">Taban Alanı</div>
        </div>

        <div class="formula-box" id="formulaBox">
            V = <span style="color:var(--secondary)">Taban Alanı</span> × <span style="color:var(--tertiary)">Yükseklik</span>
        </div>

    </div>

    <button class="btn-play" id="btnPlay" onclick="runAnim()">Animasyonu Başlat</button>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const btnPlay = document.getElementById('btnPlay');
        const explText = document.getElementById('explText');
        
        const sweepPlane = document.getElementById('sweepPlane');
        const solidVol = document.getElementById('solidVol');
        const formulaBox = document.getElementById('formulaBox');

        async function runAnim() {
            btnPlay.disabled = true;
            btnPlay.style.opacity = 0.5;

            // Reset
            sweepPlane.style.transition = "none";
            solidVol.style.transition = "none";
            sweepPlane.style.transform = "rotateX(90deg) translateZ(-100px)"; // bottom of 200px box is Z=-100 if center is 0
            // actually Z axis depends on parent transform. Let's use simple translation.
            // if parent is 200x200, bottom is translateY(100px) when rotated.
            sweepPlane.style.transform = "rotateX(90deg) translateZ(100px)";
            solidVol.style.height = "0px";
            
            formulaBox.style.opacity = 0;
            formulaBox.style.transform = "translateY(20px)";

            explText.innerText = "1. Önce prizmanın yeşil TABAN ALANI belirlenir.";
            
            await sleep(2000);

            explText.innerText = "2. Bu alan prizmanın YÜKSEKLİĞİ boyunca hareket eder (süprülür).";
            
            // Sweep up
            // Animate plane Z from 100px to -100px
            // Animate solid height from 0 to 200px
            sweepPlane.style.transition = "transform 3s linear";
            solidVol.style.transition = "height 3s linear";

            sweepPlane.style.transform = "rotateX(90deg) translateZ(-100px)";
            solidVol.style.height = "200px";

            await sleep(3500);

            explText.innerText = "3. Taban alanının taradığı tüm boşluk hacmi oluşturur.";
            
            formulaBox.style.opacity = 1;
            formulaBox.style.transform = "translateY(0)";

            await sleep(2500);

            explText.style.color = "var(--secondary)";

            btnPlay.disabled = false;
            btnPlay.style.opacity = 1;
            btnPlay.innerText = "Tekrar İzle";
        }
    </script>
</body>
</html>
