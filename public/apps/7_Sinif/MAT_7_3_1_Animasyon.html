<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yansıma Dönüşümü Animasyonu</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F0E17; --surface: #1A1A24; --text: #F8FAFC;
            --primary: #8B5CF6; --secondary: #10B981;
            --tertiary: #06B6D4; --danger: #F43F5E;
            --accent: #F59E0B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, var(--bg) 0%, #161625 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px; overflow-x: hidden;
        }

        .header {
            width: 100%; max-width: 1000px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(139, 92, 246, 0.2); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area { text-align: center; margin-bottom: 20px;}
        h1 { font-size: 2.2rem; color: var(--tertiary); font-weight: 900;}
        .subtitle { color: #94A3B8; font-size: 1.1rem; margin-top: 5px;}

        .canvas-area {
            position: relative; width: 100%; max-width: 800px; height: 500px; 
            background: #11111A; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.4); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden;
        }

        /* SVG styling for shapes */
        svg { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }

        .symmetry-line { stroke: var(--primary); stroke-width: 4; stroke-dasharray: 10 5; }
        
        .shape-original { fill: rgba(6, 182, 212, 0.2); stroke: var(--tertiary); stroke-width: 3; }
        .shape-reflection { fill: rgba(16, 185, 129, 0.2); stroke: var(--secondary); stroke-width: 3; opacity: 0;}
        
        .dist-line { stroke: white; stroke-width: 2; stroke-dasharray: 5 5; opacity: 0; transition: stroke-dashoffset 2s linear; }
        .dist-text { fill: var(--accent); font-family: 'Outfit'; font-weight: 800; font-size: 1.2rem; opacity: 0;}

        .expl-text {
            position: absolute; top: 30px; font-size: 1.5rem; color: white; font-weight: 800;
            opacity: 0; transition: 0.5s; text-align: center; width: 80%; text-shadow: 0 5px 10px black; z-index: 10;
        }

        .btn-play {
            background: var(--primary); color: white; border: none; padding: 15px 40px; border-radius: 50px;
            font-size: 1.2rem; font-weight: 900; cursor: pointer; transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.4); margin-top: 30px; z-index: 10;
        }
        .btn-play:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 15px 25px rgba(139, 92, 246, 0.6); }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=8B5CF6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.7.3.1. Şekillerin Yansıma Dönüşümü (Animasyon)</div>
    </div>

    <div class="title-area">
        <h1>Eşit Uzaklık Kuralı (Otomatik İspat)</h1>
        <p class="subtitle">Bir şeklin simetri aynasındaki yansımasının nasıl oluştuğunu ve uzaklıkların nasıl korunduğunu izleyin.</p>
    </div>

    <div class="canvas-area">
        
        <div class="expl-text" id="explText">Birinci adım: Köşelerin aynaya olan uzaklıkları çizilir.</div>

        <svg viewBox="0 0 800 500">
            <!-- Grid lines for visual aid (optional) -->
            <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
                <!-- Vertical -->
                <line x1="100" y1="0" x2="100" y2="500"></line>
                <line x1="200" y1="0" x2="200" y2="500"></line>
                <line x1="300" y1="0" x2="300" y2="500"></line>
                <line x1="500" y1="0" x2="500" y2="500"></line>
                <line x1="600" y1="0" x2="600" y2="500"></line>
                <line x1="700" y1="0" x2="700" y2="500"></line>
            </g>

            <!-- Symmetry Line -->
            <line x1="400" y1="50" x2="400" y2="450" class="symmetry-line"></line>
            <text x="375" y="40" fill="#8B5CF6" font-family="Outfit" font-weight="900">AYNA</text>

            <!-- Original Shape (Triangle on Left) -->
            <!-- A: (300, 150), B: (200, 350), C: (300, 350) -->
            <polygon points="300,150 200,350 300,350" class="shape-original" id="origShape"></polygon>

            <!-- Distance Lines -->
            <line x1="300" y1="150" x2="400" y2="150" class="dist-line" id="lineA1"></line>
            <line x1="400" y1="150" x2="500" y2="150" class="dist-line" id="lineA2"></line>
            
            <line x1="200" y1="350" x2="400" y2="350" class="dist-line" id="lineB1"></line>
            <line x1="400" y1="350" x2="600" y2="350" class="dist-line" id="lineB2"></line>

            <!-- Dist Text -->
            <text x="330" y="140" class="dist-text" id="tA1">100px</text>
            <text x="430" y="140" class="dist-text" id="tA2">100px</text>
            
            <text x="280" y="340" class="dist-text" id="tB1">200px</text>
            <text x="480" y="340" class="dist-text" id="tB2">200px</text>

            <!-- Reflected Shape (Triangle on Right) -->
            <!-- A': (500, 150), B': (600, 350), C': (500, 350) -->
            <polygon points="500,150 600,350 500,350" class="shape-reflection" id="refShape"></polygon>

        </svg>

    </div>
    
    <button class="btn-play" id="btnPlay" onclick="playAnim()">Animasyonu Başlat</button>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const btnPlay = document.getElementById('btnPlay');
        const explText = document.getElementById('explText');

        const lineA1 = document.getElementById('lineA1');
        const lineA2 = document.getElementById('lineA2');
        const lineB1 = document.getElementById('lineB1');
        const lineB2 = document.getElementById('lineB2');
        
        const tA1 = document.getElementById('tA1');
        const tA2 = document.getElementById('tA2');
        const tB1 = document.getElementById('tB1');
        const tB2 = document.getElementById('tB2');
        
        const refShape = document.getElementById('refShape');

        async function playAnim() {
            btnPlay.disabled = true;
            btnPlay.style.opacity = 0.5;

            // Reset
            lineA1.style.opacity = 0; lineA2.style.opacity = 0;
            lineB1.style.opacity = 0; lineB2.style.opacity = 0;
            tA1.style.opacity = 0; tA2.style.opacity = 0;
            tB1.style.opacity = 0; tB2.style.opacity = 0;
            refShape.style.opacity = 0; refShape.style.transition = "none";

            explText.style.opacity = 1;
            explText.innerText = "Her köşeden simetri eksenine DİK doğrular çizilir.";
            
            await sleep(2000);
            
            lineA1.style.opacity = 1; tA1.style.opacity = 1;
            lineB1.style.opacity = 1; tB1.style.opacity = 1;
            
            await sleep(2500);

            explText.innerText = "Çizilen bu doğrular, AYNA'nın diğer tarafına aynı uzunlukta uzatılır.";
            
            lineA2.style.opacity = 1;
            lineB2.style.opacity = 1;
            
            await sleep(1500);
            tA2.style.opacity = 1;
            tB2.style.opacity = 1;

            await sleep(3000);

            explText.innerText = "Uzatılan noktalar birleştirilerek şeklin SİMETRİĞİ elde edilir.";
            
            refShape.style.transition = "opacity 1s";
            refShape.style.opacity = 1;

            await sleep(3000);
            
            explText.innerText = "Kural: Şeklin aynaya olan dik uzaklığı ile görüntüsünün uzaklığı daima EŞİTTİR.";
            explText.style.color = "var(--secondary)";

            btnPlay.disabled = false;
            btnPlay.style.opacity = 1;
            btnPlay.innerText = "Tekrar İzle";
        }
    </script>
</body>
</html>
