<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tepe Değer Animasyonu</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F0E17; --surface: #1A1A24; --text: #F8FAFC;
            --primary: #8B5CF6; --secondary: #10B981;
            --tertiary: #06B6D4; --danger: #F43F5E;
            --accent: #F59E0B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, var(--bg) 0%, #161625 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px; overflow-x: hidden;
        }

        .header {
            width: 100%; max-width: 1000px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(139, 92, 246, 0.2); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area { text-align: center; margin-bottom: 20px;}
        h1 { font-size: 2.2rem; color: var(--tertiary); font-weight: 900;}
        .subtitle { color: #94A3B8; font-size: 1.1rem; margin-top: 5px;}

        .canvas-area {
            position: relative; width: 100%; max-width: 800px; height: 500px; 
            background: #11111A; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.4); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden;
        }

        .expl-text {
            position: absolute; top: 20px; font-size: 1.5rem; color: white; font-weight: 800;
            opacity: 1; transition: 0.5s; text-align: center; width: 80%; text-shadow: 0 5px 10px black; z-index: 10;
        }

        /* Rain animation area */
        .rain-area {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        }

        .falling-num {
            position: absolute; width: 50px; height: 50px; background: rgba(255,255,255,0.1); border: 2px solid white;
            color: white; font-weight: 900; font-size: 1.5rem; display: flex; align-items: center; justify-content: center;
            border-radius: 10px; top: -60px; transition: transform 1s cubic-bezier(0.55, 0.085, 0.68, 0.53);
        }

        /* Buckets at bottom */
        .buckets-container {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 30px; align-items: flex-end; justify-content: center;
        }

        .bucket-col {
            width: 60px; display: flex; flex-direction: column-reverse; gap: 5px; position: relative;
        }
        
        .bucket-label {
            position: absolute; bottom: -30px; left: 50%; transform: translateX(-50%);
            color: #94A3B8; font-weight: 900; font-size: 1.2rem;
        }

        .stacked-box {
            width: 60px; height: 60px; background: var(--primary); color: white; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 900;
            box-shadow: 0 5px 10px rgba(0,0,0,0.3);
        }

        .btn-play {
            background: var(--primary); color: white; border: none; padding: 15px 40px; border-radius: 50px;
            font-size: 1.2rem; font-weight: 900; cursor: pointer; transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.4); margin-top: 30px; z-index: 10;
        }
        .btn-play:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 15px 25px rgba(139, 92, 246, 0.6); }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=8B5CF6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.7.5.5. Tepe Değer (Animasyon)</div>
    </div>

    <div class="title-area">
        <h1>Sayıların Yağmuru</h1>
        <p class="subtitle">Gelen sayılar üst üste bindiğinde, oluşan en yüksek tepe bize Mod'u verir.</p>
    </div>

    <div class="canvas-area">
        
        <div class="expl-text" id="explText">1. Karışık veriler yukarıdan düşmeye başlıyor.</div>

        <div class="rain-area" id="rainArea"></div>

        <div class="buckets-container" id="bucketsContainer">
            <div class="bucket-col" id="col5"><div class="bucket-label">5</div></div>
            <div class="bucket-col" id="col8"><div class="bucket-label">8</div></div>
            <div class="bucket-col" id="col12"><div class="bucket-label">12</div></div>
        </div>

    </div>

    <button class="btn-play" id="btnPlay" onclick="runAnim()">Yağmuru Başlat</button>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const btnPlay = document.getElementById('btnPlay');
        const explText = document.getElementById('explText');
        const rainArea = document.getElementById('rainArea');
        
        // Let's create an array of data. Mode will be 8.
        // 5: 2 times, 8: 4 times, 12: 1 time
        const dataSequence = [5, 8, 12, 8, 5, 8, 8];
        const colMap = { 5: 0, 8: 1, 12: 2 }; // to get x positions relative to container
        
        async function runAnim() {
            btnPlay.disabled = true;
            btnPlay.style.opacity = 0.5;

            // Reset
            rainArea.innerHTML = "";
            document.getElementById('col5').innerHTML = '<div class="bucket-label">5</div>';
            document.getElementById('col8').innerHTML = '<div class="bucket-label">8</div>';
            document.getElementById('col12').innerHTML = '<div class="bucket-label">12</div>';
            
            explText.innerText = "1. Karışık veriler sütunlara düşerek birikmeye başlıyor.";

            const containerRect = document.getElementById('bucketsContainer').getBoundingClientRect();
            const canvasRect = document.querySelector('.canvas-area').getBoundingClientRect();

            let targetCounts = { 5:0, 8:0, 12:0 };

            for(let i=0; i<dataSequence.length; i++) {
                let val = dataSequence[i];
                
                // create falling div
                let fall = document.createElement('div');
                fall.className = 'falling-num';
                fall.innerText = val;
                
                // x position depends on the column
                // columns are 60px wide, gap is 30px
                let startX = (canvasRect.width / 2) - 135; // approx centering for 3 cols (60+30+60+30+60 = 240. 240/2 = 120 offset)
                let colX = startX + (colMap[val] * 90); 
                
                fall.style.left = colX + "px";
                rainArea.appendChild(fall);

                // calculate drop distance based on current items in column
                let dropDistance = 450 - (targetCounts[val] * 65); // 65 is block height + gap

                // force reflow
                fall.getBoundingClientRect();
                
                // animate drop
                fall.style.transform = `translateY(${dropDistance}px)`;
                
                await sleep(800);
                
                // remove falling and add to actual column
                fall.remove();
                
                let stacked = document.createElement('div');
                stacked.className = 'stacked-box';
                stacked.innerText = val;
                
                document.getElementById('col' + val).appendChild(stacked);
                
                targetCounts[val]++;
                
                await sleep(400);
            }

            await sleep(1000);

            explText.innerText = "2. En çok tekrar eden sayı (8), grafikteki en yüksek tepeyi oluşturdu!";
            
            // Highlight mod
            const modCol = document.getElementById('col8');
            for(let i=1; i<modCol.children.length; i++) {
                modCol.children[i].style.background = "var(--accent)";
                modCol.children[i].style.color = "#11111A";
                modCol.children[i].style.boxShadow = "0 0 30px rgba(245, 158, 11, 0.8)";
            }

            await sleep(2000);

            explText.style.color = "var(--accent)";
            explText.innerText = "Tepesi en yüksek olan bu değere TEPE DEĞER (Mod) denir.";

            btnPlay.disabled = false;
            btnPlay.style.opacity = 1;
            btnPlay.innerText = "Tekrar İzle";
        }
    </script>
</body>
</html>
