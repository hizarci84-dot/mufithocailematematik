<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Problem Akış Animasyonu</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F0E17; --surface: #1A1A24; --text: #F8FAFC;
            --primary: #8B5CF6; --secondary: #10B981;
            --tertiary: #06B6D4; --danger: #F43F5E;
            --accent: #F59E0B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, var(--bg) 0%, #161625 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px; overflow-x: hidden;
        }

        .header {
            width: 100%; max-width: 1000px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(139, 92, 246, 0.2); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area { text-align: center; margin-bottom: 20px;}
        h1 { font-size: 2.2rem; color: var(--tertiary); font-weight: 900;}
        .subtitle { color: #94A3B8; font-size: 1.1rem; margin-top: 5px;}

        .canvas-area {
            position: relative; width: 100%; max-width: 800px; height: 500px; 
            background: #11111A; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.4); 
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }

        /* 3D-ish layers */
        .layer {
            position: absolute; width: 300px; height: 200px; 
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 1.5rem; color: white;
            transition: all 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            transform: perspective(1000px) rotateX(60deg) rotateZ(-45deg) translateZ(0px);
            box-shadow: 0 20px 30px rgba(0,0,0,0.5);
        }

        .layer-base { background: rgba(16, 185, 129, 0.4); border: 4px solid var(--secondary); }
        
        .layer-cutout {
            width: 100px; height: 100px; border-radius: 50%;
            background: rgba(244, 63, 94, 0.8); border: 4px dashed white;
            position: absolute; display: flex; align-items: center; justify-content: center;
            transition: all 1.5s;
        }

        .expl-box {
            position: absolute; top: 30px; font-size: 1.5rem; color: white; font-weight: 800;
            opacity: 1; transition: 0.5s; text-align: center; width: 80%; text-shadow: 0 5px 10px black; z-index: 10;
        }

        .calc-box {
            position: absolute; bottom: 30px; background: rgba(0,0,0,0.6); border: 2px solid var(--primary);
            padding: 15px 30px; border-radius: 15px; font-size: 1.5rem; font-weight: 900; color: white;
            opacity: 0; transform: translateY(20px); transition: 1s; display: flex; flex-direction: column; gap: 10px;
        }
        .calc-row { display: flex; justify-content: space-between; width: 300px; }
        .res-line { border-top: 2px dashed rgba(255,255,255,0.3); margin-top: 5px; padding-top: 10px; color: var(--accent); font-size: 1.8rem;}

        .btn-play {
            background: var(--primary); color: white; border: none; padding: 15px 40px; border-radius: 50px;
            font-size: 1.2rem; font-weight: 900; cursor: pointer; transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.4); margin-top: 30px; z-index: 10;
        }
        .btn-play:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 15px 25px rgba(139, 92, 246, 0.6); }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=8B5CF6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.7.4.10. Alan Problemleri (Animasyon)</div>
    </div>

    <div class="title-area">
        <h1>Bileşik Alanların Parçalanması</h1>
        <p class="subtitle">İç içe geçmiş şekillerin alanlarının mantıksal olarak nasıl çıkarıldığını izleyin.</p>
    </div>

    <div class="canvas-area">
        
        <div class="expl-box" id="explText">1. Tüm şekil bir BÜTÜN (Dikdörtgen) olarak ele alınır.</div>

        <div class="layer layer-base" id="baseL">
            <div class="layer-cutout" id="cutoutL"></div>
        </div>

        <div class="calc-box" id="calcBox">
            <div class="calc-row"><span>Tüm Alan:</span> <span id="v1">-</span></div>
            <div class="calc-row"><span>Çıkan Alan:</span> <span id="v2" style="color:var(--danger)">-</span></div>
            <div class="calc-row res-line"><span>Kalan Alan:</span> <span id="v3">-</span></div>
        </div>

    </div>

    <button class="btn-play" id="btnPlay" onclick="runAnim()">Bilişsel Çözümü Başlat</button>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const btnPlay = document.getElementById('btnPlay');
        const explText = document.getElementById('explText');
        const baseL = document.getElementById('baseL');
        const cutoutL = document.getElementById('cutoutL');
        
        const calcBox = document.getElementById('calcBox');
        const v1 = document.getElementById('v1');
        const v2 = document.getElementById('v2');
        const v3 = document.getElementById('v3');

        async function runAnim() {
            btnPlay.disabled = true;
            btnPlay.style.opacity = 0.5;

            // Reset
            baseL.style.transform = "perspective(1000px) rotateX(60deg) rotateZ(-45deg) translateZ(0px)";
            cutoutL.style.transform = "translateZ(0px)";
            cutoutL.style.opacity = 1;
            calcBox.style.opacity = 0; calcBox.style.transform = "translateY(20px)";
            v1.innerText = "-"; v2.innerText = "-"; v3.innerText = "-";
            
            explText.innerText = "1. Tüm şekil (Dikdörtgen) bütün olarak hesaplanır.";
            
            await sleep(1500);
            
            calcBox.style.opacity = 1;
            calcBox.style.transform = "translateY(0)";
            v1.innerText = "240 m²";

            await sleep(2000);

            explText.innerText = "2. İstenmeyen kısım (Daire) şekilden sökülüp atılır.";
            
            // Pop the circle out in 3D
            cutoutL.style.transform = "translateZ(150px) scale(1.1)";
            
            await sleep(1500);

            v2.innerText = "48 m²";
            
            await sleep(1500);
            
            // Throw it away
            cutoutL.style.opacity = 0;
            cutoutL.style.transform = "translateZ(200px) translateX(200px) scale(0)";

            await sleep(1000);

            explText.innerText = "3. Çıkarma işlemi yapılarak KALAN ALAN bulunur.";
            
            v3.innerText = "192 m²";
            
            // Re-flatten the view to face user
            baseL.style.transform = "perspective(1000px) rotateX(0deg) rotateZ(0deg) translateZ(0px)";
            baseL.style.background = "repeating-linear-gradient(45deg, rgba(16, 185, 129, 0.4), rgba(16, 185, 129, 0.4) 10px, rgba(16, 185, 129, 0.6) 10px, rgba(16, 185, 129, 0.6) 20px)";

            await sleep(2500);

            explText.style.color = "var(--secondary)";
            explText.innerText = "Karmaşık şekiller daima bilindik basit parçalara ayrılarak çözülür.";

            btnPlay.disabled = false;
            btnPlay.style.opacity = 1;
            btnPlay.innerText = "Tekrar İzle";
        }
    </script>
</body>
</html>
