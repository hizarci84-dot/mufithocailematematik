<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Açıortay İnşa Animasyonu</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F0E17; --surface: #1A1A24; --text: #F8FAFC;
            --primary: #8B5CF6; --secondary: #10B981;
            --tertiary: #06B6D4; --danger: #F43F5E;
            --accent: #F59E0B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, var(--bg) 0%, #161625 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px; overflow-x: hidden;
        }

        .header {
            width: 100%; max-width: 1000px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(139, 92, 246, 0.2); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area { text-align: center; margin-bottom: 20px;}
        h1 { font-size: 2.2rem; color: var(--tertiary); font-weight: 900;}
        .subtitle { color: #94A3B8; font-size: 1.1rem; margin-top: 5px;}

        .canvas-area {
            position: relative; width: 100%; max-width: 800px; height: 500px; 
            background: #11111A; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.4); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden;
        }

        svg { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }

        .ray { stroke: white; stroke-width: 4; stroke-linecap: round; }
        
        .pt-vertex { fill: white; }
        .arc-main { stroke: var(--tertiary); stroke-width: 3; fill: transparent; stroke-dasharray: 5 5; opacity: 0; transition: opacity 1s;}
        
        .pt-intersect { fill: var(--primary); opacity: 0; transition: opacity 0.5s; r: 8;}
        
        .arc-sub { stroke: var(--secondary); stroke-width: 2; fill: transparent; opacity: 0; transition: opacity 1s;}

        .bisector-line { stroke: var(--danger); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 500; stroke-dashoffset: 500; transition: stroke-dashoffset 2s ease-out;}

        .expl-text {
            position: absolute; top: 30px; font-size: 1.5rem; color: white; font-weight: 800;
            opacity: 0; transition: 0.5s; text-align: center; width: 80%; text-shadow: 0 5px 10px black; z-index: 10;
        }

        .btn-play {
            background: var(--primary); color: white; border: none; padding: 15px 40px; border-radius: 50px;
            font-size: 1.2rem; font-weight: 900; cursor: pointer; transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.4); margin-top: 30px; z-index: 10;
        }
        .btn-play:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 15px 25px rgba(139, 92, 246, 0.6); }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=8B5CF6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.7.3.2. Açıortay İnşası (Animasyon)</div>
    </div>

    <div class="title-area">
        <h1>Otomatik Açıortay Çizimi</h1>
        <p class="subtitle">Pergelin kollarını eşit mesafede tutarak bir açının tam ortasından geçen doğrunun nasıl bulunduğunu izleyin.</p>
    </div>

    <div class="canvas-area">
        
        <div class="expl-text" id="explText">1. Pergelin sivri ucunu açının köşesine koyup kolları kesen bir yay çizelim.</div>

        <svg viewBox="0 0 800 500">
            <!-- Angle Rays from Vertex (150, 250) -->
            <!-- Ray 1: horizontal to (600, 250) -->
            <!-- Ray 2: angled 60 deg to (375, 60) -->
            <line x1="150" y1="250" x2="600" y2="250" class="ray"></line>
            <line x1="150" y1="250" x2="375" y2="-139" class="ray"></line> 
            <!-- wait 375, -139 is out of bounds but it's a line -->
            
            <circle cx="150" cy="250" r="8" class="pt-vertex"></circle>
            <text x="130" y="270" fill="white" font-family="Outfit" font-weight="900" font-size="1.5rem">O</text>

            <!-- Main arc from O, radius 200 -->
            <!-- Intersects horizontal ray at (350, 250) -->
            <!-- Intersects angled ray (60 deg) at (150 + 200*cos60, 250 - 200*sin60) = (250, 76.79) -->
            <path d="M 350 250 A 200 200 0 0 0 250 76.8" class="arc-main" id="arcMain"></path>

            <circle cx="350" cy="250" class="pt-intersect" id="pt1"></circle>
            <circle cx="250" cy="76.8" class="pt-intersect" id="pt2"></circle>

            <!-- Sub arcs from pt1 and pt2, radius 200 -->
            <!-- From pt1 (350, 250): circle center (350,250), r=200 -->
            <!-- From pt2 (250, 76.8): circle center (250,76.8), r=200 -->
            <!-- Intersection of these two circles is the angle bisector point -->
            <!-- The bisector is at 30 deg. (150,250) + d*(cos30, -sin30) -->
            <!-- distance to intersection is 200 * sqrt(3) = 346.41 -->
            <!-- intersect point: 150 + 346.41*cos30 = 450, 250 - 346.41*sin30 = 76.8 -->
            <path d="M 450 76.8 A 200 200 0 0 1 250 140" class="arc-sub" id="arcSub1"></path>
            <path d="M 350 140 A 200 200 0 0 1 450 76.8" class="arc-sub" id="arcSub2"></path>

            <circle cx="450" cy="76.8" class="pt-intersect" id="ptBisect"></circle>

            <!-- Bisector line from O (150,250) through (450,76.8) to (600, -10) -->
            <line x1="150" y1="250" x2="600" y2="-10" class="bisector-line" id="bisectorLine"></line>

        </svg>

    </div>
    
    <button class="btn-play" id="btnPlay" onclick="playAnim()">Animasyonu Başlat</button>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const btnPlay = document.getElementById('btnPlay');
        const explText = document.getElementById('explText');

        const arcMain = document.getElementById('arcMain');
        const pt1 = document.getElementById('pt1');
        const pt2 = document.getElementById('pt2');
        const arcSub1 = document.getElementById('arcSub1');
        const arcSub2 = document.getElementById('arcSub2');
        const ptBisect = document.getElementById('ptBisect');
        const bisectorLine = document.getElementById('bisectorLine');

        async function playAnim() {
            btnPlay.disabled = true;
            btnPlay.style.opacity = 0.5;

            // Reset
            arcMain.style.opacity = 0; pt1.style.opacity = 0; pt2.style.opacity = 0;
            arcSub1.style.opacity = 0; arcSub2.style.opacity = 0; ptBisect.style.opacity = 0;
            bisectorLine.style.transition = "none";
            bisectorLine.style.strokeDashoffset = 500;

            explText.style.opacity = 1;
            explText.innerText = "1. Pergelin sivri ucunu açının köşesine koyup kolları kesen bir yay çizilir.";
            
            await sleep(2000);
            
            arcMain.style.opacity = 1;
            await sleep(1500);
            
            pt1.style.opacity = 1;
            pt2.style.opacity = 1;
            
            await sleep(2000);

            explText.innerText = "2. Pergelin açıklığı hiç bozulmadan, sivri uç sırayla kırmızı kesişim noktalarına batırılıp iki yay daha çizilir.";
            
            arcSub1.style.opacity = 1;
            await sleep(1500);
            arcSub2.style.opacity = 1;

            await sleep(2000);

            explText.innerText = "3. Çizilen iki yayın kesiştiği nokta işaretlenir.";
            ptBisect.style.opacity = 1;

            await sleep(2500);
            
            explText.innerText = "4. Köşe noktası ile bu yeni nokta birleştirilir. AÇIORTAY HAZIR!";
            
            // force reflow
            bisectorLine.getBoundingClientRect();
            bisectorLine.style.transition = "stroke-dashoffset 2s ease-out";
            bisectorLine.style.strokeDashoffset = 0;

            await sleep(2500);

            explText.style.color = "var(--secondary)";

            btnPlay.disabled = false;
            btnPlay.style.opacity = 1;
            btnPlay.innerText = "Tekrar İzle";
        }
    </script>
</body>
</html>
