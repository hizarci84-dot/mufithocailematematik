<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kareköklü Sayılar Laboratuvarı</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F0E17; --surface: #1A1A24; --text: #F8FAFC;
            --primary: #8B5CF6; --secondary: #10B981;
            --tertiary: #06B6D4; --danger: #F43F5E;
            --accent: #F59E0B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, var(--bg) 0%, #161625 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px; overflow-x: hidden;
        }

        .header {
            width: 100%; max-width: 1000px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(139, 92, 246, 0.2); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area { text-align: center; margin-bottom: 20px;}
        h1 { font-size: 2.2rem; color: var(--tertiary); font-weight: 900;}
        .subtitle { color: #94A3B8; font-size: 1.1rem; margin-top: 5px;}

        .main-container {
            display: flex; gap: 30px; width: 100%; max-width: 1000px; flex-wrap: wrap; justify-content: center;
        }

        .panel {
            background: #11111A; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.4); 
            padding: 30px; display: flex; width: 100%; gap: 40px; align-items: center; flex-direction: column;
        }

        /* Top visual section */
        .visual-split {
            display: flex; width: 100%; gap: 30px; align-items: center; justify-content: center;
        }
        
        .square-area {
            width: 300px; height: 300px; background: rgba(0,0,0,0.3); border-radius: 20px;
            display: flex; align-items: flex-end; justify-content: flex-start; padding: 10px;
            position: relative; border: 2px dashed rgba(255,255,255,0.2);
        }

        .the-square {
            background: rgba(16, 185, 129, 0.2); border: 2px solid var(--secondary);
            border-radius: 10px; position: relative; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center;
            box-shadow: inset 0 0 20px rgba(16, 185, 129, 0.4);
        }
        
        .sq-text { font-size: 1.5rem; font-weight: 900; color: white; text-shadow: 0 2px 5px black;}
        .side-label { position: absolute; top: -30px; color: var(--accent); font-weight: 900; width: 100%; text-align: center;}

        /* Controls */
        .control-area {
            display: flex; flex-direction: column; gap: 20px; width: 300px;
        }

        .card {
            background: var(--surface); padding: 20px; border-radius: 15px; border-left: 5px solid var(--primary);
            display: flex; flex-direction: column; gap: 10px;
        }
        .card-val { font-size: 2rem; color: var(--tertiary); font-weight: 900;}

        input[type=range] { width: 100%; cursor: pointer; accent-color: var(--secondary); margin-top: 10px;}

        /* Number Line Radar */
        .radar-area {
            width: 100%; background: #161625; padding: 30px; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; gap: 20px;
        }

        .nl-container {
            position: relative; width: 100%; height: 50px; display: flex; align-items: center;
        }
        
        .nl-line {
            width: 100%; height: 6px; background: #334155; border-radius: 3px; position: relative;
        }
        
        .tick {
            position: absolute; width: 4px; height: 20px; background: white; top: -7px; transform: translateX(-50%);
            border-radius: 2px;
        }
        .tick-label {
            position: absolute; top: 25px; transform: translateX(-50%); color: #94A3B8; font-weight: 800;
        }

        /* The marker for sqrt */
        .marker {
            position: absolute; top: -30px; width: 0; height: 0;
            border-left: 10px solid transparent; border-right: 10px solid transparent;
            border-top: 20px solid var(--danger); transform: translateX(-50%);
            transition: left 0.2s; z-index: 10;
            filter: drop-shadow(0 0 10px var(--danger));
        }
        .marker-val {
            position: absolute; top: -60px; transform: translateX(-50%);
            background: var(--danger); color: white; padding: 5px 10px; border-radius: 10px;
            font-weight: 900; font-size: 1.1rem; white-space: nowrap; transition: left 0.2s;
            box-shadow: 0 5px 15px rgba(244, 63, 94, 0.4);
        }

        .status { text-align: center; font-size: 1.2rem; color: var(--accent); font-weight: 800;}

        @media (max-width: 800px) {
            .visual-split { flex-direction: column; }
        }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=8B5CF6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.8.1.2. Kareköklü Sayılar (Etkinlik)</div>
    </div>

    <div class="title-area">
        <h1>Tarla Alanı ve Karekök Radarı</h1>
        <p class="subtitle">Alanı bilinen bir karenin kenar uzunluğu, alanın "Kareköküne" eşittir.</p>
    </div>

    <div class="main-container">
        
        <div class="panel">
            
            <div class="visual-split">
                <div class="square-area">
                    <div class="the-square" id="sq">
                        <div class="side-label" id="lblSide">?</div>
                        <div class="sq-text" id="lblArea">Alan = 1</div>
                    </div>
                </div>

                <div class="control-area">
                    <div class="card">
                        <span style="font-weight:800; color:white;">Karenin Alanı (Birime Karesi)</span>
                        <span class="card-val" id="valArea">1 br²</span>
                        <input type="range" id="sliderArea" min="1" max="100" value="1" oninput="updateSquare(this.value)">
                    </div>

                    <div style="background: rgba(139, 92, 246, 0.1); border: 2px solid var(--primary); padding: 15px; border-radius: 15px; text-align:center;">
                        <div style="font-size:1.2rem; color:white; font-weight:800;">Kenar Uzunluğu:</div>
                        <div style="font-size:2.5rem; color:var(--secondary); font-weight:900;" id="valMath">√1 = 1</div>
                    </div>
                </div>
            </div>

            <!-- Radar -->
            <div class="radar-area">
                <div class="status" id="statusText">Tam Kare Sayı!</div>
                <div class="nl-container">
                    <div class="marker-val" id="markerVal">√1 ≈ 1</div>
                    <div class="marker" id="marker"></div>
                    <div class="nl-line" id="nlLine">
                        <!-- Ticks 0 to 10 generated via JS -->
                    </div>
                </div>
            </div>

        </div>

    </div>

    <script>
        // Init Number Line 1 to 10
        const nlLine = document.getElementById('nlLine');
        for(let i=1; i<=10; i++) {
            let leftPct = ((i - 1) / 9) * 100;
            nlLine.innerHTML += `
                <div class="tick" style="left: ${leftPct}%;"></div>
                <div class="tick-label" style="left: ${leftPct}%;">${i}</div>
            `;
        }

        const sq = document.getElementById('sq');
        const lblSide = document.getElementById('lblSide');
        const lblArea = document.getElementById('lblArea');
        const valArea = document.getElementById('valArea');
        const valMath = document.getElementById('valMath');
        const marker = document.getElementById('marker');
        const markerVal = document.getElementById('markerVal');
        const statusText = document.getElementById('statusText');

        function updateSquare(val) {
            let area = parseInt(val);
            let side = Math.sqrt(area);
            
            // Map side (1 to 10) to px (30 to 280)
            let px = 30 + ((side - 1) / 9) * 250;
            sq.style.width = px + "px";
            sq.style.height = px + "px";

            lblArea.innerHTML = area;
            
            let displaySide = Number.isInteger(side) ? side : side.toFixed(2);
            lblSide.innerText = displaySide;
            valArea.innerText = area + " br²";
            
            valMath.innerText = `√${area} = ${displaySide}`;

            // Map side (1 to 10) to line percentage (0% to 100%)
            let linePct = ((side - 1) / 9) * 100;
            marker.style.left = linePct + "%";
            markerVal.style.left = linePct + "%";
            markerVal.innerText = `√${area}`;

            if (Number.isInteger(side)) {
                statusText.innerText = "⭐ Mükemmel Tam Kare! Karekökü bir Doğal Sayıdır.";
                statusText.style.color = "var(--secondary)";
                sq.style.borderColor = "var(--secondary)";
                sq.style.background = "rgba(16, 185, 129, 0.2)";
                sq.style.boxShadow = "inset 0 0 20px rgba(16, 185, 129, 0.4)";
                markerVal.style.background = "var(--secondary)";
                marker.style.borderTopColor = "var(--secondary)";
                marker.style.filter = "drop-shadow(0 0 10px var(--secondary))";
            } else {
                let low = Math.floor(side);
                let high = Math.ceil(side);
                statusText.innerText = `Tam kare değil! Karekök değeri ${low} ile ${high} doğal sayıları arasındadır.`;
                statusText.style.color = "var(--accent)";
                sq.style.borderColor = "var(--accent)";
                sq.style.background = "rgba(245, 158, 11, 0.2)";
                sq.style.boxShadow = "inset 0 0 20px rgba(245, 158, 11, 0.4)";
                markerVal.style.background = "var(--danger)";
                marker.style.borderTopColor = "var(--danger)";
                marker.style.filter = "drop-shadow(0 0 10px var(--danger))";
            }
        }

        // Global spam click prevention for Etkinlik files
        document.addEventListener('click', function(e) {
            if (e.target.tagName === 'BUTTON' && !e.target.hasAttribute('data-spam-locked')) {
                e.target.setAttribute('data-spam-locked', 'true');
                let originalOpacity = e.target.style.opacity || '1';
                e.target.style.opacity = '0.7';
                e.target.style.pointerEvents = 'none';
                setTimeout(() => {
                    e.target.removeAttribute('data-spam-locked');
                    e.target.style.opacity = originalOpacity;
                    e.target.style.pointerEvents = 'auto';
                }, 400);
            }
        });

        // Initialize
        updateSquare(1);

    </script>
</body>
</html>
