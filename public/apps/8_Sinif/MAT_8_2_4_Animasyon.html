<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fonksiyon Veri Fabrikası Animasyonu</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F0E17; --surface: #1A1A24; --text: #F8FAFC;
            --primary: #8B5CF6; --secondary: #10B981;
            --tertiary: #06B6D4; --danger: #F43F5E;
            --accent: #F59E0B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, var(--bg) 0%, #161625 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px; overflow-x: hidden;
        }

        .header {
            width: 100%; max-width: 1000px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(139, 92, 246, 0.2); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area { text-align: center; margin-bottom: 20px;}
        h1 { font-size: 2.2rem; color: var(--tertiary); font-weight: 900;}
        .subtitle { color: #94A3B8; font-size: 1.1rem; margin-top: 5px;}

        .canvas-area {
            position: relative; width: 100%; max-width: 800px; height: 450px; 
            background: #11111A; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.4); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden;
        }

        .expl-text { background:rgba(139,92,246,0.15); border:1px solid rgba(139,92,246,0.3); padding:15px 25px; border-radius:12px; font-size:1.25rem; color:white; font-weight:800; text-align:center; width:100%; max-width:800px; margin-bottom:15px; transition:0.5s; }

        /* Factory */
        .factory {
            display: flex; align-items: center; justify-content: center; gap: 10px; position: relative; width: 100%;
        }

        .machine {
            background: var(--surface); border: 4px solid var(--primary); border-radius: 15px;
            width: 150px; height: 120px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: relative; box-shadow: 0 0 30px rgba(139, 92, 246, 0.2); z-index: 5;
        }
        
        .m-title { font-size: 1rem; color: #94A3B8; font-weight: 800;}
        .m-op { font-size: 2rem; color: var(--tertiary); font-weight: 900;}

        .conveyor {
            height: 10px; width: 60px; background: #334155; border-radius: 5px; position: relative;
        }

        /* The Data Box */
        .data-box {
            position: absolute; width: 50px; height: 50px; background: var(--secondary); border-radius: 10px;
            display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 900; color: white;
            box-shadow: 0 0 15px var(--secondary); top: 50%; transform: translateY(-50%); left: 20px;
            transition: all 1s linear; z-index: 10;
        }

        .btn-play {
            background: var(--primary); color: white; border: none; padding: 15px 40px; border-radius: 50px;
            font-size: 1.2rem; font-weight: 900; cursor: pointer; transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.4); margin-top: 30px; z-index: 10;
        }
        .btn-play:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 15px 25px rgba(139, 92, 246, 0.6); }

        .formula-box {
            position: absolute; bottom: 20px; background: rgba(0,0,0,0.9); border: 2px solid var(--accent);
            padding: 10px 30px; border-radius: 20px; font-size: 1.5rem; font-weight: 900; color: white;
            opacity: 0; transform: translateY(20px); transition: all 1s; z-index: 10; text-align: center;
        }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=8B5CF6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.8.2.4. Doğrusal Algoritma (Animasyon)</div>
    </div>

    <div class="title-area">
        <h1>Fonksiyon Fabrikası (f(x))</h1>
        <p class="subtitle">Her doğrusal fonksiyon f(x) = ax + b, veriyi (x) alır, algoritmik bir işlemden geçirir ve çıktı (y) üretir.</p>
    </div>

    <div class="expl-text" id="explText">1. Girdi (x): Sıcaklık 10 °C</div>
    <div class="canvas-area">
        

        <div class="factory">
            
            <div class="data-box" id="dataBox">10</div>

            <div class="conveyor"></div>

            <div class="machine">
                <div class="m-title">1. Adım</div>
                <div class="m-op">x 1.8</div>
            </div>

            <div class="conveyor"></div>

            <div class="machine" style="border-color: var(--accent);">
                <div class="m-title">2. Adım</div>
                <div class="m-op" style="color:var(--accent);">+ 32</div>
            </div>

            <div class="conveyor" style="width: 100px;"></div>

        </div>

        <div class="formula-box" id="formulaBox">
            f(x) = 1.8x + 32<br>
            <span style="color:var(--secondary)">f(10) = 50 °F</span>
        </div>

    </div>

    <button class="btn-play" id="btnPlay" onclick="runAnim()">Fabrikayı Çalıştır</button>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const btnPlay = document.getElementById('btnPlay');
        const explText = document.getElementById('explText');
        
        const dataBox = document.getElementById('dataBox');
        const formulaBox = document.getElementById('formulaBox');

        async function runAnim() {
            btnPlay.disabled = true;
            btnPlay.style.opacity = 0.5;

            // Move to Machine 1
            dataBox.style.left = "270px"; // approximate center of first machine
            await sleep(1000); // wait for move

            explText.innerText = "2. İlk işlem: 10 * 1.8 = 18";
            
            // Flash box
            dataBox.style.transform = "translateY(-50%) scale(1.3)";
            await sleep(300);
            dataBox.innerText = "18";
            dataBox.style.transform = "translateY(-50%) scale(1)";

            await sleep(1500);

            // Move to Machine 2
            explText.innerText = "3. İkinci işlem: 18 + 32 = 50";
            dataBox.style.left = "490px";
            await sleep(1000);

            dataBox.style.transform = "translateY(-50%) scale(1.3)";
            dataBox.style.background = "var(--danger)";
            dataBox.style.boxShadow = "0 0 15px var(--danger)";
            await sleep(300);
            dataBox.innerText = "50";
            dataBox.style.transform = "translateY(-50%) scale(1)";

            await sleep(1500);

            // Move to output
            explText.innerText = "4. Çıktı (y): 50 °F";
            dataBox.style.left = "700px";

            await sleep(1500);

            explText.style.color = "var(--secondary)";
            explText.innerText = "İşte doğrusal fonksiyonlar, algoritmaların cebirsel formüllerle yazılmış halidir!";
            
            formulaBox.style.opacity = 1;
            formulaBox.style.transform = "translateY(0)";

            btnPlay.style.display = "none";
        }
    </script>
</body>
</html>
