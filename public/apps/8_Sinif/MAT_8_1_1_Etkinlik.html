<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hücre Bölünmesi - Üslü İfadeler Laboratuvarı</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F0E17; --surface: #1A1A24; --text: #F8FAFC;
            --primary: #8B5CF6; --secondary: #10B981;
            --tertiary: #06B6D4; --danger: #F43F5E;
            --accent: #F59E0B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, var(--bg) 0%, #161625 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px; overflow-x: hidden;
        }

        .header {
            width: 100%; max-width: 1000px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(139, 92, 246, 0.2); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area { text-align: center; margin-bottom: 20px;}
        h1 { font-size: 2.2rem; color: var(--tertiary); font-weight: 900;}
        .subtitle { color: #94A3B8; font-size: 1.1rem; margin-top: 5px;}

        .main-container {
            display: flex; gap: 30px; width: 100%; max-width: 1000px; flex-wrap: wrap; justify-content: center;
        }

        .panel {
            background: #11111A; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.4); 
            padding: 30px; display: flex; width: 100%; gap: 30px; align-items: center; flex-direction: column;
        }

        .visual-area {
            width: 100%; max-width: 800px; min-height: 250px; display: flex; flex-wrap: wrap; 
            align-content: center; justify-content: center; gap: 10px;
            background: rgba(0,0,0,0.3); padding: 30px; border-radius: 20px;
            border: 2px dashed var(--tertiary);
        }

        .cell {
            width: 30px; height: 30px; border-radius: 50%; background: var(--secondary);
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.5), 0 0 10px var(--secondary);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .cell.limit { width: 15px; height: 15px; } /* when too many */

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .control-area {
            display: flex; gap: 30px; width: 100%; justify-content: center; align-items: center;
        }

        .card {
            background: var(--surface); padding: 20px; border-radius: 15px; border-left: 5px solid var(--primary);
            display: flex; flex-direction: column; gap: 10px; width: 250px; text-align: center;
        }

        .card-val { font-size: 2rem; color: var(--accent); font-weight: 900;}

        input[type=range] { width: 100%; cursor: pointer; accent-color: var(--primary); margin-top: 10px;}

        .formula {
            background: rgba(139, 92, 246, 0.1); border: 2px solid var(--primary);
            padding: 20px 40px; border-radius: 15px; text-align: center; font-size: 2rem; font-weight: 900;
            display: flex; align-items: baseline; gap: 5px;
        }
        
        .sup { font-size: 1.2rem; color: var(--tertiary); position: relative; top: -15px; }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=8B5CF6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.8.1.1. Üslü İfadeler (Etkinlik)</div>
    </div>

    <div class="title-area">
        <h1>Hücre Bölünmesi (Üstel Büyüme)</h1>
        <p class="subtitle">Her saat başı 2'ye bölünen bir bakterinin (Taban: 2) zamana (Kuvvet) göre nasıl çoğaldığını izleyin.</p>
    </div>

    <div class="main-container">
        
        <div class="panel">
            
            <div class="visual-area" id="visualArea">
                <div class="cell"></div>
            </div>

            <div class="control-area">
                
                <div class="card">
                    <span style="font-weight:800; color:white;">Geçen Zaman (Saat)</span>
                    <span class="card-val" id="timeVal">0 Saat</span>
                    <input type="range" id="sliderTime" min="0" max="8" value="0" oninput="updateTime(this.value)">
                </div>

                <div class="formula">
                    <span style="color:var(--secondary)">2</span><span class="sup" id="powVal">0</span> = <span style="color:white" id="resVal">1</span>
                </div>

            </div>

        </div>

    </div>

    <script>
        const visualArea = document.getElementById('visualArea');
        const timeVal = document.getElementById('timeVal');
        const powVal = document.getElementById('powVal');
        const resVal = document.getElementById('resVal');

        function updateTime(val) {
            let p = parseInt(val);
            let count = Math.pow(2, p);

            timeVal.innerText = p + " Saat";
            powVal.innerText = p;
            resVal.innerText = count;

            visualArea.innerHTML = "";
            let limitClass = count > 64 ? " limit" : "";
            
            for(let i=0; i<count; i++) {
                let d = document.createElement('div');
                d.className = "cell" + limitClass;
                visualArea.appendChild(d);
            }
        }

        // Global spam click prevention for Etkinlik files (Buttons)
        document.addEventListener('click', function(e) {
            if (e.target.tagName === 'BUTTON' && !e.target.hasAttribute('data-spam-locked')) {
                e.target.setAttribute('data-spam-locked', 'true');
                let originalOpacity = e.target.style.opacity || '1';
                e.target.style.opacity = '0.7';
                e.target.style.pointerEvents = 'none';
                setTimeout(() => {
                    e.target.removeAttribute('data-spam-locked');
                    e.target.style.opacity = originalOpacity;
                    e.target.style.pointerEvents = 'auto';
                }, 400);
            }
        });
    </script>
</body>
</html>
