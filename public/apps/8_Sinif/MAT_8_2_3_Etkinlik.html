<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İki Doğrunun Durumu</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F0E17; --surface: #1A1A24; --text: #F8FAFC;
            --primary: #8B5CF6; --secondary: #10B981;
            --tertiary: #06B6D4; --danger: #F43F5E;
            --accent: #F59E0B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, var(--bg) 0%, #161625 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px; overflow-x: hidden;
        }

        .header {
            width: 100%; max-width: 1000px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(139, 92, 246, 0.2); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area { text-align: center; margin-bottom: 20px;}
        h1 { font-size: 2.2rem; color: var(--tertiary); font-weight: 900;}
        .subtitle { color: #94A3B8; font-size: 1.1rem; margin-top: 5px;}

        .main-container {
            display: flex; gap: 30px; width: 100%; max-width: 1000px; flex-wrap: wrap; justify-content: center;
        }

        .panel {
            background: #11111A; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.4); 
            padding: 30px; display: flex; width: 100%; gap: 30px; align-items: center; justify-content: center; flex-wrap: wrap;
        }

        /* Controls */
        .controls {
            display: flex; flex-direction: column; gap: 20px; width: 300px;
        }

        .card {
            background: var(--surface); padding: 20px; border-radius: 15px; border-left: 5px solid var(--primary);
            display: flex; flex-direction: column; gap: 10px;
        }
        
        .c-val { font-size: 1.5rem; color: white; font-weight: 900;}

        input[type=range] { width: 100%; cursor: pointer; accent-color: var(--primary); margin-top: 10px;}

        /* The SVG Graph */
        .graph-wrapper {
            width: 400px; height: 400px; background: #161625; border: 2px solid #334155; border-radius: 10px; position: relative;
        }

        svg { width: 100%; height: 100%; overflow: hidden; }

        .axis { stroke: white; stroke-width: 2; }
        .grid { stroke: rgba(255,255,255,0.1); stroke-width: 1; }
        
        .line1 { stroke: var(--secondary); stroke-width: 4; stroke-linecap: round; transition: all 0.2s;}
        .line2 { stroke: var(--danger); stroke-width: 4; stroke-linecap: round; transition: all 0.2s;}

        .lbl { fill: #94A3B8; font-size: 12px; font-weight: 800; font-family: 'Outfit'; }

        .status-box {
            background: rgba(0,0,0,0.5); padding: 20px; border-radius: 15px; border: 2px dashed #334155;
            font-size: 1.2rem; font-weight: 900; color: white; text-align: center; transition: 0.3s;
        }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=8B5CF6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.8.2.3. Doğruların Durumu (Etkinlik)</div>
    </div>

    <div class="title-area">
        <h1>Paralel mi, Dik mi, Yoksa Kesişir mi?</h1>
        <p class="subtitle">İki doğrunun birbirine göre durumu, sadece EĞİMLERİNE (m) bakılarak anlaşılabilir.</p>
    </div>

    <div class="main-container">
        
        <div class="panel">
            
            <div class="controls">
                <div class="card" style="border-left-color: var(--secondary);">
                    <span style="font-weight:800; color:white;">1. Doğrunun Eğimi (m₁)</span>
                    <span class="c-val" style="color:var(--secondary);" id="valM1">m₁ = 2</span>
                    <input type="range" id="sliderM1" min="-5" max="5" step="0.5" value="2" oninput="updateGraph()">
                    <span style="font-size:1.1rem; color:white; font-weight:900;" id="eq1">y = 2x + 3</span>
                </div>
                
                <div class="card" style="border-left-color: var(--danger);">
                    <span style="font-weight:800; color:white;">2. Doğrunun Eğimi (m₂)</span>
                    <span class="c-val" style="color:var(--danger);" id="valM2">m₂ = -0.5</span>
                    <input type="range" id="sliderM2" min="-5" max="5" step="0.5" value="-0.5" oninput="updateGraph()">
                    <span style="font-size:1.1rem; color:white; font-weight:900;" id="eq2">y = -0.5x - 2</span>
                </div>

                <div class="status-box" id="statusBox">
                    Kesişen Doğrular
                </div>
            </div>

            <div class="graph-wrapper">
                <svg viewBox="-10 -10 20 20" id="svgGraph">
                    <g id="gridLines"></g>
                    
                    <!-- Axes -->
                    <line x1="-10" y1="0" x2="10" y2="0" class="axis"/>
                    <line x1="0" y1="-10" x2="0" y2="10" class="axis"/>

                    <line id="theLine1" class="line1" x1="-10" y1="0" x2="10" y2="0"/>
                    <line id="theLine2" class="line2" x1="-10" y1="0" x2="10" y2="0"/>
                </svg>
            </div>

        </div>

    </div>

    <script>
        const valM1 = document.getElementById('valM1');
        const valM2 = document.getElementById('valM2');
        const sliderM1 = document.getElementById('sliderM1');
        const sliderM2 = document.getElementById('sliderM2');
        const eq1 = document.getElementById('eq1');
        const eq2 = document.getElementById('eq2');
        const statusBox = document.getElementById('statusBox');
        
        const theLine1 = document.getElementById('theLine1');
        const theLine2 = document.getElementById('theLine2');
        const gridLines = document.getElementById('gridLines');

        // Draw grid
        for(let i=-10; i<=10; i++) {
            gridLines.innerHTML += `<line x1="${i}" y1="-10" x2="${i}" y2="10" class="grid"/>`;
            gridLines.innerHTML += `<line x1="-10" y1="${i}" x2="10" y2="${i}" class="grid"/>`;
        }

        // Fixed y-intercepts to show separation
        const n1 = 3;
        const n2 = -2;

        function updateGraph() {
            let m1 = parseFloat(sliderM1.value);
            let m2 = parseFloat(sliderM2.value);

            valM1.innerText = "m₁ = " + m1;
            valM2.innerText = "m₂ = " + m2;
            
            eq1.innerText = `y = ${m1}x + ${n1}`;
            eq2.innerText = `y = ${m2}x ${n2 > 0 ? '+'+n2 : n2}`;

            // Calculate SVG coordinates. Note SVG Y is inverted, so y_svg = -y_math
            // For line 1 (x=-10 to 10)
            let y1_start = m1 * (-10) + n1;
            let y1_end = m1 * (10) + n1;
            theLine1.setAttribute('y1', -y1_start);
            theLine1.setAttribute('y2', -y1_end);
            
            // For line 2 (x=-10 to 10)
            let y2_start = m2 * (-10) + n2;
            let y2_end = m2 * (10) + n2;
            theLine2.setAttribute('y1', -y2_start);
            theLine2.setAttribute('y2', -y2_end);

            // Logic
            if(m1 === m2) {
                statusBox.innerHTML = "⭐ Eğimler Eşit (m₁ = m₂)<br><span style='color:var(--accent);'>Bu doğrular PARALELDİR (Asla Kesişmezler).</span>";
                statusBox.style.borderColor = "var(--accent)";
                statusBox.style.backgroundColor = "rgba(245, 158, 11, 0.2)";
            } 
            else if (m1 * m2 === -1) {
                statusBox.innerHTML = "⭐ Eğimler Çarpımı -1<br><span style='color:var(--tertiary);'>Bu doğrular birbirine DİKTİR (90°).</span>";
                statusBox.style.borderColor = "var(--tertiary)";
                statusBox.style.backgroundColor = "rgba(6, 182, 212, 0.2)";
            }
            else {
                statusBox.innerHTML = "Sıradan Kesişen Doğrular<br><span style='font-size:0.9rem; color:#94A3B8;'>(Sadece tek bir noktada kesişirler)</span>";
                statusBox.style.borderColor = "#334155";
                statusBox.style.backgroundColor = "rgba(0,0,0,0.5)";
            }
        }

        // Global spam click prevention for Etkinlik files
        document.addEventListener('click', function(e) {
            if (e.target.tagName === 'BUTTON' && !e.target.hasAttribute('data-spam-locked')) {
                e.target.setAttribute('data-spam-locked', 'true');
                let originalOpacity = e.target.style.opacity || '1';
                e.target.style.opacity = '0.7';
                e.target.style.pointerEvents = 'none';
                setTimeout(() => {
                    e.target.removeAttribute('data-spam-locked');
                    e.target.style.opacity = originalOpacity;
                    e.target.style.pointerEvents = 'auto';
                }, 400);
            }
        });

        updateGraph();
    </script>
</body>
</html>
