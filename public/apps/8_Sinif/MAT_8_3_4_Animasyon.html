<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pisagor Su Çarkı Animasyonu</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F0E17; --surface: #1A1A24; --text: #F8FAFC;
            --primary: #8B5CF6; --secondary: #10B981;
            --tertiary: #06B6D4; --danger: #F43F5E;
            --accent: #F59E0B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, var(--bg) 0%, #161625 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px; overflow-x: hidden;
        }

        .header {
            width: 100%; max-width: 1000px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(139, 92, 246, 0.2); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area { text-align: center; margin-bottom: 20px;}
        h1 { font-size: 2.2rem; color: var(--tertiary); font-weight: 900;}
        .subtitle { color: #94A3B8; font-size: 1.1rem; margin-top: 5px;}

        .canvas-area {
            position: relative; width: 100%; max-width: 800px; height: 450px; 
            background: #11111A; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.4); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden;
        }

        .expl-text { background:rgba(139,92,246,0.15); border:1px solid rgba(139,92,246,0.3); padding:15px 25px; border-radius:12px; font-size:1.25rem; color:white; font-weight:800; text-align:center; width:100%; max-width:800px; margin-bottom:15px; transition:0.5s; }

        /* The SVG Scene */
        svg { overflow: visible; width: 300px; height: 300px; margin-top: 30px; transition: transform 2s ease-in-out;}
        
        .tri { fill: transparent; stroke: white; stroke-width: 4; stroke-linejoin: round; z-index: 5;}
        
        /* Masks for water */
        defs {
            /* We don't necessarily need SVG masks, we can animate a rect inside the polygons using clipPath */
        }

        /* For simplicity and performance, we use SVG clip paths */
        
        /* A: Left square (3x3 = 9) */
        .box-a { stroke: var(--secondary); stroke-width: 2; fill: rgba(16, 185, 129, 0.1); }
        .water-a { fill: var(--secondary); transition: transform 2s linear; }

        /* B: Bottom square (4x4 = 16) */
        .box-b { stroke: var(--danger); stroke-width: 2; fill: rgba(244, 63, 94, 0.1); }
        .water-b { fill: var(--danger); transition: transform 2s linear; }

        /* C: Hypotenuse square (5x5 = 25) */
        .box-c { stroke: var(--accent); stroke-width: 2; fill: rgba(245, 158, 11, 0.1); }
        .water-c { fill: var(--accent); transition: transform 2s linear; }

        .btn-play {
            background: var(--primary); color: white; border: none; padding: 15px 40px; border-radius: 50px;
            font-size: 1.2rem; font-weight: 900; cursor: pointer; transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.4); margin-top: 30px; z-index: 10;
        }
        .btn-play:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 15px 25px rgba(139, 92, 246, 0.6); }

        .rule-box {
            position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.9); border: 2px solid white;
            padding: 10px 20px; border-radius: 15px; font-size: 1.5rem; font-weight: 900; color: white;
            opacity: 0; transform: scale(0.8); transition: 0.5s; text-align: center; z-index: 10;
        }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=8B5CF6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.8.3.4. Pisagor Bağıntısı (Animasyon)</div>
    </div>

    <div class="title-area">
        <h1>Pisagor'un Su Çarkı</h1>
        <p class="subtitle">İki küçük karedeki suların hepsi büyük kareye (Hipotenüs'e) tam olarak sığar.</p>
    </div>

    <div class="expl-text" id="explText">1. Dik kenarlardaki kareler su ile tamamen dolu.</div>
    <div class="canvas-area">
        

        <svg viewBox="0 0 300 300" id="wheelSvg">
            
            <defs>
                <!-- Clip paths matching the squares -->
                <clipPath id="clipA"><polygon points="70,150 70,210 10,210 10,150" /></clipPath>
                <clipPath id="clipB"><polygon points="70,210 150,210 150,290 70,290" /></clipPath>
                
                <!-- Hypo square rotated. points: (150,210), (70,150), (130,70), (210,130) -->
                <!-- We will use a standard rect and rotate it in the clip path -->
                <!-- Wait, manually clipping a rotated polygon is easier: -->
                <clipPath id="clipC">
                    <polygon points="150,210 70,150 130,70 210,130" />
                </clipPath>
            </defs>

            <!-- The Wheel mechanism -->
            <!-- Triangle 3-4-5 -->
            <!-- 90 deg corner at (70, 210) -->
            <!-- Top vertex at (70, 150) -> a = 60 -->
            <!-- Right vertex at (150, 210) -> b = 80 -->
            <polygon class="tri" points="70,210 150,210 70,150" />
            
            <!-- Square A (Left) -->
            <polygon class="box-a" points="70,150 70,210 10,210 10,150" />
            <!-- Water A -->
            <!-- Water drains DOWN (meaning Y increases). Translate Y to empty -->
            <g clip-path="url(#clipA)">
                <!-- fill the box entirely -->
                <rect class="water-a" id="watA" x="0" y="100" width="100" height="150" />
            </g>

            <!-- Square B (Bottom) -->
            <polygon class="box-b" points="70,210 150,210 150,290 70,290" />
            <!-- Water B drains DOWN -->
            <g clip-path="url(#clipB)">
                <rect class="water-b" id="watB" x="50" y="200" width="120" height="100" />
            </g>

            <!-- Square C (Hypo) -->
            <!-- P1(150,210) to P2(70,150). Vector (-80, -60). Normal (60, -80). -->
            <!-- P3 = (70+60, 150-80) = (130, 70) -->
            <!-- P4 = (150+60, 210-80) = (210, 130) -->
            <polygon class="box-c" points="150,210 70,150 130,70 210,130" />
            
            <!-- Water C fills UP (meaning Y decreases). Initially translated down to be empty -->
            <g clip-path="url(#clipC)">
                <rect class="water-c" id="watC" x="50" y="50" width="200" height="200" transform="translate(0, 150)" />
            </g>

            <!-- Rotated Center (for the whole SVG) will be (150, 150) approx -->

        </svg>

        <div class="rule-box" id="ruleBox">
            <span style="color:var(--secondary)">a²</span> + 
            <span style="color:var(--danger)">b²</span> = 
            <span style="color:var(--accent)">c²</span><br>
            <span style="font-size:1rem; color:#94A3B8;">Tek bir damla bile taşmaz!</span>
        </div>

    </div>

    <button class="btn-play" id="btnPlay" onclick="runAnim()">Mekanizmayı Çevir</button>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const btnPlay = document.getElementById('btnPlay');
        const explText = document.getElementById('explText');
        
        const wheelSvg = document.getElementById('wheelSvg');
        const watA = document.getElementById('watA');
        const watB = document.getElementById('watB');
        const watC = document.getElementById('watC');
        const ruleBox = document.getElementById('ruleBox');

        async function runAnim() {
            btnPlay.disabled = true;
            btnPlay.style.opacity = 0.5;

            // Step 1: Rotate the SVG 180 degrees so C is at bottom
            explText.innerText = "2. Çarkı ters çeviriyoruz ki sular aşağı, Hipotenüs karesine doğru aksın...";
            wheelSvg.style.transform = "rotate(180deg)";
            
            await sleep(2500);

            // Step 2: Drain A and B, Fill C
            // Because SVG is rotated 180, visually "down" is negative Y in local space.
            // But actually, we just animate the rects in local space. 
            // Since it's rotated 180, local Y+ points visually UP.
            // So to empty A and B visually DOWN, we must move them local Y- (translateY(-height))
            
            explText.innerText = "3. Sular akıyor... Küçük karelerdeki toplam su miktarı (a² + b²)...";
            
            watA.style.transform = "translate(0, -100px)"; // drain
            watB.style.transform = "translate(0, -100px)"; // drain
            
            // To fill C, it was empty because it was translated Y+150 (visually pointing UP before rotation).
            // Now rotated 180, Y+ points UP. So it's visually at top. 
            // Wait, this is tricky. Let's just adjust transform of C to 0.
            watC.style.transform = "translate(0, 0)"; // fills

            await sleep(2500);

            explText.style.color = "var(--accent)";
            explText.innerText = "4. Gördüğünüz gibi, büyük kare (c²) HİÇ TAŞMADAN tam olarak doldu!";

            ruleBox.style.opacity = 1;
            ruleBox.style.transform = "scale(1)";

            btnPlay.style.display = "none";
        }
    </script>
</body>
</html>
