<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bileşik Olaylar ve Ağaç Diyagramı</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#0F0E17; --surface:#1A1A24; --primary:#8B5CF6; --secondary:#10B981; --tertiary:#06B6D4; --danger:#F43F5E; --accent:#F59E0B; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Outfit',sans-serif; }
        body { background:linear-gradient(135deg,var(--bg),#161625); color:#F8FAFC; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px; }
        .header { width:100%; max-width:1100px; display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,0.05); padding:15px 25px; border-radius:20px; border:1px solid rgba(139,92,246,0.2); margin-bottom:20px; }
        .header-left { display:flex; align-items:center; gap:15px; font-weight:600; font-size:1.2rem; }
        .header-left img { width:50px; height:50px; border-radius:50%; background:white; padding:2px; }
        .kazanim { background:var(--primary); color:white; padding:5px 15px; border-radius:20px; font-weight:800; font-size:0.9rem; }
        h1 { font-size:2rem; color:var(--tertiary); font-weight:900; text-align:center; }
        .subtitle { color:#94A3B8; font-size:1.05rem; margin-top:5px; text-align:center; margin-bottom:20px; }
        .panel { background:#11111A; border-radius:24px; border:1px solid rgba(255,255,255,0.05); padding:25px; width:100%; max-width:1100px; display:flex; gap:25px; flex-wrap:wrap; }
        .left-col { width:300px; display:flex; flex-direction:column; gap:15px; }
        .right-col { flex:1; min-width:280px; }
        .card { background:var(--surface); padding:15px; border-radius:15px; }
        .c-title { font-weight:800; color:white; font-size:1.05rem; margin-bottom:10px; }
        .scen-btn { padding:12px; border-radius:10px; font-size:0.95rem; font-weight:800; cursor:pointer; border:2px solid #334155; background:transparent; color:white; transition:all 0.3s; width:100%; text-align:left; margin-bottom:8px; }
        .scen-btn.active { border-color:var(--tertiary); background:rgba(6,182,212,0.15); }
        canvas { display:block; width:100%; border-radius:15px; background:#161625; }
        .event-pick { display:flex; gap:8px; flex-wrap:wrap; }
        .ep-btn { padding:10px 14px; border-radius:10px; font-size:0.9rem; font-weight:800; cursor:pointer; border:2px solid #334155; background:transparent; color:white; transition:all 0.3s; }
        .ep-btn.active { background:rgba(245,158,11,0.2); border-color:var(--accent); color:var(--accent); }
        .prob-result { background:rgba(139,92,246,0.15); border:2px solid var(--primary); padding:15px; border-radius:15px; font-size:1.1rem; font-weight:800; color:white; text-align:center; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=8B5CF6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.8.7.2. Bileşik Olaylar ve Ağaç Diyagramı (Etkinlik)</div>
    </div>
    <h1>Bileşik Olaylar ve Ağaç Diyagramı</h1>
    <p class="subtitle">İki ardışık deneyin tüm olası sonuçlarını ağaç diyagramıyla görün ve olasılık hesaplayın.</p>
    <div class="panel">
        <div class="left-col">
            <div class="card">
                <div class="c-title">🎲 Deney Seçin</div>
                <button class="scen-btn active" id="s1" onclick="loadScene(0)">🪙🪙 2 Sikke Atma</button>
                <button class="scen-btn" id="s2" onclick="loadScene(1)">🎲🎲 2 Zar Atma (1-3)</button>
                <button class="scen-btn" id="s3" onclick="loadScene(2)">🟥🟩 2 Renk Çekme</button>
            </div>
            <div class="card">
                <div class="c-title">🎯 İstenen Olay</div>
                <div class="event-pick" id="eventPick"></div>
            </div>
            <div class="prob-result" id="probResult">P(?) = ?</div>
        </div>
        <div class="right-col">
            <canvas id="cvs" height="450"></canvas>
        </div>
    </div>
    <script>
        const scenes=[
            {name:'2 Sikke',d1:['Yazı','Tura'],d2:['Yazı','Tura'],c1:'#F59E0B',c2:'#8B5CF6',events:['YY','YT','TY','TT']},
            {name:'2 Zar (1-3)',d1:['1','2','3'],d2:['1','2','3'],c1:'#10B981',c2:'#06B6D4',events:['Eşit','Toplam 4','Toplam>4']},
            {name:'2 Renk',d1:['🔴','🟢','🔵'],d2:['🔴','🟢','🔵'],c1:'#F43F5E',c2:'#10B981',events:['Aynı Renk','Farklı Renk']},
        ];
        const COLORS=['#8B5CF6','#10B981','#06B6D4','#F43F5E','#F59E0B','#EC4899'];
        let curScene=0,selectedEvent=null;

        function loadScene(i){
            curScene=i;
            selectedEvent=null;
            ['s1','s2','s3'].forEach((id,j)=>document.getElementById(id).classList.toggle('active',j===i));
            drawTree(scenes[i]);
            buildEventBtns(scenes[i]);
        }

        function buildEventBtns(s){
            const ep=document.getElementById('eventPick');ep.innerHTML='';
            s.events.forEach((e,i)=>{
                let b=document.createElement('button');b.className='ep-btn';b.textContent=e;
                b.onclick=()=>pickEvent(i,s);ep.appendChild(b);
            });
            document.getElementById('probResult').textContent='P(?) = ?';
        }

        function pickEvent(i,s){
            selectedEvent=i;
            document.querySelectorAll('.ep-btn').forEach((b,j)=>b.classList.toggle('active',j===i));
            let total=s.d1.length*s.d2.length;
            let outcomes=[];
            s.d1.forEach(a=>s.d2.forEach(b=>outcomes.push([a,b])));
            let favorable=0;
            let evLabel=s.events[i];
            if(s.name==='2 Sikke'){
                if(i===0)favorable=outcomes.filter(([a,b])=>a==='Yazı'&&b==='Yazı').length;
                if(i===1)favorable=outcomes.filter(([a,b])=>a==='Yazı'&&b==='Tura').length;
                if(i===2)favorable=outcomes.filter(([a,b])=>a==='Tura'&&b==='Yazı').length;
                if(i===3)favorable=outcomes.filter(([a,b])=>a==='Tura'&&b==='Tura').length;
            } else if(s.name==='2 Zar (1-3)'){
                if(i===0)favorable=outcomes.filter(([a,b])=>a===b).length;
                if(i===1)favorable=outcomes.filter(([a,b])=>parseInt(a)+parseInt(b)===4).length;
                if(i===2)favorable=outcomes.filter(([a,b])=>parseInt(a)+parseInt(b)>4).length;
            } else {
                if(i===0)favorable=outcomes.filter(([a,b])=>a===b).length;
                if(i===1)favorable=outcomes.filter(([a,b])=>a!==b).length;
            }
            let pct=Math.round(favorable/total*100);
            document.getElementById('probResult').innerHTML=`P(${evLabel}) = ${favorable}/${total} = ${(favorable/total).toFixed(2)}<br><span style="font-size:1.4rem;color:var(--accent)">${pct}%</span>`;
            drawTree(s,i);
        }

        function drawTree(s,highlightEvent=-1){
            const cvs=document.getElementById('cvs');cvs.width=cvs.offsetWidth;
            const ctx=cvs.getContext('2d');
            let W=cvs.width,H=450;
            ctx.clearRect(0,0,W,H);ctx.fillStyle='#161625';ctx.fillRect(0,0,W,H);
            let n1=s.d1.length,n2=s.d2.length;
            let rootX=60,rootY=H/2;
            let col1X=200,col2X=380,col3X=W-80;
            // Root node
            ctx.beginPath();ctx.arc(rootX,rootY,22,0,Math.PI*2);ctx.fillStyle=s.c1+'55';ctx.fill();
            ctx.strokeStyle=s.c1;ctx.lineWidth=3;ctx.stroke();
            ctx.fillStyle='white';ctx.font='800 16px Outfit';ctx.textAlign='center';ctx.textBaseline='middle';
            ctx.fillText('S',rootX,rootY);ctx.textBaseline='alphabetic';
            // Level 1 nodes
            s.d1.forEach((val1,i)=>{
                let y1=H/(n1+1)*(i+1);
                // Line
                ctx.strokeStyle=s.c1;ctx.lineWidth=2;ctx.setLineDash([]);
                ctx.beginPath();ctx.moveTo(rootX+22,rootY);ctx.lineTo(col1X-22,y1);ctx.stroke();
                ctx.fillStyle=s.c1;ctx.font='700 12px Outfit';ctx.textAlign='center';
                ctx.fillText(val1,(rootX+22+col1X-22)/2,(rootY+y1)/2-8);
                // Node
                ctx.beginPath();ctx.arc(col1X,y1,22,0,Math.PI*2);ctx.fillStyle=s.c1+'55';ctx.fill();
                ctx.strokeStyle=s.c1;ctx.lineWidth=3;ctx.stroke();
                ctx.fillStyle='white';ctx.font='800 15px Outfit';ctx.textAlign='center';ctx.textBaseline='middle';
                ctx.fillText(val1,col1X,y1);ctx.textBaseline='alphabetic';
                // Level 2 nodes
                s.d2.forEach((val2,j)=>{
                    let y2=H/(n1*n2+1)*(i*n2+j+1);
                    ctx.strokeStyle=s.c2;ctx.lineWidth=2;
                    ctx.beginPath();ctx.moveTo(col1X+22,y1);ctx.lineTo(col2X-22,y2);ctx.stroke();
                    ctx.fillStyle=s.c2;ctx.font='700 12px Outfit';ctx.textAlign='center';
                    ctx.fillText(val2,(col1X+22+col2X-22)/2,(y1+y2)/2-8);
                    ctx.beginPath();ctx.arc(col2X,y2,22,0,Math.PI*2);ctx.fillStyle=s.c2+'55';ctx.fill();
                    ctx.strokeStyle=s.c2;ctx.lineWidth=3;ctx.stroke();
                    ctx.fillStyle='white';ctx.font='800 15px Outfit';ctx.textAlign='center';ctx.textBaseline='middle';
                    ctx.fillText(val2,col2X,y2);ctx.textBaseline='alphabetic';
                    // Outcome label
                    let outcome=`(${val1},${val2})`;
                    ctx.beginPath();ctx.moveTo(col2X+22,y2);ctx.lineTo(col3X-25,y2);
                    ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=1;ctx.setLineDash([4,4]);ctx.stroke();ctx.setLineDash([]);
                    ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='700 12px Outfit';ctx.textAlign='left';ctx.textBaseline='middle';
                    ctx.fillText(outcome,col3X-22,y2);ctx.textBaseline='alphabetic';
                });
            });
            // Title
            ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='700 13px Outfit';ctx.textAlign='center';ctx.textBaseline='alphabetic';
            ctx.fillText('1. Atış →',col1X,H-15);ctx.fillText('2. Atış →',col2X,H-15);
            ctx.fillText(`${n1*n2} Sonuç`,col3X-20,H-15);
        }

        document.addEventListener('click', function(e) {
            if (e.target.tagName === 'BUTTON' && !e.target.hasAttribute('data-spam-locked')) {
                e.target.setAttribute('data-spam-locked','true'); e.target.style.opacity='0.7'; e.target.style.pointerEvents='none';
                setTimeout(() => { e.target.removeAttribute('data-spam-locked'); e.target.style.opacity='1'; e.target.style.pointerEvents='auto'; }, 400);
            }
        });

        window.addEventListener('resize',()=>loadScene(curScene));
        loadScene(0);
    </script>
</body>
</html>
