<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Açı Kenar Animasyonu</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F0E17; --surface: #1A1A24; --text: #F8FAFC;
            --primary: #8B5CF6; --secondary: #10B981;
            --tertiary: #06B6D4; --danger: #F43F5E;
            --accent: #F59E0B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, var(--bg) 0%, #161625 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px; overflow-x: hidden;
        }

        .header {
            width: 100%; max-width: 1000px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(139, 92, 246, 0.2); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area { text-align: center; margin-bottom: 20px;}
        h1 { font-size: 2.2rem; color: var(--tertiary); font-weight: 900;}
        .subtitle { color: #94A3B8; font-size: 1.1rem; margin-top: 5px;}

        .canvas-area {
            position: relative; width: 100%; max-width: 800px; height: 450px; 
            background: #11111A; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.4); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden;
            perspective: 1000px;
        }

        .expl-text { background:rgba(139,92,246,0.15); border:1px solid rgba(139,92,246,0.3); padding:15px 25px; border-radius:12px; font-size:1.25rem; color:white; font-weight:800; text-align:center; width:100%; max-width:800px; margin-bottom:15px; transition:0.5s; }

        /* Top Down View of Door */
        .scene {
            position: relative; width: 400px; height: 300px; margin-top: 50px;
        }

        .wall {
            position: absolute; top: 50%; left: 0; width: 100%; height: 20px; background: #334155; transform: translateY(-50%);
        }
        .hinge {
            position: absolute; top: 50%; left: 100px; width: 20px; height: 20px; background: white; border-radius: 50%;
            transform: translate(-50%, -50%); z-index: 5;
        }
        
        .door {
            position: absolute; top: 50%; left: 100px; width: 200px; height: 10px; background: var(--accent);
            transform-origin: left center; transform: translateY(-50%) rotate(0deg); transition: transform 0.5s;
            border-radius: 5px; z-index: 4;
        }
        
        .door-tip {
            position: absolute; right: 0; top: 50%; transform: translateY(-50%); width: 10px; height: 10px; background: white; border-radius: 50%;
        }

        .frame-end {
            position: absolute; top: 50%; left: 300px; width: 10px; height: 20px; background: var(--danger); transform: translateY(-50%); z-index: 5;
        }

        /* SVG for Distance Line */
        svg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 6;
        }
        .dist-line { stroke: var(--secondary); stroke-width: 4; stroke-dasharray: 10,10; transition: 0.5s;}
        
        .angle-arc { fill: rgba(245, 158, 11, 0.2); stroke: var(--accent); stroke-width: 2; transition: 0.5s;}

        .lbl-dist { fill: var(--secondary); font-size: 20px; font-weight: 900; font-family: 'Outfit'; }
        .lbl-ang { fill: var(--accent); font-size: 20px; font-weight: 900; font-family: 'Outfit'; }

        .btn-play {
            background: var(--primary); color: white; border: none; padding: 15px 40px; border-radius: 50px;
            font-size: 1.2rem; font-weight: 900; cursor: pointer; transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.4); margin-top: 30px; z-index: 10;
        }
        .btn-play:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 15px 25px rgba(139, 92, 246, 0.6); }

        .control-panel {
            position: absolute; bottom: 20px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 15px;
            display: flex; gap: 20px; align-items: center; border: 1px solid rgba(255,255,255,0.1); z-index: 10; opacity: 0; transition: 1s;
        }
        input[type=range] { width: 200px; accent-color: var(--primary); }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=8B5CF6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.8.3.1. Açı Kenar Bağıntısı (Animasyon)</div>
    </div>

    <div class="title-area">
        <h1>Açılan Kapı Metaforu</h1>
        <p class="subtitle">Kapı menteşesindeki açı büyüdükçe, kapının ucu ile kasa arasındaki mesafe (kenar) uzar.</p>
    </div>

    <div class="expl-text" id="explText">1. Kapalı bir kapıya üstten bakıyoruz. Açı 0°.</div>
    <div class="canvas-area">
        

        <div class="scene">
            <div class="wall"></div>
            <div class="frame-end"></div>
            <div class="door" id="door">
                <div class="door-tip" id="doorTip"></div>
            </div>
            <div class="hinge" id="hinge"></div>

            <svg viewBox="0 0 400 300">
                <path id="arc" class="angle-arc" d="M 100 150 L 150 150 A 50 50 0 0 0 150 150 Z" />
                <line id="dLine" class="dist-line" x1="300" y1="150" x2="300" y2="150"/>
                
                <text id="lblAng" class="lbl-ang" x="110" y="130">0°</text>
                <text id="lblDist" class="lbl-dist" x="310" y="140">Mesafe: 0</text>
            </svg>
        </div>

        <div class="control-panel" id="cPanel">
            <span style="color:white; font-weight:800;">Kapıyı Aç:</span>
            <input type="range" id="slider" min="0" max="90" value="0" oninput="updateDoor()">
        </div>

    </div>

    <button class="btn-play" id="btnPlay" onclick="runAnim()">Kapıyı İncele</button>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const btnPlay = document.getElementById('btnPlay');
        const explText = document.getElementById('explText');
        const cPanel = document.getElementById('cPanel');
        const slider = document.getElementById('slider');
        
        const door = document.getElementById('door');
        const arc = document.getElementById('arc');
        const dLine = document.getElementById('dLine');
        const lblAng = document.getElementById('lblAng');
        const lblDist = document.getElementById('lblDist');

        function polarToCartesian(centerX, centerY, radius, angleInDegrees) {
            var angleInRadians = (angleInDegrees) * Math.PI / 180.0;
            return {
                x: centerX + (radius * Math.cos(angleInRadians)),
                y: centerY - (radius * Math.sin(angleInRadians)) // - because SVG y is down
            };
        }

        function describeArc(x, y, radius, startAngle, endAngle){
            var start = polarToCartesian(x, y, radius, endAngle);
            var end = polarToCartesian(x, y, radius, startAngle);
            var largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
            var d = [
                "M", x, y, 
                "L", start.x, start.y, 
                "A", radius, radius, 0, largeArcFlag, 0, end.x, end.y,
                "Z"
            ].join(" ");
            return d;       
        }

        function updateDoor() {
            let ang = parseInt(slider.value);
            // In CSS, negative rotate goes up/counter-clockwise which matches standard math angles
            door.style.transform = `translateY(-50%) rotate(${-ang}deg)`;

            lblAng.textContent = ang + "°";

            if (ang > 0) {
                arc.setAttribute("d", describeArc(100, 150, 50, 0, ang));
            } else {
                arc.setAttribute("d", "");
            }

            // Tip coordinates
            let tip = polarToCartesian(100, 150, 200, ang);
            
            dLine.setAttribute('x1', tip.x);
            dLine.setAttribute('y1', tip.y);
            // frame is at 300, 150
            dLine.setAttribute('x2', 300);
            dLine.setAttribute('y2', 150);

            // Distance
            let dist = Math.sqrt(Math.pow(tip.x - 300, 2) + Math.pow(tip.y - 150, 2));
            lblDist.textContent = "Mesafe: " + Math.round(dist);
            
            lblDist.setAttribute('x', (tip.x + 300)/2 + 10);
            lblDist.setAttribute('y', (tip.y + 150)/2 - 10);
            
            lblAng.setAttribute('x', 110 + (ang/90)*20);
            lblAng.setAttribute('y', 130 - (ang/90)*20);
        }


        async function runAnim() {
            btnPlay.disabled = true;
            btnPlay.style.opacity = 0.5;
            btnPlay.style.display = "none";

            explText.innerText = "2. Şimdi kapıyı manuel olarak yavaş yavaş açın.";
            cPanel.style.opacity = 1;
            cPanel.style.pointerEvents = "auto";
            
            // Pulse the slider to show interaction
            slider.style.boxShadow = "0 0 20px var(--primary)";
            setTimeout(() => { slider.style.boxShadow = "none"; }, 1000);

            // We don't auto-animate this one, we let the user play with it.
            setInterval(() => {
                let ang = parseInt(slider.value);
                if(ang > 30) {
                    explText.style.color = "var(--secondary)";
                    explText.innerText = "Fark ettiniz mi? Açı büyüdükçe, yeşil noktalı çizgi (karşı kenar) uzuyor!";
                }
            }, 500);
        }

    </script>
</body>
</html>
