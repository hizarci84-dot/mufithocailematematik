<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Üslü İfadelerde Çarpma Animasyonu</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F0E17; --surface: #1A1A24; --text: #F8FAFC;
            --primary: #8B5CF6; --secondary: #10B981;
            --tertiary: #06B6D4; --danger: #F43F5E;
            --accent: #F59E0B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, var(--bg) 0%, #161625 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px; overflow-x: hidden;
        }

        .header {
            width: 100%; max-width: 1000px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(139, 92, 246, 0.2); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area { text-align: center; margin-bottom: 20px;}
        h1 { font-size: 2.2rem; color: var(--tertiary); font-weight: 900;}
        .subtitle { color: #94A3B8; font-size: 1.1rem; margin-top: 5px;}

        .canvas-area {
            position: relative; width: 100%; max-width: 800px; height: 450px; 
            background: #11111A; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.4); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden;
        }

        .expl-text { background:rgba(139,92,246,0.15); border:1px solid rgba(139,92,246,0.3); padding:15px 25px; border-radius:12px; font-size:1.25rem; color:white; font-weight:800; text-align:center; width:100%; max-width:800px; margin-bottom:15px; transition:0.5s; }

        .math-container {
            display: flex; align-items: flex-end; justify-content: center; gap: 10px; position: relative; height: 200px;
        }

        .base-group {
            display: flex; flex-direction: column; align-items: center; gap: 10px; transition: all 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .exponents-list {
            display: flex; gap: 5px; height: 100px; align-items: flex-end;
        }

        .box {
            width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
            font-weight: 900; color: white; font-size: 1.2rem; transition: 1s; opacity: 0;
            transform: translateY(50px);
        }
        .b-blue { background: var(--tertiary); box-shadow: 0 0 15px rgba(6, 182, 212, 0.5); }
        .b-pink { background: var(--danger); box-shadow: 0 0 15px rgba(244, 63, 94, 0.5); }
        .b-final { background: var(--primary); box-shadow: 0 0 15px rgba(139, 92, 246, 0.5); }

        .base {
            background: rgba(255,255,255,0.1); border: 2px solid white; padding: 10px 30px; border-radius: 15px;
            font-size: 2rem; font-weight: 900; color: white; transition: 1s; z-index: 5;
        }

        .multiply-sign {
            font-size: 3rem; color: var(--accent); font-weight: 900; margin-bottom: 20px; transition: 0.5s; opacity: 0;
        }

        .btn-play {
            background: var(--primary); color: white; border: none; padding: 15px 40px; border-radius: 50px;
            font-size: 1.2rem; font-weight: 900; cursor: pointer; transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.4); margin-top: 30px; z-index: 10;
        }
        .btn-play:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 15px 25px rgba(139, 92, 246, 0.6); }

        .final-brace {
            position: absolute; top: -20px; width: 100%; height: 20px; border: 3px solid white; border-bottom: none;
            border-radius: 10px 10px 0 0; opacity: 0; transition: 1s;
        }
        .final-sum {
            position: absolute; top: -50px; width: 100%; text-align: center; color: var(--accent); font-weight: 900; font-size: 1.5rem; opacity: 0; transition: 1s;
        }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=8B5CF6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.8.1.1. Üslü İfadeler (Animasyon)</div>
    </div>

    <div class="title-area">
        <h1>Çarpmada Üslerin Toplanması</h1>
        <p class="subtitle">Tabanları (kutuları taşıyan zemin) aynı olan üslü ifadeler çarpılırken, üsler neden toplanır?</p>
    </div>

    <div class="expl-text" id="explText">Örnek: 2³ x 2² işlemini yapalım.</div>
    <div class="canvas-area">
        

        <div class="math-container">
            
            <div class="base-group" id="g1">
                <div class="exponents-list" id="el1">
                    <div class="box b-blue">2</div>
                    <div class="box b-blue">2</div>
                    <div class="box b-blue">2</div>
                </div>
                <div class="base" id="b1">Taban 2 (3 Kere)</div>
            </div>

            <div class="multiply-sign" id="mSign">x</div>

            <div class="base-group" id="g2">
                <div class="exponents-list" id="el2">
                    <div class="box b-pink">2</div>
                    <div class="box b-pink">2</div>
                </div>
                <div class="base" id="b2">Taban 2 (2 Kere)</div>
            </div>

            <div class="base-group" id="g3" style="display:none; position:absolute;">
                <div class="final-brace" id="fBrace"></div>
                <div class="final-sum" id="fSum">3 + 2 = 5</div>
                <div class="exponents-list" id="el3"></div>
                <div class="base" style="border-color:var(--primary); box-shadow: 0 0 30px rgba(139, 92, 246, 0.4);">Ortak Taban 2</div>
            </div>

        </div>

    </div>

    <button class="btn-play" id="btnPlay" onclick="runAnim()">İşlemi Görselleştir</button>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const btnPlay = document.getElementById('btnPlay');
        const explText = document.getElementById('explText');
        
        const g1 = document.getElementById('g1');
        const g2 = document.getElementById('g2');
        const g3 = document.getElementById('g3');
        const el1 = document.getElementById('el1');
        const el2 = document.getElementById('el2');
        const el3 = document.getElementById('el3');
        const b1 = document.getElementById('b1');
        const b2 = document.getElementById('b2');
        const mSign = document.getElementById('mSign');

        async function runAnim() {
            btnPlay.disabled = true;
            btnPlay.style.opacity = 0.5;

            explText.innerText = "1. Sol tarafta 2 sayısı 3 kez yan yana çarpılıyor.";
            
            let boxes1 = el1.querySelectorAll('.box');
            for(let b of boxes1) {
                b.style.opacity = 1;
                b.style.transform = "translateY(0)";
                await sleep(400);
            }

            mSign.style.opacity = 1;
            await sleep(1000);

            explText.innerText = "2. Sağ tarafta 2 sayısı 2 kez yan yana çarpılıyor.";
            
            let boxes2 = el2.querySelectorAll('.box');
            for(let b of boxes2) {
                b.style.opacity = 1;
                b.style.transform = "translateY(0)";
                await sleep(400);
            }

            await sleep(1500);

            explText.innerText = "3. Tabanlar aynı olduğu için bunları tek bir uzun satırda (ortak taban) birleştirebiliriz.";
            
            // Move together
            g1.style.transform = "translateX(100px)";
            g2.style.transform = "translateX(-100px)";
            mSign.style.opacity = 0;
            
            b1.style.opacity = 0;
            b2.style.opacity = 0;

            await sleep(1500);

            g1.style.display = "none";
            g2.style.display = "none";
            
            g3.style.display = "flex";
            
            // Recreate boxes
            for(let i=0; i<3; i++) {
                el3.innerHTML += '<div class="box b-blue" style="opacity:1; transform:none;">2</div>';
            }
            for(let i=0; i<2; i++) {
                el3.innerHTML += '<div class="box b-pink" style="opacity:1; transform:none;">2</div>';
            }

            await sleep(1000);

            explText.innerText = "4. Gördüğünüz gibi toplamda 3 + 2 = 5 tane 2 yan yana gelmiş oldu.";
            document.getElementById('fBrace').style.opacity = 1;
            document.getElementById('fSum').style.opacity = 1;

            await sleep(2000);

            explText.style.color = "var(--secondary)";
            explText.innerText = "Kural: Çarpma işleminde tabanlar aynıysa, üsler birbirine eklenir (toplanır).";

            btnPlay.style.display = "none";
        }
    </script>
</body>
</html>
