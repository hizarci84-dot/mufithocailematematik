<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pisagor Kareleri Laboratuvarı</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F0E17; --surface: #1A1A24; --text: #F8FAFC;
            --primary: #8B5CF6; --secondary: #10B981;
            --tertiary: #06B6D4; --danger: #F43F5E;
            --accent: #F59E0B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, var(--bg) 0%, #161625 100%);
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 20px; overflow-x: hidden;
        }

        .header {
            width: 100%; max-width: 1000px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(139, 92, 246, 0.2); margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 1.2rem; }
        .header-left img { width: 50px; height: 50px; border-radius: 50%; background: white; padding: 2px;}
        .kazanim { background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem;}

        .title-area { text-align: center; margin-bottom: 20px;}
        h1 { font-size: 2.2rem; color: var(--tertiary); font-weight: 900;}
        .subtitle { color: #94A3B8; font-size: 1.1rem; margin-top: 5px;}

        .main-container {
            display: flex; gap: 30px; width: 100%; max-width: 1000px; flex-wrap: wrap; justify-content: center;
        }

        .panel {
            background: #11111A; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.4); 
            padding: 30px; display: flex; flex-direction: column; width: 100%; gap: 30px; align-items: center;
        }

        /* Controls */
        .controls {
            display: flex; gap: 15px; flex-wrap: wrap; justify-content: center;
        }

        .btn-tri {
            background: rgba(255,255,255,0.05); border: 2px solid #334155; padding: 10px 20px;
            border-radius: 10px; color: white; font-weight: 800; font-size: 1.1rem; cursor: pointer; transition: 0.3s;
        }
        .btn-tri:hover { background: rgba(139, 92, 246, 0.2); border-color: var(--primary); }
        .btn-tri.active { background: var(--primary); border-color: var(--primary); box-shadow: 0 0 15px rgba(139, 92, 246, 0.5);}

        /* Canvas */
        .canvas-area {
            position: relative; width: 500px; height: 500px; background: #161625;
            border: 2px dashed #334155; border-radius: 15px; overflow: visible; display: flex; align-items: center; justify-content: center;
        }

        svg { overflow: visible; }
        
        .tri-poly { fill: rgba(139, 92, 246, 0.2); stroke: white; stroke-width: 3;}
        
        .sq { stroke-width: 2; transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .sq-a { fill: rgba(16, 185, 129, 0.2); stroke: var(--secondary); }
        .sq-b { fill: rgba(244, 63, 94, 0.2); stroke: var(--danger); }
        .sq-c { fill: rgba(245, 158, 11, 0.2); stroke: var(--accent); }

        .lbl-area { font-family: 'Outfit'; font-weight: 900; font-size: 20px; text-anchor: middle; alignment-baseline: central; fill: white;}
        
        .status-box {
            background: rgba(0,0,0,0.5); padding: 15px 30px; border-radius: 20px;
            font-size: 1.5rem; font-weight: 900; color: white; border: 2px solid #334155;
            text-align: center; width: 100%; transition: 0.3s;
        }
        
        .eq-row { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 2rem;}

    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=8B5CF6&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.8.3.4. Pisagor Bağıntısı (Etkinlik)</div>
    </div>

    <div class="title-area">
        <h1>Pisagor Kareleri (a² + b² = c²)</h1>
        <p class="subtitle">Dik kenarların üzerindeki karelerin alanları toplamı, Hipotenüsün üzerindeki karenin alanına eşittir.</p>
    </div>

    <div class="main-container">
        
        <div class="panel">
            
            <div class="controls">
                <button class="btn-tri active" onclick="loadTri(3, 4, 5, this)">3 - 4 - 5 Üçgeni</button>
                <button class="btn-tri" onclick="loadTri(6, 8, 10, this)">6 - 8 - 10 Üçgeni</button>
                <button class="btn-tri" onclick="loadTri(5, 12, 13, this)">5 - 12 - 13 Üçgeni</button>
                <button class="btn-tri" onclick="loadTri(8, 15, 17, this)">8 - 15 - 17 Üçgeni</button>
            </div>

            <div class="canvas-area">
                <svg width="400" height="400" viewBox="0 0 400 400" id="svgGraph">
                    
                    <!-- Base point for 90 deg corner is fixed to (150, 250) -->
                    <!-- We will dynamically create squares and polygon using JS for easier math -->
                    
                    <g id="squaresG"></g>
                    <polygon id="tri" class="tri-poly" />
                    <g id="labelsG"></g>
                    
                </svg>
            </div>
            
            <div class="status-box" id="statusBox">
                <div class="eq-row">
                    <span style="color:var(--secondary);" id="txtA">3²</span> + 
                    <span style="color:var(--danger);" id="txtB">4²</span> = 
                    <span style="color:var(--accent);" id="txtC">5²</span>
                </div>
                <div style="font-size:1.2rem; color:#94A3B8; margin-top:10px;">
                    <span id="txtA2">9</span> + <span id="txtB2">16</span> = <span id="txtC2">25</span>
                </div>
            </div>

        </div>

    </div>

    <script>
        const svgGraph = document.getElementById('svgGraph');
        const squaresG = document.getElementById('squaresG');
        const tri = document.getElementById('tri');
        const labelsG = document.getElementById('labelsG');

        const txtA = document.getElementById('txtA');
        const txtB = document.getElementById('txtB');
        const txtC = document.getElementById('txtC');
        const txtA2 = document.getElementById('txtA2');
        const txtB2 = document.getElementById('txtB2');
        const txtC2 = document.getElementById('txtC2');

        // Scale factors to fit within 400x400
        // max hypo = 17. 17 * scale needs to fit. scale = 8 is good (136px)
        const SCALE = 10;
        
        function getSquarePoints(p1, p2, isLeft) {
            // vector from p1 to p2
            let dx = p2.x - p1.x;
            let dy = p2.y - p1.y;
            
            // Perpendicular vector
            // 90 deg rotation: (-dy, dx) or (dy, -dx)
            let px = isLeft ? -dy : dy;
            let py = isLeft ? dx : -dx;

            let p3 = {x: p2.x + px, y: p2.y + py};
            let p4 = {x: p1.x + px, y: p1.y + py};

            return [p1, p2, p3, p4];
        }

        function ptsToString(pts) {
            return pts.map(p => `${p.x},${p.y}`).join(' ');
        }
        
        function getCenter(pts) {
            let cx = 0, cy = 0;
            pts.forEach(p => { cx += p.x; cy += p.y; });
            return {x: cx/4, y: cy/4};
        }

        function loadTri(a, b, c, btn) {
            // Active btn
            document.querySelectorAll('.btn-tri').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            // Corner at (100, 250)
            let pRight = {x: 100 + (b * SCALE), y: 280}; // B side on bottom
            let pCorner = {x: 100, y: 280};
            let pTop = {x: 100, y: 280 - (a * SCALE)}; // A side on left

            tri.setAttribute('points', `${pCorner.x},${pCorner.y} ${pRight.x},${pRight.y} ${pTop.x},${pTop.y}`);

            // Squares
            // Side A (Left vertical): from pTop to pCorner. Square is to the left (-dx)
            let sqA = getSquarePoints(pTop, pCorner, true);
            // Side B (Bottom horizontal): from pCorner to pRight. Square is to the bottom
            let sqB = getSquarePoints(pCorner, pRight, true);
            // Side C (Hypo): from pRight to pTop. Square is to the top right
            let sqC = getSquarePoints(pRight, pTop, true);

            squaresG.innerHTML = `
                <polygon points="${ptsToString(sqA)}" class="sq sq-a" />
                <polygon points="${ptsToString(sqB)}" class="sq sq-b" />
                <polygon points="${ptsToString(sqC)}" class="sq sq-c" />
            `;

            let cA = getCenter(sqA);
            let cB = getCenter(sqB);
            let cC = getCenter(sqC);

            labelsG.innerHTML = `
                <text x="${cA.x}" y="${cA.y}" class="lbl-area" fill="var(--secondary)">${a*a}</text>
                <text x="${cB.x}" y="${cB.y}" class="lbl-area" fill="var(--danger)">${b*b}</text>
                <text x="${cC.x}" y="${cC.y}" class="lbl-area" fill="var(--accent)">${c*c}</text>
            `;

            // Update text
            txtA.innerText = a + "²";
            txtB.innerText = b + "²";
            txtC.innerText = c + "²";
            txtA2.innerText = a * a;
            txtB2.innerText = b * b;
            txtC2.innerText = c * c;
        }

        // Global spam click prevention for Etkinlik files
        document.addEventListener('click', function(e) {
            if (e.target.tagName === 'BUTTON' && !e.target.hasAttribute('data-spam-locked')) {
                e.target.setAttribute('data-spam-locked', 'true');
                let originalOpacity = e.target.style.opacity || '1';
                e.target.style.opacity = '0.7';
                e.target.style.pointerEvents = 'none';
                setTimeout(() => {
                    e.target.removeAttribute('data-spam-locked');
                    e.target.style.opacity = originalOpacity;
                    e.target.style.pointerEvents = 'auto';
                }, 400);
            }
        });

        // init
        loadTri(3, 4, 5, document.querySelector('.btn-tri'));

    </script>
</body>
</html>
