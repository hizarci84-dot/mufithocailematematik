<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Polinomlar</title>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            background-color: #0d0e15;
            color: #00ffcc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 90%;
            max-width: 1000px;
            background: #151828;
            border: 2px solid #00ffcc;
            border-radius: 15px;
            box-shadow: 0 0 15px #00ffcc, inset 0 0 10px #00ffcc;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }
        h1, h2 {
            text-shadow: 0 0 10px #00ffcc;
        }
        .neon-button {
            background: transparent;
            color: #ff00ff;
            border: 2px solid #ff00ff;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 0 10px #ff00ff, inset 0 0 5px #ff00ff;
            transition: all 0.3s ease;
            margin: 10px;
        }
        .neon-button:hover {
            background: #ff00ff;
            color: #fff;
            box-shadow: 0 0 20px #ff00ff, inset 0 0 10px #ff00ff;
        }
        svg {
            border: 1px solid #ff00ff;
            box-shadow: 0 0 10px #ff00ff;
            background-color: #1a1a2e;
            border-radius: 10px;
        }
        .content {
            margin: 20px 0;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Polinomlar (Animasyon)</h1>
        <div class="content">
            <p>Bu alanda Polinom kavramı ve işlemleri işlenmektedir. \(P(x) = a_nx^n + \dots + a_0\)</p>
        </div>
        <svg width="400" height="400" viewBox="-200 -200 400 400">
            <!-- Cartesian Plane -->
            <line x1="-200" y1="0" x2="200" y2="0" stroke="#555" stroke-width="1" />
            <line x1="0" y1="-200" x2="0" y2="200" stroke="#555" stroke-width="1" />
            
            <g transform="scale(1, -1)">
                <circle cx="50" cy="50" r="30" fill="none" stroke="#00ffcc" stroke-width="2" />
                <path d="M -100 -50 Q 0 100 100 -50" fill="none" stroke="#ff00ff" stroke-width="2" />
            </g>
            <text x="180" y="-10" fill="#00ffcc" font-size="12">x</text>
            <text x="10" y="-180" fill="#00ffcc" font-size="12">y</text>
            <text x="50" y="-60" fill="#fff" font-size="12">P(x)</text>
        </svg>
        <br>
        <button class="neon-button" onclick="alert('Animasyon başlatıldı!')">Çalıştır / Yenile</button>
    </div>
</body>
</html>
