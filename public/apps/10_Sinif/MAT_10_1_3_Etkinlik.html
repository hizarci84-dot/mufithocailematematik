<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10.1.3 - Taban Bloklarıyla Bölünebilme İspatı</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root {
            --bg-color: #0F172A; /* Slate 900 */
            --panel-bg: #1E293B; /* Slate 800 */
            --primary: #38BDF8; /* Sky 400 */
            --secondary: #A78BFA; /* Violet 400 */
            --accent: #F472B6; /* Pink 400 */
            --danger: #F43F5E; /* Rose 500 */
            --success: #10B981; /* Emerald 500 */
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        
        body {
            background-color: var(--bg-color); color: var(--text-main);
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding: 20px; overflow-x: hidden;
        }

        .header {
            width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center;
            padding: 15px 25px; background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px); border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 800; color: var(--primary); }
        .header-left img { width: 40px; height: 40px; border-radius: 10px; }
        .kazanim { background: rgba(56, 189, 248, 0.1); padding: 8px 15px; border-radius: 12px; color: var(--primary); font-weight: 600; font-size: 0.9rem; }

        h1 { font-size: 2.5rem; font-weight: 900; margin-bottom: 10px; text-align: center; 
             background: linear-gradient(135deg, var(--primary), var(--secondary)); 
             -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
             
        .subtitle { color: var(--text-muted); font-size: 1.1rem; margin-bottom: 30px; text-align: center; max-width: 700px; }

        .workspace { display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 900px; align-items: center; }

        .controls {
            display: flex; gap: 20px; align-items: center; justify-content: center; background: var(--panel-bg);
            padding: 15px 25px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2); width: 100%;
        }

        .input-group { display: flex; align-items: center; gap: 10px; }
        .input-group label { font-weight: 600; color: var(--text-muted); }
        .input-group input, .input-group select { 
            width: 100px; background: rgba(0,0,0,0.3); border: 2px solid rgba(255,255,255,0.1); 
            color: white; font-size: 1.2rem; font-weight: 800; padding: 8px; border-radius: 10px; text-align: center;
        }

        .btn-action {
            background: linear-gradient(135deg, var(--primary), var(--secondary)); border: none;
            color: white; padding: 10px 20px; border-radius: 10px; font-weight: 800; font-size: 1.1rem;
            cursor: pointer; transition: all 0.3s;
        }
        .btn-action:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(167, 139, 250, 0.4); }

        .svg-board {
            width: 100%; height: 450px; background: rgba(255,255,255,0.02);
            border-radius: 20px; border: 2px dashed rgba(255,255,255,0.1);
            position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center;
        }

        .math-rule-box {
            background: rgba(0,0,0,0.4); border: 2px solid rgba(255,255,255,0.1);
            padding: 20px; border-radius: 15px; font-size: 1.5rem; font-weight: 600; color: white;
            display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
            width: 100%; min-height: 80px; transition: 0.5s; box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        /* SVG Blocks */
        .block100 { fill: rgba(56, 189, 248, 0.2); stroke: var(--primary); stroke-width: 2; transition: all 1s ease-in-out; }
        .block10 { fill: rgba(167, 139, 250, 0.2); stroke: var(--secondary); stroke-width: 2; transition: all 1s ease-in-out; }
        .block1 { fill: rgba(244, 114, 182, 0.2); stroke: var(--accent); stroke-width: 2; transition: all 1s ease-in-out; }
        
        .block-text { fill: white; font-weight: 800; font-size: 18px; text-anchor: middle; dominant-baseline: middle; transition: all 1s; }
        
        .cut-line { stroke: var(--danger); stroke-width: 3; stroke-dasharray: 5,5; opacity: 0; transition: opacity 0.5s; vector-effect: non-scaling-stroke; }

    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <img src="../../logom.png" alt="Logo" onerror="this.src='https://ui-avatars.com/api/?name=MH&background=38BDF8&color=fff'">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.10.1.3. Bölünebilme Kuralları (Etkinlik)</div>
    </div>
    
    <h1>Rakamları Toplamı Neden 3'e Bölünmeli?</h1>
    <p class="subtitle">Bir sayının 3'e tam bölünebilmesi için neden "rakamları toplamı"na bakarız? Gelin taban bloklarıyla bu mantığı parçalayarak ispatlayalım.</p>
    
    <div class="workspace">
        <div class="controls">
            <div class="input-group">
                <label>Sayı (10-399):</label>
                <input type="number" id="inpNum" min="10" max="399" value="234">
            </div>
            <button class="btn-action" onclick="runProof()">İspatı Başlat</button>
        </div>
        
        <div class="svg-board">
            <svg width="100%" height="100%" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid meet" id="proofSvg">
                <g id="blocksGroup"></g>
            </svg>
        </div>
        
        <div class="math-rule-box" id="ruleBox">
            <span id="mathOutput">Değer girip ispatı başlatın.</span>
        </div>
    </div>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const ruleBox = document.getElementById('ruleBox');
        const mathOutput = document.getElementById('mathOutput');
        const blocksGroup = document.getElementById('blocksGroup');
        
        let debounceTimer;
        function updateMath(texString) {
            mathOutput.innerHTML = texString;
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                MathJax.typesetPromise([mathOutput]);
            }, 50);
        }

        async function runProof() {
            let num = parseInt(document.getElementById('inpNum').value);
            if(isNaN(num) || num < 10 || num > 399) { num = 234; document.getElementById('inpNum').value = 234; }
            
            blocksGroup.innerHTML = '';
            document.getElementById('ruleBox').style.borderColor = 'rgba(255,255,255,0.1)';
            document.getElementById('ruleBox').style.boxShadow = 'none';
            
            let hundreds = Math.floor(num / 100);
            let tens = Math.floor((num % 100) / 10);
            let ones = num % 10;
            
            updateMath(`\\( ${num} = ${hundreds} \\times 100 + ${tens} \\times 10 + ${ones} \\times 1 \\)`);
            
            // Draw blocks
            let html = '';
            
            // 100s blocks
            for(let i=0; i<hundreds; i++) {
                html += `
                <g class="b100" id="h_${i}" transform="translate(${50 + i*110}, 100)">
                    <rect x="0" y="0" width="100" height="100" class="block100" />
                    <text x="50" y="50" class="block-text">100</text>
                    <line x1="90" y1="-10" x2="90" y2="110" class="cut-line" id="h_cut_${i}" />
                </g>`;
            }
            
            // 10s blocks
            for(let i=0; i<tens; i++) {
                html += `
                <g class="b10" id="t_${i}" transform="translate(${50 + i*30}, 250)">
                    <rect x="0" y="0" width="20" height="100" class="block10" />
                    <text x="10" y="50" class="block-text">10</text>
                    <line x1="0" y1="90" x2="30" y2="90" class="cut-line" id="t_cut_${i}" />
                </g>`;
            }
            
            // 1s blocks
            for(let i=0; i<ones; i++) {
                html += `
                <g class="b1" id="o_${i}" transform="translate(${300 + (i%5)*30}, ${250 + Math.floor(i/5)*30})">
                    <rect x="0" y="0" width="20" height="20" class="block1" />
                    <text x="10" y="10" class="block-text">1</text>
                </g>`;
            }
            
            blocksGroup.innerHTML = html;
            
            await sleep(3000);
            
            updateMath(`100 = 99 + 1 (99 sayısı 3'e tam bölünür, at çöpe!)<br>10 = 9 + 1 (9 sayısı 3'e tam bölünür, at çöpe!)`);
            
            // Show cut lines
            for(let i=0; i<hundreds; i++) { document.getElementById(`h_cut_${i}`).style.opacity = '1'; }
            for(let i=0; i<tens; i++) { document.getElementById(`t_cut_${i}`).style.opacity = '1'; }
            
            await sleep(3000);
            
            // Animate removing the 99 and 9 parts, leaving just the 1s
            updateMath(`Geriye sadece 1'lik parçalar kaldı.<br>Yüzlüklerden ${hundreds} adet "1", Onluklardan ${tens} adet "1" arttı.`);
            
            for(let i=0; i<hundreds; i++) {
                let g = document.getElementById(`h_${i}`);
                g.innerHTML = `
                    <rect x="90" y="0" width="10" height="100" class="block1" />
                    <text x="95" y="50" class="block-text">1</text>
                `;
                g.style.transform = `translate(${50 + i*30}, 100)`; // shrink position
            }
            
            for(let i=0; i<tens; i++) {
                let g = document.getElementById(`t_${i}`);
                g.innerHTML = `
                    <rect x="0" y="90" width="20" height="10" class="block1" />
                    <text x="10" y="95" class="block-text">1</text>
                `;
                g.style.transform = `translate(${50 + i*30}, 150)`; 
            }
            
            await sleep(3000);
            
            // Move all remainders together
            let totalRemainders = hundreds + tens + ones;
            let resClass = totalRemainders % 3 === 0 ? "var(--success)" : "var(--danger)";
            let resText = totalRemainders % 3 === 0 ? "Tam Bölünür!" : `Kalan: ${totalRemainders % 3}`;
            
            document.getElementById('ruleBox').style.borderColor = resClass;
            document.getElementById('ruleBox').style.boxShadow = `0 0 30px ${resClass}`;
            
            updateMath(`Kalan Toplam Parça = ${hundreds} + ${tens} + ${ones} = ${totalRemainders} \\quad \\implies \\quad <span style="color:${resClass}; font-weight:900;">${resText}</span>`);
            
            // Move SVG groups conceptually
            blocksGroup.style.transform = "translateX(200px)";
            blocksGroup.style.transition = "transform 1s";
        }
        
        window.onload = runProof;
    </script>
</body>
</html>
