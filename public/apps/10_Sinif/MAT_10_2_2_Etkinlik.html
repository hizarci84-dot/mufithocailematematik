<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10.2.2 - Doğrusal Fonksiyonlar</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --primary: #f59e0b; /* Amber */
            --grid-color: rgba(245, 158, 11, 0.15);
            --axis-color: rgba(245, 158, 11, 0.5);
            --text-main: #f8fafc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }

        .header {
            width: 100%; max-width: 1000px; display: flex; justify-content: space-between; align-items: center;
            padding: 15px 25px; background: var(--panel-bg); border-radius: 12px; margin-bottom: 20px;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-weight: 800; color: var(--primary); font-size: 1.2rem; }
        .kazanim { background: rgba(245, 158, 11, 0.1); padding: 5px 15px; border-radius: 6px; color: var(--primary); }

        h1 { font-size: 2.2rem; margin-bottom: 10px; text-align: center; }
        .subtitle { color: #94a3b8; font-size: 1.05rem; margin-bottom: 30px; text-align: center; max-width: 800px; }

        .workspace { display: flex; gap: 20px; width: 100%; max-width: 1000px; }
        @media(max-width: 800px) { .workspace { flex-direction: column; } }

        .controls { flex: 1; background: var(--panel-bg); padding: 25px; border-radius: 12px; display: flex; flex-direction: column; gap: 20px; border: 1px solid rgba(255,255,255,0.05); }

        .slider-group label { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 8px; }
        input[type=range] { width: 100%; accent-color: var(--primary); }
        .val-badge { color: var(--primary); font-weight: 800; background: rgba(0,0,0,0.3); padding: 2px 8px; border-radius: 4px; }

        .math-box { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; text-align: center; font-size: 1.2rem; border-left: 4px solid var(--primary); }

        .graph-container {
            flex: 2; background: #0b1120; border-radius: 12px; border: 1px solid rgba(245, 158, 11, 0.3);
            position: relative; overflow: hidden; min-height: 400px;
        }

        svg { width: 100%; height: 100%; display: block; }
        .grid-line { stroke: var(--grid-color); stroke-width: 1; }
        .axis-line { stroke: var(--axis-color); stroke-width: 2; }
        .axis-label { fill: var(--axis-color); font-size: 14px; font-weight: 600; }
        .line-path { stroke: var(--primary); stroke-width: 4; fill: none; filter: drop-shadow(0 0 5px var(--primary)); }
        
        .intercept-point { fill: var(--bg-color); stroke: white; stroke-width: 2; }
        .intercept-label { fill: white; font-size: 14px; font-weight: 800; }

    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <span>@mufithocailematematik</span>
        </div>
        <div class="kazanim">MAT.10.2.2. Doğrusal Fonksiyonlar</div>
    </div>
    
    <h1>Doğrusal Fonksiyon Laboratuvarı</h1>
    <p class="subtitle">\( f(x) = mx + n \) şeklindeki doğrusal fonksiyonlarda eğim (m) ve y-eksenini kestiği noktanın (n) grafiği nasıl değiştirdiğini keşfedin.</p>
    
    <div class="workspace">
        <div class="controls">
            <div class="slider-group">
                <label>Eğim (m) <span class="val-badge" id="valM">1</span></label>
                <input type="range" id="slM" min="-5" max="5" step="0.5" value="1">
            </div>
            <div class="slider-group">
                <label>Y-Keseni (n) <span class="val-badge" id="valN">0</span></label>
                <input type="range" id="slN" min="-10" max="10" step="1" value="0">
            </div>
            
            <div class="math-box">
                <div id="mathEq">\( f(x) = 1x + 0 \)</div>
            </div>
        </div>
        
        <div class="graph-container">
            <svg viewBox="-15 -15 30 30" preserveAspectRatio="xMidYMid meet" id="graphSvg">
                <!-- Inverted Y for drawing -->
                <g transform="scale(1, -1)">
                    <g id="gridGroup"></g>
                    <line x1="-15" y1="0" x2="15" y2="0" class="axis-line" />
                    <line x1="0" y1="-15" x2="0" y2="15" class="axis-line" />
                    <line id="mainLine" class="line-path" x1="-15" y1="-15" x2="15" y2="15" />
                    
                    <circle id="yIntPt" class="intercept-point" cx="0" cy="0" r="0.4" />
                    <circle id="xIntPt" class="intercept-point" cx="0" cy="0" r="0.4" />
                </g>
                <!-- Labels drawn without inversion -->
                <g id="labelsGroup"></g>
                <text id="yIntLbl" class="intercept-label" x="0" y="0"></text>
                <text id="xIntLbl" class="intercept-label" x="0" y="0"></text>
            </svg>
        </div>
    </div>

    <script>
        const slM = document.getElementById('slM');
        const slN = document.getElementById('slN');
        const valM = document.getElementById('valM');
        const valN = document.getElementById('valN');
        const mainLine = document.getElementById('mainLine');
        const mathEq = document.getElementById('mathEq');
        
        const yIntPt = document.getElementById('yIntPt');
        const xIntPt = document.getElementById('xIntPt');
        const yIntLbl = document.getElementById('yIntLbl');
        const xIntLbl = document.getElementById('xIntLbl');

        let debounceTimer;

        function drawGrid() {
            let gridHtml = ''; let labelHtml = '';
            for(let i = -15; i <= 15; i++) {
                gridHtml += `<line x1="${i}" y1="-15" x2="${i}" y2="15" class="grid-line" />`;
                gridHtml += `<line x1="-15" y1="${i}" x2="15" y2="${i}" class="grid-line" />`;
                
                if(i !== 0 && i % 5 === 0) {
                    // Proper text alignment to prevent overlap
                    labelHtml += `<text x="${i}" y="1.2" class="axis-label" text-anchor="middle" dominant-baseline="hanging">${i}</text>`;
                    labelHtml += `<text x="-0.5" y="${-i}" class="axis-label" text-anchor="end" dominant-baseline="middle">${i}</text>`;
                }
            }
            document.getElementById('gridGroup').innerHTML = gridHtml;
            document.getElementById('labelsGroup').innerHTML = labelHtml;
        }

        function updateGraph() {
            let m = parseFloat(slM.value);
            let n = parseInt(slN.value);
            
            valM.innerText = m;
            valN.innerText = n;
            
            // Calculate line endpoints for SVG (-15 to 15 in X)
            let y1 = m * (-15) + n;
            let y2 = m * (15) + n;
            
            mainLine.setAttribute('y1', y1);
            mainLine.setAttribute('y2', y2);
            
            // Y-Intercept
            yIntPt.setAttribute('cy', n);
            yIntLbl.setAttribute('x', 0.8);
            yIntLbl.setAttribute('y', -n - 0.8);
            yIntLbl.setAttribute('text-anchor', 'start');
            yIntLbl.textContent = `(0, ${n})`;
            
            // X-Intercept
            if(m !== 0) {
                let xInt = -n / m;
                xIntPt.setAttribute('cx', xInt);
                xIntPt.setAttribute('cy', 0);
                xIntPt.style.display = 'block';
                
                xIntLbl.setAttribute('x', xInt);
                xIntLbl.setAttribute('y', 1.5);
                xIntLbl.setAttribute('text-anchor', 'middle');
                xIntLbl.textContent = `(${xInt.toFixed(1).replace(/\.0$/,'')}, 0)`;
                xIntLbl.style.display = 'block';
            } else {
                xIntPt.style.display = 'none';
                xIntLbl.style.display = 'none';
            }
            
            // MathJax
            let signN = n >= 0 ? `+ ${n}` : `- ${Math.abs(n)}`;
            let eq = `\\( f(x) = ${m}x ${signN} \\)`;
            if(m===0) eq = `\\( f(x) = ${n} \\)`;
            
            mathEq.innerHTML = eq;
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => MathJax.typesetPromise([mathEq]), 100);
        }

        slM.addEventListener('input', updateGraph);
        slN.addEventListener('input', updateGraph);

        window.onload = () => { drawGrid(); updateGraph(); };
    </script>
</body>
</html>
